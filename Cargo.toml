[package]
name = "comicpile-vercel-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
axum = "0.8"
comicpile-roll-service = { path = "native/roll-service" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

[[bin]]
name = "native_roll"
path = "api/native_roll.rs"

[[bin]]
name = "native_issue"
path = "api/native_issue.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
