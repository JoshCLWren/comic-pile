[package]
name = "comicpile-vercel-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
build = "build.rs"

[dependencies]
http-body = "1"
axum = "0.8"
comicpile-roll-service = { path = "native/roll-service" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
tokio-postgres = "0.7.18"

[[bin]]
name = "native_roll"
path = "api/native_roll.rs"

[[bin]]
name = "native_issue"
path = "api/native_issue.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

# Forbid panicking accessors in Vercel ingress production dispatch (#4742).
# Test harnesses inside the ingress binaries opt out with cfg(test) allows;
# the compile-time-only build script allows panicking accessors because a
# toolchain failure aborts the build without handling requests.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
