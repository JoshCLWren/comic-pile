# Match the Vercel GET ingress. Old bootstrap paths fall through to Python's 404;
# there is no compatibility proxy, fixture, or mocked bootstrap success.
server {
    listen 8080;
    server_name _;
    client_max_body_size 16m;

    # Every native v2 resource shares the production method/path split; a new
    # v2 cutover must not silently fall through to Python 404s in this audit.
    location /api/v2 {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-ComicPile-API-Runtime rust always;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
