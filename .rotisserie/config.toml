# Rotisserie adopter configuration for Comic Pile.
# Factory code lives in https://github.com/JoshCLWren/rotisserie/tree/main/factory.
schema_version = 1

[repository]
host = "github.com"
owner = "JoshCLWren"
name = "comic-pile"

[production]
url = "https://comic-pile.vercel.app"

[markers]
# Existing issue and PR markers use this namespace; changing it orphans live claims.
namespace = "comic-pile-factory"

# Providers merge over Rotisserie's factory/defaults/providers.toml.
[providers.gemini-free]
provider = "google"
credential = "GEMINI_API_KEY"
endpoint = "https://generativelanguage.googleapis.com/v1beta/openai"
name = "Google Gemini API Free"
headers = { "x-goog-api-client" = "comic-pile-factory-oai/1.0" }

[issues]
# Issues the factory must never claim, implement or close.
reserved = [679, 1093, 1109]

[dashboard]
auth_url = "https://comic-pile.vercel.app/api/v2/factory/github"

# Refinery applies native/migrate/migrations in version order and rejects a
# version below the last applied one, so the factory serializes these PRs and
# denies a merge whose version is already used or is not above main's highest.
[[migrations]]
family = "refinery"
directory = "native/migrate/migrations/"
version = '^V(?P<version>[0-9]+)__[A-Za-z0-9_]+\.sql$'
increasing = true
