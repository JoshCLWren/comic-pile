# mypy configuration for ComicPile strict-mypy Phase 0 (#3250).
#
# This file is the repository-owned mypy configuration. It targets the strict
# preset but deliberately scopes strictness to the migrated surface rather
# than pretending the whole repository is strict yet. Modules that have been
# migrated to strict-clean are listed in tests/mypy_ratchet_baseline.json and
# enforced by scripts/check_mypy_ratchet.sh; the remainder of the production
# surface is inventoried in docs/MYPHASE0_INVENTORY.md and migrated in Phase 1+.
#
# Intentional ComicPile policy differences from mypy's stock strict preset are
# documented in docs/MYPHASE0_TYPING_POLICY.md. They are narrow and explicit;
# there is no blanket per-module ignore here.

[mypy]
python_version = 3.14
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
show_error_context = True
show_error_codes = True
no_implicit_optional = True

# Third-party packages without usable stubs. Each entry is deliberate: the
# package genuinely ships no type information and the import boundary is
# typed by hand at the call site. This is the only category of per-module
# override in this file; there are no per-module error-code disables.
[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-pydantic_settings.*]
ignore_missing_imports = True

[mypy-multipart.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-filelock.*]
ignore_missing_imports = True

[mypy-email_validator.*]
ignore_missing_imports = True

[mypy-github.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-aiosqlite.*]
ignore_missing_imports = True

[mypy-pil.*]
ignore_missing_imports = True