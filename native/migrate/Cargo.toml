[package]
name = "comicpile-migrate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Standalone workspace and lockfile: this tool is a CI/deploy-time binary and
# must never join the Vercel ingress workspace or its release dependency graph.
[workspace]

[dependencies]
native-tls = "0.2"
postgres-native-tls = "0.5"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
