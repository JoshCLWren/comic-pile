# Weekly grouped dependency updates for uv + pnpm + GitHub Actions.
# Majors for the frontend toolchain stay ungrouped/ignored so they remain planned work.
#
# Factory labels: Dependabot branches are not factory/* so the bare `factory`
# label admits them to the work queue. Start at factory:review + factory:unowned
# so workers can claim, fix CI, promote, and merge. `infrastructure` keeps them
# in provenance lane 5 (behind product bugs). Do not use the product
# `dependencies` label (that means the dependency-blocking feature).
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - factory
      - factory:review
      - factory:unowned
      - infrastructure
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
      python-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - factory
      - factory:review
      - factory:unowned
      - infrastructure
    ignore:
      # Dev-only bot/tooling; noisy and outside the product path.
      - dependency-name: testdriverai
      # Planned frontend toolchain majors — bump in dedicated PRs, not weekly noise.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
    groups:
      js-root-minor-patch:
        update-types:
          - minor
          - patch
      js-root-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - factory
      - factory:review
      - factory:unowned
      - infrastructure
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - factory
      - factory:review
      - factory:unowned
      - infrastructure
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major
