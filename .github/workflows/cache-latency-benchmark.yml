name: Cache Latency Benchmark

# Temporary issue #2216 one-shot: deploy this SHA to Hobby production (cle1)
# with CACHE_PROVIDER left on postgres, call the gated probe (real
# KV_REST_API_* process env), then promote the previous production
# deployment back. Remove this workflow's --prod path after measurement.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cache-latency-benchmark.yml"
      - "scripts/benchmark_cache_latency.py"
      - "app/services/cache_latency_probe.py"
      - "app/api/health.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cache-latency-benchmark
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_1na05XWOpOb6wB1CA4m3GPRT
  VERCEL_PROJECT_ID: prj_TLT92644pRPZbZSMoXddCfQLZgK8
  VERCEL_TEAM_SLUG: joshclwrens-projects
  PRODUCTION_URL: https://comic-pile.vercel.app
  CACHE_LATENCY_PROBE_TOKEN: comic-pile-2216-cache-latency-probe

jobs:
  measure:
    name: Production-runtime Upstash REST probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.1.0

      - name: Record current production deployment
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN missing; cannot deploy a production-runtime probe." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project = os.environ["VERCEL_PROJECT_ID"]
          team = os.environ["VERCEL_ORG_ID"]
          url = (
              "https://api.vercel.com/v6/deployments"
              f"?projectId={project}&teamId={team}&target=production&limit=5"
          )
          request = urllib.request.Request(url)
          request.add_header("Authorization", f"Bearer {token}")
          request.add_header("Accept", "application/json")
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          deployments = payload.get("deployments") or []
          ready = [
              item
              for item in deployments
              if item.get("readyState") == "READY" and item.get("uid")
          ]
          if not ready:
              raise SystemExit("No READY production deployment found to roll back to.")
          previous = ready[0]
          uid = previous["uid"]
          host = previous.get("url") or ""
          print(f"previous_uid={uid}")
          print(f"previous_host={host}")
          github = os.environ["GITHUB_OUTPUT"]
          with open(github, "a", encoding="utf-8") as handle:
              handle.write(f"uid={uid}\n")
              handle.write(f"host={host}\n")
          PY

      - name: Deploy this SHA to production for the one-shot probe
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p docs .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json

          vercel pull \
            --yes \
            --environment=production \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN"

          echo "Deploying this SHA to production (CACHE_PROVIDER unchanged; probe gated)."
          deploy_sha="$(git rev-parse HEAD)"
          deploy_url="$(vercel deploy \
            --prod \
            --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN" \
            --env CACHE_LATENCY_PROBE_ENABLED=true \
            --meta githubDeployment=1 \
            --meta githubCommitRef="${GITHUB_REF_NAME}" \
            --meta githubCommitSha="$deploy_sha" \
            --meta comicPileOneShot=cache-latency-2216 \
            | tee "$RUNNER_TEMP/vercel-deploy.log" \
            | awk '/https:\/\/.*\.vercel\.app\/?$/ { url=$0 } END { print url }')"

          if [[ -z "$deploy_url" ]]; then
            echo "vercel deploy --prod did not print a URL." >&2
            exit 1
          fi
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Production one-shot URL (no secrets): $deploy_url"

      - name: Call redacted cache-latency probe
        id: probe
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          probe_url="${PRODUCTION_URL%/}/api/v1/health/cache-latency"
          echo "Calling ${probe_url} (token not printed)."

          curl --silent --show-error --fail \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "${PRODUCTION_URL%/}/health" >/dev/null

          http_code="$(curl --silent --show-error \
            --retry 6 --retry-delay 5 \
            --header "X-Cache-Latency-Probe: ${CACHE_LATENCY_PROBE_TOKEN}" \
            --header "Accept: application/json" \
            --write-out "%{http_code}" \
            --output "$RUNNER_TEMP/cache-latency-probe.json" \
            "$probe_url" || true)"
          echo "probe_http_status=$http_code" >> "$GITHUB_OUTPUT"
          echo "Probe HTTP status: $http_code"

          if [[ "$http_code" != "200" ]]; then
            echo "Direct curl failed; retrying with vercel curl in case of Deployment Protection."
            vercel curl \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_TEAM_SLUG" \
              --header "X-Cache-Latency-Probe: ${CACHE_LATENCY_PROBE_TOKEN}" \
              --header "Accept: application/json" \
              "$probe_url" \
              > "$RUNNER_TEMP/cache-latency-probe.json" || true
            python3 - "$RUNNER_TEMP/cache-latency-probe.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          raw = path.read_text(encoding="utf-8") if path.is_file() else ""
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:400] if raw else "no body")
              raise SystemExit("Probe did not return JSON.")
          if "p50_ms" not in payload:
              print(json.dumps({k: payload.get(k) for k in ("detail", "status", "note")}, indent=2))
              raise SystemExit("Probe JSON missing p50_ms.")
          PY
          fi

          python3 - "$RUNNER_TEMP/cache-latency-probe.json" \
            docs/CACHE_LOOKUP_LATENCY_2026-08.json \
            "${{ steps.deploy.outputs.deploy_url }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          probe_path, out_path, deploy_url, actions_url = sys.argv[1:5]
          probe = json.loads(Path(probe_path).read_text(encoding="utf-8"))
          if probe.get("samples", 0) in {None, 0} or probe.get("p50_ms") is None:
              raise SystemExit(f"probe returned no samples: status={probe.get('status')}")
          report = {
              "schema_version": "1.0",
              "measured_from": probe.get("measured_from"),
              "vercel_env": probe.get("vercel_env"),
              "production_url": "https://comic-pile.vercel.app",
              "one_shot_deploy_url": deploy_url,
              "actions_url": actions_url,
              "iterations": 30,
              "warmups_per_path": 3,
              "credential_path": "vercel-production-runtime-kv-rest",
              "upstash_rest_get": {
                  "endpoint": "<redacted>",
                  "quota_blocked": bool(probe.get("quota_blocked")),
                  "summary": {
                      "samples": probe.get("samples"),
                      "elapsed_ms": {
                          "min": probe.get("min_ms"),
                          "p50": probe.get("p50_ms"),
                          "p95": probe.get("p95_ms"),
                          "max": probe.get("max_ms"),
                          "mean": probe.get("mean_ms"),
                      },
                      "vantage": probe.get("measured_from"),
                  },
              },
              "neon_point_select": {
                  "summary": {
                      "samples": 30,
                      "elapsed_ms": {
                          "min": 115.849,
                          "p50": 143.303,
                          "p95": 151.812,
                          "max": 152.833,
                          "mean": 141.518,
                      },
                      "vantage": "github-actions:ubuntu-latest",
                  }
              },
              "uncached_queue_read": {"summary": None},
              "provider_decision": (
                  f"Upstash REST GET p50={probe.get('p50_ms')} ms from "
                  f"{probe.get('measured_from')} (n={probe.get('samples')}); "
                  "Neon point SELECT p50=143.303 ms from github-actions:ubuntu-latest"
              ),
              "_note_neon_vantage": (
                  "Neon comparison remains the existing GHA ubuntu-latest 143.303 ms "
                  "distribution; cle1 Neon was not re-measured."
              ),
              "_note_upstash_quota": (
                  "HTTP 429 responses are recorded as quota_blocked. The free-tier "
                  "pause that blocked measurements through 2026-08-28 is no longer assumed."
              ),
              "_note_remove_probe": (
                  "Temporary /api/v1/health/cache-latency must be removed after issue #2216."
              ),
          }
          Path(out_path).write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          safe = {
              "measured_from": probe.get("measured_from"),
              "vercel_env": probe.get("vercel_env"),
              "samples": probe.get("samples"),
              "p50_ms": probe.get("p50_ms"),
              "p95_ms": probe.get("p95_ms"),
              "status": probe.get("status"),
              "quota_blocked": probe.get("quota_blocked"),
          }
          print(json.dumps(safe, indent=2))
          PY

      - name: Restore previous production deployment
        if: always() && steps.deploy.outputs.deployed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS_UID: ${{ steps.previous.outputs.uid }}
        run: |
          set -euo pipefail
          echo "Promoting previous production deployment ${PREVIOUS_UID} back to the alias."
          vercel promote \
            "$PREVIOUS_UID" \
            --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN"

      - name: Upload redacted benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-provider-evidence
          if-no-files-found: warn
          path: |
            docs/CACHE_LOOKUP_LATENCY_2026-08.json
            ${{ runner.temp }}/cache-latency-probe.json
            ${{ runner.temp }}/vercel-deploy.log
