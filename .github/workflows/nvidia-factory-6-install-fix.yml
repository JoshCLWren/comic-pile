name: NVIDIA Factory 6 install repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nvidia-factory-6-install-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - name: Repair OpenCode install step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/nvidia-factory-6.yml')
          text = path.read_text()
          old = 'npm install --global --ignore-scripts opencode-ai@1.15.2 free-coding-models@0.5.69'
          new = 'npm install --global opencode-ai@1.15.2\n          npm install --global --ignore-scripts free-coding-models@0.5.69'
          if old not in text:
              raise SystemExit('expected install command not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c factory/fix-nvidia-factory-6-install
          git add .github/workflows/nvidia-factory-6.yml
          git commit -m 'fix: allow OpenCode postinstall in Factory 6'
          git push --set-upstream origin factory/fix-nvidia-factory-6-install
          gh pr create --base main --head factory/fix-nvidia-factory-6-install --title 'Fix NVIDIA Factory 6 OpenCode install' --body 'The first Factory 6 run failed before model selection because `opencode-ai` requires its postinstall script, but the workflow installed it with `--ignore-scripts`. This splits the install so OpenCode can run its required postinstall while the FCM package remains script-suppressed.'
