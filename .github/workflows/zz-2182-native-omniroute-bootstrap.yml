name: Bootstrap native OmniRoute factory routes

on:
  push:
    branches:
      - fix/2182-native-omniroute-intent-routes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/2182-native-omniroute-intent-routes
          fetch-depth: 0

      - name: Apply native OmniRoute route migration
        run: python3 .github/scripts/bootstrap_2182.py

      - name: Validate focused factory routing tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install pytest
          python3 -m pytest --no-cov -q \
            tests/test_factory_provider_candidates.py \
            tests/test_factory_omniroute_route.py \
            tests/test_factory_candidate_health.py \
            tests/test_factory_executor_selection_workflow.py
          python3 .github/scripts/validate-free-model-factories.py
          python3 -m py_compile \
            .github/scripts/factory_provider_candidates.py \
            .github/scripts/factory_omniroute_route.py
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'comic-pile-native-route-migration[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Route factories through native OmniRoute intent pools'
          git push origin HEAD:fix/2182-native-omniroute-intent-routes
