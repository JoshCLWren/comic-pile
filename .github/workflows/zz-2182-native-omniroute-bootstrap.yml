name: Bootstrap native OmniRoute factory routes

on:
  push:
    branches:
      - fix/2182-native-omniroute-intent-routes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/2182-native-omniroute-intent-routes
          fetch-depth: 0

      - name: Apply native OmniRoute route migration
        run: python3 .github/scripts/bootstrap_2182.py

      - name: Validate guarded migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/validate-free-model-factories.py
          python3 -m py_compile \
            .github/scripts/factory_provider_candidates.py \
            .github/scripts/factory_omniroute_route.py
          [[ "$(python3 .github/scripts/factory_omniroute_route.py --mode issue)" == 'auto/coding:free' ]]
          [[ "$(python3 .github/scripts/factory_omniroute_route.py --mode pr --pr-stage factory:changes-requested)" == 'auto/coding:free' ]]
          [[ "$(python3 .github/scripts/factory_omniroute_route.py --mode pr --pr-stage factory:review)" == 'auto/reasoning:free' ]]
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'comic-pile-native-route-migration[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Route factories through native OmniRoute intent pools'
          git push origin HEAD:fix/2182-native-omniroute-intent-routes
