name: Factory Fork Persistence

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows: ['Factory Fork Execution']
    types: [completed]
  workflow_dispatch:
    inputs:
      run:
        description: Completed canonical fork execution run to reconcile
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: factory-fork-persistence-${{ github.event.workflow_run.id || inputs.run }}
  cancel-in-progress: false

jobs:
  persist:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install factory syntax parsers
        uses: ./.github/actions/factory-syntax

      # No contributor checkout or artifact code execution is permitted here.
      - name: Validate receipt, lease, artifact ancestry, and persist exact fork head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
          EXECUTION_RUN: ${{ github.event.workflow_run.id || inputs.run }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$EXECUTION_RUN" ]]; then
            python3 .github/scripts/factory_fork_control.py reconcile
            exit 0
          fi
          [[ "$EXECUTION_RUN" =~ ^[0-9]+$ ]]
          python3 .github/scripts/factory_fork_control.py complete --run "$EXECUTION_RUN"
