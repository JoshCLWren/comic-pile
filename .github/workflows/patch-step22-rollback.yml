name: Patch Step 22 rollback

on:
  push:
    branches:
      - manual/2431-fix-bprd-rollback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: manual/2431-fix-bprd-rollback
          fetch-depth: 1
      - name: Patch trigger-aware rollback and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('app/services/bprd_production_migration.py')
          text = service.read_text()
          old = '''    await db.execute(\n        delete(ContinuityRule).where(\n            ContinuityRule.user_id == spec.user_id,\n            ContinuityRule.note == marker,\n        )\n    )\n    await db.delete(plan)\n    await db.flush()\n\n    legacy_dependencies = snapshot.get("legacy_dependencies")\n    legacy_rules = snapshot.get("legacy_rules")\n    if not isinstance(legacy_dependencies, list) or not isinstance(legacy_rules, list):\n        raise MigrationInvariantError("dry-run snapshot lacks rollback rows")\n\n    for row in legacy_dependencies:\n        if not isinstance(row, dict):\n            raise MigrationInvariantError("invalid dependency row in dry-run snapshot")\n        db.add(\n            Dependency(\n                id=int(row["id"]),\n                source_issue_id=int(row["source_issue_id"]),\n                target_issue_id=int(row["target_issue_id"]),\n                created_at=_parse_datetime(row["created_at"]),\n                note=row.get("note"),\n            )\n        )\n    await db.flush()\n\n    for row in legacy_rules:\n        if not isinstance(row, dict):\n            raise MigrationInvariantError(\n                "invalid continuity-rule row in dry-run snapshot"\n            )\n        db.add(\n            ContinuityRule(\n                id=int(row["id"]),\n                user_id=int(row["user_id"]),\n                legacy_dependency_id=int(row["legacy_dependency_id"]),\n                source_type=str(row["source_type"]),\n                source_id=int(row["source_id"]),\n                target_type=str(row["target_type"]),\n                target_id=int(row["target_id"]),\n                satisfaction_type=str(row["satisfaction_type"]),\n                checkpoint_issue_id=row.get("checkpoint_issue_id"),\n                convergence_targets=row.get("convergence_targets"),\n                note=row.get("note"),\n                created_at=_parse_datetime(row["created_at"]),\n                updated_at=_parse_datetime(row["updated_at"]),\n            )\n        )\n    await db.flush()\n'''
          new = '''    # Delete the exact rule objects we fingerprinted above. Production still has\n    # the legacy dependency compatibility trigger, so leaving even one plan edge\n    # alive would let a restored Dependency claim that row via ON CONFLICT.\n    for rule in plan_rules:\n        await db.delete(rule)\n    await db.flush()\n    remaining_plan_rule_ids = (\n        await db.execute(\n            select(ContinuityRule.id).where(\n                ContinuityRule.user_id == spec.user_id,\n                ContinuityRule.note == marker,\n            )\n        )\n    ).scalars().all()\n    if remaining_plan_rule_ids:\n        raise MigrationInvariantError(\n            "plan-owned rules survived rollback removal: "\n            f"{remaining_plan_rule_ids}"\n        )\n\n    await db.delete(plan)\n    await db.flush()\n\n    legacy_dependencies = snapshot.get("legacy_dependencies")\n    legacy_rules = snapshot.get("legacy_rules")\n    if not isinstance(legacy_dependencies, list) or not isinstance(legacy_rules, list):\n        raise MigrationInvariantError("dry-run snapshot lacks rollback rows")\n\n    for row in legacy_dependencies:\n        if not isinstance(row, dict):\n            raise MigrationInvariantError("invalid dependency row in dry-run snapshot")\n        db.add(\n            Dependency(\n                id=int(row["id"]),\n                source_issue_id=int(row["source_issue_id"]),\n                target_issue_id=int(row["target_issue_id"]),\n                created_at=_parse_datetime(row["created_at"]),\n                note=row.get("note"),\n            )\n        )\n    await db.flush()\n\n    # Production migration c84400000002 mirrors Dependency inserts into\n    # continuity_rules. Base.metadata.create_all() test databases do not install\n    # that trigger. Reconcile the mirrored row when present, otherwise create the\n    # captured row directly. In both cases the rollback restores the exact rule ID\n    # and metadata recorded by the dry-run snapshot.\n    restored_rule_ids: set[int] = set()\n    for row in legacy_rules:\n        if not isinstance(row, dict):\n            raise MigrationInvariantError(\n                "invalid continuity-rule row in dry-run snapshot"\n            )\n        legacy_dependency_id = int(row["legacy_dependency_id"])\n        rule = (\n            await db.execute(\n                select(ContinuityRule).where(\n                    ContinuityRule.legacy_dependency_id == legacy_dependency_id\n                )\n            )\n        ).scalar_one_or_none()\n        if rule is None:\n            rule = ContinuityRule(\n                id=int(row["id"]),\n                user_id=int(row["user_id"]),\n                legacy_dependency_id=legacy_dependency_id,\n                source_type=str(row["source_type"]),\n                source_id=int(row["source_id"]),\n                target_type=str(row["target_type"]),\n                target_id=int(row["target_id"]),\n                satisfaction_type=str(row["satisfaction_type"]),\n                checkpoint_issue_id=row.get("checkpoint_issue_id"),\n                convergence_targets=row.get("convergence_targets"),\n                note=row.get("note"),\n                created_at=_parse_datetime(row["created_at"]),\n                updated_at=_parse_datetime(row["updated_at"]),\n            )\n            db.add(rule)\n        else:\n            expected_edge = (\n                int(row["user_id"]),\n                str(row["source_type"]),\n                int(row["source_id"]),\n                str(row["target_type"]),\n                int(row["target_id"]),\n            )\n            actual_edge = (\n                rule.user_id,\n                rule.source_type,\n                rule.source_id,\n                rule.target_type,\n                rule.target_id,\n            )\n            if actual_edge != expected_edge:\n                raise MigrationInvariantError(\n                    "legacy dependency trigger restored an unexpected rule edge: "\n                    f"expected {expected_edge!r}, got {actual_edge!r}"\n                )\n            rule.id = int(row["id"])\n            rule.satisfaction_type = str(row["satisfaction_type"])\n            rule.checkpoint_issue_id = row.get("checkpoint_issue_id")\n            rule.convergence_targets = row.get("convergence_targets")\n            rule.note = row.get("note")\n            rule.created_at = _parse_datetime(row["created_at"])\n            rule.updated_at = _parse_datetime(row["updated_at"])\n        restored_rule_ids.add(int(row["id"]))\n    await db.flush()\n\n    actual_restored_rule_ids = set(\n        (\n            await db.execute(\n                select(ContinuityRule.id).where(\n                    ContinuityRule.legacy_dependency_id.in_(dependency_ids)\n                )\n            )\n        ).scalars().all()\n    )\n    if actual_restored_rule_ids != restored_rule_ids:\n        raise MigrationInvariantError(\n            "rollback failed to restore exact legacy continuity rules: "\n            f"{sorted(actual_restored_rule_ids)}"\n        )\n'''
          if old not in text:
              raise SystemExit('rollback block no longer matches expected main content')
          service.write_text(text.replace(old, new))

          tests = Path('tests/test_bprd_production_migration.py')
          text = tests.read_text()
          text = text.replace('from sqlalchemy import func, select\n', 'from sqlalchemy import func, select, text\n', 1)
          anchor = '''\n\n@pytest.mark.asyncio\nasync def test_step22_rollback_refuses_after_reader_edits_plan(\n'''
          regression = r'''\n\n@pytest.mark.asyncio\nasync def test_step22_rollback_handles_production_dependency_sync_trigger(\n    async_db: AsyncSession,\n) -> None:\n    """Rollback cooperates with the production legacy-dependency mirror trigger."""\n    spec, black_flame, war_on_frogs = await _seed_migration_shape(async_db)\n    trigger_function = "test_step22_sync_legacy_dependency"\n    trigger_name = "trg_test_step22_sync_legacy_dependency"\n    await async_db.execute(\n        text(\n            f"""\n            CREATE OR REPLACE FUNCTION {trigger_function}()\n            RETURNS trigger\n            LANGUAGE plpgsql\n            AS $$\n            DECLARE\n                owner_id integer;\n            BEGIN\n                SELECT thread.user_id\n                  INTO owner_id\n                  FROM issues AS issue\n                  JOIN threads AS thread ON thread.id = issue.thread_id\n                 WHERE issue.id = NEW.source_issue_id;\n\n                DELETE FROM continuity_rules\n                 WHERE legacy_dependency_id = NEW.id;\n\n                INSERT INTO continuity_rules (\n                    user_id, source_type, source_id, target_type, target_id,\n                    satisfaction_type, checkpoint_issue_id, legacy_dependency_id,\n                    note, created_at, updated_at\n                )\n                VALUES (\n                    owner_id, 'issue', NEW.source_issue_id, 'issue',\n                    NEW.target_issue_id, 'item_read', NULL, NEW.id, NEW.note,\n                    NEW.created_at, CURRENT_TIMESTAMP\n                )\n                ON CONFLICT (user_id, source_type, source_id, target_type, target_id)\n                DO UPDATE SET\n                    satisfaction_type = 'item_read',\n                    checkpoint_issue_id = NULL,\n                    legacy_dependency_id = EXCLUDED.legacy_dependency_id,\n                    note = EXCLUDED.note,\n                    updated_at = CURRENT_TIMESTAMP;\n                RETURN NEW;\n            END;\n            $$\n            """\n        )\n    )\n    await async_db.execute(\n        text(\n            f"""\n            CREATE TRIGGER {trigger_name}\n            AFTER INSERT OR UPDATE OF source_issue_id, target_issue_id, note\n            ON dependencies\n            FOR EACH ROW\n            EXECUTE FUNCTION {trigger_function}()\n            """\n        )\n    )\n    await async_db.commit()\n\n    try:\n        snapshot = await build_bprd_dry_run(async_db, spec)\n        receipt = await apply_bprd_migration(async_db, snapshot=snapshot, spec=spec)\n        await async_db.commit()\n\n        result = await rollback_bprd_migration(\n            async_db,\n            snapshot=snapshot,\n            receipt=receipt,\n            spec=spec,\n        )\n        await async_db.commit()\n\n        assert result["restored_dependency_ids"] == sorted(\n            edge.dependency_id for edge in spec.legacy_edges\n        )\n        restored_rules = (\n            await async_db.execute(\n                select(ContinuityRule).where(\n                    ContinuityRule.legacy_dependency_id.in_(\n                        [edge.dependency_id for edge in spec.legacy_edges]\n                    )\n                )\n            )\n        ).scalars().all()\n        assert {rule.id for rule in restored_rules} == {\n            edge.rule_id for edge in spec.legacy_edges\n        }\n        assert await async_db.get(ContinuityPlan, receipt["plan_id"]) is None\n        await async_db.refresh(black_flame)\n        await async_db.refresh(war_on_frogs)\n        assert black_flame.is_blocked is False\n        assert war_on_frogs.is_blocked is True\n        assert [thread.id for thread in await _bprd_pool(spec.user_id, async_db)] == [\n            black_flame.id\n        ]\n    finally:\n        await async_db.rollback()\n        await async_db.execute(text(f"DROP TRIGGER IF EXISTS {trigger_name} ON dependencies"))\n        await async_db.execute(text(f"DROP FUNCTION IF EXISTS {trigger_function}()"))\n        await async_db.commit()\n'''.replace('\\n', '\n')
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          tests.write_text(text.replace(anchor, regression + anchor, 1))
          PY

          git diff --check
          git diff -- app/services/bprd_production_migration.py tests/test_bprd_production_migration.py

      - name: Commit branch fix and remove one-shot patch workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-step22-rollback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/services/bprd_production_migration.py tests/test_bprd_production_migration.py
          git commit -m 'Fix Step 22 rollback with production dependency trigger'
          git push origin HEAD:manual/2431-fix-bprd-rollback
