name: CI

# SECURITY: The following secrets must be configured in GitHub repository settings:
# Settings > Secrets and variables > Actions > New repository secret
# - SECRET_KEY: Application secret key for session encryption
# - DATABASE_URL: PostgreSQL connection string (e.g., postgresql+asyncpg://postgres:PASSWORD@postgres:5432/comic_pile_test)
# - POSTGRES_PASSWORD: PostgreSQL database password

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  node-auth:
    name: TypeScript auth build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      SECRET_KEY: test-secret-key-for-testing-only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/comic_pile_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --strict --skipLibCheck auth/me.ts
      - run: npm test

  factory-pr-auth:
    name: Factory PR authentication
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'Faker==40.40.0'
      - run: python3 .github/scripts/test_factory_worker_github_app.py
      - run: python3 .github/scripts/test_factory_app_identity_contract.py
      - run: node --test .github/scripts/factory-kilo-verdict.test.cjs .github/scripts/factory-contributor-checkout.test.cjs .github/scripts/factory-pr-auth.test.cjs .github/scripts/factory-readable-handoff.test.cjs .github/scripts/factory-visibility*.test.cjs

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.set-outputs.outputs.image-tag }}
      image-ref: ${{ steps.set-outputs.outputs.image-ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set lowercase image name
        id: lowercase
        run: echo "image-name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CI Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: set-outputs
        run: |
          echo "image-tag=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "image-ref=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  build-fork:
    name: Build Fork Docker Image
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: false
          cache-from: type=gha

  frontend-typecheck:
    name: Frontend Lint + Typecheck
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 15
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Restore frontend toolchain from CI image
        run: |
          mkdir -p static
          rm -rf frontend/node_modules static/react
          cp -a /opt/ci-assets/static/react static/react
          pnpm install --frozen-lockfile

      - name: Run anti-slop lint
        run: pnpm run lint:anti-slop

      - name: Run frontend lint
        run: pnpm --filter frontend run lint

      - name: Verify generated API contract freshness
        # The committed client includes test-only /api/v1/debug/log.
        env:
          ENVIRONMENT: test
        run: pnpm --filter frontend run check:api-types

      - name: Run frontend typecheck
        run: pnpm --filter frontend run typecheck

      - name: Run production frontend build through root package
        run: pnpm run build

  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Run ruff check
        run: ruff check .

  python-typecheck:
    name: Python Type Check (ty)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 15
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Run ty check
        run: ty check --error-on-warning

  frontend-unit-tests:
    name: Frontend Unit Tests (vitest)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Restore frontend toolchain from CI image
        run: |
          mkdir -p static
          rm -rf frontend/node_modules static/react
          cp -a /opt/ci-assets/static/react static/react
          pnpm install --frozen-lockfile

      - name: Run vitest unit tests with 94% coverage gate
        run: pnpm --filter frontend test:coverage

  ui-audit:
    name: Rendered UI Audit (Chromium)
    runs-on: ubuntu-latest
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable repository pnpm version
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run self-contained rendered UI audit
        run: pnpm run audit:ui

      - name: Upload rendered audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-ui-audit-${{ github.sha }}
          path: frontend/test-results/ui-audit/
          if-no-files-found: ignore
          retention-days: 7

  production-runtime-migrations:
    name: Production Runtime Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/comic_pile_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true

      # Match Deploy Production exactly; dev tools can mask missing runtime
      # dependencies (Playwright brings greenlet into the ordinary CI image).
      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Verify async runtime imports
        run: .venv/bin/python -c "import greenlet; import app.database; import app.models"

      - name: Apply all migrations from scratch with production dependencies
        run: .venv/bin/alembic upgrade head

  migration-health:
    name: Migration Health
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      CI: true
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Remove .env files
        run: rm -f .env .env.test .env.backup .envrc

      - name: Wait for PostgreSQL
        run: |
          i=1
          while [ $i -le 30 ]; do
            if pg_isready -h postgres -p 5432 -U postgres; then exit 0; fi
            sleep 2; i=$((i + 1))
          done
          exit 1

      - name: Check single Alembic head
        run: |
          HEADS=$(alembic heads 2>/dev/null | grep -c "(head)")
          if [ "$HEADS" -ne 1 ]; then
            echo "ERROR: $HEADS Alembic heads detected - resolve before merging"
            alembic heads
            exit 1
          fi
          echo "Single head confirmed: $(alembic heads 2>/dev/null)"

      - name: Apply all migrations from scratch
        run: alembic upgrade head

      # Note: alembic check is intentionally omitted. The reviews table uses a
      # NULLS NOT DISTINCT unique index (uq_review_user_thread_issue) applied via
      # raw SQL in migration 4882a6a20f35. SQLAlchemy has no native representation
      # for this, so alembic check always reports a false-positive difference.
      # Single-head enforcement + clean upgrade-from-scratch is the effective gate.

  test-unit:
    name: Backend Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      SECRET_KEY: test-secret-key-for-testing-only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      REDIS_URL: redis://redis:6379/0
      PGUSER: postgres
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
      RUST_SQL_ORACLE_DIR: artifacts/rust-sql-oracle
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Remove .env file to prevent CI database override
        run: rm -f .env .env.test .env.backup .envrc .env.local .env.production

      - name: Wait for PostgreSQL
        run: |
          i=1
          while [ $i -le 30 ]; do
            if pg_isready -h postgres -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
            i=$((i + 1))
          done
          echo "PostgreSQL failed to start"
          exit 1

      - name: Run backend tests (shard ${{ matrix.shard }})
        run: |
          FILES=$(python scripts/ci_backend_shard.py \
            --shard ${{ matrix.shard }} \
            --shards ${{ strategy.job-total }})
          if [ -z "$FILES" ]; then
            echo "::error::No backend test files were assigned to shard ${{ matrix.shard }}"
            exit 1
          fi
          # addopts is cleared so each shard emits a partial coverage data file
          # only: no per-shard HTML report and no per-shard coverage gate. The
          # coverage-gate job combines every shard and enforces the 90% total.
          pytest $FILES -o addopts="" \
            --cov=comic_pile --cov-branch --cov-report= --cov-fail-under=0

      - name: Upload synthetic Rust port SQL oracle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-sql-oracle-${{ matrix.shard }}
          path: artifacts/rust-sql-oracle/*.json
          if-no-files-found: ignore

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: warn

  coverage-gate:
    name: Backend Coverage Gate
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork, test-unit]
    if: always() && needs.test-unit.result == 'success' && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage-*
          merge-multiple: true

      - name: Combine coverage and enforce the 90% gate
        run: |
          coverage combine
          coverage report --show-missing --fail-under=90
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend

  check-all-jobs:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, build-fork, node-auth, factory-pr-auth, frontend-typecheck, python-lint, python-typecheck, frontend-unit-tests, ui-audit, production-runtime-migrations, migration-health, test-unit, coverage-gate]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Fork build: ${{ needs.build-fork.result }}"
          echo "TypeScript auth: ${{ needs.node-auth.result }}"
          echo "Factory PR authentication: ${{ needs.factory-pr-auth.result }}"
          echo "Frontend Lint + Typecheck: ${{ needs.frontend-typecheck.result }}"
          echo "Python Lint (ruff): ${{ needs.python-lint.result }}"
          echo "Python Type Check (ty): ${{ needs.python-typecheck.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Rendered UI Audit: ${{ needs.ui-audit.result }}"
          echo "Production Runtime Migrations: ${{ needs.production-runtime-migrations.result }}"
          echo "Migration Health: ${{ needs.migration-health.result }}"
          echo "Backend Tests: ${{ needs.test-unit.result }}"
          echo "Backend Coverage Gate: ${{ needs.coverage-gate.result }}"
          if { [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build-fork.result }}" != "success" ]; } || \
             [ "${{ needs.node-auth.result }}" != "success" ] || \
             [ "${{ needs.factory-pr-auth.result }}" != "success" ] || \
             [ "${{ needs.frontend-typecheck.result }}" != "success" ] || \
             [ "${{ needs.python-lint.result }}" != "success" ] || \
             [ "${{ needs.python-typecheck.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.ui-audit.result }}" != "success" ] || \
             [ "${{ needs.production-runtime-migrations.result }}" != "success" ] || \
             [ "${{ needs.migration-health.result }}" != "success" ] || \
             [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.coverage-gate.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed. Please review the failures."
            exit 1
          fi

          echo "::notice::All enabled CI jobs passed successfully!"
