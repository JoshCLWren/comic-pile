name: CI

# SECURITY: The following secrets must be configured in GitHub repository settings:
# Settings > Secrets and variables > Actions > New repository secret
# - SECRET_KEY: Application secret key for session encryption
# - DATABASE_URL: PostgreSQL connection string (e.g., postgresql+asyncpg://postgres:PASSWORD@postgres:5432/comic_pile_test)
# - POSTGRES_PASSWORD: PostgreSQL database password

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Pull-request CI is untrusted: no job receives an Actions write token.
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  node-auth:
    name: TypeScript auth build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      SECRET_KEY: test-secret-key-for-testing-only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/comic_pile_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --strict --skipLibCheck auth/me.ts
      - run: npm test

  rust-ingress:
    name: Rust-default API ingress (real FastAPI registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install locked Python runtime dependencies for read-only route discovery
        run: uv sync --locked --no-dev
      - name: Prove regeneration PR contains only current deterministic artifacts
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          ROUTE_PYTHON: .venv/bin/python
        run: |
          set -euo pipefail
          node scripts/check_generated_files_guard.mjs --allow-generated \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
          node scripts/generate_vercel_routes.mjs --check
          node scripts/generate_route_burndown.mjs --check

      - name: Generate and validate real FastAPI ingress
        env:
          ROUTE_PYTHON: .venv/bin/python
        run: |
          set -euo pipefail
          node scripts/generate_vercel_routes.mjs
          node scripts/generate_route_burndown.mjs
          node scripts/generate_vercel_routes.mjs --check
          node scripts/generate_route_burndown.mjs --check
          node --test scripts/generate_route_burndown.test.mjs scripts/generate_openapi_types.test.mjs scripts/generate_vercel_routes.test.mjs scripts/vercel_slim_routes.test.mjs scripts/generate_ui_audit_ingress.test.mjs 'scripts/route-area-tests/*.test.mjs'
      - name: Retired v1 plan-reader guard (real FastAPI app and checked-in ingress)
        run: uv run --no-sync --with pytest pytest -o addopts='' --noconftest -q tests/test_continuity_plan_reader_rust_only.py

      - name: Publish resolved ingress for frontend jobs
        uses: actions/upload-artifact@v7
        with:
          name: resolved-ingress-${{ github.sha }}
          path: vercel.json
          if-no-files-found: error
          retention-days: 1

  route-fragment-guard:
    name: Fragment-only guard (no generated files)
    # Part of the required CI Summary gate. Runs on every pull_request event
    # (no path filters, independent of factory-only scoping) and fails PRs that
    # commit bot-owned outputs: vercel.json, docs/api/v2-route-inventory.json,
    # docs/api/route-fragments/vercel-rewrites.json, AGENTS.md route-burndown
    # marker edits, native/contracts/{v2-runtime,same-path-runtime}.openapi.json
    # and frontend/src/generated/{openapi.json,openapi.ts,nativeV2Client.ts}
    # (owner directive 2026-11-19: parallel PRs must not share generated files).
    # regenerate-routes.yml regenerates them post-merge; the generated-contracts
    # job regenerates the contracts from each PR's own code.
    # On non-PR events (push, dispatch) the steps are skipped so the job still
    # succeeds and CI Summary can require strict success.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Fetch PR base and head revisions
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
      - name: Reject committed bot-owned route outputs in ordinary PRs
        if: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: >-
          node scripts/check_generated_files_guard.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Enforce generated-only scope on regeneration PRs
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: >-
          node scripts/check_generated_files_guard.mjs
          --allow-generated
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  script-checks:
    name: Node script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Reject nested lockfiles in workspace packages
        run: bash scripts/check_nested_lockfiles.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/generate_route_burndown.test.mjs scripts/generate_openapi_types.test.mjs scripts/generate_vercel_routes.test.mjs scripts/vercel_slim_routes.test.mjs scripts/check_generated_files_guard.test.mjs 'scripts/route-area-tests/*.test.mjs'

  generated-contracts:
    name: Generated API contracts (from this commit's Rust code)
    # Feature PRs never commit the generated contracts or frontend client
    # (owner directive 2026-11-19). This job regenerates them from the code at
    # this exact commit and hands them to every frontend job, so a PR is
    # type-checked, unit-tested and audited against the contract its own Rust
    # code produces. On the route-regeneration bot PR it also proves the
    # committed copies match the code (the former checked_in_*_is_current tests).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enable repository pnpm version
        run: corepack enable
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Regenerate contracts and frontend client
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: bash scripts/generate_contracts.sh
      - name: Prove the regeneration PR commits exactly what the code produces
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash scripts/generate_contracts.sh --check
      - name: Publish generated contracts for frontend jobs
        uses: actions/upload-artifact@v7
        with:
          name: generated-contracts-${{ github.sha }}
          path: |
            native/contracts/v2-runtime.openapi.json
            native/contracts/same-path-runtime.openapi.json
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
            frontend/src/generated/nativeV2Client.ts
          if-no-files-found: error
          retention-days: 1

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.set-outputs.outputs.image-tag }}
      image-ref: ${{ steps.set-outputs.outputs.image-ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set lowercase image name
        id: lowercase
        run: echo "image-name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CI Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: set-outputs
        run: |
          echo "image-tag=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-fork:
    name: Build Fork Docker Image
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: false
          cache-from: type=gha

  frontend-typecheck:
    name: Frontend Lint + Typecheck
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork, generated-contracts]
    if: always() && needs.generated-contracts.result == 'success' && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 15
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the contracts generated from this commit's code
        uses: actions/download-artifact@v8
        with:
          name: generated-contracts-${{ github.sha }}
          path: .

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Restore frontend toolchain from CI image
        run: |
          mkdir -p static
          rm -rf frontend/node_modules static/react
          cp -a /opt/ci-assets/static/react static/react
          pnpm install --frozen-lockfile

      - name: Run anti-slop lint
        run: pnpm run lint:anti-slop

      - name: Test anti-slop lint scope regression
        run: node --test scripts/anti_slop_scope.test.mjs

      - name: Run frontend lint
        run: pnpm --filter frontend run lint

      - name: Check for unused frontend modules
        run: pnpm --filter frontend run check:unused

      - name: Verify generated API contract freshness
        run: pnpm --filter frontend run check:api-types

      - name: Run frontend typecheck
        run: pnpm --filter frontend run typecheck

      - name: Run production frontend build through root package
        run: pnpm run build

  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Run ruff check
        run: ruff check .

  python-typecheck:
    name: Python Type Check (ty)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 15
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Run ty check
        run: ty check --error-on-warning

  factory-actionlint:
    name: Factory Workflow Syntax (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      # Upstream v1.7.11 rejects GitHub's supported concurrency.queue field.
      - name: Install maintained, queue-aware actionlint
        run: go install actionlint.kjanat.dev/cmd/actionlint@v1.17.1
      - name: Validate all GitHub Actions workflows
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  factory-shellcheck:
    name: Factory Shell Scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check syntax of every maintained shell script
        run: |
          set -euo pipefail
          find .github/scripts scripts -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
      - name: Shellcheck maintained shell scripts
        run: |
          set -euo pipefail
          find .github/scripts scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error

  native-route-db-test-guard:
    name: Native Route DB-Test Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the route DB-test checker
        run: node --test scripts/check_native_route_db_tests.test.mjs
      - name: Require a DB-backed HTTP test for every native route module
        run: node scripts/check_native_route_db_tests.mjs

  frontend-unit-tests:
    name: Frontend Unit Tests (vitest)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork, rust-ingress, generated-contracts]
    if: always() && needs.rust-ingress.result == 'success' && needs.generated-contracts.result == 'success' && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the ingress resolved from active handlers
        uses: actions/download-artifact@v8
        with:
          name: resolved-ingress-${{ github.sha }}
          path: .

      - name: Download the contracts generated from this commit's code
        uses: actions/download-artifact@v8
        with:
          name: generated-contracts-${{ github.sha }}
          path: .

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Restore frontend toolchain from CI image
        run: |
          mkdir -p static
          rm -rf frontend/node_modules static/react
          cp -a /opt/ci-assets/static/react static/react
          pnpm install --frozen-lockfile

      - name: Run vitest unit tests with 94% coverage gate
        run: pnpm --filter frontend test:coverage

  ui-audit:
    name: Rendered UI Audit (Chromium)
    # ubuntu-24.04 GitHub-hosted runners already ship Chromium and the shared
    # libraries Playwright needs. Do not install browser system dependencies
    # with apt here: `playwright install --with-deps` runs `apt-get install`
    # for fonts-*/xfonts-* from security.ubuntu.com, which has been returning
    # 503 and failing this job on every PR. Installing only the pinned browser
    # binaries uses the Playwright CDN and removes all runtime apt dependency
    # without weakening the audit or its strictness.
    runs-on: ubuntu-24.04
    needs: [build, build-fork, rust-ingress, generated-contracts]
    if: always() && needs.rust-ingress.result == 'success' && needs.generated-contracts.result == 'success' && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the ingress resolved from active handlers
        uses: actions/download-artifact@v8
        with:
          name: resolved-ingress-${{ github.sha }}
          path: .

      - name: Download the contracts generated from this commit's code
        uses: actions/download-artifact@v8
        with:
          name: generated-contracts-${{ github.sha }}
          path: .

      - name: Enable repository pnpm version
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser binaries
        # No --with-deps: that path runs apt-get against security.ubuntu.com,
        # whose 503s for fonts-*/xfonts-* broke every PR. Only the browser
        # binaries are downloaded (from the Playwright CDN) here.
        run: pnpm --filter frontend exec playwright install chromium

      - name: Run self-contained rendered UI audit
        run: pnpm run audit:ui

      - name: Upload rendered audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-ui-audit-${{ github.sha }}
          path: frontend/test-results/ui-audit/
          if-no-files-found: ignore
          retention-days: 7

  production-runtime-migrations:
    name: Production Runtime Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/comic_pile_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true

      # Match Deploy Production exactly; dev tools can mask missing runtime
      # dependencies (Playwright brings greenlet into the ordinary CI image).
      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Verify async runtime imports
        run: .venv/bin/python -c "import greenlet; import app.database; import app.models"

      - name: Apply all migrations from scratch with production dependencies
        run: .venv/bin/alembic upgrade head

  migration-health:
    name: Migration Health
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-trixie' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      CI: true
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Remove .env files
        run: rm -f .env .env.test .env.backup .envrc

      - name: Wait for PostgreSQL
        run: |
          i=1
          while [ $i -le 30 ]; do
            if pg_isready -h postgres -p 5432 -U postgres; then exit 0; fi
            sleep 2; i=$((i + 1))
          done
          exit 1

      - name: Check single Alembic head
        run: |
          HEADS=$(alembic heads 2>/dev/null | grep -c "(head)")
          if [ "$HEADS" -ne 1 ]; then
            echo "ERROR: $HEADS Alembic heads detected - resolve before merging"
            alembic heads
            exit 1
          fi
          echo "Single head confirmed: $(alembic heads 2>/dev/null)"

      - name: Apply all migrations from scratch
        run: alembic upgrade head

      # Note: alembic check is intentionally omitted. The reviews table uses a
      # NULLS NOT DISTINCT unique index (uq_review_user_thread_issue) applied via
      # raw SQL in migration 4882a6a20f35. SQLAlchemy has no native representation
      # for this, so alembic check always reports a false-positive difference.
      # Single-head enforcement + clean upgrade-from-scratch is the effective gate.

  docs-code-paths:
    name: Docs code-path check
    # Part of the required CI Summary gate. Offline and deterministic: fails when current
    # Markdown docs cite repository code paths that no longer exist (see
    # scripts/check_doc_code_paths.mjs). Runs on Node only. Runs on every event with no path filters.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Unit-test the doc path checker
        run: node --test scripts/check_doc_code_paths.test.mjs
      - name: Check Markdown code-path references
        run: node scripts/check_doc_code_paths.mjs

  check-all-jobs:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, build-fork, node-auth, rust-ingress, route-fragment-guard, generated-contracts, docs-code-paths, script-checks, factory-actionlint, factory-shellcheck, native-route-db-test-guard, frontend-typecheck, python-lint, python-typecheck, frontend-unit-tests, ui-audit, production-runtime-migrations, migration-health]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Fork build: ${{ needs.build-fork.result }}"
          echo "TypeScript auth: ${{ needs.node-auth.result }}"
          echo "Rust default route discovery: ${{ needs.rust-ingress.result }}"
          echo "Route fragment guard: ${{ needs.route-fragment-guard.result }}"
          echo "Generated API contracts: ${{ needs.generated-contracts.result }}"
          echo "Docs code paths: ${{ needs.docs-code-paths.result }}"
          echo "Node script tests: ${{ needs.script-checks.result }}"
          echo "Workflow syntax: ${{ needs.factory-actionlint.result }}"
          echo "Shell scripts: ${{ needs.factory-shellcheck.result }}"
          echo "Native Route DB-Test Guard: ${{ needs.native-route-db-test-guard.result }}"
          echo "Frontend Lint + Typecheck: ${{ needs.frontend-typecheck.result }}"
          echo "Python Lint (ruff): ${{ needs.python-lint.result }}"
          echo "Python Type Check (ty): ${{ needs.python-typecheck.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Rendered UI Audit: ${{ needs.ui-audit.result }}"
          echo "Production Runtime Migrations: ${{ needs.production-runtime-migrations.result }}"
          echo "Migration Health: ${{ needs.migration-health.result }}"
          if { [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build-fork.result }}" != "success" ]; } || \
             [ "${{ needs.node-auth.result }}" != "success" ] || \
             [ "${{ needs.rust-ingress.result }}" != "success" ] || \
             [ "${{ needs.route-fragment-guard.result }}" != "success" ] || \
             [ "${{ needs.generated-contracts.result }}" != "success" ] || \
             [ "${{ needs.docs-code-paths.result }}" != "success" ] || \
             [ "${{ needs.script-checks.result }}" != "success" ] || \
             [ "${{ needs.factory-actionlint.result }}" != "success" ] || \
             [ "${{ needs.factory-shellcheck.result }}" != "success" ] || \
             [ "${{ needs.native-route-db-test-guard.result }}" != "success" ] || \
             [ "${{ needs.frontend-typecheck.result }}" != "success" ] || \
             [ "${{ needs.python-lint.result }}" != "success" ] || \
             [ "${{ needs.python-typecheck.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.ui-audit.result }}" != "success" ] || \
             [ "${{ needs.production-runtime-migrations.result }}" != "success" ] || \
             [ "${{ needs.migration-health.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed. Please review the failures."
            exit 1
          fi

          echo "::notice::All enabled CI jobs passed successfully!"
