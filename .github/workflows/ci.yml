name: CI

# SECURITY: The following secrets must be configured in GitHub repository settings:
# Settings > Secrets and variables > Actions > New repository secret
# - SECRET_KEY: Application secret key for session encryption
# - DATABASE_URL: PostgreSQL connection string (e.g., postgresql+asyncpg://postgres:PASSWORD@postgres:5432/comic_pile_test)
# - POSTGRES_PASSWORD: PostgreSQL database password

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Pull-request CI is untrusted: no job receives an Actions write token.
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  factory-scope:
    name: Determine factory-only CI scope
    runs-on: ubuntu-latest
    outputs:
      fast_only: ${{ steps.paths.outputs.fast_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate factory-only path classifier
        run: python3 -m unittest discover -s scripts -p test_factory_ci_scope.py
      - name: Classify complete changed-file set
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          changed="$RUNNER_TEMP/factory-ci-changed-paths"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] ||
             [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'fast_only=false' >> "$GITHUB_OUTPUT"
            echo 'Full CI: no authoritative comparison base'
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed"
          # Classification policy MUST come from the trusted base, not the PR.
          # Otherwise a PR could modify this script to report itself as fast.
          trusted="$RUNNER_TEMP/trusted-factory-ci-scope.py"
          if ! git show "$BASE_SHA:scripts/factory_ci_scope.py" > "$trusted"; then
            echo 'fast_only=false' >> "$GITHUB_OUTPUT"
            echo 'Full CI: trusted base has no approved factory scope classifier'
            exit 0
          fi
          selected="$(python3 "$trusted" "$changed")"
          echo "fast_only=$selected" >> "$GITHUB_OUTPUT"
          echo "Factory-only path scope: $selected"

  factory-fast-contracts:
    name: Factory-only Python syntax and contracts
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Validate factory Python modules
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q .github/scripts
          python3 -m unittest discover -s scripts -p test_factory_ci_scope.py

  # Keep the product Rust suite in this required workflow so a red Rust run
  # cannot be ignored while CI Summary stays green. Factory-only infrastructure
  # changes keep the genuinely fast path and do not run the Rust suite.
  native-rust-roll:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true'
    uses: ./.github/workflows/rust-roll.yml

  rust-ingress:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true'
    name: Rust-default API ingress (fragment-derived)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove regeneration PR contains only current deterministic artifacts
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/check_route_fragment_guard.py --allow-generated \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
          node scripts/generate_vercel_routes.mjs --check
          node scripts/generate_route_burndown.mjs --check

      - name: Generate and validate fragment-derived ingress
        run: |
          set -euo pipefail
          node scripts/generate_vercel_routes.mjs
          node scripts/generate_route_burndown.mjs
          node scripts/generate_vercel_routes.mjs --check
          node scripts/generate_route_burndown.mjs --check
          node --test scripts/generate_route_burndown.test.mjs scripts/generate_openapi_types.test.mjs scripts/generate_vercel_routes.test.mjs scripts/vercel_slim_routes.test.mjs scripts/generate_ui_audit_ingress.test.mjs

      - name: Publish resolved ingress for frontend jobs
        uses: actions/upload-artifact@v7
        with:
          name: resolved-ingress-${{ github.sha }}
          path: vercel.json
          if-no-files-found: error
          retention-days: 1

  route-fragment-guard:
    name: Fragment-only guard (no generated files)
    # Part of the required CI Summary gate. Runs on every pull_request event
    # (no path filters, independent of factory-only scoping) and fails PRs that
    # commit bot-owned route outputs: vercel.json, docs/api/v2-route-inventory.json,
    # docs/api/route-fragments/vercel-rewrites.json, or AGENTS.md route-burndown
    # marker edits. regenerate-routes.yml regenerates them post-merge.
    # On non-PR events (push, dispatch) the steps are skipped so the job still
    # succeeds and CI Summary can require strict success.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Fetch PR base and head revisions
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
      - name: Reject committed bot-owned route outputs in ordinary PRs
        if: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: >-
          python3 scripts/check_route_fragment_guard.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Enforce generated-only scope on regeneration PRs
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/route-regeneration/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: >-
          python3 scripts/check_route_fragment_guard.py
          --allow-generated
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  script-checks:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true'
    name: Node script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Reject nested lockfiles in workspace packages
        run: bash scripts/check_nested_lockfiles.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reject newly introduced non-AIP v2 URL shapes
        run: node scripts/check_v2_aip_shapes.mjs
      - name: Verify the all-version live route census and retirement allowlist
        run: node scripts/generate_live_route_census.mjs --check
      - run: node --test scripts/generate_route_burndown.test.mjs scripts/generate_openapi_types.test.mjs scripts/generate_vercel_routes.test.mjs scripts/vercel_slim_routes.test.mjs scripts/no_background_metadata_repair.test.mjs scripts/check_v2_aip_shapes.test.mjs scripts/generate_live_route_census.test.mjs

  build:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.set-outputs.outputs.image-tag }}
      image-ref: ${{ steps.set-outputs.outputs.image-ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set lowercase image name
        id: lowercase
        run: echo "image-name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CI Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: set-outputs
        run: |
          echo "image-tag=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-fork:
    name: Build Fork Docker Image
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: false
          cache-from: type=gha

  frontend-typecheck:
    name: Frontend Lint + Typecheck
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-slim' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 15
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Restore frontend toolchain from CI image
        run: |
          mkdir -p static
          rm -rf frontend/node_modules static/react
          cp -a /opt/ci-assets/static/react static/react
          pnpm install --frozen-lockfile

      - name: Run anti-slop lint
        run: pnpm run lint:anti-slop

      - name: Test anti-slop lint scope regression
        run: node --test scripts/anti_slop_scope.test.mjs

      - name: Run frontend lint
        run: pnpm --filter frontend run lint

      - name: Check for unused frontend modules
        run: pnpm --filter frontend run check:unused

      - name: Verify generated API contract freshness
        run: pnpm --filter frontend run check:api-types

      - name: Run frontend typecheck
        run: pnpm --filter frontend run typecheck

      - name: Run production frontend build through root package
        run: pnpm run build

  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-slim' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Run ruff check
        run: ruff check .

  python-typecheck:
    name: Python Type Check (ty)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-slim' }}
    needs: [build, build-fork]
    if: always() && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 15
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Run ty check
        run: ty check --error-on-warning

  factory-actionlint:
    name: Factory Workflow Syntax (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      # Upstream v1.7.11 rejects GitHub's supported concurrency.queue field.
      - name: Install maintained, queue-aware actionlint
        run: go install actionlint.kjanat.dev/cmd/actionlint@v1.17.1
      - name: Validate all GitHub Actions workflows
        run: '"$(go env GOPATH)/bin/actionlint" -color'
      # The installed factory workflows' contract with Rotisserie (track main,
      # no secrets in runtime checkouts, no ticket-creating health checks).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Rotisserie adopter contract
        run: uv run --frozen python -m pytest -q --no-cov tests/test_rotisserie_adopter_contract.py
      # The contributor fork CI guards must actually gate CI, not merely be
      # linted/type-checked. This job is required on both the full and the
      # factory-only fast path, so the assertions run for every pull request.
      - name: Contributor fork CI boundary guards
        run: uv run --frozen python -m pytest -q --no-cov tests/test_contributor_ci.py

  factory-shellcheck:
    name: Factory Shell Scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check syntax of every maintained shell script
        run: |
          set -euo pipefail
          find .github/scripts scripts -type f \( -name '*.sh' -o -path 'scripts/factory-run' \) -print0 | xargs -0 -r -n 1 bash -n
      - name: Shellcheck maintained shell scripts
        run: |
          set -euo pipefail
          find .github/scripts scripts -type f \( -name '*.sh' -o -path 'scripts/factory-run' \) -print0 | xargs -0 -r shellcheck --severity=error

  native-route-db-test-guard:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true'
    name: Native Route DB-Test Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the route DB-test checker
        run: node --test scripts/check_native_route_db_tests.test.mjs
      - name: Require a DB-backed HTTP test for every native route module
        run: node scripts/check_native_route_db_tests.mjs

  reading-lists-terminology:
    name: Reading Lists Terminology Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the terminology checker
        run: node --test scripts/check_reading_lists_terminology.test.mjs
      - name: Require zero retired option-letter names in tracked source
        run: node scripts/check_reading_lists_terminology.mjs

  frontend-unit-tests:
    name: Frontend Unit Tests (vitest)
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image-ref || 'python:3.14-slim' }}
    needs: [build, build-fork, rust-ingress]
    if: always() && needs.rust-ingress.result == 'success' && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 10
    env:
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the ingress resolved from active handlers
        uses: actions/download-artifact@v8
        with:
          name: resolved-ingress-${{ github.sha }}
          path: .

      - name: Install fork CI toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/actions/fork-ci-toolchain

      - name: Restore frontend toolchain from CI image
        run: |
          mkdir -p static
          rm -rf frontend/node_modules static/react
          cp -a /opt/ci-assets/static/react static/react
          pnpm install --frozen-lockfile

      - name: Run vitest unit tests with 94% coverage gate
        run: pnpm --filter frontend test:coverage

  ui-audit:
    name: Rendered UI Audit (Chromium)
    # ubuntu-24.04 GitHub-hosted runners already ship Chromium and the shared
    # libraries Playwright needs. Do not install browser system dependencies
    # with apt here: `playwright install --with-deps` runs `apt-get install`
    # for fonts-*/xfonts-* from security.ubuntu.com, which has been returning
    # 503 and failing this job on every PR. Installing only the pinned browser
    # binaries uses the Playwright CDN and removes all runtime apt dependency
    # without weakening the audit or its strictness.
    runs-on: ubuntu-24.04
    needs: [build, build-fork, rust-ingress]
    if: always() && needs.rust-ingress.result == 'success' && (needs.build.result == 'success' || needs.build-fork.result == 'success')
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the ingress resolved from active handlers
        uses: actions/download-artifact@v8
        with:
          name: resolved-ingress-${{ github.sha }}
          path: .

      - name: Enable repository pnpm version
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser binaries
        # No --with-deps: that path runs apt-get against security.ubuntu.com,
        # whose 503s for fonts-*/xfonts-* broke every PR. Only the browser
        # binaries are downloaded (from the Playwright CDN) here.
        run: pnpm --filter frontend exec playwright install chromium

      - name: Run self-contained rendered UI audit
        run: pnpm run audit:ui

      - name: Upload rendered audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-ui-audit-${{ github.sha }}
          path: frontend/test-results/ui-audit/
          if-no-files-found: ignore
          retention-days: 7

  production-runtime-migrations:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true'
    name: Production Runtime Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comic_pile_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      # Match Deploy Production exactly: the same comicpile-migrate runner
      # applies the embedded refinery baseline to an empty database.
      - name: Apply all migrations from scratch with the production runner
        run: cargo run --locked -p comicpile-migrate -- up

  migration-health:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true'
    name: Migration Health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comic_pile_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Wait for PostgreSQL
        run: |
          i=1
          while [ $i -le 30 ]; do
            if pg_isready -h localhost -p 5432 -U postgres; then exit 0; fi
            sleep 2; i=$((i + 1))
          done
          exit 1

      - name: Apply every embedded migration from scratch
        run: cargo run --locked -p comicpile-migrate -- up

      - name: Re-running the runner is idempotent
        run: cargo run --locked -p comicpile-migrate -- up

  docs-code-paths:
    needs: [factory-scope]
    if: needs.factory-scope.outputs.fast_only != 'true'
    name: Docs code-path check
    # Part of the required CI Summary gate. Offline and deterministic: fails when current
    # Markdown docs cite repository code paths that no longer exist (see
    # scripts/check_doc_code_paths.mjs). Runs on Node only. Runs on every event with no path filters.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Unit-test the doc path checker
        run: node --test scripts/check_doc_code_paths.test.mjs
      - name: Check Markdown code-path references
        run: node scripts/check_doc_code_paths.mjs

  conflict-markers:
    name: Conflict Marker Guard
    # Required on every event, including factory-only fast-path changes. The
    # default pull_request checkout is the effective merge candidate; the exact
    # PR head is archived separately below so neither tree can bypass the guard.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conflict-marker guard
        run: python3 -m unittest discover -s tests -p test_check_conflict_markers.py
      - name: Check effective candidate tree
        run: python3 scripts/check_conflict_markers.py
      - name: Check exact pull request head
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          head_tree="$RUNNER_TEMP/conflict-marker-head"
          mkdir -p "$head_tree"
          git archive "$HEAD_SHA" | tar -x -C "$head_tree"
          python3 scripts/check_conflict_markers.py --root "$head_tree"

  dependency-integrity:
    name: Dependency Integrity Guard
    # Required on every event, including factory-only fast-path changes. No path
    # filters and no factory-scope gate: the effective merge candidate and the
    # exact PR head are both validated, so a cached or stale status context
    # cannot stand in for the dependency files in the candidate tree.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test dependency-integrity guard
        run: python3 -m unittest discover -s tests -p test_dependency_integrity.py
      - name: Check effective candidate manifests and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_dependency_integrity.py --root .
          bash scripts/check_nested_lockfiles.sh
          corepack enable
          pinned="$(python3 -c 'import json; print(json.load(open("package.json"))["packageManager"].split("@", 1)[1].split("+", 1)[0])')"
          actual="$(pnpm --version)"
          if [[ "$actual" != "$pinned" ]]; then
            echo "::error::pnpm $actual does not match pinned version $pinned"
            exit 1
          fi
          pnpm install --frozen-lockfile --lockfile-only --offline --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml
      - name: Check exact pull request head
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          head_tree="$RUNNER_TEMP/dependency-integrity-head"
          mkdir -p "$head_tree"
          git archive "$HEAD_SHA" | tar -x -C "$head_tree"
          python3 scripts/check_dependency_integrity.py --root "$head_tree"
          (
            cd "$head_tree"
            pnpm install --frozen-lockfile --lockfile-only --offline --ignore-scripts
          )

  check-all-jobs:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [factory-scope, factory-fast-contracts, build, build-fork, native-rust-roll, rust-ingress, route-fragment-guard, conflict-markers, dependency-integrity, docs-code-paths, script-checks, factory-actionlint, factory-shellcheck, native-route-db-test-guard, reading-lists-terminology, frontend-typecheck, python-lint, python-typecheck, frontend-unit-tests, ui-audit, production-runtime-migrations, migration-health]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Factory-only fast path: ${{ needs.factory-scope.outputs.fast_only }}"
          if [[ "${{ needs.factory-scope.result }}" != success ]]; then
            echo "::error::Factory scope classification failed"
            exit 1
          fi
          if [[ "${{ needs.factory-scope.outputs.fast_only }}" == true ]]; then
            for result in \
              "${{ needs.factory-fast-contracts.result }}" \
              "${{ needs.route-fragment-guard.result }}" \
              "${{ needs.conflict-markers.result }}" \
              "${{ needs.dependency-integrity.result }}" \
              "${{ needs.factory-actionlint.result }}" \
              "${{ needs.factory-shellcheck.result }}"; do
              if [[ "$result" != success ]]; then
                echo "::error::Factory fast-path required check was $result, not success"
                exit 1
              fi
            done
            echo "::notice::Factory-only checks passed; app/frontend/backend workloads intentionally skipped"
            exit 0
          fi
          echo "Build: ${{ needs.build.result }}"
          echo "Fork build: ${{ needs.build-fork.result }}"
          echo "Native Rust Roll: ${{ needs.native-rust-roll.result }}"
          echo "Rust default route discovery: ${{ needs.rust-ingress.result }}"
          echo "Route fragment guard: ${{ needs.route-fragment-guard.result }}"
          echo "Conflict markers: ${{ needs.conflict-markers.result }}"
          echo "Dependency integrity: ${{ needs.dependency-integrity.result }}"
          echo "Docs code paths: ${{ needs.docs-code-paths.result }}"
          echo "Node script tests: ${{ needs.script-checks.result }}"
          echo "Workflow syntax: ${{ needs.factory-actionlint.result }}"
          echo "Shell scripts: ${{ needs.factory-shellcheck.result }}"
          echo "Native Route DB-Test Guard: ${{ needs.native-route-db-test-guard.result }}"
          echo "Reading Lists Terminology Guard: ${{ needs.reading-lists-terminology.result }}"
          echo "Frontend Lint + Typecheck: ${{ needs.frontend-typecheck.result }}"
          echo "Python Lint (ruff): ${{ needs.python-lint.result }}"
          echo "Python Type Check (ty): ${{ needs.python-typecheck.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Rendered UI Audit: ${{ needs.ui-audit.result }}"
          echo "Production Runtime Migrations: ${{ needs.production-runtime-migrations.result }}"
          echo "Migration Health: ${{ needs.migration-health.result }}"
          if { [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build-fork.result }}" != "success" ]; } || \
             [ "${{ needs.native-rust-roll.result }}" != "success" ] || \
             [ "${{ needs.rust-ingress.result }}" != "success" ] || \
             [ "${{ needs.route-fragment-guard.result }}" != "success" ] || \
             [ "${{ needs.conflict-markers.result }}" != "success" ] || \
             [ "${{ needs.dependency-integrity.result }}" != "success" ] || \
             [ "${{ needs.docs-code-paths.result }}" != "success" ] || \
             [ "${{ needs.script-checks.result }}" != "success" ] || \
             [ "${{ needs.factory-actionlint.result }}" != "success" ] || \
             [ "${{ needs.factory-shellcheck.result }}" != "success" ] || \
             [ "${{ needs.native-route-db-test-guard.result }}" != "success" ] || \
             [ "${{ needs.reading-lists-terminology.result }}" != "success" ] || \
             [ "${{ needs.frontend-typecheck.result }}" != "success" ] || \
             [ "${{ needs.python-lint.result }}" != "success" ] || \
             [ "${{ needs.python-typecheck.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.ui-audit.result }}" != "success" ] || \
             [ "${{ needs.production-runtime-migrations.result }}" != "success" ] || \
             [ "${{ needs.migration-health.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed. Please review the failures."
            exit 1
          fi

          echo "::notice::All enabled CI jobs passed successfully!"
