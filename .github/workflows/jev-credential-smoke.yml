name: Jev Credential Smoke (experimental)

on:
  push:
    branches:
      - jev-4421-credential-smoke
    paths:
      - .github/workflows/jev-credential-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'JoshCLWren/comic-pile'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_JEV_API_KEY: ${{ secrets.OPENROUTER_JEV_API_KEY }}
    steps:
      - name: Verify dedicated Jev credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_JEV_API_KEY:-}" ]]; then
            echo '::error::OPENROUTER_JEV_API_KEY is not available to this workflow'
            exit 1
          fi
      - name: Call Jev Decisions API once and validate response
        shell: bash
        run: |
          set -euo pipefail
          request="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$request" "$response"' EXIT
          cat > "$request" <<'JSON'
          {
            "model": "typesafe/jev-1.14",
            "state": {
              "issue": "The application freezes for 30 seconds whenever I open the reading queue.",
              "user_reported": true
            },
            "questions": {
              "is_product_bug": {
                "type": "noul",
                "instructions": "Does the report describe malfunctioning existing product behavior?",
                "criteria": {
                  "true": "A malfunction or incorrect behavior of existing software is reported.",
                  "false": "No defect is reported; the request is a new feature, discussion, or question."
                }
              }
            }
          }
          JSON
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 25 \
            --output "$response" --write-out '%{http_code}' \
            --request POST https://openrouter.ai/api/alpha/decisions \
            --header "Authorization: Bearer ${OPENROUTER_JEV_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request")"
          if [[ "$status" != 200 ]]; then
            echo "::error::Jev Decisions API returned HTTP $status"
            exit 1
          fi
          if ! jq -e '
            (.answers.is_product_bug.type == "noul") and
            (.answers.is_product_bug.noul | type == "number" and . >= 0 and . <= 1) and
            (.model | type == "string" and startswith("typesafe/jev-1.14"))
          ' "$response" >/dev/null; then
            echo '::error::Jev returned unexpected response shape or model'
            exit 1
          fi
          {
            echo '### Jev credential smoke: passed'
            echo ''
            echo '- Endpoint: OpenRouter Decisions API'
            echo '- Requested model: `typesafe/jev-1.14`'
            echo "- Returned model: \`$(jq -r '.model' "$response")\`"
            echo "- Product bug probability: $(jq -r '.answers.is_product_bug.noul' "$response")"
            echo "- Reported cost (USD): $(jq -r '.usage.cost // "not returned"' "$response")"
            echo '- Existing free-model key: not used'
          } >> "$GITHUB_STEP_SUMMARY"
