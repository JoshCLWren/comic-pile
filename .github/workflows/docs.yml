name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_markdown_docs.py"
      - "scripts/check_v1_canonical_guidance.mjs"
      - "scripts/generate_markdown_inventory.py"
      - "tests/test_markdown_docs.py"
      - "tests/test_generate_markdown_inventory.py"
      - "tests/test_social_preview_asset.py"
      - "docs/images/social-preview.png"
      - "docs/images/social-preview.html"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check_markdown_docs.py"
      - "scripts/check_v1_canonical_guidance.mjs"
      - "scripts/generate_markdown_inventory.py"
      - "tests/test_markdown_docs.py"
      - "tests/test_generate_markdown_inventory.py"
      - "tests/test_social_preview_asset.py"
      - "docs/images/social-preview.png"
      - "docs/images/social-preview.html"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: uv run python scripts/check_markdown_docs.py
      - name: v1 canonical guidance guard
        run: node scripts/check_v1_canonical_guidance.mjs
      - name: Markdown pytest checks (PRs only)
        if: github.event_name == 'pull_request'
        run: uv run python -m pytest -q --no-cov tests/test_markdown_docs.py tests/test_generate_markdown_inventory.py tests/test_social_preview_asset.py
      - name: Render Markdown inventory artifact
        run: uv run python scripts/generate_markdown_inventory.py --output "${RUNNER_TEMP}/MARKDOWN_INVENTORY.md"
      - uses: actions/upload-artifact@v7
        with:
          name: markdown-inventory
          path: ${{ runner.temp }}/MARKDOWN_INVENTORY.md
          if-no-files-found: error
