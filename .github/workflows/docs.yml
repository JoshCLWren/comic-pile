name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_markdown_docs.py"
      - "scripts/generate_markdown_inventory.py"
      - "tests/test_markdown_docs.py"
      - "tests/test_generate_markdown_inventory.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/check_markdown_docs.py"
      - "scripts/generate_markdown_inventory.py"
      - "tests/test_markdown_docs.py"
      - "tests/test_generate_markdown_inventory.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project and test dependencies
        run: >-
          python -m pip install -e .
          "pytest>=8.0.0"
          "pytest-asyncio>=1.3.0"
          "pytest-cov>=7.0.0"

      - name: Validate Markdown ownership and links
        run: python scripts/check_markdown_docs.py

      - name: Run Markdown regression tests
        run: >-
          python -m pytest
          tests/test_markdown_docs.py
          tests/test_generate_markdown_inventory.py
          -q

      - name: Render Markdown inventory
        run: python scripts/generate_markdown_inventory.py --output docs/MARKDOWN_INVENTORY.md

      - name: Preserve rendered inventory
        uses: actions/upload-artifact@v7
        with:
          name: markdown-inventory
          path: docs/MARKDOWN_INVENTORY.md
          if-no-files-found: error
