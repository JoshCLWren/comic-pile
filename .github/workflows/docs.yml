name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_markdown_docs.py"
      - "scripts/generate_markdown_inventory.py"
      - "tests/test_markdown_docs.py"
      - "tests/test_generate_markdown_inventory.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/check_markdown_docs.py"
      - "scripts/generate_markdown_inventory.py"
      - "tests/test_markdown_docs.py"
      - "tests/test_generate_markdown_inventory.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test runner
        run: python -m pip install "pytest>=8.0.0"

      - name: Validate Markdown ownership and links
        run: python scripts/check_markdown_docs.py

      - name: Run Markdown regression tests
        run: >-
          python -m pytest -o addopts=''
          tests/test_markdown_docs.py
          tests/test_generate_markdown_inventory.py
          -q

      - name: Render Markdown inventory
        run: python scripts/generate_markdown_inventory.py
