name: P0 4684 regenerate unified API contracts

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked Python and pnpm dependencies
        run: |
          uv sync --locked
          corepack enable
          pnpm install --frozen-lockfile
      - name: Generate merged OpenAPI and TypeScript clients from current Python and Rust contracts
        env:
          ENVIRONMENT: test
        run: .venv/bin/python scripts/generate_openapi_types.py
      - name: Publish exact generated bytes for factory ingestion
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path in (
              "frontend/src/generated/openapi.json",
              "frontend/src/generated/openapi.ts",
              "frontend/src/generated/nativeV2Client.ts",
          ):
              encoded = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              print(f"ARTIFACT_BEGIN:{path}:{len(encoded)}")
              for index in range(0, len(encoded), 8000):
                  print(f"ARTIFACT_PART:{path}:{index // 8000}:{encoded[index:index + 8000]}")
              print(f"ARTIFACT_END:{path}")
          PY
