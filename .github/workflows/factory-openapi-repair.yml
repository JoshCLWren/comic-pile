name: Factory OpenAPI Repair

on:
  push:
    branches:
      - factory/849-roll-recovery-card

permissions:
  contents: write

concurrency:
  group: factory-openapi-repair-849
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out factory branch
        uses: actions/checkout@v7
        with:
          ref: factory/849-roll-recovery-card

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Restore locked Python environment
        run: uv sync --frozen

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Regenerate and commit OpenAPI artifacts
        env:
          PYTHONPATH: .
        run: |
          uv run python scripts/generate_openapi_types.py
          git diff --check
          if git diff --quiet -- frontend/src/generated/openapi.json frontend/src/generated/openapi.ts; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/openapi.json frontend/src/generated/openapi.ts
          git commit -m "Regenerate OpenAPI client artifacts"
          git push origin HEAD:factory/849-roll-recovery-card
