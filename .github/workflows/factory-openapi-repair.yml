name: Factory OpenAPI Repair

on:
  push:
    branches:
      - factory/955-normalize-thread-api-v1-nova

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: factory/955-normalize-thread-api-v1-nova

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Restore locked Python environment
        run: uv sync --frozen

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Regenerate and commit OpenAPI artifacts
        env:
          PYTHONPATH: .
        run: |
          uv run python scripts/generate_openapi_types.py
          git add frontend/src/generated/openapi.json frontend/src/generated/openapi.ts
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git config user.name 'comic-pile-factory'
          git config user.email 'comic-pile-factory@users.noreply.github.com'
          git commit -m 'Regenerate OpenAPI client artifacts'
          git push origin HEAD:factory/955-normalize-thread-api-v1-nova
