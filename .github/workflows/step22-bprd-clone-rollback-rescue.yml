name: Step 22 B.P.R.D. Clone Rollback Rescue

on:
  push:
    branches:
      - manual/2431-step22-clone-rollback-rescue

permissions:
  contents: read
  actions: read

concurrency:
  group: step22-bprd-clone-rollback-rescue
  cancel-in-progress: false

jobs:
  rescue:
    name: Roll back the already-migrated production clone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_BRANCH_ID: br-flat-star-ay6bmye0
      PRODUCTION_BRANCH_ID: br-silent-violet-ayobfez5
      EXPECTED_BRANCH_NAME: step22-bprd-rehearsal
      ORIGINAL_RUN_ID: '34413212095'
      ORIGINAL_ARTIFACT: step22-bprd-clone-rehearsal-dcb126d504118fcd6cb73cb07691821760c7aee2
      EXPECTED_SNAPSHOT_TOKEN: 7d3249cfd8b7c64259bdc63d68b24dfbd72db76f66deca60823dc36d4e739b58
      EVIDENCE_DIR: /tmp/step22-rescue
    steps:
      - name: Check out fixed rollback code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Download original failed-rehearsal snapshot and receipt
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ORIGINAL_ARTIFACT }}
          path: ${{ env.EVIDENCE_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}

      - name: Validate original evidence
        run: |
          set -euo pipefail
          SNAPSHOT="$EVIDENCE_DIR/bprd-step22-snapshot.json"
          RECEIPT="$EVIDENCE_DIR/bprd-step22-receipt.json"
          test -f "$SNAPSHOT"
          test -f "$RECEIPT"
          test "$(jq -r '.snapshot_token' "$SNAPSHOT")" = "$EXPECTED_SNAPSHOT_TOKEN"
          test "$(jq -r '.source_snapshot_token' "$RECEIPT")" = "$EXPECTED_SNAPSHOT_TOKEN"
          test "$(jq -r '.plan_id' "$RECEIPT")" = '6'
          test "$(jq -r '.plan_rule_count' "$RECEIPT")" = '21'
          echo 'Original guarded snapshot and apply receipt verified.'

      - name: Refuse production target and resolve clone connection
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
            echo 'NEON_API_KEY secret and NEON_PROJECT_ID variable are required.' >&2
            exit 1
          fi
          if [[ "$NEON_BRANCH_ID" == "$PRODUCTION_BRANCH_ID" ]]; then
            echo 'Refusing to run rollback rescue against production branch.' >&2
            exit 1
          fi

          branch_json="$(curl --fail --silent --show-error \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_BRANCH_ID}" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}")"
          jq -e --arg id "$NEON_BRANCH_ID" --arg name "$EXPECTED_BRANCH_NAME" \
            '.branch.id == $id and .branch.name == $name and (.branch.default | not)' \
            <<< "$branch_json" >/dev/null

          raw_uri="$(curl --fail --silent --show-error --get \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" \
            --data-urlencode "branch_id=${NEON_BRANCH_ID}" \
            --data-urlencode 'database_name=neondb' \
            --data-urlencode 'role_name=neondb_owner' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" \
            | jq -r '.uri')"
          test -n "$raw_uri"
          test "$raw_uri" != 'null'
          echo "::add-mask::$raw_uri"

          uri="$(RAW_DATABASE_URL="$raw_uri" .venv/bin/python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          raw = os.environ['RAW_DATABASE_URL']
          parts = urlsplit(raw)
          query = []
          for key, value in parse_qsl(parts.query, keep_blank_values=True):
              if key == 'channel_binding':
                  continue
              if key == 'sslmode':
                  key = 'ssl'
              query.append((key, value))
          print(urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)))
          PY
          )"
          echo "::add-mask::$uri"
          echo "db_url=$uri" >> "$GITHUB_OUTPUT"
          echo "Confirmed non-production Neon branch: $EXPECTED_BRANCH_NAME ($NEON_BRANCH_ID)"

      - name: Verify clone is still at the failed rehearsal cutover state
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          ENVIRONMENT: development
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import asyncio
          import json
          from sqlalchemy import func, select
          from app.database import AsyncSessionLocal
          from app.models.continuity_plan import ContinuityPlan
          from app.models.continuity_rule import ContinuityRule
          from app.models.dependency import Dependency

          async def main() -> None:
              async with AsyncSessionLocal() as db:
                  plan = await db.get(ContinuityPlan, 6)
                  assert plan is not None
                  assert plan.user_id == 1
                  assert plan.name == 'B.P.R.D.'
                  assert plan.ordering_mode == 'strict_sequential'
                  assert len(plan.nodes_json) == 22
                  rule_count = await db.scalar(
                      select(func.count()).select_from(ContinuityRule).where(
                          ContinuityRule.user_id == 1,
                          ContinuityRule.note == 'continuity-plan:6',
                      )
                  )
                  assert rule_count == 21
                  legacy_count = await db.scalar(
                      select(func.count()).select_from(Dependency).where(
                          Dependency.id.in_([1358, 1359, 1360, 1575, 1576])
                      )
                  )
                  assert legacy_count == 0
              print(json.dumps({'plan_id': 6, 'nodes': 22, 'plan_rules': 21, 'legacy_dependencies': 0}))

          asyncio.run(main())
          PY

      - name: Roll back the exact failed-rehearsal cutover
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          ENVIRONMENT: development
        run: |
          set -euo pipefail
          .venv/bin/python scripts/bprd_step22_migration.py rollback \
            --snapshot "$EVIDENCE_DIR/bprd-step22-snapshot.json" \
            --receipt "$EVIDENCE_DIR/bprd-step22-receipt.json" \
            --confirm STEP22-BPRD \
            | tee "$EVIDENCE_DIR/rollback-result.json"

      - name: Prove exact original snapshot and Roll boundary restored
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          ENVIRONMENT: development
        run: |
          set -euo pipefail
          POST="$EVIDENCE_DIR/bprd-step22-postrollback.json"
          .venv/bin/python scripts/bprd_step22_migration.py dry-run --output "$POST" >/dev/null
          test "$(jq -r '.snapshot_token' "$POST")" = "$EXPECTED_SNAPSHOT_TOKEN"
          jq -e '.ok == true and (.errors | length) == 0' "$POST" >/dev/null
          test "$(jq '.legacy_dependencies | length' "$POST")" = '5'
          test "$(jq '.legacy_rules | length' "$POST")" = '5'
          test "$(jq '.overlapping_plans | length' "$POST")" = '0'

          .venv/bin/python - <<'PY'
          import asyncio
          import json
          from sqlalchemy import select
          from app.database import AsyncSessionLocal
          from app.models.continuity_rule import ContinuityRule
          from comic_pile.queue import get_roll_pool

          EXPECTED_RULE_IDS = {117, 125, 625, 626, 627}
          async def main() -> None:
              async with AsyncSessionLocal() as db:
                  rules = (await db.execute(
                      select(ContinuityRule).where(
                          ContinuityRule.legacy_dependency_id.in_([1358, 1359, 1360, 1575, 1576])
                      )
                  )).scalars().all()
                  assert {rule.id for rule in rules} == EXPECTED_RULE_IDS
                  pool = await get_roll_pool(1, db)
                  bprd_ids = [thread.id for thread in pool if thread.id in {3382, 3383, 3384, 3385}]
                  assert bprd_ids == [3384]
              print(json.dumps({'restored_rule_ids': sorted(EXPECTED_RULE_IDS), 'bprd_roll_thread_ids': [3384], 'snapshot_restored': True}))

          asyncio.run(main())
          PY
          echo "Exact original snapshot restored: $EXPECTED_SNAPSHOT_TOKEN"

      - name: Upload rescue evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: step22-bprd-clone-rollback-rescue-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ env.EVIDENCE_DIR }}
