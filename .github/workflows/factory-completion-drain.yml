name: Factory Completion Drain

on:
  # Recalculate when a worker finishes and releases capacity. Do not watch
  # the dispatcher here: this workflow now wakes that dispatcher, and watching
  # its completion would create a self-triggering Actions loop with no work.
  workflow_run:
    workflows: ["Fixed Model Factory Entry"]
    types: [completed]
  # Recovery heartbeat only. Normal allocation should be driven by state-change
  # events above rather than by this clock.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  checks: read

# This workflow only signals the trusted dispatcher. It never claims an issue
# or PR itself. Retain the shared job serialization group so wakeups cannot race
# with controller reconciliation and handoff scheduling.
# Coalesce duplicate ingress events for this workflow only. The job-level
# shared group below serializes every lease writer without canceling other lanes.
concurrency:
  group: factory-completion-drain-ingress
  queue: single
  cancel-in-progress: false

jobs:
  drain:
    concurrency:
      group: fixed-model-factory-dispatch
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Select healthy completion wakeups from current demand
        id: batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          result="$(python3 .github/scripts/factory_full_completion_controller.py)"
          echo "$result" | jq .
          # The full-completion controller is signal-only: assignments is
          # intentionally empty. Use its selected_workers, but give the
          # existing serialized dispatcher exclusive authority to claim work.
          workers="$(jq -ec '.selected_workers | select(type == "array") | map(tostring) | unique' <<< "$result")"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "completion_demand=$(jq -r '.completion_demand' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "production_demand=$(jq -r '.production_demand' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "completion_target=$(jq -r '.completion_target' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Wake serialized dispatcher for selected completion workers
        id: wakeups
        if: steps.batch.outputs.workers != '[]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ steps.batch.outputs.workers }}
        run: |
          set -Eeuo pipefail
          dispatch_failures=0
          signaled=0

          wake_dispatcher() {
            local worker="$1"
            local attempt=1
            [[ "$worker" =~ ^[1-9][0-9]*$ ]] || {
              echo "Invalid completion worker ID: $worker" >&2
              return 1
            }
            # Only the dispatcher calls factory-work-controller.py assign;
            # this signal owns no lease to release or mutate.
            while (( attempt <= 3 )); do
              echo "Waking dispatcher for healthy completion worker ${worker} (attempt ${attempt}/3)"
              if gh workflow run fixed-model-factory-dispatch.yml \
                --repo "$GITHUB_REPOSITORY" --ref main -f worker="$worker"; then
                signaled=$((signaled + 1))
                return 0
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 3))
              fi
              attempt=$((attempt + 1))
            done

            echo "Unable to wake dispatcher for completion worker ${worker}" >&2
            return 1
          }

          while IFS= read -r worker; do
            [[ -n "$worker" ]] || continue
            wake_dispatcher "$worker" || dispatch_failures=$((dispatch_failures + 1))
          done < <(jq -r '.[]' <<< "$WORKERS")

          echo "signaled=$signaled" >> "$GITHUB_OUTPUT"
          if (( dispatch_failures > 0 )); then
            echo "${dispatch_failures} completion dispatcher wakeup(s) failed; lease state was not changed" >&2
            exit 1
          fi

      - name: Report demand-driven allocation
        shell: bash
        env:
          COMPLETION: ${{ steps.batch.outputs.completion_demand }}
          PRODUCTION: ${{ steps.batch.outputs.production_demand }}
          TARGET: ${{ steps.batch.outputs.completion_target }}
          SIGNALS: ${{ steps.wakeups.outputs.signaled }}
        run: |
          echo "Demand completion=${COMPLETION:-0} production=${PRODUCTION:-0}; target=${TARGET:-0}; dispatcher_wakeups=${SIGNALS:-0} (leases owned by dispatcher)"
