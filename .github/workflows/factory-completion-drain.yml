name: Factory Completion Drain

on:
  # Follow every dispatcher tick so completion uses the same reliable heartbeat
  # that already feeds implementation work.
  workflow_run:
    workflows: ["Fixed Model Factory Dispatcher"]
    types: [completed]
  # Independent five-minute recovery path. Severe review backlog must not wait
  # fifteen minutes for another chance if a dispatcher completion event is lost.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: factory-completion-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Assign full healthy completion fleet
        id: batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          result="$(python3 .github/scripts/factory_full_completion_controller.py)"
          echo "$result" | jq .
          workers="$(jq -c '[.assignments[].worker]' <<< "$result")"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "backlog=$(jq -r '.backlog' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "assigned=$(jq -r '.assignments | length' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Dispatch assigned completion workers
        if: steps.batch.outputs.workers != '[]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ steps.batch.outputs.workers }}
        run: |
          set -Eeuo pipefail
          controller='.github/scripts/factory-work-controller.py'
          dispatch_failures=0

          dispatch_worker() {
            local worker="$1"
            local attempt=1
            while (( attempt <= 3 )); do
              echo "Starting completion Factory ${worker} (dispatch attempt ${attempt}/3)"
              if gh workflow run free-model-factory-entry.yml \
                --repo "$GITHUB_REPOSITORY" --ref main -f worker="$worker"; then
                return 0
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 3))
              fi
              attempt=$((attempt + 1))
            done

            echo "Unable to dispatch completion Factory ${worker}; releasing its lease" >&2
            python3 "$controller" release --worker "$worker" || true
            return 1
          }

          while IFS= read -r worker; do
            [[ -n "$worker" ]] || continue
            dispatch_worker "$worker" || dispatch_failures=$((dispatch_failures + 1))
          done < <(jq -r '.[]' <<< "$WORKERS")

          if (( dispatch_failures > 0 )); then
            echo "${dispatch_failures} completion worker dispatch(es) failed; healthy workers were still attempted" >&2
            exit 1
          fi

      - name: Report completion drain result
        shell: bash
        env:
          BACKLOG: ${{ steps.batch.outputs.backlog }}
          ASSIGNED: ${{ steps.batch.outputs.assigned }}
        run: |
          echo "Completion backlog ${BACKLOG:-0}; dispatched ${ASSIGNED:-0} healthy completion workers"
