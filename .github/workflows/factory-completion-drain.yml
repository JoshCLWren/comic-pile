name: Factory Completion Drain

on:
  # Worker Entry explicitly uses workflow_dispatch after its worker job
  # finishes. GITHUB_TOKEN-launched entries can suppress workflow_run events,
  # so that event is not a reliable capacity signal or an additional trigger.
  # Recovery heartbeat only: keep scheduling independent of worker completion.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed worker entry run to classify in trusted Neon
        type: string
        required: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  checks: read

# This workflow only signals the trusted dispatcher. It never claims an issue
# or PR itself. Retain the shared job serialization group so wakeups cannot race
# with controller reconciliation and handoff scheduling.
# Coalesce duplicate ingress events for this workflow only. The job-level
# shared group below serializes every lease writer without canceling other lanes.
concurrency:
  group: factory-completion-drain-ingress
  queue: single
  cancel-in-progress: false

jobs:
  persist_outcome:
    # The worker Entry dispatches this trusted job directly. workflow_run
    # notifications are not reliable for GITHUB_TOKEN-launched entries.
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Configure restricted Neon factory event ledger
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Classify and persist the completed worker attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid worker entry run ID"
            exit 1
          }
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .event == "workflow_dispatch"
            and .path == ".github/workflows/free-model-factory-entry.yml"
            and .head_repository.full_name == $repo
          ' <<< "$metadata" >/dev/null
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
          job_id="$(jq -r '[.jobs[] | select(.name == "run / factory" and .status == "completed") | .id][0] // empty' <<< "$jobs")"
          [[ "$job_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Worker's factory job is not complete"
            exit 1
          }
          # The parent entry can still be finishing its signal job, but its
          # reusable factory job has already completed and has final logs.
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
            > "$RUNNER_TEMP/factory-entry.log"
          python3 .github/scripts/classify-fixed-model-run.py \
            --log "$RUNNER_TEMP/factory-entry.log" > "$RUNNER_TEMP/worker-outcome.json"
          worker="$(jq -r '.worker // empty' "$RUNNER_TEMP/worker-outcome.json")"
          if [[ -z "$worker" ]]; then
            worker="$(jq -r '.inputs.worker // empty' <<< "$metadata")"
            [[ "$worker" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Unable to attest worker identity"
              exit 1
            }
            jq --arg worker "$worker" '
              .worker = $worker
              | .outcome_class = "control_plane_failure"
              | .persisted_work = false
            ' "$RUNNER_TEMP/worker-outcome.json" > "$RUNNER_TEMP/worker-outcome-fallback.json"
            mv "$RUNNER_TEMP/worker-outcome-fallback.json" "$RUNNER_TEMP/worker-outcome.json"
          fi
          python3 .github/scripts/factory_state_ledger.py runtime-outcome \
            --repo "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN_ID" \
            --file "$RUNNER_TEMP/worker-outcome.json"

  drain:
    concurrency:
      group: fixed-model-factory-dispatch
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure shared Neon factory discovery cache
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Select healthy completion wakeups from current demand
        id: batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          result="$(python3 .github/scripts/factory_full_completion_controller.py)"
          echo "$result" | jq .
          # The full-completion controller is signal-only: assignments is
          # intentionally empty. Use its selected_workers, but give the
          # existing serialized dispatcher exclusive authority to claim work.
          workers="$(jq -ec '.selected_workers | select(type == "array") | map(tostring) | unique' <<< "$result")"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "completion_demand=$(jq -r '.completion_demand' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "production_demand=$(jq -r '.production_demand' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "completion_target=$(jq -r '.completion_target' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Wake serialized dispatcher for selected completion workers
        id: wakeups
        if: steps.batch.outputs.workers != '[]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ steps.batch.outputs.workers }}
        run: |
          set -Eeuo pipefail
          dispatch_failures=0
          signaled=0

          wake_dispatcher() {
            local worker="$1"
            local attempt=1
            [[ "$worker" =~ ^[1-9][0-9]*$ ]] || {
              echo "Invalid completion worker ID: $worker" >&2
              return 1
            }
            # Only the dispatcher calls factory-work-controller.py assign;
            # this signal owns no lease to release or mutate.
            while (( attempt <= 3 )); do
              echo "Waking dispatcher for healthy completion worker ${worker} (attempt ${attempt}/3)"
              if gh workflow run fixed-model-factory-dispatch.yml \
                --repo "$GITHUB_REPOSITORY" --ref main -f worker="$worker"; then
                signaled=$((signaled + 1))
                return 0
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 3))
              fi
              attempt=$((attempt + 1))
            done

            echo "Unable to wake dispatcher for completion worker ${worker}" >&2
            return 1
          }

          while IFS= read -r worker; do
            [[ -n "$worker" ]] || continue
            wake_dispatcher "$worker" || dispatch_failures=$((dispatch_failures + 1))
          done < <(jq -r '.[]' <<< "$WORKERS")

          echo "signaled=$signaled" >> "$GITHUB_OUTPUT"
          if (( dispatch_failures > 0 )); then
            echo "${dispatch_failures} completion dispatcher wakeup(s) failed; lease state was not changed" >&2
            exit 1
          fi

      - name: Report demand-driven allocation
        shell: bash
        env:
          COMPLETION: ${{ steps.batch.outputs.completion_demand }}
          PRODUCTION: ${{ steps.batch.outputs.production_demand }}
          TARGET: ${{ steps.batch.outputs.completion_target }}
          SIGNALS: ${{ steps.wakeups.outputs.signaled }}
        run: |
          echo "Demand completion=${COMPLETION:-0} production=${PRODUCTION:-0}; target=${TARGET:-0}; dispatcher_wakeups=${SIGNALS:-0} (leases owned by dispatcher)"
