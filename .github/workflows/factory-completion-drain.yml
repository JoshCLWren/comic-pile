name: Factory Completion Drain

on:
  # Recalculate immediately whenever either the dispatcher or an individual
  # worker finishes. Worker completion is a capacity-change event: a lease may
  # have been released and the queue may have changed, so wake the single
  # assignment writer on demand.
  workflow_run:
    workflows: ["Fixed Model Factory Dispatcher", "Fixed Model Factory Entry"]
    types: [completed]
  # Recovery heartbeat only. Normal allocation should be driven by state-change
  # events above rather than by this clock.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: factory-completion-dispatch-signal
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Wake central dispatcher for completion demand
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run fixed-model-factory-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f mode=completion
          echo 'Completion capacity delegated to Fixed Model Factory Dispatcher'
