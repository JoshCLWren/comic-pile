name: Factory Completion Drain

on:
  # Worker completion is a capacity-change event: a lease may have been
  # released and the queue may have changed, so wake the single assignment
  # writer on demand. Do not trigger from dispatcher completion or this signal
  # workflow would feed back into itself indefinitely.
  workflow_run:
    workflows: ["Fixed Model Factory Entry"]
    types: [completed]
  # Recovery heartbeat only. Normal allocation should be driven by worker
  # completion events above rather than by this clock.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: factory-completion-dispatch-signal
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install REST-backed factory GitHub reads
        shell: bash
        run: |
          set -Eeuo pipefail
          real_gh="$(command -v gh)"
          shim_dir="$RUNNER_TEMP/factory-gh-rest"
          mkdir -p "$shim_dir"
          cp .github/scripts/factory-gh-rest-shim.sh "$shim_dir/gh"
          chmod +x "$shim_dir/gh"
          echo "FACTORY_REAL_GH=$real_gh" >> "$GITHUB_ENV"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Plan health-aware completion capacity
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          result="$(python3 .github/scripts/factory_full_completion_controller.py)"
          echo "$result" | jq .
          workers="$(jq -c '.selected_workers // []' <<< "$result")"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "completion_demand=$(jq -r '.completion_demand // 0' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "production_demand=$(jq -r '.production_demand // 0' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "completion_target=$(jq -r '.completion_target // 0' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Delegate selected workers to central dispatcher
        if: steps.plan.outputs.workers != '[]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ steps.plan.outputs.workers }}
        run: |
          set -Eeuo pipefail

          wait_for_dispatcher_idle() {
            local attempt active
            for attempt in {1..180}; do
              active=0
              for status in queued in_progress; do
                count="$(
                  gh run list --workflow fixed-model-factory-dispatch.yml \
                    --status "$status" --limit 20 --json databaseId \
                    --jq 'length' 2>/dev/null || echo 1
                )"
                active=$((active + count))
              done
              (( active == 0 )) && return 0
              sleep 5
            done
            echo 'Timed out waiting for central dispatcher serialization lane' >&2
            return 1
          }

          delegated=0
          while IFS= read -r worker; do
            [[ -n "$worker" ]] || continue
            wait_for_dispatcher_idle
            echo "Delegating completion-selected Factory ${worker} to central dispatcher"
            gh workflow run fixed-model-factory-dispatch.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f mode=smoke -f worker="$worker"
            # Ensure this request becomes visible before considering the next
            # worker. GitHub concurrency retains only one pending run per group,
            # so serial signaling prevents our own batch from coalescing away.
            sleep 5
            wait_for_dispatcher_idle
            delegated=$((delegated + 1))
          done < <(jq -r '.[]' <<< "$WORKERS")

          echo "Delegated ${delegated} completion-selected worker(s) through the single assignment writer"

      - name: Report demand-driven plan
        shell: bash
        env:
          COMPLETION: ${{ steps.plan.outputs.completion_demand }}
          PRODUCTION: ${{ steps.plan.outputs.production_demand }}
          TARGET: ${{ steps.plan.outputs.completion_target }}
          WORKERS: ${{ steps.plan.outputs.workers }}
        run: |
          selected="$(jq -r 'length' <<< "${WORKERS:-[]}")"
          echo "Demand completion=${COMPLETION:-0} production=${PRODUCTION:-0}; target=${TARGET:-0}; selected=${selected}; assignment authority=dispatcher"
