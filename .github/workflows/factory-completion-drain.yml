name: Factory Completion Drain

# Terminal outcomes are persisted by trusted Entry before this explicit signal.
# The canonical dispatcher's hourly watchdog recovers missed signals. This
# bridge neither discovers demand nor owns a lease or a shared-writer lock.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Entry run (advisory scheduling context)
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: factory-completion-drain-ingress
  queue: single
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Wake canonical dispatcher once
        id: wakeups
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -Eeuo pipefail
          [[ -z "$SOURCE_RUN_ID" || "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh workflow run fixed-model-factory-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f mode=roster \
            -f source_run_id="$SOURCE_RUN_ID"
          echo "dispatcher_wakeups=1 source_run_id=${SOURCE_RUN_ID:-manual}"
