name: Fixed Model Factory Dispatcher Recovery

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixed-model-factory-dispatch-recovery.yml'
      - '.github/scripts/factory_heartbeat_health.py'
      - '.github/factory-expected-workers.json'

permissions:
  actions: write
  issues: read
  contents: read

concurrency:
  group: fixed-model-factory-dispatch-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Recover stale fixed-model dispatcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            > /tmp/factory-registry-comments.json
          python3 .github/scripts/factory_heartbeat_health.py \
            --comments /tmp/factory-registry-comments.json \
            --output /tmp/factory-heartbeat-health.json \
            --summary "$GITHUB_STEP_SUMMARY"

          # Per-worker freshness is diagnostic only. Preserve the existing
          # fleet-wide recovery gate; never launch a worker for its stale age.
          newest_age="$(jq -r '.newest_active_age_seconds // "missing"' /tmp/factory-heartbeat-health.json)"
          if [[ "$newest_age" != missing ]] && (( newest_age < 1200 )); then
            echo 'An active factory heartbeat is fresh; no dispatcher recovery needed.'
            exit 0
          fi

          echo 'Fixed-model heartbeats are stale; dispatching recovery run.'
          gh workflow run fixed-model-factory-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f mode=roster
          echo 'Recovery dispatcher requested.'

      - name: Preserve per-worker heartbeat diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-heartbeat-health
          path: /tmp/factory-heartbeat-health.json
          if-no-files-found: warn
