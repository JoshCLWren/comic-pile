# One-off read-only generator for PR #4185, removed after applying artifacts.
name: Temporary OpenAPI Contract Artifact 4185
on:
  push:
    branches:
      - perf/reading-boundaries-scoped-historical-20261025
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  generated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI schema and TypeScript from actual FastAPI models
        run: ENVIRONMENT=test uv run python scripts/generate_openapi_types.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-v2-generated-4185
          path: |
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
          retention-days: 1

  publish-contract:
    needs: generated-contract
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(api): regenerate v2 schema')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/reading-boundaries-scoped-historical-20261025
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: openapi-v2-generated-4185
          path: /tmp/v2-contract
      - name: Commit exact generated artifacts, without running repository code
        run: |
          cp /tmp/v2-contract/openapi.json frontend/src/generated/openapi.json
          cp /tmp/v2-contract/openapi.ts frontend/src/generated/openapi.ts
          git add frontend/src/generated/openapi.json frontend/src/generated/openapi.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api): regenerate v2 schema [skip ci]'
          git push origin HEAD:perf/reading-boundaries-scoped-historical-20261025
