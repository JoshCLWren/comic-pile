name: Factory Fix 827

on:
  push:
    branches:
      - factory/642-auth-client-v1

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/642-auth-client-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact pathname matching fix
        run: |
          python - <<'PY'
          from pathlib import Path

          api_path = Path('frontend/src/services/api.ts')
          text = api_path.read_text()
          text = text.replace(
              "const CSRF_EXEMPT_PATHS = ['/v1/auth/login', '/v1/auth/register', '/v1/auth/refresh']",
              "const AUTH_ENDPOINT_PATHS = new Set(['/v1/auth/login', '/v1/auth/register', '/v1/auth/refresh'])",
          )
          text = text.replace(
              "function shouldAttachCsrfToken(config: InternalAxiosRequestConfig): boolean {\n  const method = (config.method ?? 'get').toLowerCase()\n  if (!CSRF_PROTECTED_METHODS.has(method)) {\n    return false\n  }\n\n  const requestUrl = config.url ?? ''\n  return !CSRF_EXEMPT_PATHS.some((path) => requestUrl.includes(path))\n}",
              "function getRequestPathname(requestUrl: string): string {\n  return new URL(requestUrl, 'http://comic-pile.local').pathname\n}\n\nfunction shouldAttachCsrfToken(config: InternalAxiosRequestConfig): boolean {\n  const method = (config.method ?? 'get').toLowerCase()\n  if (!CSRF_PROTECTED_METHODS.has(method)) {\n    return false\n  }\n\n  return !AUTH_ENDPOINT_PATHS.has(getRequestPathname(config.url ?? ''))\n}",
          )
          text = text.replace(
              "      const requestUrl = originalRequest.url ?? ''\n      const isAuthEndpoint =\n        requestUrl.includes('/v1/auth/login') ||\n        requestUrl.includes('/v1/auth/register') ||\n        requestUrl.includes('/v1/auth/refresh')\n      if (isAuthEndpoint) {\n        if (requestUrl.includes('/v1/auth/refresh')) {",
              "      const requestPathname = getRequestPathname(originalRequest.url ?? '')\n      if (AUTH_ENDPOINT_PATHS.has(requestPathname)) {\n        if (requestPathname === '/v1/auth/refresh') {",
          )
          api_path.write_text(text)

          test_path = Path('frontend/src/unit/api-auth-v1.test.ts')
          test = test_path.read_text()
          marker = "it('refreshes expired requests through the canonical v1 auth endpoint', async () => {"
          csrf_test = """it('does not exempt protected requests that only mention an auth path in the query', async () => {\n  apiMock.get.mockResolvedValue({ csrf_token: 'fresh-token' })\n\n  const config = await requestInterceptor({\n    method: 'post',\n    url: '/threads/9?returnTo=/v1/auth/login',\n    headers: {},\n  })\n\n  expect(apiMock.get).toHaveBeenCalledWith('/v1/auth/csrf', { skipAuthRedirect: true })\n  expect(config.headers).toEqual({ 'X-CSRF-Token': 'fresh-token' })\n})\n\n"""
          test = test.replace(marker, csrf_test + marker)
          test += """\nit('refreshes a protected request whose query mentions an auth path', async () => {\n  apiMock.post.mockResolvedValue({ access_token: 'refreshed-token' })\n  apiMock.request.mockResolvedValue({ refreshed: true })\n\n  const originalRequest = { url: '/v1/threads/42?returnTo=/v1/auth/login', headers: {} }\n  const result = await responseInterceptor({\n    config: originalRequest,\n    response: { status: 401 },\n  })\n\n  expect(apiMock.post).toHaveBeenCalledWith('/v1/auth/refresh')\n  expect(apiMock.request).toHaveBeenCalledWith({\n    ...originalRequest,\n    _retry: true,\n    headers: { Authorization: 'Bearer refreshed-token' },\n  })\n  expect(result).toEqual({ refreshed: true })\n})\n"""
          test_path.write_text(test)
          Path('.github/workflows/factory-fix-827.yml').unlink()
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/services/api.ts frontend/src/unit/api-auth-v1.test.ts .github/workflows/factory-fix-827.yml
          git commit -m "fix: match canonical auth endpoints by pathname"
          git push origin HEAD:factory/642-auth-client-v1
