name: Factory Release Reconciliation

on:
  workflow_run:
    workflows:
      - Factory Ready Merge Drain
      - Fixed Model Factory Dispatcher
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional exact merged pull request to reconcile
        required: false
        type: string
      backfill_since:
        description: Optional ISO-8601 lower bound
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: factory-release-reconciliation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request release reconciliation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_STARTED: ${{ github.event.workflow_run.created_at }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_SINCE: ${{ inputs.backfill_since }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_PR" ]]; then
              gh workflow run release-writer.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f "pr_number=$INPUT_PR"
            elif [[ -n "$INPUT_SINCE" ]]; then
              gh workflow run release-writer.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f "backfill_since=$INPUT_SINCE"
            else
              gh workflow run release-writer.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main
            fi
            exit 0
          fi

          if [[ -z "$WORKFLOW_STARTED" ]]; then
            echo 'Factory workflow start time is unavailable; refusing an unbounded dispatch.' >&2
            exit 1
          fi

          mapfile -t merged_prs < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
              --jq ".[] | select(.merged_at != null and .merged_at >= \"$WORKFLOW_STARTED\") | .number"
          )

          if (( ${#merged_prs[@]} == 0 )); then
            echo "No PRs merged after factory workflow start $WORKFLOW_STARTED; nothing to reconcile."
            exit 0
          fi

          for pr in "${merged_prs[@]}"; do
            echo "Dispatching exact release reconciliation for merged PR #$pr"
            gh workflow run release-writer.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "pr_number=$pr"
          done
