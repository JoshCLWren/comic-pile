name: Reconcile OmniRoute free factory pool

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MANAGEMENT_API_KEY: ${{ secrets.OMNIROUTE_MANAGEMENT_API_KEY }}
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Reconcile qualified pool
        run: python3 .github/scripts/reconcile_omniroute_free_pool.py
