name: Materialize production profile review fixes

on:
  push:
    branches:
      - test/faithful-real-user-production-profile
    paths:
      - tmp-production-profile-review-fixes/**
      - .github/workflows/materialize-production-profile-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/faithful-real-user-production-profile
          fetch-depth: 0

      - name: Materialize checksum-verified review fixes
        run: python tmp-production-profile-review-fixes/materialize.py

      - name: Install manifest test dependency
        run: python -m pip install pytest

      - name: Verify manifest builder tests
        run: python -m pytest -q -c /dev/null --noconftest tests/test_build_production_profile_manifest.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check browser tests
        run: pnpm --filter frontend typecheck:test

      - name: Commit readable fixes and remove bridge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r tmp-production-profile-review-fixes .github/workflows/materialize-production-profile-review-fixes.yml
          git add frontend/playwright.prod-profile.config.ts
          git add frontend/src/test/production-profile-real-user-support.ts
          git add frontend/src/test/production-profile-real-user.spec.ts
          git add frontend/src/test/fixtures/production-profile-workload.json
          git add frontend/src/test/fixtures/production-profile-workload.actions.json
          git add frontend/src/test/fixtures/production-profile-workload.routes.json
          git add scripts/build_production_profile_manifest.py
          git add tests/test_build_production_profile_manifest.py
          git commit -m "Address production profiler review findings"
          git push origin HEAD:test/faithful-real-user-production-profile
