name: Cleanup issue 2104 tests

on:
  push:
    branches:
      - manual/2104-remove-continuity-readiness

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: manual/2104-remove-continuity-readiness
          fetch-depth: 0

      - name: Remove stale readiness mocks and audit references
        run: python scripts/cleanup_issue_2104_tests.py

      - name: Commit cleanup and remove temporary automation
        run: |
          rm -f scripts/cleanup_issue_2104_tests.py .github/workflows/issue-2104-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Remove stale readiness test mocks (#2104)"
          git push origin HEAD:manual/2104-remove-continuity-readiness
