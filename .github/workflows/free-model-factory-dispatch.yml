name: Fixed Model Factory Dispatcher

on:
  workflow_run:
    workflows: ['Factory heartbeat watchdog']
    types: [completed]
  workflow_dispatch:
    inputs:
      worker:
        description: Optional single Factory 6-46; blank runs the three-lane smoke set
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-model-factory-dispatch.yml'
      - '.github/workflows/free-model-factory-entry.yml'
      - '.github/workflows/free-model-factory-run.yml'
      - '.github/scripts/free-model-factory-worker.sh'
      - '.github/free-model-factories.tsv'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Resolve and dispatch fixed workers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SHA: ${{ github.sha }}
          WATCHDOG_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          DISPATCH_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          manifest='.github/free-model-factories.tsv'

          if [[ "$EVENT_NAME" == push ]]; then
            echo "Fixed-model automation changed at ${DEPLOY_SHA}; canceling older entry runs"
            stale_runs="$({
              for status in queued in_progress; do
                gh run list --workflow free-model-factory-entry.yml --status "$status" --limit 100 \
                  --json databaseId,headSha \
                  | jq -r --arg sha "$DEPLOY_SHA" '.[] | select(.headSha != $sha) | .databaseId'
              done
            } | sort -u)"

            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              echo "Canceling stale fixed-model entry run ${run_id}"
              if ! gh run cancel "$run_id"; then
                current_status="$(gh run view "$run_id" --json status --jq '.status')"
                [[ "$current_status" == completed ]] || {
                  echo "Unable to cancel stale fixed-model entry run ${run_id}; status=${current_status}" >&2
                  exit 1
                }
              fi
            done <<< "$stale_runs"
          fi

          if [[ "$EVENT_NAME" == workflow_dispatch && -n "${DISPATCH_WORKER:-}" ]]; then
            awk -F '\t' -v worker="$DISPATCH_WORKER" '$1 == worker {found=1} END {exit !found}' "$manifest"
            workers="$(jq -nc --arg worker "$DISPATCH_WORKER" '[$worker]')"
          elif [[ "$EVENT_NAME" == workflow_run ]]; then
            slots=(0 15 30 45)
            index=$((WATCHDOG_RUN_NUMBER % 4))
            minute="${slots[$index]}"
            workers="$(awk -F '\t' -v minute="$minute" '$4 == minute {print $1}' "$manifest" | jq -Rsc 'split("\n") | map(select(length > 0))')"
            echo "Watchdog run ${WATCHDOG_RUN_NUMBER} selected :$(printf '%02d' "$minute") batch"
          else
            # Immediate post-merge/manual smoke: NVIDIA, OmniRoute, OpenCode.
            workers='["6","32","39"]'
          fi

          [[ "$workers" != '[]' ]] || { echo 'Dispatcher resolved no workers' >&2; exit 1; }
          echo "Dispatching workers: $workers"

          while IFS= read -r worker; do
            echo "Starting Factory ${worker}"
            gh workflow run free-model-factory-entry.yml --ref main -f worker="$worker"
          done < <(jq -r '.[]' <<< "$workers")
