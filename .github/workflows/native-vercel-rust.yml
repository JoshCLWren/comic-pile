name: Native Vercel Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-vercel-rust:
    name: Rust function build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-local-test
          POSTGRES_DB: native_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_ROLL_TEST_DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/native_auth_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Forbid database-test bypass
        run: |
          if [[ -n "${RUST_ROLL_ALLOW_DB_SKIP+x}" ]]; then
            echo "::error::RUST_ROLL_ALLOW_DB_SKIP is forbidden in CI and factory tests."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify unified Cargo workspace lockfile
        # Runs the same guard the production @vercel/rust build.sh runs. It
        # fails on a second lockfile, divergent resolution or lock mutation,
        # and exports the canonical digest so build.rs asserts it on every
        # subsequent cargo invocation in this job.
        working-directory: .
        run: |
          set -euo pipefail
          node check-rust-workspace-lock.mjs
          lock_sha256="$(node check-rust-workspace-lock.mjs --lock-sha256)"
          printf 'COMICPILE_EXPECTED_LOCK_SHA256=%s\n' "$lock_sha256" >> "$GITHUB_ENV"
      - name: Check workspace Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile the native Vercel Rust function
        run: cargo check --locked -p comicpile-vercel-native --all-targets
      - name: Run native function tests
        run: cargo test --locked -p comicpile-vercel-native --all-targets
