name: Native Vercel Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-vercel-rust:
    name: Rust function build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check Vercel Rust function formatting
        run: cargo fmt --manifest-path Cargo.toml -- --check
      - name: Compile the native Vercel Rust function
        run: cargo check --manifest-path Cargo.toml --all-targets
      - name: Run native function tests
        run: cargo test --manifest-path Cargo.toml --all-targets
      - name: Print generated root lockfile for committed reproducibility
        run: |
          echo "COMICPILE_LOCK_BEGIN"
          base64 -w0 Cargo.lock
          echo
          echo "COMICPILE_LOCK_END"
