name: Native Vercel Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-vercel-rust:
    name: Rust function build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-local-test
          POSTGRES_DB: native_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_ROLL_TEST_DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/native_auth_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Python bundle excludes cached Rust artifacts
        run: |
          npm install --prefix "$RUNNER_TEMP/python-bundle-test" --ignore-scripts --no-audit --no-fund --package-lock=false @vercel/build-utils@15.2.0
          VERCEL_BUILD_UTILS_DIR="$RUNNER_TEMP/python-bundle-test" node .github/scripts/test-python-bundle.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install migration dependencies
        run: uv sync --frozen --all-extras
      - name: Prepare the migrated PostgreSQL schema for Rust integration tests
        env:
          DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/native_auth_test
        run: uv run alembic upgrade head
      - name: Check Vercel Rust function formatting
        run: cargo fmt --manifest-path Cargo.toml -- --check
      - name: Compile the native Vercel Rust function
        run: cargo check --locked --manifest-path Cargo.toml --all-targets
      - name: Run native function tests
        run: cargo test --locked --manifest-path Cargo.toml --all-targets
