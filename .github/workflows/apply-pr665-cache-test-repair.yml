name: Apply PR 665 cache test repair

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  repair-cache-tests:
    if: github.event.pull_request.number == 665
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: add-upstash-cache
          fetch-depth: 0

      - name: Apply test repair
        run: python scripts/fix_pr665_cache_tests.py

      - name: Validate repair
        run: |
          python -m compileall -q tests/test_cache.py
          git diff --check
          grep -F 'pytest.skip(reason="REDIS_URL is required for cache regression tests")' tests/test_cache.py
          grep -F 'test_username: str' tests/test_cache.py
          if grep -F 'user_id=sample_data["user"].id' tests/test_cache.py; then
            echo "stale sample_data ownership remains"
            exit 1
          fi

      - name: Commit clean test fix
        run: |
          rm .github/workflows/apply-pr665-cache-test-repair.yml
          rm scripts/fix_pr665_cache_tests.py
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_cache.py .github/workflows/apply-pr665-cache-test-repair.yml scripts/fix_pr665_cache_tests.py
          git commit -m "Fix cache regression test setup"
          git push origin HEAD:add-upstash-cache
