name: Factory Regenerate OpenAPI

on:
  push:
    branches:
      - factory/848-report-type

permissions:
  contents: write

concurrency:
  group: factory-regenerate-openapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-clean-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: factory/848-report-type

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Restore locked Python environment
        run: uv sync --frozen

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Regenerate and commit deterministic artifacts
        env:
          PYTHONPATH: .
        run: |
          uv run python scripts/generate_openapi_types.py
          git rm .github/workflows/factory-regenerate-openapi.yml
          git add frontend/src/generated/openapi.json frontend/src/generated/openapi.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Regenerate OpenAPI artifacts"
          git push origin HEAD:factory/848-report-type
