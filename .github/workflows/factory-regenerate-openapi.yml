name: Factory Regenerate OpenAPI

on:
  push:
    branches:
      - factory/843-continuity-rule-crud

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: factory/843-continuity-rule-crud
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Restore locked Python environment
        run: uv sync --frozen
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Regenerate and commit OpenAPI artifacts
        env:
          PYTHONPATH: .
        run: |
          uv run python scripts/generate_openapi_types.py
          git add frontend/src/generated/openapi.json frontend/src/generated/openapi.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate OpenAPI artifacts"
          git push origin HEAD:factory/843-continuity-rule-crud
