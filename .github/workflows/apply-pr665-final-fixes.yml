name: Apply PR 665 final CI fixes

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply-final-fixes:
    if: github.event.pull_request.number == 665 && github.event.pull_request.head.ref == 'add-upstash-cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: add-upstash-cache
          fetch-depth: 0

      - name: Apply final fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          issue_path = Path("app/api/issue.py")
          issue_text = issue_path.read_text()

          old_import = "from app.api.dependency import _invalidate_dependency_caches\n"
          new_import = (
              "from app.api.dependency import _invalidate_dependency_caches\n"
              "from app.api.session import _invalidate_session_caches\n"
          )
          if issue_text.count(old_import) != 1:
              raise RuntimeError("Unexpected session invalidation import match count")
          issue_text = issue_text.replace(old_import, new_import, 1)

          old_coros = '''    coros = [
              invalidate_cache(f"cache:list_issues:{thread_id}:*"),
          '''
          new_coros = '''    coros = [
              _invalidate_session_caches(user_id),
              invalidate_cache(f"cache:list_issues:{thread_id}:*"),
          '''
          if issue_text.count(old_coros) != 1:
              raise RuntimeError("Unexpected issue cache coroutine match count")
          issue_text = issue_text.replace(old_coros, new_coros, 1)
          issue_path.write_text(issue_text)

          test_path = Path("tests/test_cache.py")
          test_text = test_path.read_text()
          old_skip = '        pytest.skip(reason="REDIS_URL is required for cache regression tests")\n'
          new_assert = (
              '        assert settings.redis_url is not None, '
              '"REDIS_URL is required for cache regression tests"\n'
          )
          if test_text.count(old_skip) != 1:
              raise RuntimeError("Unexpected Redis requirement match count")
          test_text = test_text.replace(old_skip, new_assert, 1)
          test_path.write_text(test_text)
          PY

      - name: Validate source edits
        run: |
          python -m compileall -q app/api/issue.py tests/test_cache.py
          git diff --check
          grep -q "_invalidate_session_caches(user_id)" app/api/issue.py
          grep -q "assert settings.redis_url is not None" tests/test_cache.py

      - name: Commit clean final fixes
        run: |
          rm .github/workflows/apply-pr665-final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final cache CI failures"
          git push origin HEAD:add-upstash-cache
