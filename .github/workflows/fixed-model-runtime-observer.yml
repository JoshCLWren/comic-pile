name: Fixed Model Runtime Observer

on:
  pull_request:
    paths:
      - .github/scripts/classify-fixed-model-run.py
      - .github/workflows/fixed-model-runtime-observer.yml
  workflow_run:
    workflows:
      - Fixed Model Factory Entry
    types:
      - completed

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

jobs:
  classifier-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test fixed-model runtime classifier
        run: python .github/scripts/classify-fixed-model-run.py --self-test

  publish-runtime-outcome:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Read fixed-model job log
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          job_id="$(jq -r '[.jobs[] | select(.name == "run / factory") | .id][0] // empty' <<< "$jobs")"
          if [[ -z "$job_id" ]]; then
            echo 'No fixed-model execution job exists for this run; nothing lane-specific can be published.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/fixed-model.log"
          python .github/scripts/classify-fixed-model-run.py \
            --log "$RUNNER_TEMP/fixed-model.log" > "$RUNNER_TEMP/runtime-outcome.json"
          # Backup and primary collectors must agree: a log claim is not PR
          # delivery proof. Verify one targeted GitHub PR before persistence.
          delivery_pr="$(jq -r '.delivery_pr // empty' "$RUNNER_TEMP/runtime-outcome.json")"
          if [[ -n "$delivery_pr" ]]; then
            [[ "$delivery_pr" =~ ^[1-9][0-9]*$ ]] || exit 1
            delivery="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$delivery_pr")"
            jq -e --arg repo "$GITHUB_REPOSITORY" --argjson number "$delivery_pr" '
              .number == $number and .head.repo.full_name == $repo and
              (.state == "open" or .merged == true) and
              (.head.sha | test("^[0-9a-f]{40}$"))
            ' <<< "$delivery" >/dev/null || {
              echo "::error::Unverified PR handoff #$delivery_pr"
              exit 1
            }
          fi
          worker="$(jq -r '.worker // empty' "$RUNNER_TEMP/runtime-outcome.json")"
          if [[ -z "$worker" ]]; then
            echo 'The fixed-model job did not reach lane resolution; no durable worker marker can be identified.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/runtime-outcome.json"

      - name: Configure shared Neon factory registry cache
        if: steps.runtime.outputs.publish == 'true'
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Update durable attempt-outcome marker
        if: steps.runtime.outputs.publish == 'true'
        shell: bash
        env:
          WORKER: ${{ steps.runtime.outputs.worker }}
        run: |
          set -Eeuo pipefail
          data="$RUNNER_TEMP/runtime-outcome.json"
          # Attempt evidence has its own durable record. Runner liveness updates use
          # factory-heartbeat:v1 and must never overwrite this classified result.
          marker="<!-- factory-attempt-outcome:v1 worker=opencode-free-model-factory-${WORKER} -->"
          model="$(jq -r .model "$data")"
          source="$(jq -r .source "$data")"
          minute="$(jq -r .minute "$data")"
          outcome="$(jq -r .outcome "$data")"
          outcome_class="$(jq -r .outcome_class "$data")"
          detail="$(jq -r .detail "$data")"
          proven="$(jq -r 'if .exact_model_proven then "yes" else "no" end' "$data")"
          persisted="$(jq -r 'if .persisted_work then "yes" else "no" end' "$data")"
          delivery_state="$(jq -r '.delivery_outcome // "none"' "$data")"
          delivery_pr="$(jq -r '.delivery_pr // empty' "$data")"
          selected_kind="$(jq -r '.selected_kind // ""' "$data")"
          selected_number="$(jq -r '.selected_number // ""' "$data")"
          selected='none'
          if [[ -n "$selected_kind" && -n "$selected_number" ]]; then
            selected="${selected_kind} #${selected_number}"
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nSlot: :%02d hourly\nAgent outcome: %s\nAttempt outcome: %s\nExact model execution proven: %s\nSelected: %s\nPersisted work signal: %s\nVerified delivery: %s\nDelivered PR: %s\nDetail: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "$model" "$source" "$minute" "$outcome" "$outcome_class" "$proven" "$selected" "$persisted" "$delivery_state" "${delivery_pr:-none}" "$detail" "$now" "$RUN_URL")"
          {
            echo "### Observed factory worker outcome"
            echo
            echo "Agent: \`$outcome_class\`"
            echo "Verified delivery: \`$delivery_state\`"
            echo "PR: \`${delivery_pr:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Trusted Neon stores a compact advisory ID. Verify its actual GitHub
          # author/marker before a mutation; no shared comment body cache.
          locators="$(python3 .github/scripts/factory_state_operations.py export-model-exclusions \
            --repo "$GITHUB_REPOSITORY" --worker "$WORKER")"
          comment_id="$(jq -r '.__attempt_id[0] // empty' <<< "$locators")"
          current=''
          if [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
            current="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" 2>/dev/null || true)"
          else
            comment_id=''
          fi
          if [[ -z "$comment_id" || -z "$current" ]]; then
            # Cold-start only, following a missing or invalidated locator.
            comment_id="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
              | python3 .github/scripts/factory_registry_verify.py find --kind attempt --worker "$WORKER")"
            current=''
          fi
          if [[ -n "$comment_id" && -z "$current" ]]; then
            current="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" 2>/dev/null || true)"
          fi
          # Real validation follows: author, canonical worker and marker kind.
          verified="$(python3 -c 'import json,sys; sys.path.insert(0,".github/scripts"); from factory_registry_ingest import marker_ids; print(any(m["worker"]==sys.argv[1] and m["kind"]=="attempt" and m["id"]==sys.argv[2] for m in marker_ids([json.load(sys.stdin)])))' \
            "$WORKER" "$comment_id" <<< "$current" 2>/dev/null || true)"
          if [[ "$verified" != True ]]; then
            comment_id=''
            current=''
          fi
          existing_run=''
          if [[ -n "$comment_id" ]]; then
            existing_run="$(jq -r '.body // ""' <<< "$current" \
              | sed -n 's/^Run: //p' | tail -1)"
          fi
          if [[ "$existing_run" =~ ^[0-9]+$ ]] && (( existing_run > RUN_ID )); then
            echo "Newer attempt evidence from run ${existing_run} already exists; preserving it"
          elif [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            created="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body")"
            comment_id="$(jq -er '.id' <<< "$created")"
          fi
          if [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              > "$RUNNER_TEMP/verified-attempt-marker.json"
            python3 - "$RUNNER_TEMP/verified-attempt-marker.json" <<'PYMARKER'
          import json
          import os
          import sys
          sys.path.insert(0, ".github/scripts")
          from factory_registry_ingest import marker_ids
          from factory_state_operations import remember_verified_markers
          with open(sys.argv[1], encoding="utf-8") as stream:
              markers = [item for item in marker_ids([json.load(stream)]) if item["kind"] == "attempt"]
          if markers:
              remember_verified_markers(os.environ["GITHUB_REPOSITORY"], markers)
          PYMARKER
          fi

      - name: Persist classified worker completion in Neon
        if: always() && steps.runtime.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_state_ledger.py runtime-outcome \
            --repo "$GITHUB_REPOSITORY" --run-id "$RUN_ID" \
            --file "$RUNNER_TEMP/runtime-outcome.json"
