name: PR 712 Chromium E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build Chromium E2E Image
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.set-outputs.outputs.image-ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set lowercase image name
        id: lowercase
        run: echo "image-name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Chromium E2E image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}:chromium-e2e-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image reference
        id: set-outputs
        run: echo "image-ref=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image-name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  chromium-e2e:
    name: Chromium E2E shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    container:
      image: ${{ needs.build.outputs.image-ref }}
      options: >-
        --shm-size=2gb
        --memory=8gb
        --cpus=4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI: true
      HOME: /root
      TEST_ENVIRONMENT: "true"
      SECRET_KEY: test-secret-key-for-testing-only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/comic_pile_test
      REDIS_URL: redis://redis:6379/0
      PGUSER: postgres
      PATH: "/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Remove local environment files
        run: rm -f .env .env.test .env.backup .envrc .env.local .env.production

      - name: Wait for PostgreSQL
        run: |
          i=1
          while [ "$i" -le 30 ]; do
            if pg_isready -h postgres -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
            i=$((i + 1))
          done
          exit 1

      - name: Restore frontend toolchain
        run: |
          mkdir -p static
          rm -rf frontend/node_modules static/react
          cp -a /opt/ci-assets/static/react static/react
          pnpm install --frozen-lockfile

      - name: Start backend server
        shell: bash
        run: |
          export AUTO_BACKUP_ENABLED=false
          python -m uvicorn app.main:app --host 0.0.0.0 --port 9000 --workers 1 --log-level warning > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend
        run: |
          i=1
          while [ "$i" -le 30 ]; do
            if curl -f http://localhost:9000/health 2>/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
            i=$((i + 1))
          done
          cat /tmp/backend.log || true
          exit 1

      - name: Run Chromium Playwright shard
        run: cd frontend && REUSE_EXISTING_SERVER=true BASE_URL=http://localhost:9000 pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/6

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            /tmp/backend.log
            frontend/playwright-report
            frontend/test-results
