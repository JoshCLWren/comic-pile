name: Fixed free-model factory runner

on:
  workflow_call:
    inputs:
      worker:
        description: Durable factory executor slot
        required: true
        type: string
    secrets:
      OMNIROUTE_API_KEY:
        required: false
      OMNIROUTE_MANAGEMENT_API_KEY:
        required: false
      PR_REBASE_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: fixed-model-factory-${{ inputs.worker }}
  cancel-in-progress: false

env:
  FACTORY_BUDGET_SECONDS: '1200'
  OPENCODE_VERSION: '1.18.18'
  OPENCODE_LINUX_X64_SHA256: '0cddc222418b8553669905a8980c0cda7088f00da24d83d6ac76b01c9fdb2aaf'
  KILO_VERSION: '7.4.22'
  KILO_LINUX_X64_BASELINE_SHA256: 'bf817ad53bc95b16abe92e7a2389cc9f509c62c3510c23ecc58e151a4455cb41'

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Workflow token handles GitHub API, labels, comments, and backlog-zero
      # workflow dispatch. A dedicated PAT is used only for git fetch/push so
      # pull_request workflows are attributed to a trusted actor.
      GH_TOKEN: ${{ github.token }}
      PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MANAGEMENT_API_KEY: ${{ secrets.OMNIROUTE_MANAGEMENT_API_KEY }}
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
    steps:
      - name: Require trusted push credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PR_REBASE_TOKEN:-}" ]]; then
            echo '::error::PR_REBASE_TOKEN is required so fixed-model factory pushes trigger PR workflows without action_required.'
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PR_REBASE_TOKEN }}

      - name: Configure trusted git remote
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote set-url origin "https://x-access-token:${PR_REBASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Resolve executor slot policy
        id: lane
        shell: bash
        env:
          REQUESTED_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          row="$(awk -F '\t' -v worker="$REQUESTED_WORKER" '$1 == worker {print; exit}' .github/free-model-factories.tsv)"
          [[ -n "$row" ]] || { echo "No fixed-model lane for worker ${REQUESTED_WORKER}" >&2; exit 1; }
          IFS=$'\t' read -r worker source model minute scheduler display <<< "$row"
          [[ "$worker" == "$REQUESTED_WORKER" ]]

          # GitHub agents have one execution gateway. The manifest remains the
          # durable worker roster, while OmniRoute owns provider/model choice.
          source='omniroute-free'
          model='free-cascade-small'
          runtime_model='omniroute/free-cascade-small'
          branch_suffix='omniroute'
          if [[ -n "${OMNIROUTE_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]]; then
            configured=true
            reason='omniroute-only-gateway'
          else
            configured=false
            reason='missing-OMNIROUTE credentials'
          fi

          {
            echo "worker=$worker"
            echo "source=$source"
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "minute=$minute"
            echo "scheduler=$scheduler"
            echo "display=$display"
            echo "branch_suffix=$branch_suffix"
            echo "configured=$configured"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          printf 'Factory %s locked: source=%s model=%s runtime=%s minute=:%02d scheduler=%s configured=%s\n' \
            "$worker" "$source" "$model" "$runtime_model" "$minute" "$scheduler" "$configured"

      - name: Configure git identity
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
        run: |
          git config user.name "opencode-free-model-factory-${WORKER}[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Ensure durable owner label
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}

        run: |
          set -Eeuo pipefail
          label="factory:${WORKER}"
          description="Factory ${WORKER}: code and review executor slot"
          if gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          fi

      - name: Stop cleanly when optional credentials are not configured
        if: steps.lane.outputs.configured != 'true'
        shell: bash
        env:
          REASON: ${{ steps.lane.outputs.reason }}
          DISPLAY: ${{ steps.lane.outputs.display }}
        run: |
          echo "${DISPLAY} lane is installed but inactive: ${REASON}"

      - name: Install pinned OpenCode release
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source != 'kilo-auto'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          bin_dir="$RUNNER_TEMP/opencode-bin"
          curl -fsSL \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$OPENCODE_LINUX_X64_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          test -x "$bin_dir/opencode"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/opencode" --version

      - name: Install pinned Kilo CLI release
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'kilo-auto'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/kilo-linux-x64-baseline.tar.gz"
          bin_dir="$RUNNER_TEMP/kilo-bin"
          curl -fsSL \
            "https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/kilo-linux-x64-baseline.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$KILO_LINUX_X64_BASELINE_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          kilo_path="$(find "$bin_dir" -type f -name kilo -perm -111 | head -n 1)"
          [[ -n "$kilo_path" ]] || { echo 'Pinned Kilo archive did not contain an executable kilo binary' >&2; exit 1; }
          if [[ "$kilo_path" != "$bin_dir/kilo" ]]; then ln -s "$kilo_path" "$bin_dir/kilo"; fi
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/kilo" --version

      - name: Select execution candidate at dispatch time
        id: executor
        if: steps.lane.outputs.configured == 'true'
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          SOURCE: ${{ steps.lane.outputs.source }}
          LANE_MODEL: ${{ steps.lane.outputs.model }}
          LANE_RUNTIME_MODEL: ${{ steps.lane.outputs.runtime_model }}
          LANE_DISPLAY: ${{ steps.lane.outputs.display }}
          LANE_BRANCH_SUFFIX: ${{ steps.lane.outputs.branch_suffix }}
        run: |
          set -Eeuo pipefail
          discovery_outcome="$RUNNER_TEMP/factory-discovery-outcome"

          [[ "$SOURCE" == 'omniroute-free' ]] || {
            printf 'control_plane_failure\tGitHub execution is OmniRoute-only; got %s\n' "$SOURCE" > "$discovery_outcome"
            exit 1
          }

          discover_provider() {
            local provider="$1"
            local catalog="$2"
            python3 .github/scripts/factory_provider_candidates.py \
              --provider "$provider" --catalog "$catalog"
          }

          catalog_candidates='[]'
          catalog_successes=0
          catalog_failures=()

          if [[ -n "${OMNIROUTE_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]]; then
            omniroute_catalog="$RUNNER_TEMP/factory-omniroute-catalog"
            if curl --silent --show-error --fail-with-body \
              --connect-timeout 5 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 \
              --header "Authorization: Bearer ${OMNIROUTE_API_KEY}" \
              "${OMNIROUTE_BASE_URL%/}/models" > "$omniroute_catalog"; then
              if omniroute_discovery="$(discover_provider omniroute-free "$omniroute_catalog")" \
                && jq -e '.status and (.candidates | type == "array")' >/dev/null <<< "$omniroute_discovery"; then
                if [[ "$(jq -r '.status' <<< "$omniroute_discovery")" != invalid ]]; then
                  catalog_successes=$((catalog_successes + 1))
                  candidates="$(jq -c '.candidates // []' <<< "$omniroute_discovery")"
                  catalog_candidates="$(jq -cn \
                    --argjson left "$catalog_candidates" --argjson right "$candidates" \
                    '$left + $right | unique_by([.provider, .model])')"
                else
                  catalog_failures+=('OmniRoute returned an invalid model catalog')
                fi
              else
                catalog_failures+=('OmniRoute candidate adapter failed')
              fi
            else
              catalog_failures+=('OmniRoute model catalog request failed')
            fi
          fi

          candidate_count="$(jq 'length' <<< "$catalog_candidates")"
          if (( candidate_count == 0 )); then
            if (( catalog_successes == 0 )); then
              IFS=';' failure_detail="${catalog_failures[*]}"
              printf 'provider_unavailable\t%s\n' \
                "${failure_detail:-No catalog provider was executable}" > "$discovery_outcome"
            else
              printf 'model_unavailable\tLive catalogs exposed no policy-eligible candidate\n' \
                > "$discovery_outcome"
            fi
            exit 1
          fi

          catalog_candidates="$(jq '[.[] | select(.provider == "omniroute-free")]' <<< "$catalog_candidates")"
          candidate_count="$(jq 'length' <<< "$catalog_candidates")"
          if (( candidate_count == 0 )); then
            printf 'provider_unavailable\tOmniRoute exposed no policy-eligible candidate\n' > "$discovery_outcome"
            exit 1
          fi

          discovery_file="$RUNNER_TEMP/factory-provider-discovery.json"
          comments_file="$RUNNER_TEMP/factory-attempt-comments.json"
          jq -cn --argjson candidates "$catalog_candidates" \
            '{candidates: $candidates}' > "$discovery_file"
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            > "$comments_file"; then
            printf 'control_plane_failure\tFactory health evidence could not be read\n' > "$discovery_outcome"
            exit 1
          fi

          preferred_provider='omniroute-free'
          selection="$(python3 .github/scripts/factory_candidate_health.py \
            --discovery "$discovery_file" --comments "$comments_file" \
            --worker "$WORKER" --preferred-provider "$preferred_provider")"
          source="$(jq -r '.selected.provider // empty' <<< "$selection")"
          model="$(jq -r '.selected.model // empty' <<< "$selection")"
          runtime_model="$(jq -r '.selected.runtime_model // empty' <<< "$selection")"
          health_state="$(jq -r '.selected.health_state // empty' <<< "$selection")"
          if [[ -z "$source" || -z "$model" || -z "$runtime_model" ]]; then
            failure_outcome="$(jq -r '.failure_outcome // "unknown_failure"' <<< "$selection")"
            failure_detail="$(jq -r '.detail // "candidate health selection failed"' <<< "$selection")"
            printf '%s\t%s\n' "$failure_outcome" "$failure_detail" > "$discovery_outcome"
            exit 1
          fi

          case "$source" in
            opencode-free) branch_suffix='opencode-free' ;;
            openrouter-free) branch_suffix='openrouter' ;;
            omniroute-free) branch_suffix='omniroute' ;;
            *)
              printf 'control_plane_failure\tSelected unsupported catalog provider: %s\n' \
                "$source" > "$discovery_outcome"
              exit 1
              ;;
          esac
          {
            echo "source=$source"
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "display=${source} · ${model}"
            echo "branch_suffix=$branch_suffix"
            echo "reason=selected-${health_state}-from-live-provider-catalog"
          } >> "$GITHUB_OUTPUT"
          printf 'Factory %s selected executor: provider=%s model=%s runtime=%s health=%s\n' \
            "$WORKER" "$source" "$model" "$runtime_model" "$health_state"

      - name: Report selected executor heartbeat
        if: always()
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          MINUTE: ${{ steps.lane.outputs.minute }}
          CONFIGURED: ${{ steps.lane.outputs.configured }}
          REASON: ${{ steps.executor.outputs.reason || steps.lane.outputs.reason }}
          EXECUTOR_OUTCOME: ${{ steps.executor.outcome }}
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          marker="<!-- factory-heartbeat:v1 worker=opencode-free-model-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$CONFIGURED" != true ]]; then
            outcome='unconfigured'
          elif [[ "$EXECUTOR_OUTCOME" != success ]]; then
            outcome='selection-failed'
          else
            outcome='running'
          fi
          body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nSlot: :%02d hourly\nOutcome: %s\nConfiguration: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "$MODEL" "$SOURCE" "$MINUTE" "$outcome" "$REASON" "$now" "$GITHUB_RUN_ID")"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Configure selected OmniRoute capacity
        if: steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'omniroute-free'
        shell: bash
        env:
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${OMNIROUTE_API_KEY:-}" ]] || { echo 'OMNIROUTE_API_KEY missing for selected OmniRoute capacity' >&2; exit 1; }
          [[ -n "${OMNIROUTE_BASE_URL:-}" ]] || { echo 'OMNIROUTE_BASE_URL missing for selected OmniRoute capacity' >&2; exit 1; }

          mkdir -p "$HOME/.config/opencode"
          jq -n \
            --arg model "$MODEL" \
            --arg key "$OMNIROUTE_API_KEY" \
            --arg base_url "${OMNIROUTE_BASE_URL%/}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job "$GITHUB_JOB" \
            --arg workflow "$GITHUB_WORKFLOW" \
            '{
              provider: {
                omniroute: {
                  npm: "@ai-sdk/openai-compatible",
                  name: "OmniRoute free capacity",
                  options: {
                    baseURL: $base_url,
                    apiKey: $key,
                    headers: {
                      "X-GitHub-Run-ID": $run_id,
                      "X-GitHub-Job": $job,
                      "X-GitHub-Workflow": $workflow
                    }
                  },
                  models: {($model): {name: $model}}
                }
              }
            }' > "$HOME/.config/opencode/opencode.json"
          chmod 600 "$HOME/.config/opencode/opencode.json"

      - name: Smoke selected OmniRoute route through OpenCode
        if: steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) != 'kilo-auto'
        shell: bash
        env:
          RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain)"
          [[ -z "$before" ]] || { echo 'Smoke requires clean worktree' >&2; exit 1; }
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            opencode run -m "$RUNTIME_MODEL" --agent build --dir "$GITHUB_WORKSPACE" \
            --title 'ComicPile fixed-model smoke' \
            'Reply with exactly FIXED_MODEL_OPENCODE_OK. Do not edit files, run commands, or use tools.' \
            2>&1 | tee "$RUNNER_TEMP/fixed-model-smoke.log"
          status=${PIPESTATUS[0]}
          set -e
          record_smoke_model_outcome() {
            local smoke_log="$RUNNER_TEMP/fixed-model-smoke.log"
            if grep -Eiq 'HTTP[^0-9]*410|410 Gone' "$smoke_log"; then
              printf 'model_retired_410\t%s\n' \
                "${RUNTIME_MODEL} returned HTTP 410 and is permanently retired" \
                > "$RUNNER_TEMP/factory-discovery-outcome"
            elif grep -Eiq 'model[^[:alnum:]]+(not found|not available|unavailable|does not exist)|unknown model|invalid model|HTTP[^0-9]*404|404 Not Found|Model is unavailable' "$smoke_log"; then
              printf 'model_unavailable\t%s\n' \
                "${RUNTIME_MODEL} was rejected as unavailable by OmniRoute" \
                > "$RUNNER_TEMP/factory-discovery-outcome"
            elif grep -Eiq '429|Too Many Requests|rate.?limit|cooling down' "$smoke_log"; then
              printf 'provider_throttle\t%s\n' \
                "${RUNTIME_MODEL} was throttled or all upstream credentials were cooling down" \
                > "$RUNNER_TEMP/factory-discovery-outcome"
            elif grep -Eiq 'bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$smoke_log"; then
              printf 'provider_failure\t%s\n' \
                "${RUNTIME_MODEL} failed with a transient gateway or upstream error" \
                > "$RUNNER_TEMP/factory-discovery-outcome"
            fi
          }
          if (( status != 0 )); then
            if (( status == 124 || status == 137 || status == 143 )) || \
              grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/fixed-model-smoke.log"; then
              record_smoke_model_outcome
              echo "Transient smoke failure detected for ${RUNTIME_MODEL}; quarantining this route for the next selection" >&2
              cat "$RUNNER_TEMP/fixed-model-smoke.log" >&2 || true
              exit 1
            fi
            record_smoke_model_outcome
            exit "$status"
          fi
          if ! grep -q 'FIXED_MODEL_OPENCODE_OK' "$RUNNER_TEMP/fixed-model-smoke.log"; then
            if grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/fixed-model-smoke.log"; then
              record_smoke_model_outcome
              echo "Transient smoke failure detected for ${RUNTIME_MODEL}; quarantining this route for the next selection" >&2
              cat "$RUNNER_TEMP/fixed-model-smoke.log" >&2 || true
              exit 1
            fi
            echo "Smoke did not return FIXED_MODEL_OPENCODE_OK" >&2
            cat "$RUNNER_TEMP/fixed-model-smoke.log" >&2 || true
            record_smoke_model_outcome
            exit 1
          fi
          [[ -z "$(git status --porcelain)" ]] || { echo 'Model smoke modified the worktree' >&2; exit 1; }

      - name: Smoke Kilo Auto Free through Kilo CLI
        if: steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'kilo-auto'
        shell: bash
        env:
          FACTORY_RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain)"
          [[ -z "$before" ]] || { echo 'Smoke requires clean worktree' >&2; exit 1; }
          attempt=0
          max_attempts=3
          while (( attempt < max_attempts )); do
            attempt=$((attempt + 1))
            set +e
            bash .github/scripts/kilo-auto-factory-run.sh \
              180 \
              'ComicPile Kilo Auto Free smoke' \
              'Reply with exactly KILO_AUTO_FREE_OK. Do not edit files, run commands, or use tools.' \
              "$RUNNER_TEMP/kilo-auto-smoke.log"
            status=$?
            set -e
            if grep -q 'KILO_AUTO_FREE_OK' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
              break
            fi
            if grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
              if (( attempt < max_attempts )); then
                retry_after="$(grep -Ei 'retry-after:[[:space:]]*[0-9]+' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null | tail -n1 | grep -Eo '[0-9]+' | tail -n1 || true)"
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  delay=$(( retry_after > 60 ? 60 : retry_after ))
                else
                  delay=$(( 5 * attempt ))
                fi
                echo "Kilo smoke transient failure (attempt ${attempt}/${max_attempts}); retrying after ${delay}s" >&2
                cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
                sleep "$delay"
                continue
              fi
              echo "Transient Kilo smoke failure after ${attempt} attempts; allowing worker to proceed with built-in retry handling" >&2
              cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
              exit 0
            fi
            # Non-transient failure without sentinel - break to final error handling
            break
          done
          if grep -q 'KILO_AUTO_FREE_OK' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
            echo "Kilo smoke succeeded"
          elif grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
            echo "Transient Kilo smoke failure detected; allowing worker to proceed with built-in retry handling" >&2
            cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
            exit 0
          else
            echo "Kilo smoke did not return KILO_AUTO_FREE_OK" >&2
            cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
            exit 1
          fi
          [[ -z "$(git status --porcelain)" ]] || { echo 'Kilo smoke modified the worktree' >&2; exit 1; }

      - name: Run continuous fixed-model factory session
        if: steps.lane.outputs.configured == 'true'
        env:
          FACTORY_WORKER: ${{ steps.lane.outputs.worker }}
          FACTORY_SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          FACTORY_MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          FACTORY_RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
          FACTORY_DISPLAY: ${{ steps.executor.outputs.display || steps.lane.outputs.display }}
          FACTORY_BRANCH_SUFFIX: ${{ steps.executor.outputs.branch_suffix || steps.lane.outputs.branch_suffix }}
        run: |
          set +e
          bash .github/scripts/free-model-factory-worker.sh
          worker_status=$?
          set -e
          # Write after the worker (and model) exits, so attempt code cannot
          # forge the trusted wrapper's source classification.
          printf '%s\n' "$worker_status" > "$RUNNER_TEMP/factory-worker-status"
          exit "$worker_status"

      - name: Report OmniRoute routing summary
        if: always() && steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'omniroute-free'
        shell: bash
        env:
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${OMNIROUTE_MANAGEMENT_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]] || {
            echo 'OmniRoute routing summary unavailable: gateway credentials missing' >&2
            exit 0
          }
          gateway_base_url="${OMNIROUTE_BASE_URL%/}"
          case "$gateway_base_url" in
            */v1) gateway_base_url="${gateway_base_url%/v1}" ;;
          esac
          analytics="$RUNNER_TEMP/omniroute-analytics.json"
          code="$(curl --silent --show-error --output "$analytics" --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 \
            --header "Authorization: Bearer ${OMNIROUTE_MANAGEMENT_API_KEY}" \
            "${gateway_base_url}/api/usage/analytics?period=session" || true)"
          if [[ "$code" != 200 ]]; then
            message="OmniRoute routing summary unavailable (HTTP ${code})"
            echo "::warning::$message"
            echo "$message" >&2
            {
              echo '### OmniRoute routing summary'
              echo
              echo "> ⚠️ ${message}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary="$(jq -r '.summary | "requests=\(.totalRequests) successful=\(.successfulRequests) success_rate_pct=\(.successRatePct) avg_latency_ms=\(.avgLatencyMs)"' "$analytics")"
          echo "OmniRoute routing summary (session-wide): ${summary}"
          {
            echo '### OmniRoute routing summary'
            echo
            echo "Requested model: ${MODEL}"
            echo
            echo '```text'
            echo "$summary"
            jq -r '.byModel[] | "provider=\(.provider) model=\(.model) requests=\(.requests) success_rate_pct=\(.successRatePct) avg_latency_ms=\(.avgLatencyMs)"' "$analytics"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report terminal heartbeat
        if: always()
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          MINUTE: ${{ steps.lane.outputs.minute }}
          CONFIGURED: ${{ steps.lane.outputs.configured }}
          REASON: ${{ steps.executor.outputs.reason || steps.lane.outputs.reason }}
          JOB_STATUS: ${{ job.status }}
          WORKER_STATUS_FILE: ${{ runner.temp }}/factory-worker-status
          DISCOVERY_OUTCOME_FILE: ${{ runner.temp }}/factory-discovery-outcome
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          marker="<!-- factory-heartbeat:v1 worker=opencode-free-model-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$CONFIGURED" != true ]]; then outcome='unconfigured'; else outcome="$JOB_STATUS"; fi
          body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nSlot: :%02d hourly\nOutcome: %s\nConfiguration: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "$MODEL" "$SOURCE" "$MINUTE" "$outcome" "$REASON" "$now" "$GITHUB_RUN_ID")"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

          # Publish a conservative attempt result synchronously. The asynchronous
          # log classifier may later replace unknown_failure with a more specific
          # outcome, but capacity never waits on a chained workflow-run event.
          attempt_marker="<!-- factory-attempt-outcome:v1 worker=opencode-free-model-factory-${WORKER} -->"
          worker_status="$(cat "$WORKER_STATUS_FILE" 2>/dev/null || true)"
          discovery_record="$(cat "$DISCOVERY_OUTCOME_FILE" 2>/dev/null || true)"
          if [[ -n "$discovery_record" ]]; then
            IFS="$(printf '\t')" read -r attempt_outcome attempt_detail <<< "$discovery_record"
          elif [[ "$worker_status" == 2 || "$worker_status" == 3 ]]; then
            attempt_outcome='control_plane_failure'
            attempt_detail="factory controller assignment failed with exit status ${worker_status}"
          elif [[ "$CONFIGURED" == true && "$JOB_STATUS" == success ]]; then
            attempt_outcome='success'
            attempt_detail='factory job completed successfully'
          elif [[ "$CONFIGURED" != true ]]; then
            attempt_outcome='unknown_failure'
            attempt_detail="factory lane was not executable: ${REASON}"
          else
            attempt_outcome='unknown_failure'
            attempt_detail='factory job failed before a more specific log classification was available'
          fi
          attempt_body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nOutcome: %s\nAttempt outcome: %s\nDetail: %s\nUpdated: %s\nRun: %s' \
            "$attempt_marker" "$WORKER" "$MODEL" "$SOURCE" "$outcome" "$attempt_outcome" "$attempt_detail" "$now" "$GITHUB_RUN_ID")"
          attempt_comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$attempt_marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          existing_run=''
          if [[ -n "$attempt_comment_id" ]]; then
            existing_run="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${attempt_comment_id}" --jq '.body' \
              | sed -n 's/^Run: //p' | tail -1)"
          fi
          if [[ "$existing_run" =~ ^[0-9]+$ ]] && (( existing_run > GITHUB_RUN_ID )); then
            echo "Newer attempt evidence from run ${existing_run} already exists; preserving it"
          elif [[ -n "$attempt_comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${attempt_comment_id}" \
              -f body="$attempt_body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" \
              -f body="$attempt_body" >/dev/null
          fi
