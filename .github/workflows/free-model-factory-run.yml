name: Fixed free-model factory runner

on:
  workflow_call:
    inputs:
      worker:
        description: Durable factory executor slot
        required: true
        type: string
      model_exclusions:
        description: Trusted Neon model health exclusions without credentials
        required: true
        type: string
      heartbeat_comment_id:
        description: Advisory registry comment ID from trusted Neon snapshot
        required: false
        type: string
      attempt_comment_id:
        description: Advisory latest-attempt comment ID from trusted Neon snapshot
        required: false
        type: string
    secrets:
      OPENCODE_API_KEY:
        required: false
      OPENCODE_ZEN_API_KEY:
        required: false
      NVIDIA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      Z_AI_API_KEY:
        required: false
      OLLAMA_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      ORCAROUTER_API_KEY:
        required: false
      REQUESTY_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      AION_API_KEY:
        required: false
      COHERE_API_KEY:
        required: false
      TYPHOON_API_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      AI_GATEWAY_API_KEY:
        required: false
      OMNIROUTE_API_KEY:
        required: false
      OMNIROUTE_MANAGEMENT_API_KEY:
        required: false
      PR_REBASE_TOKEN:
        required: true
      # Worker 48 only. Missing secrets keep that worker on PR_REBASE_TOKEN.
      # These values do not create the GitHub App.
      FACTORY_WORKER_48_APP_ID:
        required: false
      FACTORY_WORKER_48_INSTALLATION_ID:
        required: false
      FACTORY_WORKER_48_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: fixed-model-factory-${{ inputs.worker }}
  cancel-in-progress: false

env:
  FACTORY_BUDGET_SECONDS: '6000'
  FACTORY_MODEL_EXCLUSIONS: ${{ inputs.model_exclusions }}
  FACTORY_HEARTBEAT_COMMENT_ID: ${{ inputs.heartbeat_comment_id }}
  FACTORY_ATTEMPT_COMMENT_ID: ${{ inputs.attempt_comment_id }}
  KILO_VERSION: '7.4.22'
  KILO_LINUX_X64_BASELINE_SHA256: 'bf817ad53bc95b16abe92e7a2389cc9f509c62c3510c23ecc58e151a4455cb41'

jobs:
  factory:
    runs-on: ubuntu-latest
    # Allow the agent a full budget plus setup and handoff time.
    timeout-minutes: 120
    outputs:
      worker_session_started: ${{ steps.worker_session.outputs.started }}
    env:
      # Workflow token handles GitHub API, labels, comments, and backlog-zero
      # workflow dispatch. Git fetch/push and PR creation use the dedicated
      # PAT so pull_request workflows and initial review use a trusted actor.
      GH_TOKEN: ${{ github.token }}
      PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
      # Worker 48 installation token inputs. Empty unless Josh has created the App.
      FACTORY_WORKER_48_APP_ID: ${{ secrets.FACTORY_WORKER_48_APP_ID }}
      FACTORY_WORKER_48_INSTALLATION_ID: ${{ secrets.FACTORY_WORKER_48_INSTALLATION_ID }}
      FACTORY_WORKER_48_APP_PRIVATE_KEY: ${{ secrets.FACTORY_WORKER_48_APP_PRIVATE_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AION_API_KEY: ${{ secrets.AION_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MANAGEMENT_API_KEY: ${{ secrets.OMNIROUTE_MANAGEMENT_API_KEY }}
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
      # INCIDENT 2026-09-06: OmniRoute stays off; multi-provider Entry is live.
      FACTORY_OMNIROUTE_ENABLED: ${{ vars.FACTORY_OMNIROUTE_ENABLED || 'off' }}
    steps:
      - name: Require trusted push credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PR_REBASE_TOKEN:-}" ]]; then
            echo '::error::PR_REBASE_TOKEN is required so fixed-model factory pushes trigger PR workflows without action_required.'
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PR_REBASE_TOKEN }}

      - name: Install factory syntax parsers
        uses: ./.github/actions/factory-syntax

      - name: Configure trusted git remote
        shell: bash
        run: |
          set -Eeuo pipefail
          # Shared producer for every worker. Worker 48 replaces this remote
          # in free-model-factory-worker-primitives.sh only when its
          # installation token is configured. Other workers never do.
          git remote set-url origin "https://x-access-token:${PR_REBASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Resolve executor slot policy
        id: lane
        shell: bash
        env:
          REQUESTED_WORKER: ${{ inputs.worker }}
          EXISTING_OPENCODE_KEY: ${{ (inputs.worker == '88' || inputs.worker == '90') && (secrets.OPENCODE_API_KEY || secrets.OPENCODE_ZEN_API_KEY) || '' }}
        run: |
          set -Eeuo pipefail
          row="$(awk -F '\t' -v worker="$REQUESTED_WORKER" '$1 == worker {print; exit}' .github/free-model-factories.tsv)"
          [[ -n "$row" ]] || { echo "No fixed-model lane for worker ${REQUESTED_WORKER}" >&2; exit 1; }
          IFS=$'\t' read -r worker source model minute scheduler display <<< "$row"
          [[ "$worker" == "$REQUESTED_WORKER" ]]
          # Deliberate comparison: two anonymous and two authenticated DeepSeek factories.
          # Other OpenCode free lanes continue to use dynamic catalog selection.
          case "$worker" in
            87|89) deepseek_mode=anonymous ;;
            88|90) deepseek_mode=authenticated ;;
            *) deepseek_mode=normal ;;
          esac
          if [[ "$deepseek_mode" != normal ]]; then
            [[ "$source" == opencode-free && "$model" == deepseek-v4.1-flash-free ]] || {
              echo "::error::DeepSeek experiment worker $worker must use exact OpenCode Free model"
              exit 1
            }
          fi

          configure_adapter=false
          case "$source" in
            opencode-free|openrouter-free)
              runtime_model="${source%-free}/${model}"
              branch_suffix='catalog-free'
              configured=true
              reason='catalog-backed-free-code-slot'
              ;;
            kilo-auto)
              runtime_model="kilo/${model}"
              branch_suffix='kilo-auto'
              configured=true
              reason='configured-anonymous-free'
              ;;
            omniroute-free)
              runtime_model="omniroute/${model}"
              branch_suffix='omniroute'
              if [[ "${FACTORY_OMNIROUTE_ENABLED:-off}" =~ ^(1|on|true|yes)$ ]]; then
                if [[ -n "${OMNIROUTE_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]]; then
                  configured=true
                  reason='configured-omniroute'
                else
                  configured=false
                  reason='missing-omniroute-credentials'
                fi
              else
                configured=false
                reason='omniroute-disabled-incident'
              fi
              ;;
            *)
              # Source -> provider ID, credential gate, and model selector
              # come from one typed registry, never ad hoc shell aliases.
              resolution="$(python3 .github/scripts/factory_provider_registry.py resolve --source "$source" --model "$model")"
              runtime_model="$(jq -er '.runtime_model' <<< "$resolution")"
              branch_suffix="$(jq -er '.branch_suffix' <<< "$resolution")"
              configured="$(jq -er '.configured | tostring' <<< "$resolution")"
              reason="$(jq -er '.reason' <<< "$resolution")"
              configure_adapter="$(jq -er '.configure_adapter | tostring' <<< "$resolution")"
              ;;
          esac

          if [[ "$deepseek_mode" == authenticated && -z "${EXISTING_OPENCODE_KEY:-}" ]]; then
            configured=false
            reason='missing-OpenCode-credential'
          fi

          {
            echo "deepseek_mode=$deepseek_mode"
            echo "worker=$worker"
            echo "source=$source"
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "minute=$minute"
            echo "scheduler=$scheduler"
            echo "display=$display"
            echo "branch_suffix=$branch_suffix"
            echo "configure_adapter=$configure_adapter"
            echo "configured=$configured"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          printf 'Factory %s locked: source=%s model=%s runtime=%s minute=:%02d scheduler=%s configured=%s\n' \
            "$worker" "$source" "$model" "$runtime_model" "$minute" "$scheduler" "$configured"

      - name: Configure git identity
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
        run: |
          git config user.name "opencode-free-model-factory-${WORKER}[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Ensure durable owner label
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}

        run: |
          set -Eeuo pipefail
          label="factory:${WORKER}"
          description="Factory ${WORKER}: code and review executor slot"
          if gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          fi

      - name: Stop cleanly when optional credentials are not configured
        if: steps.lane.outputs.configured != 'true'
        shell: bash
        env:
          REASON: ${{ steps.lane.outputs.reason }}
          DISPLAY: ${{ steps.lane.outputs.display }}
        run: |
          echo "${DISPLAY} lane is installed but inactive: ${REASON}"

      - name: Install current OpenCode 2
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source != 'kilo-auto'
        run: bash .github/scripts/install-opencode-v2.sh

      - name: Configure authenticated DeepSeek OpenCode credential
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.deepseek_mode == 'authenticated'
        shell: bash
        env:
          EXISTING_OPENCODE_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "${EXISTING_OPENCODE_KEY:-}" ]] || { echo "::error::Existing OpenCode API key unavailable"; exit 1; }
          echo "::add-mask::$EXISTING_OPENCODE_KEY"
          printf 'OPENCODE_API_KEY=%s\n' "$EXISTING_OPENCODE_KEY" >> "$GITHUB_ENV"
          echo 'Authenticated DeepSeek uses existing OpenCode credential and exact free model'

      - name: Install pinned Kilo CLI release
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'kilo-auto'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/kilo-linux-x64-baseline.tar.gz"
          bin_dir="$RUNNER_TEMP/kilo-bin"
          curl -fsSL \
            "https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/kilo-linux-x64-baseline.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$KILO_LINUX_X64_BASELINE_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          kilo_path="$(find "$bin_dir" -type f -name kilo -perm -111 | head -n 1)"
          [[ -n "$kilo_path" ]] || { echo 'Pinned Kilo archive did not contain an executable kilo binary' >&2; exit 1; }
          if [[ "$kilo_path" != "$bin_dir/kilo" ]]; then ln -s "$kilo_path" "$bin_dir/kilo"; fi
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/kilo" --version

      - name: Select execution candidate at dispatch time
        id: executor
        if: steps.lane.outputs.configured == 'true'
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          SOURCE: ${{ steps.lane.outputs.source }}
          LANE_MODEL: ${{ steps.lane.outputs.model }}
          LANE_RUNTIME_MODEL: ${{ steps.lane.outputs.runtime_model }}
          DEEPSEEK_MODE: ${{ steps.lane.outputs.deepseek_mode }}
          LANE_DISPLAY: ${{ steps.lane.outputs.display }}
          LANE_BRANCH_SUFFIX: ${{ steps.lane.outputs.branch_suffix }}
        run: |
          set -Eeuo pipefail
          discovery_outcome="$RUNNER_TEMP/factory-discovery-outcome"
          exclusions_file="$RUNNER_TEMP/factory-neon-model-exclusions.json"
          printf '%s\n' "$FACTORY_MODEL_EXCLUSIONS" > "$exclusions_file"
          jq -e 'type == "object" and all(.[]; type == "array")' "$exclusions_file" >/dev/null || {
            printf 'control_plane_failure\tTrusted Neon model snapshot unavailable\n' > "$discovery_outcome"
            exit 1
          }
          # Dynamic free slots rotate within a live catalog. Pinned slots must
          # honor the Neon eligibility decision before contacting a provider.
          if [[ "$SOURCE" != openrouter-free && "$SOURCE" != vercel-ai-gateway ]] &&
             [[ "$SOURCE" != opencode-free || "$DEEPSEEK_MODE" != normal ]] &&
             jq -e --arg source "$SOURCE" --arg model "$LANE_MODEL" \
               '(.[$source] // []) | index($model) != null' "$exclusions_file" >/dev/null; then
            printf 'model_unavailable\tPinned model excluded by trusted Neon health\n' > "$discovery_outcome"
            exit 1
          fi

          case "$SOURCE" in
            cloudflare-workers-ai) ;&
            gemini-free|groq-free|aion-free|cohere-eval|typhoon-free) ;&
            nvidia|kilo-auto|z-ai|ollama-cloud|mistral|orcarouter|requesty)
              # These adapters cannot enumerate reliably. Preserve the lane
              # request and let the existing real invocation/probe prove it.
              {
                echo "source=$SOURCE"
                echo "model=$LANE_MODEL"
                echo "runtime_model=$LANE_RUNTIME_MODEL"
                echo "display=$LANE_DISPLAY"
                echo "branch_suffix=$LANE_BRANCH_SUFFIX"
                echo "reason=selected-by-runtime-evidence"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            vercel-ai-gateway)
              # Published pricing is authoritative; TSV model is only a
              # legacy display hint. Do not make a chargeable inference probe.
              if ! selection="$(python3 .github/scripts/factory_published_model_catalog.py \
                  --source "$SOURCE" --worker "$WORKER" \
                  --exclusions-file "$exclusions_file")"; then
                printf 'control_plane_failure\tVercel zero-price catalog unavailable or has no eligible models\n' > "$discovery_outcome"
                exit 1
              fi
              model="$(jq -er '.model' <<< "$selection")"
              {
                echo "source=$SOURCE"
                echo "model=$model"
                echo "runtime_model=vercel/$model"
                echo "display=Vercel Free · $model"
                echo "branch_suffix=$LANE_BRANCH_SUFFIX"
                echo "reason=selected-from-published-zero-price-catalog"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            opencode-free)
              if [[ "$DEEPSEEK_MODE" != normal ]]; then
                catalog="$RUNNER_TEMP/deepseek-pinned-models.txt"
                bash scripts/opencode-model-catalog.sh opencode plain refresh > "$catalog"
                grep -Fx "$LANE_RUNTIME_MODEL" "$catalog" >/dev/null || {
                  printf 'model_unavailable\tPinned free DeepSeek absent from OpenCode catalog\n' > "$discovery_outcome"
                  echo "::error::Pinned free DeepSeek absent from OpenCode catalog"
                  exit 1
                }
                {
                  echo "source=opencode-free"
                  echo "model=$LANE_MODEL"
                  echo "runtime_model=$LANE_RUNTIME_MODEL"
                  echo "display=DeepSeek V4.1 Flash Free ($DEEPSEEK_MODE)"
                  echo "branch_suffix=opencode-free"
                  echo "reason=deepseek-pinned-$DEEPSEEK_MODE"
                } >> "$GITHUB_OUTPUT"
                echo "Factory $WORKER pinned to $LANE_RUNTIME_MODEL ($DEEPSEEK_MODE); rotation disabled"
                exit 0
              fi
              # Models are selected at execution, after OpenCode 2 installation.
              catalog="$RUNNER_TEMP/factory-opencode-free-catalog"
              bash scripts/opencode-model-catalog.sh opencode verbose refresh > "$catalog"
              comments_file="$RUNNER_TEMP/factory-opencode-attempt-comments.json"
              # Decision comes from trusted Entry/Neon, not a registry scan.
              printf '[]\n' > "$comments_file"
              result="$(python3 .github/scripts/factory_live_opencode.py \
                --catalog "$catalog" --worker "$WORKER" --comments "$comments_file" \
                --exclusions-file "$exclusions_file" \
                --rotation "${GITHUB_RUN_NUMBER:-0}")"
              model="$(jq -er '.model' <<< "$result")"
              runtime_model="$(jq -er '.runtime_model' <<< "$result")"
              {
                echo "source=opencode-free"
                echo "model=$model"
                echo "runtime_model=$runtime_model"
                echo "display=OpenCode Free · $model"
                echo "branch_suffix=opencode-free"
                echo "reason=selected-from-live-free-catalog"
              } >> "$GITHUB_OUTPUT"
              echo "Factory $WORKER selected $runtime_model from $(jq -r '.candidate_count' <<< "$result") free OpenCode models"
              exit 0
              ;;
            openrouter-free)
              # Resolve from OpenRouter's current :free catalog and verified
              # zero prompt/completion pricing, never a magic TSV model ID.
              # The same policy holds regardless of OmniRoute's state.
              if ! selection="$(python3 .github/scripts/factory_published_model_catalog.py \
                  --source "$SOURCE" --worker "$WORKER" \
                  --exclusions-file "$exclusions_file")"; then
                printf 'control_plane_failure\tOpenRouter published free catalog unavailable or empty\n' > "$discovery_outcome"
                exit 1
              fi
              model="$(jq -er '.model' <<< "$selection")"
              {
                echo "source=$SOURCE"
                echo "model=$model"
                echo "runtime_model=openrouter/$model"
                echo "display=OpenRouter Free · $model"
                echo "branch_suffix=$LANE_BRANCH_SUFFIX"
                echo "reason=selected-from-published-zero-price-catalog"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              printf 'control_plane_failure\tUnsupported provider adapter: %s\n' "$SOURCE" > "$discovery_outcome"
              exit 1
              ;;
          esac

          discover_provider() {
            local provider="$1"
            local catalog="$2"
            python3 .github/scripts/factory_provider_candidates.py \
              --provider "$provider" --catalog "$catalog"
          }

          catalog_candidates='[]'
          catalog_successes=0
          catalog_failures=()

          opencode_catalog="$RUNNER_TEMP/factory-opencode-catalog"
          if bash scripts/opencode-model-catalog.sh opencode plain refresh > "$opencode_catalog"; then
            if opencode_discovery="$(discover_provider opencode-free "$opencode_catalog")" \
              && jq -e '.status and (.candidates | type == "array")' >/dev/null <<< "$opencode_discovery"; then
              if [[ "$(jq -r '.status' <<< "$opencode_discovery")" != invalid ]]; then
                catalog_successes=$((catalog_successes + 1))
                candidates="$(jq -c '.candidates // []' <<< "$opencode_discovery")"
                catalog_candidates="$(jq -cn \
                  --argjson left "$catalog_candidates" --argjson right "$candidates" \
                  '$left + $right | unique_by([.provider, .model])')"
              else
                catalog_failures+=('OpenCode returned an invalid model catalog')
              fi
            else
              catalog_failures+=('OpenCode candidate adapter failed')
            fi
          else
            catalog_failures+=('OpenCode model discovery command failed')
          fi

          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            openrouter_catalog="$RUNNER_TEMP/factory-openrouter-catalog"
            if curl --silent --show-error --fail-with-body \
              --connect-timeout 5 --max-time 30 \
              --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              https://openrouter.ai/api/v1/models > "$openrouter_catalog"; then
              if openrouter_discovery="$(discover_provider openrouter-free "$openrouter_catalog")" \
                && jq -e '.status and (.candidates | type == "array")' >/dev/null <<< "$openrouter_discovery"; then
                if [[ "$(jq -r '.status' <<< "$openrouter_discovery")" != invalid ]]; then
                  catalog_successes=$((catalog_successes + 1))
                  candidates="$(jq -c '.candidates // []' <<< "$openrouter_discovery")"
                  catalog_candidates="$(jq -cn \
                    --argjson left "$catalog_candidates" --argjson right "$candidates" \
                    '$left + $right | unique_by([.provider, .model])')"
                else
                  catalog_failures+=('OpenRouter returned an invalid model catalog')
                fi
              else
                catalog_failures+=('OpenRouter candidate adapter failed')
              fi
            else
              catalog_failures+=('OpenRouter model catalog request failed')
            fi
          fi

          if [[ "${FACTORY_OMNIROUTE_ENABLED:-off}" =~ ^(1|on|true|yes)$ ]] && [[ -n "${OMNIROUTE_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]]; then
            omniroute_catalog="$RUNNER_TEMP/factory-omniroute-catalog"
            if curl --silent --show-error --fail-with-body \
              --connect-timeout 5 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 \
              --header "Authorization: Bearer ${OMNIROUTE_API_KEY}" \
              "${OMNIROUTE_BASE_URL%/}/models" > "$omniroute_catalog"; then
              if omniroute_discovery="$(discover_provider omniroute-free "$omniroute_catalog")" \
                && jq -e '.status and (.candidates | type == "array")' >/dev/null <<< "$omniroute_discovery"; then
                if [[ "$(jq -r '.status' <<< "$omniroute_discovery")" != invalid ]]; then
                  catalog_successes=$((catalog_successes + 1))
                  candidates="$(jq -c '.candidates // []' <<< "$omniroute_discovery")"
                  catalog_candidates="$(jq -cn \
                    --argjson left "$catalog_candidates" --argjson right "$candidates" \
                    '$left + $right | unique_by([.provider, .model])')"
                else
                  catalog_failures+=('OmniRoute returned an invalid model catalog')
                fi
              else
                catalog_failures+=('OmniRoute candidate adapter failed')
              fi
            else
              catalog_failures+=('OmniRoute model catalog request failed')
            fi
          fi

          candidate_count="$(jq 'length' <<< "$catalog_candidates")"
          if (( candidate_count == 0 )); then
            if (( catalog_successes == 0 )); then
              IFS=';' failure_detail="${catalog_failures[*]}"
              printf 'provider_unavailable\t%s\n' \
                "${failure_detail:-No catalog provider was executable}" > "$discovery_outcome"
            else
              printf 'model_unavailable\tLive catalogs exposed no policy-eligible candidate\n' \
                > "$discovery_outcome"
            fi
            exit 1
          fi

          discovery_file="$RUNNER_TEMP/factory-provider-discovery.json"
          comments_file="$RUNNER_TEMP/factory-attempt-comments.json"
          jq -cn --argjson candidates "$catalog_candidates" \
            '{candidates: $candidates}' > "$discovery_file"
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            > "$comments_file"; then
            printf 'control_plane_failure\tFactory health evidence could not be read\n' > "$discovery_outcome"
            exit 1
          fi

          selection="$(python3 .github/scripts/factory_candidate_health.py \
            --discovery "$discovery_file" --comments "$comments_file" \
            --worker "$WORKER")"
          source="$(jq -r '.selected.provider // empty' <<< "$selection")"
          model="$(jq -r '.selected.model // empty' <<< "$selection")"
          runtime_model="$(jq -r '.selected.runtime_model // empty' <<< "$selection")"
          health_state="$(jq -r '.selected.health_state // empty' <<< "$selection")"
          if [[ -z "$source" || -z "$model" || -z "$runtime_model" ]]; then
            failure_outcome="$(jq -r '.failure_outcome // "unknown_failure"' <<< "$selection")"
            failure_detail="$(jq -r '.detail // "candidate health selection failed"' <<< "$selection")"
            printf '%s\t%s\n' "$failure_outcome" "$failure_detail" > "$discovery_outcome"
            exit 1
          fi

          case "$source" in
            opencode-free) branch_suffix='opencode-free' ;;
            openrouter-free) branch_suffix='openrouter' ;;
            omniroute-free) branch_suffix='omniroute' ;;
            *)
              printf 'control_plane_failure\tSelected unsupported catalog provider: %s\n' \
                "$source" > "$discovery_outcome"
              exit 1
              ;;
          esac
          {
            echo "source=$source"
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "display=${source} · ${model}"
            echo "branch_suffix=$branch_suffix"
            echo "reason=selected-${health_state}-from-live-provider-catalog"
          } >> "$GITHUB_OUTPUT"
          printf 'Factory %s selected executor: provider=%s model=%s runtime=%s health=%s\n' \
            "$WORKER" "$source" "$model" "$runtime_model" "$health_state"

      - name: Report selected executor heartbeat
        if: always()
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          MINUTE: ${{ steps.lane.outputs.minute }}
          CONFIGURED: ${{ steps.lane.outputs.configured }}
          REASON: ${{ steps.executor.outputs.reason || steps.lane.outputs.reason }}
          EXECUTOR_OUTCOME: ${{ steps.executor.outcome }}
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          marker="<!-- factory-heartbeat:v1 worker=opencode-free-model-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$CONFIGURED" != true ]]; then
            outcome='unconfigured'
          elif [[ "$EXECUTOR_OUTCOME" != success ]]; then
            outcome='selection-failed'
          else
            outcome='running'
          fi
          body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nSlot: :%02d hourly\nOutcome: %s\nConfiguration: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "$MODEL" "$SOURCE" "$MINUTE" "$outcome" "$REASON" "$now" "$GITHUB_RUN_ID")"
          # Neon provides a candidate ID. Verify the marker live before PATCH;
          # consult the full GitHub registry only when the shared snapshot misses.
          comment_id="${FACTORY_HEARTBEAT_COMMENT_ID:-}"
          if [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
            current="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --jq '.body' 2>/dev/null || true)"
            [[ "$current" == *"$marker"* ]] || comment_id=""
          else
            comment_id=""
          fi
          if [[ -z "$comment_id" ]]; then
            comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          fi
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            created="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body")"
            comment_id="$(jq -er '.id' <<< "$created")"
          fi
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]] && echo "FACTORY_HEARTBEAT_COMMENT_ID=$comment_id" >> "$GITHUB_ENV"

      # Crouton's OpenCode Zen free route can reject anonymous runner requests.
      # Do not change the anonymous DeepSeek comparison or other model lanes.
      - name: Configure existing Zen credential for Crouton Alpha
        if: steps.lane.outputs.configured == 'true' && steps.executor.outputs.source == 'opencode-free' && steps.executor.outputs.model == 'crouton-alpha-free'
        shell: bash
        env:
          EXISTING_OPENCODE_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${EXISTING_OPENCODE_KEY:-}" ]]; then
            echo "::add-mask::$EXISTING_OPENCODE_KEY"
            printf 'OPENCODE_API_KEY=%s\n' "$EXISTING_OPENCODE_KEY" >> "$GITHUB_ENV"
            echo 'Using existing OpenCode Zen credential for zero-cost Crouton Alpha'
          else
            echo 'No existing Zen credential; Crouton will use anonymous free quota'
          fi

      - name: Configure selected OmniRoute capacity
        if: vars.FACTORY_OMNIROUTE_ENABLED == 'on' && steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'omniroute-free'
        shell: bash
        env:
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${OMNIROUTE_API_KEY:-}" ]] || { echo 'OMNIROUTE_API_KEY missing for selected OmniRoute capacity' >&2; exit 1; }
          [[ -n "${OMNIROUTE_BASE_URL:-}" ]] || { echo 'OMNIROUTE_BASE_URL missing for selected OmniRoute capacity' >&2; exit 1; }

          mkdir -p "$HOME/.config/opencode"
          temp_config="$(mktemp)"
          jq -n \
            --arg model "$MODEL" \
            --arg key "$OMNIROUTE_API_KEY" \
            --arg base_url "${OMNIROUTE_BASE_URL%/}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job "$GITHUB_JOB" \
            --arg workflow "$GITHUB_WORKFLOW" \
            '{
              providers: {
                omniroute: {
                  name: "OmniRoute free capacity",
                  package: "@opencode/ai/providers/openai-compatible",
                  env: ["OMNIROUTE_API_KEY"],
                  settings: {baseURL: $base_url},
                  headers: {
                    "X-GitHub-Run-ID": $run_id,
                    "X-GitHub-Job": $job,
                    "X-GitHub-Workflow": $workflow
                  },
                  models: {($model): {name: $model}}
                }
              }
            }' > "$temp_config"
          # Retain the installer's noninteractive permission and safety policy.
          jq -s '.[0] * .[1]' "$HOME/.config/opencode/opencode.json" "$temp_config" > "$temp_config.merged"
          mv "$temp_config.merged" "$HOME/.config/opencode/opencode.json"
          rm -f "$temp_config"
          chmod 600 "$HOME/.config/opencode/opencode.json"

      - name: Configure OpenAI-compatible factory provider
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.configure_adapter == 'true'
        shell: bash
        env:
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.config/opencode"
          temp_config="$(mktemp)"
          trap 'rm -f "$temp_config" "$temp_config.merged"' EXIT
          # The registry owns the OpenCode ID, endpoint, key name, and exact
          # upstream modelID. The output contains no secret values.
          python3 .github/scripts/factory_provider_registry.py config \
            --source "$SOURCE" --model "$MODEL" > "$temp_config"
          jq -s '.[0] * .[1]' "$HOME/.config/opencode/opencode.json" "$temp_config" > "$temp_config.merged"
          mv "$temp_config.merged" "$HOME/.config/opencode/opencode.json"
          chmod 600 "$HOME/.config/opencode/opencode.json"

      - name: Require Vercel model to remain zero-price
        if: steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'vercel-ai-gateway'
        shell: bash
        env:
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          catalog="$RUNNER_TEMP/vercel-ai-gateway-models.json"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            https://ai-gateway.vercel.sh/v1/models > "$catalog"
          if ! jq -e --arg model "$MODEL" '
            [.data[] | select(
              .id == $model and
              ((.pricing.input // "1") | tonumber) == 0 and
              ((.pricing.output // "1") | tonumber) == 0
            )] | length == 1
          ' "$catalog" >/dev/null; then
            echo "Vercel model is missing or no longer zero-price; refusing free-fleet execution: ${MODEL}" >&2
            printf 'model_unavailable\tVercel AI Gateway model is missing or no longer zero-price: %s\n' "$MODEL" > "$RUNNER_TEMP/factory-discovery-outcome"
            exit 1
          fi
          echo "Verified zero-price Vercel AI Gateway model: ${MODEL}"

      - name: Wait for exact model in OpenCode catalog
        id: model_preflight
        if: steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) != 'kilo-auto'
        shell: bash
        env:
          RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          WORKER: ${{ steps.lane.outputs.worker }}
          DEEPSEEK_MODE: ${{ steps.lane.outputs.deepseek_mode }}
        run: |
          set -Eeuo pipefail
          # Dynamic free-model lanes try each model at most once, within their
          # own provider. Pinned experiments and other sources never fall back.
          if [[ "$DEEPSEEK_MODE" == normal ]] && \
            [[ "$SOURCE" == opencode-free || "$SOURCE" == openrouter-free ]]; then
            catalog="$RUNNER_TEMP/factory-${SOURCE}-catalog"
            if [[ "$SOURCE" == opencode-free ]]; then
              catalog="$RUNNER_TEMP/factory-opencode-free-catalog"
            else
              bash scripts/opencode-model-catalog.sh openrouter verbose refresh > "$catalog" || {
                printf 'control_plane_failure\tOpenRouter executable catalog read failed\n' > "$RUNNER_TEMP/factory-discovery-outcome"
                exit 1
              }
            fi
            [[ -s "$catalog" ]] || {
              printf 'control_plane_failure\tProvider model catalog empty\n' > "$RUNNER_TEMP/factory-discovery-outcome"
              exit 1
            }
            comments="$RUNNER_TEMP/factory-model-preflight-comments.json"
            printf '[]\n' > "$comments"
            attempted=()
            max_candidates=5
            for (( attempt=1; attempt<=max_candidates; attempt++ )); do
              wait_status=0
              bash .github/scripts/wait-opencode-model.sh "$RUNTIME_MODEL" || wait_status=$?
              if (( wait_status == 0 )); then
                echo "model=${RUNTIME_MODEL#*/}" >> "$GITHUB_OUTPUT"
                echo "runtime_model=$RUNTIME_MODEL" >> "$GITHUB_OUTPUT"
                echo "Executable free-model preflight passed: $RUNTIME_MODEL (attempt $attempt)"
                exit 0
              fi
              if (( wait_status != 3 )); then
                printf 'control_plane_failure\tOpenCode catalog unreadable for %s\n' "$RUNTIME_MODEL" > "$RUNNER_TEMP/factory-discovery-outcome"
                exit 1
              fi
              model="${RUNTIME_MODEL#*/}"
              echo "Missing model $RUNTIME_MODEL ($attempt/$max_candidates); trying another vetted free model" >&2
              now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" \
                -f body="<!-- factory-model-unavailable:v1 run=${GITHUB_RUN_ID} -->
          Worker: opencode-free-model-factory-${WORKER}
          Model: ${model}
          Source: ${SOURCE}
          Attempt outcome: model_unavailable
          Detail: Exact selected model absent from successfully read runtime catalog
          Updated: ${now}
          Run: ${GITHUB_RUN_ID}" >/dev/null || {
                printf 'control_plane_failure\tCannot persist trusted model-health evidence\n' > "$RUNNER_TEMP/factory-discovery-outcome"
                exit 1
              }
              attempted+=("$model")
              printf '%s\n' "$model" >> "$RUNNER_TEMP/factory-model-preflight-attempted"
              exclusions=()
              for prior in "${attempted[@]}"; do exclusions+=(--attempted "$prior"); done
              if ! selected="$(python3 .github/scripts/factory_live_opencode.py \
                --provider "$SOURCE" --catalog "$catalog" --comments "$comments" \
                --worker "$WORKER" --exclusions-file "$RUNNER_TEMP/factory-neon-model-exclusions.json" --rotation "${GITHUB_RUN_NUMBER:-0}" \
                "${exclusions[@]}" 2>&1)"; then
                printf 'model_unavailable\tNo alternative zero-cost %s candidate after %s attempts\n' "$SOURCE" "${#attempted[@]}" > "$RUNNER_TEMP/factory-discovery-outcome"
                echo "No additional vetted model: $selected" >&2
                exit 1
              fi
              RUNTIME_MODEL="$(jq -er '.runtime_model' <<< "$selected")"
            done
            printf 'model_unavailable\tAll %s bounded candidate attempts failed\n' "$max_candidates" > "$RUNNER_TEMP/factory-discovery-outcome"
            exit 1
          fi
          model_wait_status=0
          bash .github/scripts/wait-opencode-model.sh "$RUNTIME_MODEL" || model_wait_status=$?
          if (( model_wait_status == 3 )); then
            printf 'model_unavailable\tOpenCode catalog did not expose exact model: %s\n' "$RUNTIME_MODEL" > "$RUNNER_TEMP/factory-discovery-outcome"
            exit 1
          elif (( model_wait_status != 0 )); then
            printf 'control_plane_failure\tOpenCode catalog unreadable for %s\n' "$RUNTIME_MODEL" > "$RUNNER_TEMP/factory-discovery-outcome"
            exit 1
          fi

      # The first model invocation is the real leased coding/review mission.
      # Catalog and free-price checks do not spend inference tokens.
      # No extra smoke, chat-completion probe, or tool-canary prompt.

      - name: Run continuous fixed-model factory session
        id: worker_session
        if: steps.lane.outputs.configured == 'true'
        env:
          FACTORY_OMNIROUTE_ENABLED: ${{ vars.FACTORY_OMNIROUTE_ENABLED || 'off' }}
          FACTORY_WORKER: ${{ steps.lane.outputs.worker }}
          FACTORY_SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          FACTORY_MODEL: ${{ steps.model_preflight.outputs.model || steps.executor.outputs.model || steps.lane.outputs.model }}
          FACTORY_RUNTIME_MODEL: ${{ steps.model_preflight.outputs.runtime_model || steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
          FACTORY_DISPLAY: ${{ steps.executor.outputs.display || steps.lane.outputs.display }}
          FACTORY_BRANCH_SUFFIX: ${{ steps.executor.outputs.branch_suffix || steps.lane.outputs.branch_suffix }}
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          set +e
          bash .github/scripts/free-model-factory-worker.sh
          worker_status=$?
          set -e
          # Write after the worker (and model) exits, so attempt code cannot
          # forge the trusted wrapper's source classification.
          printf '%s\n' "$worker_status" > "$RUNNER_TEMP/factory-worker-status"
          exit "$worker_status"

      - name: Report OmniRoute routing summary
        if: always() && vars.FACTORY_OMNIROUTE_ENABLED == 'on' && steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'omniroute-free'
        shell: bash
        env:
          MODEL: ${{ steps.model_preflight.outputs.model || steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${OMNIROUTE_MANAGEMENT_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]] || {
            echo 'OmniRoute routing summary unavailable: gateway credentials missing' >&2
            exit 0
          }
          gateway_base_url="${OMNIROUTE_BASE_URL%/}"
          case "$gateway_base_url" in
            */v1) gateway_base_url="${gateway_base_url%/v1}" ;;
          esac
          analytics="$RUNNER_TEMP/omniroute-analytics.json"
          code="$(curl --silent --show-error --output "$analytics" --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 30 \
            --header "Authorization: Bearer ${OMNIROUTE_MANAGEMENT_API_KEY}" \
            "${gateway_base_url}/api/usage/analytics?period=session" || true)"
          if [[ "$code" != 200 ]]; then
            message="OmniRoute routing summary unavailable (HTTP ${code})"
            echo "::warning::$message"
            echo "$message" >&2
            {
              echo '### OmniRoute routing summary'
              echo
              echo "> ⚠️ ${message}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary="$(jq -r '.summary | "requests=\(.totalRequests) successful=\(.successfulRequests) success_rate_pct=\(.successRatePct) avg_latency_ms=\(.avgLatencyMs)"' "$analytics")"
          echo "OmniRoute routing summary (session-wide): ${summary}"
          {
            echo '### OmniRoute routing summary'
            echo
            echo "Requested model: ${MODEL}"
            echo
            echo '```text'
            echo "$summary"
            jq -r '.byModel[] | "provider=\(.provider) model=\(.model) requests=\(.requests) success_rate_pct=\(.successRatePct) avg_latency_ms=\(.avgLatencyMs)"' "$analytics"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report terminal heartbeat
        if: always()
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.model_preflight.outputs.model || steps.executor.outputs.model || steps.lane.outputs.model }}
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          MINUTE: ${{ steps.lane.outputs.minute }}
          CONFIGURED: ${{ steps.lane.outputs.configured }}
          REASON: ${{ steps.executor.outputs.reason || steps.lane.outputs.reason }}
          JOB_STATUS: ${{ job.status }}
          WORKER_STATUS_FILE: ${{ runner.temp }}/factory-worker-status
          DISCOVERY_OUTCOME_FILE: ${{ runner.temp }}/factory-discovery-outcome
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          marker="<!-- factory-heartbeat:v1 worker=opencode-free-model-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A green wrapper exit is NOT evidence of useful coding. The trusted
          # post-run classifier will publish the final delivery verdict.
          if [[ "$CONFIGURED" != true ]]; then
            outcome='unconfigured'
          elif [[ "$JOB_STATUS" == success ]]; then
            outcome='finished'
          else
            outcome='failure'
          fi
          body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nSlot: :%02d hourly\nOutcome: %s\nConfiguration: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "$MODEL" "$SOURCE" "$MINUTE" "$outcome" "$REASON" "$now" "$GITHUB_RUN_ID")"
          # Neon provides a candidate ID. Verify the marker live before PATCH;
          # consult the full GitHub registry only when the shared snapshot misses.
          comment_id="${FACTORY_HEARTBEAT_COMMENT_ID:-}"
          if [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
            current="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --jq '.body' 2>/dev/null || true)"
            [[ "$current" == *"$marker"* ]] || comment_id=""
          else
            comment_id=""
          fi
          if [[ -z "$comment_id" ]]; then
            comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          fi
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

          # Publish a conservative attempt result synchronously. The asynchronous
          # log classifier may later replace unknown_failure with a more specific
          # outcome, but capacity never waits on a chained workflow-run event.
          attempt_marker="<!-- factory-attempt-outcome:v1 worker=opencode-free-model-factory-${WORKER} -->"
          worker_status="$(cat "$WORKER_STATUS_FILE" 2>/dev/null || true)"
          discovery_record="$(cat "$DISCOVERY_OUTCOME_FILE" 2>/dev/null || true)"
          if [[ -n "$discovery_record" ]]; then
            IFS="$(printf '\t')" read -r attempt_outcome attempt_detail <<< "$discovery_record"
          elif [[ "$worker_status" == 2 || "$worker_status" == 3 ]]; then
            attempt_outcome='control_plane_failure'
            attempt_detail="factory controller assignment failed with exit status ${worker_status}"
          elif [[ "$CONFIGURED" == true && "$JOB_STATUS" == success ]]; then
            attempt_outcome='classification_pending'
            attempt_detail='wrapper exited; awaiting trusted work/delivery classification'
          elif [[ "$CONFIGURED" != true ]]; then
            attempt_outcome='unknown_failure'
            attempt_detail="factory lane was not executable: ${REASON}"
          else
            attempt_outcome='unknown_failure'
            attempt_detail='factory job failed before a more specific log classification was available'
          fi
          attempt_body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nOutcome: %s\nAttempt outcome: %s\nDetail: %s\nUpdated: %s\nRun: %s' \
            "$attempt_marker" "$WORKER" "$MODEL" "$SOURCE" "$outcome" "$attempt_outcome" "$attempt_detail" "$now" "$GITHUB_RUN_ID")"
          # Sticky NVIDIA 410 retirement is reported from the real work attempt.
          # Never send a separate inference request just to test the model.
          if [[ "$SOURCE" == nvidia && "$attempt_outcome" == model_retired_410 ]]; then
            retirement_marker='<!-- factory-model-retired-410:v1 -->'
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" \
              -f body="${retirement_marker}
          Worker: opencode-free-model-factory-${WORKER}
          Model: ${MODEL}
          Source: nvidia
          Attempt outcome: model_retired_410
          Detail: Confirmed HTTP 410 during actual assigned work
          Updated: ${now}
          Run: ${GITHUB_RUN_ID}" >/dev/null
          fi
          # Keep a run-specific failure snapshot: later successes overwrite the worker record.
          if [[ "$SOURCE" == opencode-free && ( "$attempt_outcome" == model_unavailable || "$attempt_outcome" == provider_quota ) ]]; then
            # Retain a run-specific record even after the worker selects another model.
            marker_type='factory-model-unavailable'
            if [[ "$attempt_outcome" == provider_quota ]]; then marker_type='factory-provider-quota'; fi
            unavailable_marker="<!-- ${marker_type}:v1 run=${GITHUB_RUN_ID} -->"
            snapshot_body="$(printf '%s\n' "$attempt_body" | tail -n +2)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" \
              -f body="${unavailable_marker}
          ${snapshot_body}" >/dev/null
          fi
          attempt_comment_id="${FACTORY_ATTEMPT_COMMENT_ID:-}"
          if [[ ! "$attempt_comment_id" =~ ^[1-9][0-9]*$ ]]; then
            attempt_comment_id=""
          fi
          if [[ -z "$attempt_comment_id" ]]; then
            attempt_comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
              | jq -r --arg marker "$attempt_marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          fi
          existing_run=""
          if [[ -n "$attempt_comment_id" ]]; then
            existing_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${attempt_comment_id}" --jq '.body' 2>/dev/null || true)"
            if [[ "$existing_body" == *"$attempt_marker"* ]]; then
              existing_run="$(sed -n 's/^Run: //p' <<< "$existing_body" | tail -1)"
            else
              attempt_comment_id=""
            fi
          fi
          if [[ "$existing_run" =~ ^[0-9]+$ ]] && (( existing_run > GITHUB_RUN_ID )); then
            echo "Newer attempt evidence from run ${existing_run} already exists; preserving it"
          elif [[ -n "$attempt_comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${attempt_comment_id}" \
              -f body="$attempt_body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" \
              -f body="$attempt_body" >/dev/null
          fi

  release_pre_session_lease:
    needs: factory
    if: ${{ always() && needs.factory.outputs.worker_session_started != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # A failed smoke may have modified its checkout. Recover from a fresh
      # trusted main on a separate runner, inside the same per-worker lock.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/factory-syntax
      # Only this trusted, separate cleanup job receives the Neon DSN.
      # The model-running factory job above must never see it.
      - name: Configure restricted Neon factory lease release
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
      - name: Release lease after pre-session abort
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          [[ "$FACTORY_WORKER" =~ ^[1-9][0-9]{0,2}$ ]] || {
            echo 'Invalid worker ID; refusing lease recovery' >&2
            exit 1
          }
          # Never clear GitHub ownership without the transactional Neon ledger.
          [[ -s "${FACTORY_STATE_DSN_FILE:-}" ]] || {
            echo 'Neon factory lease connection missing; refusing split release' >&2
            exit 1
          }
          python3 .github/scripts/factory-work-controller.py release \
            --worker "$FACTORY_WORKER" --reason "pre-session-abort-run-${GITHUB_RUN_ID}"

  release_post_session_lease:
    needs: factory
    # Keep the worker lock until both execution and trusted release complete.
    if: ${{ always() && needs.factory.outputs.worker_session_started == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Separate trusted runner; never use the model's checkout or credentials.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/factory-syntax
      - name: Configure restricted Neon post-session lease release
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
      - name: Release worker lease after session exits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          [[ "$FACTORY_WORKER" =~ ^[1-9][0-9]{0,2}$ ]] || {
            echo 'Invalid worker ID; refusing lease recovery' >&2
            exit 1
          }
          [[ -s "${FACTORY_STATE_DSN_FILE:-}" ]] || {
            echo 'Neon factory lease connection missing; refusing split release' >&2
            exit 1
          }
          python3 .github/scripts/factory-work-controller.py release \
            --worker "$FACTORY_WORKER" --reason "post-session-exit-run-${GITHUB_RUN_ID}"

