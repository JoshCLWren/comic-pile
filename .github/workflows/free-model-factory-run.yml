name: Fixed free-model factory runner

on:
  workflow_call:
    inputs:
      worker:
        description: Durable fixed-model factory number
        required: true
        type: string
    secrets:
      NVIDIA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      PR_REBASE_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: fixed-model-factory-${{ inputs.worker }}
  cancel-in-progress: false

env:
  FACTORY_BUDGET_SECONDS: '1200'
  OPENCODE_VERSION: '1.18.18'
  OPENCODE_LINUX_X64_SHA256: '0cddc222418b8553669905a8980c0cda7088f00da24d83d6ac76b01c9fdb2aaf'
  KILO_VERSION: '7.4.22'
  KILO_LINUX_X64_BASELINE_SHA256: 'bf817ad53bc95b16abe92e7a2389cc9f509c62c3510c23ecc58e151a4455cb41'
  OMNIROUTE_IMAGE: 'diegosouzapw/omniroute:3.8.49@sha256:92c768c56e2de32c51a0621ef182835018b00b288c9bb235c5c5e4514658c1a1'

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Workflow token handles GitHub API, labels, comments, and backlog-zero
      # workflow dispatch. A dedicated PAT is used only for git fetch/push so
      # pull_request workflows are attributed to a trusted actor.
      GH_TOKEN: ${{ github.token }}
      PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Require trusted push credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PR_REBASE_TOKEN:-}" ]]; then
            echo '::error::PR_REBASE_TOKEN is required so fixed-model factory pushes trigger PR workflows without action_required.'
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PR_REBASE_TOKEN }}

      - name: Configure trusted git remote
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote set-url origin "https://x-access-token:${PR_REBASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Resolve fixed lane
        id: lane
        shell: bash
        env:
          REQUESTED_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          row="$(awk -F '\t' -v worker="$REQUESTED_WORKER" '$1 == worker {print; exit}' .github/free-model-factories.tsv)"
          [[ -n "$row" ]] || { echo "No fixed-model lane for worker ${REQUESTED_WORKER}" >&2; exit 1; }
          IFS=$'\t' read -r worker source model minute scheduler display <<< "$row"
          [[ "$worker" == "$REQUESTED_WORKER" ]]

          case "$source" in
            nvidia)
              runtime_model="nvidia/${model}"
              branch_suffix='nvidia'
              if [[ -n "${NVIDIA_API_KEY:-}" ]]; then configured=true; reason='configured'; else configured=false; reason='missing-NVIDIA_API_KEY'; fi
              ;;
            omniroute-opencode)
              runtime_model="omniroute/${model}"
              branch_suffix='omni'
              configured=true
              reason='configured'
              ;;
            opencode-free)
              runtime_model="opencode/${model}"
              branch_suffix='opencode-free'
              configured=true
              reason='configured-keyless'
              ;;
            openrouter-free)
              runtime_model="openrouter/${model}"
              branch_suffix='openrouter'
              if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then configured=true; reason='configured'; else configured=false; reason='missing-OPENROUTER_API_KEY'; fi
              ;;
            kilo-auto)
              runtime_model="kilo/${model}"
              branch_suffix='kilo-auto'
              configured=true
              reason='configured-anonymous-free'
              ;;
            *)
              echo "Unsupported factory source: ${source}" >&2
              exit 1
              ;;
          esac

          {
            echo "worker=$worker"
            echo "source=$source"
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "minute=$minute"
            echo "scheduler=$scheduler"
            echo "display=$display"
            echo "branch_suffix=$branch_suffix"
            echo "configured=$configured"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          printf 'Factory %s locked: source=%s model=%s runtime=%s minute=:%02d scheduler=%s configured=%s\n' \
            "$worker" "$source" "$model" "$runtime_model" "$minute" "$scheduler" "$configured"

      - name: Configure git identity
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
        run: |
          git config user.name "opencode-free-model-factory-${WORKER}[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Ensure durable owner label
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          DISPLAY: ${{ steps.lane.outputs.display }}
          SOURCE: ${{ steps.lane.outputs.source }}
        run: |
          set -Eeuo pipefail
          label="factory:${WORKER}"
          description="Fixed-model Factory ${WORKER}: ${DISPLAY} via ${SOURCE}"
          if gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          fi

      - name: Stop cleanly when optional credentials are not configured
        if: steps.lane.outputs.configured != 'true'
        shell: bash
        env:
          REASON: ${{ steps.lane.outputs.reason }}
          DISPLAY: ${{ steps.lane.outputs.display }}
        run: |
          echo "${DISPLAY} lane is installed but inactive: ${REASON}"

      - name: Install pinned OpenCode release
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source != 'kilo-auto'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          bin_dir="$RUNNER_TEMP/opencode-bin"
          curl -fsSL \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$OPENCODE_LINUX_X64_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          test -x "$bin_dir/opencode"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/opencode" --version

      - name: Install pinned Kilo CLI release
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'kilo-auto'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/kilo-linux-x64-baseline.tar.gz"
          bin_dir="$RUNNER_TEMP/kilo-bin"
          curl -fsSL \
            "https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/kilo-linux-x64-baseline.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$KILO_LINUX_X64_BASELINE_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          kilo_path="$(find "$bin_dir" -type f -name kilo -perm -111 | head -n 1)"
          [[ -n "$kilo_path" ]] || { echo 'Pinned Kilo archive did not contain an executable kilo binary' >&2; exit 1; }
          if [[ "$kilo_path" != "$bin_dir/kilo" ]]; then ln -s "$kilo_path" "$bin_dir/kilo"; fi
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/kilo" --version

      - name: Select execution candidate at dispatch time
        id: executor
        if: steps.lane.outputs.configured == 'true'
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          SOURCE: ${{ steps.lane.outputs.source }}
          LANE_MODEL: ${{ steps.lane.outputs.model }}
          LANE_RUNTIME_MODEL: ${{ steps.lane.outputs.runtime_model }}
          LANE_DISPLAY: ${{ steps.lane.outputs.display }}
        run: |
          set -Eeuo pipefail
          catalog="$RUNNER_TEMP/factory-provider-catalog"
          discovery_outcome="$RUNNER_TEMP/factory-discovery-outcome"

          case "$SOURCE" in
            opencode-free)
              if ! opencode models opencode --refresh > "$catalog"; then
                printf 'provider_unavailable\tOpenCode model discovery command failed\n' > "$discovery_outcome"
                exit 1
              fi
              ;;
            openrouter-free)
              if ! curl --silent --show-error --fail-with-body \
                --connect-timeout 5 --max-time 30 \
                --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
                https://openrouter.ai/api/v1/models > "$catalog"; then
                printf 'provider_unavailable\tOpenRouter model catalog request failed\n' > "$discovery_outcome"
                exit 1
              fi
              ;;
            nvidia|kilo-auto|omniroute-opencode)
              # These adapters cannot enumerate reliably. Preserve the lane
              # request and let the existing real invocation/probe prove it.
              {
                echo "model=$LANE_MODEL"
                echo "runtime_model=$LANE_RUNTIME_MODEL"
                echo "display=$LANE_DISPLAY"
                echo "reason=selected-by-runtime-evidence"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              printf 'control_plane_failure\tUnsupported provider adapter: %s\n' "$SOURCE" > "$discovery_outcome"
              exit 1
              ;;
          esac

          configured_args=()
          while IFS= read -r configured_model; do
            [[ -n "$configured_model" ]] || continue
            configured_args+=(--configured-model "$configured_model")
          done < <(
            awk -F '\t' -v source="$SOURCE" \
              '$0 !~ /^#/ && $2 == source {print $3}' \
              .github/free-model-factories.tsv | sort -u
          )

          discovery="$(python3 .github/scripts/factory_provider_candidates.py \
            --provider "$SOURCE" --catalog "$catalog" "${configured_args[@]}")"
          discovery_status="$(jq -r '.status' <<< "$discovery")"
          candidate_count="$(jq '.candidates | length' <<< "$discovery")"
          if [[ "$discovery_status" != available || "$candidate_count" == 0 ]]; then
            printf 'model_unavailable\t%s catalog exposed no policy-eligible candidate\n' "$SOURCE" > "$discovery_outcome"
            exit 1
          fi

          candidate_index=$(( (10#$WORKER - 1) % candidate_count ))
          model="$(jq -r --argjson index "$candidate_index" '.candidates[$index].model' <<< "$discovery")"
          runtime_model="$(jq -r --argjson index "$candidate_index" '.candidates[$index].runtime_model' <<< "$discovery")"
          {
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "display=${SOURCE} · ${model}"
            echo "reason=selected-from-live-provider-catalog"
          } >> "$GITHUB_OUTPUT"
          printf 'Factory %s selected executor: provider=%s model=%s runtime=%s\n' \
            "$WORKER" "$SOURCE" "$model" "$runtime_model"

      - name: Report selected executor heartbeat
        if: always()
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          SOURCE: ${{ steps.lane.outputs.source }}
          MINUTE: ${{ steps.lane.outputs.minute }}
          CONFIGURED: ${{ steps.lane.outputs.configured }}
          REASON: ${{ steps.executor.outputs.reason || steps.lane.outputs.reason }}
          EXECUTOR_OUTCOME: ${{ steps.executor.outcome }}
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          marker="<!-- factory-heartbeat:v1 worker=opencode-free-model-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$CONFIGURED" != true ]]; then
            outcome='unconfigured'
          elif [[ "$EXECUTOR_OUTCOME" != success ]]; then
            outcome='selection-failed'
          else
            outcome='running'
          fi
          body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nSlot: :%02d hourly\nOutcome: %s\nConfiguration: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "$MODEL" "$SOURCE" "$MINUTE" "$outcome" "$REASON" "$now" "$GITHUB_RUN_ID")"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Create ephemeral OmniRoute runtime secrets
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'omniroute-opencode'
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
        run: |
          set -Eeuo pipefail
          runtime_env="$RUNNER_TEMP/omniroute-runtime.env"
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          api_key_secret="$(openssl rand -hex 32)"
          initial_password="$(openssl rand -hex 24)"
          storage_key="$(openssl rand -hex 32)"
          ws_secret="$(openssl rand -base64 32 | tr -d '\n')"
          for secret in "$jwt_secret" "$api_key_secret" "$initial_password" "$storage_key" "$ws_secret"; do echo "::add-mask::$secret"; done
          {
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'API_KEY_SECRET=%s\n' "$api_key_secret"
            printf 'INITIAL_PASSWORD=%s\n' "$initial_password"
            printf 'STORAGE_ENCRYPTION_KEY=%s\n' "$storage_key"
            printf 'STORAGE_ENCRYPTION_KEY_VERSION=v1\n'
            printf 'OMNIROUTE_WS_BRIDGE_SECRET=%s\n' "$ws_secret"
            printf 'DATA_DIR=/app/data\n'
            printf 'OMNIROUTE_NO_UPDATE_NOTIFIER=1\n'
            printf 'AUTH_COOKIE_SECURE=false\n'
            printf 'OPENCODE_SYNTHESIZE_CLI_HEADERS=true\n'
            printf 'OPENCODE_USER_AGENT=opencode/%s\n' "$OPENCODE_VERSION"
            printf 'OPENCODE_CLIENT=cli\n'
            printf 'OPENCODE_PROJECT=comic-pile-factory-%s\n' "$WORKER"
          } > "$runtime_env"
          printf '%s' "$initial_password" > "$RUNNER_TEMP/omniroute-initial-password"
          chmod 600 "$runtime_env" "$RUNNER_TEMP/omniroute-initial-password"

      - name: Start fixed OmniRoute lane
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'omniroute-opencode'
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          docker pull "$OMNIROUTE_IMAGE"
          docker run -d --name "omniroute-factory-${WORKER}" --stop-timeout 40 \
            -p 127.0.0.1:20128:20128 \
            --env-file "$RUNNER_TEMP/omniroute-runtime.env" \
            "$OMNIROUTE_IMAGE" >/dev/null

          for _ in {1..120}; do
            code="$(curl --silent --output "$RUNNER_TEMP/omniroute-health.json" --write-out '%{http_code}' \
              --connect-timeout 1 --max-time 3 http://127.0.0.1:20128/api/monitoring/health || true)"
            [[ "$code" == 200 ]] && break
            sleep 1
          done
          [[ "${code:-}" == 200 ]] || { docker logs "omniroute-factory-${WORKER}" >&2 || true; exit 1; }

          cookies="$RUNNER_TEMP/omniroute-cookies"
          initial_password="$(cat "$RUNNER_TEMP/omniroute-initial-password")"
          login_body="$(jq -nc --arg password "$initial_password" '{password:$password}')"
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 30 \
            --cookie-jar "$cookies" --header 'Content-Type: application/json' --data "$login_body" \
            http://127.0.0.1:20128/api/auth/login >/dev/null

          provider_body="$(jq -nc --arg name "Factory ${WORKER} Fixed OpenCode Free" \
            '{provider:"opencode",name:$name,priority:1,testStatus:"active"}')"
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 30 \
            --cookie "$cookies" --header 'Content-Type: application/json' --data "$provider_body" \
            http://127.0.0.1:20128/api/providers >/dev/null

          key_response="$(curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 30 \
            --cookie "$cookies" --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg name "Factory ${WORKER} Runtime" '{name:$name,noLog:true}')" \
            http://127.0.0.1:20128/api/keys)"
          key="$(jq -r '.key // empty' <<< "$key_response")"
          [[ "$key" == sk-* ]] || { echo 'OmniRoute did not return a gateway key' >&2; exit 1; }
          echo "::add-mask::$key"

          models="$(curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 30 \
            --header "Authorization: Bearer $key" http://127.0.0.1:20128/v1/models)"
          jq -e --arg model "$MODEL" '.data[]?.id | select(. == $model)' >/dev/null <<< "$models" || {
            echo "Pinned OmniRoute model is not currently exposed: ${MODEL}" >&2
            echo 'No fallback is allowed for a fixed-model lane.' >&2
            exit 1
          }

          request="$(jq -nc --arg model "$MODEL" '{model:$model,messages:[{role:"user",content:"Reply with exactly FIXED_MODEL_OK"}],max_tokens:64}')"
          response="$RUNNER_TEMP/omniroute-probe.json"
          headers="$RUNNER_TEMP/omniroute-probe-headers.txt"
          attempt=0
          max_attempts=3
          code=""
          while (( attempt < max_attempts )); do
            attempt=$((attempt + 1))
            code="$(curl --silent --show-error --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 120 --header "Authorization: Bearer $key" \
              --header 'Content-Type: application/json' --data "$request" \
              http://127.0.0.1:20128/v1/chat/completions || true)"
            [[ "$code" =~ ^2 ]] && break
            if grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$response" 2>/dev/null || [[ "$code" == "429" ]]; then
              if (( attempt < max_attempts )); then
                retry_after="$(grep -i '^retry-after:' "$headers" 2>/dev/null | tail -n1 | sed -E 's/^[^:]+:[[:space:]]*//I' | tr -d '\r' | grep -E '^[0-9]+' || true)"
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  delay=$(( retry_after > 60 ? 60 : retry_after ))
                else
                  delay=$(( 5 * attempt ))
                fi
                echo "OmniRoute probe transient HTTP ${code} (attempt ${attempt}/${max_attempts}); retrying after ${delay}s" >&2
                cat "$response" >&2 || true
                sleep "$delay"
                continue
              fi
              echo "Transient OmniRoute probe failure HTTP ${code} after ${attempt} attempts; allowing worker to proceed with built-in retry handling" >&2
              cat "$response" >&2 || true
              exit 0
            fi
            break
          done
          [[ "$code" =~ ^2 ]] || { echo "Pinned OmniRoute model probe failed HTTP ${code}" >&2; cat "$response" >&2 || true; exit 1; }

          mkdir -p "$HOME/.config/opencode"
          jq -n --arg model "$MODEL" --arg key "$key" '{
            provider: {
              omniroute: {
                npm: "@ai-sdk/openai-compatible",
                name: "OmniRoute fixed free lane",
                options: {baseURL: "http://127.0.0.1:20128/v1", apiKey: $key},
                models: {($model): {name: $model}}
              }
            }
          }' > "$HOME/.config/opencode/opencode.json"
          chmod 600 "$HOME/.config/opencode/opencode.json"

      - name: Probe pinned NVIDIA model before OpenCode smoke
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'nvidia'
        shell: bash
        env:
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${NVIDIA_API_KEY:-}" ]] || { echo 'NVIDIA_API_KEY missing after lane configured=true' >&2; exit 1; }
          request="$(jq -nc --arg model "$MODEL" '{model:$model,messages:[{role:"user",content:"Reply with exactly FIXED_MODEL_OK"}],max_tokens:16}')"
          response="$RUNNER_TEMP/nvidia-probe.json"
          headers="$RUNNER_TEMP/nvidia-probe-headers.txt"
          attempt=0
          max_attempts=3
          code=""
          while (( attempt < max_attempts )); do
            attempt=$((attempt + 1))
            code="$(curl --silent --show-error --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 120 \
              --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
              --header 'Content-Type: application/json' \
              --data "$request" \
              https://integrate.api.nvidia.com/v1/chat/completions || true)"
            if [[ "$code" == "404" ]]; then
              echo "Pinned NVIDIA model is not currently invokable for this account: ${MODEL}" >&2
              echo 'No fallback is allowed for a fixed-model lane.' >&2
              cat "$response" >&2 || true
              exit 1
            fi
            [[ "$code" =~ ^2 ]] && break
            if grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$response" 2>/dev/null || [[ "$code" == "429" ]]; then
              if (( attempt < max_attempts )); then
                retry_after="$(grep -i '^retry-after:' "$headers" 2>/dev/null | tail -n1 | sed -E 's/^[^:]+:[[:space:]]*//I' | tr -d '\r' | grep -E '^[0-9]+' || true)"
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  delay=$(( retry_after > 60 ? 60 : retry_after ))
                else
                  delay=$(( 5 * attempt ))
                fi
                echo "NVIDIA probe transient HTTP ${code} (attempt ${attempt}/${max_attempts}); retrying after ${delay}s" >&2
                cat "$response" >&2 || true
                sleep "$delay"
                continue
              fi
              echo "Transient NVIDIA probe failure HTTP ${code} after ${attempt} attempts; allowing worker to proceed with built-in retry handling" >&2
              cat "$response" >&2 || true
              exit 0
            fi
            break
          done
          [[ "$code" =~ ^2 ]] || {
            echo "Pinned NVIDIA model probe failed HTTP ${code}" >&2
            cat "$response" >&2 || true
            exit 1
          }
          echo "NVIDIA probe succeeded for ${MODEL}"

      - name: Smoke exact pinned model through OpenCode
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source != 'kilo-auto'
        shell: bash
        env:
          RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain)"
          [[ -z "$before" ]] || { echo 'Smoke requires clean worktree' >&2; exit 1; }
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            opencode run -m "$RUNTIME_MODEL" --agent build --dir "$GITHUB_WORKSPACE" \
            --title 'ComicPile fixed-model smoke' \
            'Reply with exactly FIXED_MODEL_OPENCODE_OK. Do not edit files, run commands, or use tools.' \
            2>&1 | tee "$RUNNER_TEMP/fixed-model-smoke.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            if grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/fixed-model-smoke.log"; then
              echo "Transient smoke failure detected for ${RUNTIME_MODEL}; allowing worker to proceed with built-in retry handling" >&2
              cat "$RUNNER_TEMP/fixed-model-smoke.log" >&2 || true
              exit 0
            fi
            exit "$status"
          fi
          if ! grep -q 'FIXED_MODEL_OPENCODE_OK' "$RUNNER_TEMP/fixed-model-smoke.log"; then
            if grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/fixed-model-smoke.log"; then
              echo "Transient smoke failure detected for ${RUNTIME_MODEL}; allowing worker to proceed with built-in retry handling" >&2
              cat "$RUNNER_TEMP/fixed-model-smoke.log" >&2 || true
              exit 0
            fi
            echo "Smoke did not return FIXED_MODEL_OPENCODE_OK" >&2
            cat "$RUNNER_TEMP/fixed-model-smoke.log" >&2 || true
            exit 1
          fi
          [[ -z "$(git status --porcelain)" ]] || { echo 'Model smoke modified the worktree' >&2; exit 1; }

      - name: Smoke Kilo Auto Free through Kilo CLI
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'kilo-auto'
        shell: bash
        env:
          FACTORY_RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain)"
          [[ -z "$before" ]] || { echo 'Smoke requires clean worktree' >&2; exit 1; }
          attempt=0
          max_attempts=3
          while (( attempt < max_attempts )); do
            attempt=$((attempt + 1))
            set +e
            bash .github/scripts/kilo-auto-factory-run.sh \
              180 \
              'ComicPile Kilo Auto Free smoke' \
              'Reply with exactly KILO_AUTO_FREE_OK. Do not edit files, run commands, or use tools.' \
              "$RUNNER_TEMP/kilo-auto-smoke.log"
            status=$?
            set -e
            if grep -q 'KILO_AUTO_FREE_OK' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
              break
            fi
            if grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
              if (( attempt < max_attempts )); then
                retry_after="$(grep -Ei 'retry-after:[[:space:]]*[0-9]+' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null | tail -n1 | grep -Eo '[0-9]+' | tail -n1 || true)"
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  delay=$(( retry_after > 60 ? 60 : retry_after ))
                else
                  delay=$(( 5 * attempt ))
                fi
                echo "Kilo smoke transient failure (attempt ${attempt}/${max_attempts}); retrying after ${delay}s" >&2
                cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
                sleep "$delay"
                continue
              fi
              echo "Transient Kilo smoke failure after ${attempt} attempts; allowing worker to proceed with built-in retry handling" >&2
              cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
              exit 0
            fi
            # Non-transient failure without sentinel - break to final error handling
            break
          done
          if grep -q 'KILO_AUTO_FREE_OK' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
            echo "Kilo smoke succeeded"
          elif grep -Eiq '429|Too Many Requests|rate.?limit|overloaded|temporar(il)?y unavailable|bad gateway|gateway timeout|service unavailable|HTTP[^0-9]*(502|503|504)|ECONNRESET|ETIMEDOUT|connection reset' "$RUNNER_TEMP/kilo-auto-smoke.log" 2>/dev/null; then
            echo "Transient Kilo smoke failure detected; allowing worker to proceed with built-in retry handling" >&2
            cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
            exit 0
          else
            echo "Kilo smoke did not return KILO_AUTO_FREE_OK" >&2
            cat "$RUNNER_TEMP/kilo-auto-smoke.log" >&2 || true
            exit 1
          fi
          [[ -z "$(git status --porcelain)" ]] || { echo 'Kilo smoke modified the worktree' >&2; exit 1; }

      - name: Run continuous fixed-model factory session
        if: steps.lane.outputs.configured == 'true'
        env:
          FACTORY_WORKER: ${{ steps.lane.outputs.worker }}
          FACTORY_SOURCE: ${{ steps.lane.outputs.source }}
          FACTORY_MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          FACTORY_RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
          FACTORY_DISPLAY: ${{ steps.executor.outputs.display || steps.lane.outputs.display }}
          FACTORY_BRANCH_SUFFIX: ${{ steps.lane.outputs.branch_suffix }}
        run: |
          set +e
          bash .github/scripts/free-model-factory-worker.sh
          worker_status=$?
          set -e
          # Write after the worker (and model) exits, so attempt code cannot
          # forge the trusted wrapper's source classification.
          printf '%s\n' "$worker_status" > "$RUNNER_TEMP/factory-worker-status"
          exit "$worker_status"

      - name: Report terminal heartbeat
        if: always()
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          SOURCE: ${{ steps.lane.outputs.source }}
          MINUTE: ${{ steps.lane.outputs.minute }}
          CONFIGURED: ${{ steps.lane.outputs.configured }}
          REASON: ${{ steps.executor.outputs.reason || steps.lane.outputs.reason }}
          JOB_STATUS: ${{ job.status }}
          WORKER_STATUS_FILE: ${{ runner.temp }}/factory-worker-status
          DISCOVERY_OUTCOME_FILE: ${{ runner.temp }}/factory-discovery-outcome
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          marker="<!-- factory-heartbeat:v1 worker=opencode-free-model-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$CONFIGURED" != true ]]; then outcome='unconfigured'; else outcome="$JOB_STATUS"; fi
          body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nSlot: :%02d hourly\nOutcome: %s\nConfiguration: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "$MODEL" "$SOURCE" "$MINUTE" "$outcome" "$REASON" "$now" "$GITHUB_RUN_ID")"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

          # Publish a conservative attempt result synchronously. The asynchronous
          # log classifier may later replace unknown_failure with a more specific
          # outcome, but capacity never waits on a chained workflow-run event.
          attempt_marker="<!-- factory-attempt-outcome:v1 worker=opencode-free-model-factory-${WORKER} -->"
          worker_status="$(cat "$WORKER_STATUS_FILE" 2>/dev/null || true)"
          discovery_record="$(cat "$DISCOVERY_OUTCOME_FILE" 2>/dev/null || true)"
          if [[ -n "$discovery_record" ]]; then
            IFS="$(printf '\t')" read -r attempt_outcome attempt_detail <<< "$discovery_record"
          elif [[ "$worker_status" == 2 || "$worker_status" == 3 ]]; then
            attempt_outcome='control_plane_failure'
            attempt_detail="factory controller assignment failed with exit status ${worker_status}"
          elif [[ "$CONFIGURED" == true && "$JOB_STATUS" == success ]]; then
            attempt_outcome='success'
            attempt_detail='factory job completed successfully'
          elif [[ "$CONFIGURED" != true ]]; then
            attempt_outcome='unknown_failure'
            attempt_detail="factory lane was not executable: ${REASON}"
          else
            attempt_outcome='unknown_failure'
            attempt_detail='factory job failed before a more specific log classification was available'
          fi
          attempt_body="$(printf '%s\nWorker: opencode-free-model-factory-%s\nModel: %s\nSource: %s\nOutcome: %s\nAttempt outcome: %s\nDetail: %s\nUpdated: %s\nRun: %s' \
            "$attempt_marker" "$WORKER" "$MODEL" "$SOURCE" "$outcome" "$attempt_outcome" "$attempt_detail" "$now" "$GITHUB_RUN_ID")"
          attempt_comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$attempt_marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          existing_run=''
          if [[ -n "$attempt_comment_id" ]]; then
            existing_run="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${attempt_comment_id}" --jq '.body' \
              | sed -n 's/^Run: //p' | tail -1)"
          fi
          if [[ "$existing_run" =~ ^[0-9]+$ ]] && (( existing_run > GITHUB_RUN_ID )); then
            echo "Newer attempt evidence from run ${existing_run} already exists; preserving it"
          elif [[ -n "$attempt_comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${attempt_comment_id}" \
              -f body="$attempt_body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" \
              -f body="$attempt_body" >/dev/null
          fi
