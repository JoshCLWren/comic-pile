name: Production Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-performance
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_BASE_URL: https://comic-pile.vercel.app
      PROD_PERFORMANCE_OUTPUT: ../test-results/production-performance.json
      PROD_DEPLOYMENT_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore bounded performance history
        uses: actions/cache/restore@v4
        with:
          path: test-results/production-performance-history.jsonl
          key: production-performance-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            production-performance-

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Remove stale production E2E records
        env:
          DATABASE_URL: ${{ secrets.PROD_E2E_DATABASE_URL }}
          PROD_E2E_ACCOUNT_EMAIL: ${{ secrets.PROD_E2E_ACCOUNT_EMAIL }}
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$PROD_E2E_ACCOUNT_EMAIL" ]; then
            echo 'Missing dedicated production E2E cleanup secrets.' >&2
            exit 1
          fi
          uv run python scripts/cleanup_production_e2e_data.py --max-age-hours 24 \
            | tee production-e2e-cleanup.json
          echo '### Production E2E cleanup' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat production-e2e-cleanup.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticate dedicated production E2E account
        working-directory: frontend
        env:
          PROD_E2E_ACCOUNT_USERNAME: ${{ secrets.PROD_E2E_ACCOUNT_USERNAME }}
          PROD_E2E_ACCOUNT_PASSWORD: ${{ secrets.PROD_E2E_ACCOUNT_PASSWORD }}
          PROD_PROFILE_STORAGE_STATE: ${{ runner.temp }}/production-storage-state.json
        run: |
          if [ -z "$PROD_E2E_ACCOUNT_USERNAME" ] || [ -z "$PROD_E2E_ACCOUNT_PASSWORD" ]; then
            echo 'Missing dedicated production E2E account credentials.' >&2
            exit 1
          fi
          node scripts/create-production-e2e-storage-state.mjs
          chmod 600 "$PROD_PROFILE_STORAGE_STATE"
          echo "PROD_PROFILE_STORAGE_STATE=$PROD_PROFILE_STORAGE_STATE" >> "$GITHUB_ENV"

      - name: Measure production milestones
        working-directory: frontend
        run: pnpm exec playwright test --config=playwright.prod-performance.config.ts

      - name: Append history and detect regressions
        run: |
          python scripts/update_production_performance_history.py \
            --sample test-results/production-performance.json \
            --history test-results/production-performance-history.jsonl \
            --summary test-results/production-performance-summary.md
          cat test-results/production-performance-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save bounded performance history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: test-results/production-performance-history.jsonl
          key: production-performance-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-e2e-cleanup.json
            test-results/production-performance.json
            test-results/production-performance-history.jsonl
            test-results/production-performance-summary.md
            playwright-report-prod-performance
          if-no-files-found: warn
          retention-days: 30
