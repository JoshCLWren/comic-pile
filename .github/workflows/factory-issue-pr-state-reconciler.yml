name: Factory Issue PR State Reconciler

on:
  pull_request_target:
    # `edited` routes Greptile re-reviews that only rewrite the PR-body
    # summary (no new review submission) when it lists open findings for the
    # current head. Only Greptile routing runs for `edited`.
    types: [opened, reopened, ready_for_review, synchronize, closed, unlabeled, edited]
  # Trusted review feedback may route a PR to repair. Native APPROVED is
  # deliberately not a merge authorization; controller attestations still rule.
  # `submitted` also covers Greptile's COMMENTED reviews and thread replies:
  # each one recomputes Greptile routing from the live PR state, so open
  # Greptile findings route the PR to factory:changes-requested.
  pull_request_review:
    types: [submitted, dismissed]
  # A thread reply fires pull_request_review_comment. Greptile pushback on an
  # answered finding reopens it, so recompute routing for replies as well.
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    # PR events cannot repair issues whose last canonical PR was closed before
    # this reconciler existed. Periodically recompute every open factory issue
    # so stale ready/review/building labels cannot permanently block intake.
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write
  # write: enroll step labels PRs via GITHUB_TOKEN (PUT .../issues/{n}/labels)
  pull-requests: write

# Issue state is shared by every PR linked to that issue. Serialize all
# issue-centric reconciliations so duplicate PR events cannot race label
# replacement. Greptile routing events (pull_request_review, thread replies
# via pull_request_review_comment, and PR-body `edited`) only touch their own PR, so they use a per-PR group instead: a
# burst of events on one PR can no longer replace a queued routing run for a
# different PR (run 39140967515 was lost that way). Within one PR group a
# newer pending run may still replace an older pending one; that is safe
# because routing is recomputed from live PR state, never from the payload.
concurrency:
  group: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || (github.event_name == 'pull_request_target' && github.event.action == 'edited')) && format('factory-greptile-routing-pr-{0}', github.event.pull_request.number) || 'factory-issue-pr-state-reconciler' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted reconciliation implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enroll repository PRs missing factory labels
        uses: actions/github-script@v9
        with:
          script: |
            const visibility = require('./.github/scripts/factory-visibility.cjs');
            if (context.eventName === 'pull_request_review'
                || context.eventName === 'pull_request_review_comment'
                || (context.eventName === 'pull_request_target' && context.payload.action === 'edited')) {
              await visibility({ github, context });
            } else {
              await visibility.reconcileMissingPrLabels({ github, context });
            }

      - name: Reconcile linked issue from trusted canonical PR history
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -Eeuo pipefail
          # This event only affects PR review/repair state. Do not enter the
          # scheduled linked-issue sweep or infer issue closure from a review.
          [[ "$EVENT_NAME" == 'pull_request_review' || "$EVENT_NAME" == 'pull_request_review_comment' ]] && exit 0
          # A PR-body edit only feeds Greptile routing (previous step).
          [[ "$EVENT_NAME" == 'pull_request_target' && "$EVENT_ACTION" == 'edited' ]] && exit 0

          issue_from_head() {
            sed -nE 's#^factory/[0-9]+-([0-9]+)-.*$#\1#p' <<< "$1"
          }

          trusted_factory_pr() {
            local pr="$1" expected_issue="$2" pr_json head_ref head_repo comments
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")" || return 2
            head_ref="$(jq -r '.head.ref // ""' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"

            # Branch shape alone is never authority. Factory persistence happens
            # in this repository and must have a trusted durable provenance marker.
            [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || return 1
            [[ "$(issue_from_head "$head_ref")" == "$expected_issue" ]] || return 1

            comments="$(mktemp)"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" >"$comments" || return 1

            python3 - "$head_ref" "$pr" "$expected_issue" "$comments" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          import traceback

          def check_provenance():
              head_ref, pr_number, expected_issue, comments_path = sys.argv[1:]
              path = Path('.github/scripts/factory-revocation-fence.py')
              # importlib does not automatically add this script's directory to sys.path.
              sys.path.insert(0, str(path.parent.resolve()))
              spec = importlib.util.spec_from_file_location('factory_revocation_fence', path)
              if spec is None or spec.loader is None:
                  return 1
              fence = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = fence
              spec.loader.exec_module(fence)
    
              branch = fence.BRANCH_RE.match(head_ref)
              if branch is None or branch.group('issue') != expected_issue:
                  return 1
    
              comments = json.loads(Path(comments_path).read_text(encoding='utf-8'))
              for comment in fence.flatten_comments(comments):
                  if not fence.comment_is_trusted(comment):
                      continue
                  for marker in fence.PROVENANCE_RE.finditer(str(comment.get('body') or '')):
                      if (
                          marker.group('pr') == pr_number
                          and marker.group('issue') == expected_issue
                          and marker.group('worker') == branch.group('worker')
                      ):
                          # The marker itself is the durable identity established by
                          # the same trusted parser used by the revocation fence.
                          # Later repair commits may advance the PR head, so issue
                          # completion follows this persisted PR/issue/producer tuple.
                          return 0
              return 1

          try:
              sys.exit(check_provenance())
          except Exception:
              traceback.print_exc()
              sys.exit(2)
          PY
          }

          replace_issue_state() {
            local issue="$1" stage="$2" labels target
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/labels?per_page=100" --jq '[.[].name]')"
            target="$(jq -c --arg stage "$stage" '
              map(select((test("^factory:(?:unowned|local|[1-9]|[1-3][0-9]|[4-9][0-9])$")|not)
                         and (test("^factory:(?:building|review|changes-requested|ci|ready|blocked)$")|not)
                         and . != "factory"))
              + ["factory", "factory:unowned"]
              + (if $stage == "claimable" then [] else [$stage] end)
              | unique' <<< "$labels")"
            # Avoid no-op writes and their downstream labeling events.
            if [[ "$(jq -c 'sort' <<< "$labels")" == "$(jq -c 'sort' <<< "$target")" ]]; then
              echo "Issue #${issue}: labels unchanged"
              return 0
            fi
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/issues/${issue}/labels" \
              --input - <<< "{\"labels\":${target}}" >/dev/null
            echo "Issue #${issue} -> factory:unowned${stage:+ + ${stage}}"
          }

          reconcile_issue() {
            local issue="$1" pulls records stage labels blocked body_file
            # Claim policy already treats BLOCKED_LABELS (including
            # ralph-status:blocked) as non-executable. Skip before any
            # trusted-history walk so replace_issue_state never rewrites
            # a held issue back to factory + factory:unowned.
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/labels?per_page=100" --jq '[.[].name]')"
            blocked="$(python3 .github/scripts/factory_issue_pr_state_policy.py \
              --blocked-by-labels-json "$labels")"
            if [[ "$blocked" == "blocked" ]]; then
              echo "Issue #${issue}: skipped (blocked labels)"
              return 0
            fi
            # ``gh issue list --label factory`` includes pull requests.
            # Manual-only PR bodies must skip here the same way
            # stale-expiration already skips them (#4244).
            body_file="$(mktemp)"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq '.body // ""' >"$body_file"
            blocked="$(python3 .github/scripts/factory_issue_pr_state_policy.py \
              --blocked-by-body-file "$body_file")"
            rm -f "$body_file"
            if [[ "$blocked" == "blocked" ]]; then
              echo "Issue #${issue}: skipped (manual-only)"
              return 0
            fi
            # Scheduled sweeps reuse one PR snapshot for all issues.
            pulls="${SWEEP_PULLS:-}"
            if [[ -z "$pulls" ]]; then
              pulls="$(gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100")"
            fi
            records='[]'

            while IFS=$'\t' read -r pr head_ref state merged_at; do
              [[ -n "$pr" ]] || continue
              [[ "$(issue_from_head "$head_ref")" == "$issue" ]] || continue
              if trusted_factory_pr "$pr" "$issue"; then
                merged=false
                [[ -n "$merged_at" && "$merged_at" != 'null' ]] && merged=true
                records="$(jq -c \
                  --arg state "$state" \
                  --argjson merged "$merged" \
                  '. + [{trusted:true,state:$state,merged:$merged}]' <<< "$records")"
              else
                status=$?
                [[ "$status" == 1 ]] || return "$status"
              fi
            done < <(jq -r '.[][] | [.number, .head.ref, .state, .merged_at] | @tsv' <<< "$pulls")

            # No trusted canonical PR history means this workflow has no authority
            # over the issue. In particular, a forged fork factory/* PR cannot
            # create a label mutation merely by naming an issue in its branch.
            [[ "$(jq 'length' <<< "$records")" != '0' ]] || return 0

            stage="$(python3 .github/scripts/factory_issue_pr_state_policy.py \
              --records-json "$records")"
            replace_issue_state "$issue" "$stage"
          }

          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            issue="$(issue_from_head "$EVENT_HEAD_REF")"
            [[ -n "$issue" ]] || exit 0

            # Fail closed before issue mutation. A fork or a canonical-looking PR
            # without durable trusted factory provenance has no issue-write
            # authority. Allow the producer a short handoff window because PR
            # creation and provenance persistence are separate API calls.
            [[ "$EVENT_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || exit 0
            trusted=false
            for attempt in {1..12}; do
              if trusted_factory_pr "$EVENT_PR_NUMBER" "$issue"; then
                trusted=true
                break
              else
                status=$?
                # Only missing/untrusted provenance is retryable. A broken
                # verifier or GitHub API error must fail the job visibly.
                [[ "$status" == 1 ]] || exit "$status"
              fi
              (( attempt < 12 )) && sleep 5
            done
            [[ "$trusted" == true ]] || exit 0

            reconcile_issue "$issue"
            exit 0
          fi

          # Blank reconciliation is also issue-centric and uses the exact same
          # trusted-history calculation. Restrict the sweep to existing factory
          # issues so unrelated issues are never introduced by branch-shaped data.
          # Do not refetch the same full PR list once per open factory issue.
          SWEEP_PULLS="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100")"
          while IFS= read -r issue; do
            [[ -n "$issue" ]] || continue
            state="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)"
            [[ "$state" == 'OPEN' ]] || continue
            reconcile_issue "$issue"
          done < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label factory \
            --limit 1000 --json number --jq '.[].number')
