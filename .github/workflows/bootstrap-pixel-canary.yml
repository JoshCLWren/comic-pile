name: Bootstrap Pixel Canary factory lane

on:
  push:
    branches:
      - factory/add-pixel-canary

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: factory/add-pixel-canary
          fetch-depth: 0

      - name: Patch factory control plane
        run: python3 .github/scripts/bootstrap_pixel_canary.py

      - name: Validate patched control plane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/factory_roster.py \
            .github/scripts/validate-free-model-factories.py \
            tests/test_free_provider_pin_guards.py \
            tests/test_factory_executor_selection_workflow.py
          python3 .github/scripts/validate-free-model-factories.py
          git diff --check

      - name: Publish patched files
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='factory/add-pixel-canary'
          files=(
            '.github/free-model-factories.tsv'
            '.github/factory-expected-workers.json'
            '.github/scripts/factory_roster.py'
            '.github/workflows/free-model-factory-run.yml'
            '.github/scripts/validate-free-model-factories.py'
            'tests/test_free_provider_pin_guards.py'
            'tests/test_factory_executor_selection_workflow.py'
          )
          for path in "${files[@]}"; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${branch}" --jq '.sha')"
            content="$(base64 -w0 "$path")"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='feat: add Pixel Canary factory lane' \
              -f content="$content" \
              -f sha="$sha" \
              -f branch="$branch" >/dev/null
          done

          for path in '.github/scripts/bootstrap_pixel_canary.py' '.github/workflows/bootstrap-pixel-canary.yml'; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${branch}" --jq '.sha')"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='chore: remove Pixel Canary bootstrap artifact' \
              -f sha="$sha" \
              -f branch="$branch" >/dev/null
          done
