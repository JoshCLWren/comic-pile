name: Bootstrap Pixel Canary factory lane

on:
  push:
    branches:
      - factory/add-pixel-canary

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: factory/add-pixel-canary
          fetch-depth: 0

      - name: Patch factory control plane
        run: python3 .github/scripts/bootstrap_pixel_canary.py

      - name: Validate patched control plane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/factory_roster.py \
            .github/scripts/validate-free-model-factories.py \
            tests/test_free_provider_pin_guards.py \
            tests/test_factory_executor_selection_workflow.py
          python3 .github/scripts/validate-free-model-factories.py
          git diff --check

      - name: Commit patched lane
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Pixel Canary factory lane'
          git push origin HEAD:factory/add-pixel-canary
