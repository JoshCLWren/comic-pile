name: Bootstrap Pixel Canary factory lane

on:
  push:
    branches:
      - factory/add-pixel-canary

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: factory/add-pixel-canary
          fetch-depth: 0

      - name: Restore patch targets from main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout origin/main -- \
            .github/free-model-factories.tsv \
            .github/factory-expected-workers.json \
            .github/scripts/factory_roster.py \
            .github/workflows/free-model-factory-run.yml \
            .github/scripts/validate-free-model-factories.py \
            tests/test_free_provider_pin_guards.py \
            tests/test_factory_executor_selection_workflow.py

      - name: Patch factory control plane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/bootstrap_pixel_canary.py
          cp .github/workflows/free-model-factory-run.yml .github/patched-free-model-factory-run.yml

      - name: Validate patched control plane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/factory_roster.py \
            .github/scripts/validate-free-model-factories.py \
            tests/test_free_provider_pin_guards.py \
            tests/test_factory_executor_selection_workflow.py
          python3 .github/scripts/validate-free-model-factories.py
          git diff --check

      - name: Publish non-workflow files and patched runner blob
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='factory/add-pixel-canary'
          files=(
            '.github/free-model-factories.tsv'
            '.github/factory-expected-workers.json'
            '.github/scripts/factory_roster.py'
            '.github/scripts/validate-free-model-factories.py'
            'tests/test_free_provider_pin_guards.py'
            'tests/test_factory_executor_selection_workflow.py'
          )
          for path in "${files[@]}"; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${branch}" --jq '.sha')"
            content="$(base64 -w0 "$path")"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='feat: add Pixel Canary factory lane' \
              -f content="$content" \
              -f sha="$sha" \
              -f branch="$branch" >/dev/null
          done

          temp='.github/patched-free-model-factory-run.yml'
          content="$(base64 -w0 "$temp")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${temp}" \
            -f message='chore: stage patched Pixel Canary runner blob' \
            -f content="$content" \
            -f branch="$branch" >/dev/null
