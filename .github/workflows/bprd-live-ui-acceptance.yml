name: B.P.R.D. Live Production UI Acceptance

on:
  push:
    branches:
      - manual/2366-bprd-live-ui-acceptance

permissions:
  contents: read

concurrency:
  group: bprd-live-ui-acceptance
  cancel-in-progress: false

jobs:
  accept:
    name: Add real B.P.R.D. material through live UI under disposable user
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://comic-pile.vercel.app
      PRODUCTION_BRANCH_ID: br-silent-violet-ayobfez5
      EXPECTED_BRANCH_NAME: production
    steps:
      - name: Check out exact live code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create disposable production login through real auth API
        id: auth
        run: |
          set -euo pipefail
          username="acceptance_bprd_ui_${GITHUB_RUN_ID}"
          email="${username}@example.com"
          password="$(openssl rand -base64 24 | tr -d '\n')Aa1!"
          echo "::add-mask::$password"

          register_payload="$(jq -nc --arg u "$username" --arg e "$email" --arg p "$password" '{username:$u,email:$e,password:$p}')"
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$register_payload" \
            "$BASE_URL/api/auth/register" >/tmp/register.json

          login_payload="$(jq -nc --arg u "$username" --arg p "$password" '{username:$u,password:$p}')"
          token="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$login_payload" \
            "$BASE_URL/api/auth/login" | jq -r '.access_token')"
          test -n "$token"
          test "$token" != null
          echo "::add-mask::$token"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Resolve and verify production database
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          branch_json="$(curl --fail --silent --show-error \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${PRODUCTION_BRANCH_ID}" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}")"
          jq -e --arg id "$PRODUCTION_BRANCH_ID" --arg name "$EXPECTED_BRANCH_NAME" \
            '.branch.id == $id and .branch.name == $name and .branch.default and .branch.primary' \
            <<< "$branch_json" >/dev/null

          raw_uri="$(curl --fail --silent --show-error --get \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" \
            --data-urlencode "branch_id=${PRODUCTION_BRANCH_ID}" \
            --data-urlencode 'database_name=neondb' \
            --data-urlencode 'role_name=neondb_owner' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" \
            | jq -r '.uri')"
          test -n "$raw_uri"
          test "$raw_uri" != null
          echo "::add-mask::$raw_uri"

          uri="$(RAW_DATABASE_URL="$raw_uri" .venv/bin/python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          parts = urlsplit(os.environ['RAW_DATABASE_URL'])
          query = []
          for key, value in parse_qsl(parts.query, keep_blank_values=True):
              if key == 'channel_binding':
                  continue
              if key == 'sslmode':
                  key = 'ssl'
              query.append((key, value))
          print(urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)))
          PY
          )"
          echo "::add-mask::$uri"
          echo "db_url=$uri" >> "$GITHUB_OUTPUT"

      - name: Seed only the disposable user's prerequisite plan
        id: seed
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          ENVIRONMENT: development
          ACCEPTANCE_USERNAME: ${{ steps.auth.outputs.username }}
        run: |
          set -euo pipefail
          output="$(.venv/bin/python - <<'PY'
          import asyncio
          import json
          import os
          from datetime import UTC, datetime

          from sqlalchemy import func, select

          from app.database import AsyncSessionLocal
          from app.models.continuity_plan import ContinuityPlan
          from app.models.issue import Issue
          from app.models.thread import Thread
          from app.models.user import User
          from app.schemas.continuity_plan import ContinuityPlanNode
          from app.services.continuity_plan_writer import replace_compiled_rules, validate_node_ownership
          from app.services.issue_tracking import apply_thread_issue_tracking_state
          from comic_pile.dependencies import refresh_user_blocked_status

          async def main() -> None:
              async with AsyncSessionLocal() as db:
                  user = await db.scalar(select(User).where(User.username == os.environ['ACCEPTANCE_USERNAME']))
                  assert user is not None
                  thread_count = await db.scalar(select(func.count()).select_from(Thread).where(Thread.user_id == user.id))
                  plan_count = await db.scalar(select(func.count()).select_from(ContinuityPlan).where(ContinuityPlan.user_id == user.id))
                  assert thread_count == 0
                  assert plan_count == 0

                  gate_thread = Thread(
                      user_id=user.id,
                      title='B.P.R.D. Acceptance Gate',
                      format='comic',
                      queue_position=1,
                      status='active',
                      total_issues=1,
                      issues_remaining=1,
                      reading_progress='not_started',
                      created_at=datetime.now(UTC),
                  )
                  db.add(gate_thread)
                  await db.flush()
                  gate_issue = Issue(
                      thread_id=gate_thread.id,
                      issue_number='gate',
                      position=1,
                      status='unread',
                  )
                  db.add(gate_issue)
                  await db.flush()
                  apply_thread_issue_tracking_state(gate_thread, [gate_issue])

                  node = ContinuityPlanNode(
                      id=f'issue-{gate_issue.id}',
                      node_type='issue',
                      ref_id=gate_issue.id,
                      lane_id='main',
                      position=0,
                      is_checkpoint=False,
                      convergence_gate=[],
                  )
                  await validate_node_ownership(db, user_id=user.id, nodes=[node])
                  plan = ContinuityPlan(
                      user_id=user.id,
                      name='B.P.R.D.',
                      ordering_mode='strict_sequential',
                      lanes_json=[{'id':'main','name':'Reading order','order':0}],
                      nodes_json=[node.model_dump()],
                  )
                  db.add(plan)
                  await db.flush()
                  await replace_compiled_rules(
                      db,
                      user_id=user.id,
                      plan=plan,
                      nodes=[node],
                      ordering_mode='strict_sequential',
                  )
                  await refresh_user_blocked_status(user.id, db)
                  await db.commit()
                  print(json.dumps({'user_id': user.id, 'plan_id': plan.id, 'gate_thread_id': gate_thread.id}))

          asyncio.run(main())
          PY
          )"
          echo "$output" | tee /tmp/bprd-live-ui-seed.json
          echo "user_id=$(jq -r '.user_id' <<< "$output")" >> "$GITHUB_OUTPUT"
          echo "plan_id=$(jq -r '.plan_id' <<< "$output")" >> "$GITHUB_OUTPUT"
          echo "gate_thread_id=$(jq -r '.gate_thread_id' <<< "$output")" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Drive Add material through live production UI
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
          PLAN_ID: ${{ steps.seed.outputs.plan_id }}
        run: |
          set -euo pipefail
          cd frontend
          node <<'JS'
          const { chromium } = require('@playwright/test')
          const fs = require('node:fs')

          const baseUrl = process.env.BASE_URL
          const token = process.env.ACCESS_TOKEN
          const planId = process.env.PLAN_ID

          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } })
            const failures = []
            page.on('pageerror', error => failures.push(`pageerror: ${error.message}`))
            page.on('console', msg => {
              if (msg.type() === 'error') failures.push(`console: ${msg.text()}`)
            })
            await page.addInitScript(accessToken => {
              localStorage.setItem('auth_token', accessToken)
              window.__COMIC_PILE_ACCESS_TOKEN = accessToken
            }, token)

            await page.goto(`${baseUrl}/continuity-plans/${planId}`, { waitUntil: 'domcontentloaded', timeout: 30000 })
            await page.getByRole('button', { name: 'Browse sources' }).waitFor({ state: 'visible', timeout: 30000 })
            await page.screenshot({ path: '../bprd-live-ui-before.png', fullPage: true })

            await page.getByRole('button', { name: 'Browse sources' }).click()
            const sourceButton = page.getByRole('button', { name: /B\.P\.R\.D\. Plague of Frogs Omnibus Vol\. 3/i })
            await sourceButton.waitFor({ state: 'visible', timeout: 30000 })
            await sourceButton.click()
            await page.getByText('Missing · choose whether to add').first().waitFor({ state: 'visible', timeout: 30000 })

            let addBoxes = page.getByRole('checkbox', { name: 'Add' })
            if (await addBoxes.count() !== 15) throw new Error(`Expected 15 Add checkboxes, got ${await addBoxes.count()}`)

            for (let i = 0; i < 15; i++) {
              const unchecked = page.locator('input[type="checkbox"]:not(:checked)')
              const before = await unchecked.count()
              if (before !== 15 - i) throw new Error(`Expected ${15 - i} unchecked boxes before selection ${i + 1}, got ${before}`)
              const responsePromise = page.waitForResponse(
                response => response.url().includes('/adoption-plan') && response.request().method() === 'POST',
                { timeout: 30000 },
              )
              await unchecked.first().check()
              const response = await responsePromise
              if (!response.ok()) throw new Error(`adoption-plan failed: ${response.status()} ${await response.text()}`)
            }

            const commitButton = page.getByRole('button', { name: 'Add selected material' })
            await commitButton.waitFor({ state: 'visible' })
            if (await commitButton.isDisabled()) throw new Error('Add selected material stayed disabled after all 15 opt-ins')

            const commitResponsePromise = page.waitForResponse(
              response => response.url().includes('/adoption-commit') && response.request().method() === 'POST',
              { timeout: 30000 },
            )
            await commitButton.click()
            const commitResponse = await commitResponsePromise
            if (!commitResponse.ok()) throw new Error(`adoption-commit failed: ${commitResponse.status()} ${await commitResponse.text()}`)
            const committed = await commitResponse.json()
            if ((committed.created_positions ?? []).length !== 15) throw new Error(`Expected 15 created positions, got ${JSON.stringify(committed)}`)
            await page.getByText(/Added material to this Reading Plan · created 15 · reused 0/).waitFor({ state: 'visible', timeout: 30000 })
            await page.screenshot({ path: '../bprd-live-ui-committed.png', fullPage: true })

            await page.reload({ waitUntil: 'domcontentloaded' })
            await page.getByRole('button', { name: 'Browse sources' }).waitFor({ state: 'visible', timeout: 30000 })
            await page.getByRole('button', { name: 'Browse sources' }).click()
            const sourceAgain = page.getByRole('button', { name: /B\.P\.R\.D\. Plague of Frogs Omnibus Vol\. 3/i })
            await sourceAgain.waitFor({ state: 'visible', timeout: 30000 })
            await sourceAgain.click()
            await page.getByText('Already in ComicPile').first().waitFor({ state: 'visible', timeout: 30000 })
            const existingCount = await page.getByText('Already in ComicPile').count()
            if (existingCount !== 15) throw new Error(`Expected 15 existing entries after reload, got ${existingCount}`)
            if (await page.getByRole('checkbox', { name: 'Add' }).count() !== 0) throw new Error('Add checkboxes remained after reload/reconciliation')
            await page.screenshot({ path: '../bprd-live-ui-reloaded.png', fullPage: true })

            fs.writeFileSync('../bprd-live-ui-browser.json', JSON.stringify({
              plan_id: Number(planId),
              created_positions: committed.created_positions,
              existing_after_reload: existingCount,
              browser_failures: failures,
            }, null, 2))
            if (failures.length) throw new Error(`Browser console/page failures: ${failures.join(' | ')}`)
            await browser.close()
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          JS

      - name: Verify persisted plan and Roll boundary after live UI commit
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          ENVIRONMENT: development
          ACCEPTANCE_USERNAME: ${{ steps.auth.outputs.username }}
          PLAN_ID: ${{ steps.seed.outputs.plan_id }}
          GATE_THREAD_ID: ${{ steps.seed.outputs.gate_thread_id }}
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import asyncio
          import json
          import os
          from sqlalchemy import func, select

          from app.database import AsyncSessionLocal
          from app.models.continuity_plan import ContinuityPlan
          from app.models.continuity_rule import ContinuityRule
          from app.models.issue import Issue
          from app.models.thread import Thread
          from app.models.user import User
          from comic_pile.queue import get_roll_pool

          async def main() -> None:
              async with AsyncSessionLocal() as db:
                  user = await db.scalar(select(User).where(User.username == os.environ['ACCEPTANCE_USERNAME']))
                  assert user is not None
                  plan = await db.get(ContinuityPlan, int(os.environ['PLAN_ID']))
                  assert plan is not None and plan.user_id == user.id
                  assert plan.ordering_mode == 'strict_sequential'
                  assert len(plan.nodes_json or []) == 16
                  assert {str(node.get('lane_id')) for node in plan.nodes_json or []} == {'main'}

                  rule_count = await db.scalar(
                      select(func.count()).select_from(ContinuityRule).where(
                          ContinuityRule.user_id == user.id,
                          ContinuityRule.note == f'continuity-plan:{plan.id}',
                      )
                  )
                  assert rule_count == 15

                  threads = list((await db.execute(
                      select(Thread).where(
                          Thread.user_id == user.id,
                          Thread.title.in_([
                              'CBL: B.P.R.D.: The Universal Machine',
                              'CBL: B.P.R.D.: Garden of Souls',
                              'CBL: B.P.R.D.: Killing Ground',
                          ]),
                      ).order_by(Thread.queue_position)
                  )).scalars().all())
                  assert len(threads) == 3
                  for thread in threads:
                      issues = list((await db.execute(
                          select(Issue).where(Issue.thread_id == thread.id).order_by(Issue.position)
                      )).scalars().all())
                      assert [issue.position for issue in issues] == [1,2,3,4,5]
                      assert thread.queue_position > 0
                      assert thread.total_issues == 5
                      assert thread.issues_remaining == 5
                      assert thread.next_unread_issue_id == issues[0].id

                  pool = await get_roll_pool(user.id, db)
                  assert [thread.id for thread in pool] == [int(os.environ['GATE_THREAD_ID'])]

                  evidence = {
                      'user_id': user.id,
                      'username': user.username,
                      'plan_id': plan.id,
                      'node_count': len(plan.nodes_json or []),
                      'compiled_rules': rule_count,
                      'materialized_threads': [
                          {'id': thread.id, 'title': thread.title, 'queue_position': thread.queue_position}
                          for thread in threads
                      ],
                      'roll_pool_before_prerequisite': [
                          {'id': thread.id, 'title': thread.title} for thread in pool
                      ],
                  }
                  print(json.dumps(evidence, indent=2, sort_keys=True))
                  with open('/tmp/bprd-live-ui-db.json', 'w') as handle:
                      json.dump(evidence, handle, indent=2, sort_keys=True)

          asyncio.run(main())
          PY

      - name: Upload UI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bprd-live-ui-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            bprd-live-ui-before.png
            bprd-live-ui-committed.png
            bprd-live-ui-reloaded.png
            bprd-live-ui-browser.json
            /tmp/bprd-live-ui-seed.json
            /tmp/bprd-live-ui-db.json
