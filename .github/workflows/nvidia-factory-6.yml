name: NVIDIA Factory Fleet 6-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nvidia-factory-6.yml'
      - '.github/scripts/nvidia-factory-worker.sh'
      - '.github/workflows/nvidia-factory-owner-reconcile.yml'
      - '.github/workflows/factory-heartbeat-watchdog.yml'
  schedule:
    - cron: "7 * * * *"
    - cron: "19 * * * *"
    - cron: "31 * * * *"
    - cron: "43 * * * *"
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      worker:
        description: NVIDIA factory worker to run
        required: true
        default: "6"
        type: choice
        options: ["6", "7", "8", "9", "10"]

concurrency:
  group: nvidia-factory-${{ github.event.schedule || inputs.worker || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create and verify all durable fleet owner labels
        shell: bash
        run: |
          set -Eeuo pipefail
          for worker in 6 7 8 9 10; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A${worker}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f name="factory:${worker}" \
                -f color='5319e7' \
                -f description="Owned by OpenCode NVIDIA Factory ${worker}" >/dev/null
              echo "Created factory:${worker}"
            fi
            gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A${worker}" --jq '.name'
          done
          echo 'NVIDIA fleet ownership labels 6-10 are visible.'

  factory:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      FACTORY_BUDGET_SECONDS: "3000"
    steps:
      - name: Resolve durable worker
        id: worker
        shell: bash
        env:
          DISPATCH_WORKER: ${{ inputs.worker }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${DISPATCH_WORKER:-}" ]]; then
            worker="$DISPATCH_WORKER"
          else
            case "$SCHEDULE" in
              "7 * * * *") worker=6 ;;
              "19 * * * *") worker=7 ;;
              "31 * * * *") worker=8 ;;
              "43 * * * *") worker=9 ;;
              "55 * * * *") worker=10 ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "Factory $worker selected"

      - name: Bootstrap fleet owner labels
        shell: bash
        run: |
          set -Eeuo pipefail
          for worker in 6 7 8 9 10; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A${worker}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f name="factory:${worker}" \
                -f color='5319e7' \
                -f description="Owned by OpenCode NVIDIA Factory ${worker}" >/dev/null
              echo "Created factory:${worker}"
            fi
          done

      - name: Report running heartbeat
        env:
          WORKER: ${{ steps.worker.outputs.worker }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="<!-- factory-heartbeat:v1 worker=opencode-nvidia-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\nWorker: opencode-nvidia-factory-%s\nSlot: %s\nOutcome: running\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "${SCHEDULE:-dispatch}" "$now" "$GITHUB_RUN_ID")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        env:
          WORKER: ${{ steps.worker.outputs.worker }}
        run: |
          git config user.name "opencode-nvidia-factory-${WORKER}[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Install pinned FCM discovery CLI
        run: npm install --global --ignore-scripts free-coding-models@0.5.69

      - name: Select a healthy NVIDIA model with fleet rotation
        id: model
        shell: bash
        env:
          WORKER: ${{ steps.worker.outputs.worker }}
        run: |
          set -Eeuo pipefail
          fcm_output="$(free-coding-models --json --origin nvidia --hide-unconfigured --best --no-telemetry)"
          mapfile -t candidates < <(printf '%s\n' "$fcm_output" | python scripts/select_fcm_nvidia_model.py | sed '/^$/d')
          if (( ${#candidates[@]} == 0 )); then
            echo "No NVIDIA candidates returned by FCM" >&2
            exit 1
          fi
          start=$(( (WORKER - 6) % ${#candidates[@]} ))
          selected_model=""
          for ((offset=0; offset<${#candidates[@]}; offset++)); do
            idx=$(( (start + offset) % ${#candidates[@]} ))
            candidate="${candidates[$idx]}"
            echo "Factory ${WORKER} probing ${candidate}"
            provider_model="${candidate#nvidia/}"
            request="$(jq -nc --arg model "$provider_model" '{model:$model,messages:[{role:"user",content:"Reply with exactly: FCM_NVIDIA_MODEL_OK"}],max_tokens:32}')"
            response="$(curl --silent --show-error --fail-with-body --header "Authorization: Bearer $NVIDIA_API_KEY" --header 'Content-Type: application/json' --data "$request" https://integrate.api.nvidia.com/v1/chat/completions || true)"
            if jq -e '.choices[0].message.content | strings | contains("FCM_NVIDIA_MODEL_OK")' >/dev/null 2>&1 <<< "$response"; then
              selected_model="$candidate"
              break
            fi
          done
          if [[ -z "$selected_model" ]]; then
            echo "No compatible NVIDIA model is currently healthy" >&2
            exit 1
          fi
          echo "Selected $selected_model for Factory $WORKER"
          echo "model=$selected_model" >> "$GITHUB_OUTPUT"

      - name: Run continuous NVIDIA factory work session
        env:
          WORKER: ${{ steps.worker.outputs.worker }}
          MODEL: ${{ steps.model.outputs.model }}
        run: bash .github/scripts/nvidia-factory-worker.sh "$WORKER" "$MODEL"

      - name: Report terminal heartbeat
        if: always()
        env:
          WORKER: ${{ steps.worker.outputs.worker }}
          SCHEDULE: ${{ github.event.schedule }}
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          marker="<!-- factory-heartbeat:v1 worker=opencode-nvidia-factory-${WORKER} -->"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\nWorker: opencode-nvidia-factory-%s\nSlot: %s\nOutcome: %s\nUpdated: %s\nRun: %s' \
            "$marker" "$WORKER" "${SCHEDULE:-dispatch}" "$OUTCOME" "$now" "$GITHUB_RUN_ID")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi
