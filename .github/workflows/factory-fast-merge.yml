name: Factory-only Fast Merge

# Privileged automation runs only trusted main. Merge only after the unprivileged
# CI workflow reports successful Ruff and ty checks for the exact PR head.
# An owner-authorized token must have a ruleset bypass for protected main.
# The policy switch lives in .github/factory-fast-merge.json.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Optional PR number, otherwise scan open PRs'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  issues: write

concurrency:
  group: factory-only-fast-merge
  cancel-in-progress: false

jobs:
  fast-merge:
    # On PR wakeup, skip if Python CI has not passed. The CI workflow itself
    # sends one targeted workflow_dispatch once both checks pass.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Merge only factory PRs with exact-head green Python checks
        id: merge
        shell: bash
        env:
          # Repo ruleset MUST authorize this credential for PR-only bypass.
          # The script applies the strict factory-only allowlist and leases.
          GH_TOKEN: ${{ secrets.PR_REBASE_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr || '' }}
        run: |
          set -Eeuo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr "$PR_NUMBER")
          fi
          python3 .github/scripts/factory-fast-merge.py "${args[@]}" > "$RUNNER_TEMP/fast-merge-result.json"
          cat "$RUNNER_TEMP/fast-merge-result.json"
          count="$(jq -r '.merged | length' "$RUNNER_TEMP/fast-merge-result.json")"
          echo "merged_count=$count" >> "$GITHUB_OUTPUT"

      - name: Reconcile merged issues and dispatch production
        if: steps.merge.outputs.merged_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_post_merge_closure.py --sweep || {
            echo "::warning::Post-merge sweep failed; existing drain can retry"
          }
          # The trusted Python merge path already dispatched production in finally.
