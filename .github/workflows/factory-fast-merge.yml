name: Factory-only Fast Merge

# Trusted main only, never PR heads. Factory-only PRs are attempted immediately
# after open/synchronize/label, without CI or semantic review dependencies.
# An owner-authorized token must have a ruleset bypass for protected main.
# The policy switch lives in .github/factory-fast-merge.json.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Optional PR number, otherwise scan open PRs'
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  issues: write

concurrency:
  group: factory-only-fast-merge
  cancel-in-progress: false

jobs:
  fast-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Immediately merge eligible factory-only PRs
        id: merge
        shell: bash
        env:
          # Owner PAT is required to bypass main's CI Summary rule for ONLY
          # the script's strict factory-only allowlist; token does not bypass
          # the allowlist or other software-enforced eligibility checks.
          GH_TOKEN: ${{ secrets.PR_REBASE_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr || '' }}
        run: |
          set -Eeuo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr "$PR_NUMBER")
          fi
          python3 .github/scripts/factory-fast-merge.py "${args[@]}" > "$RUNNER_TEMP/fast-merge-result.json"
          cat "$RUNNER_TEMP/fast-merge-result.json"
          count="$(jq -r '.merged | length' "$RUNNER_TEMP/fast-merge-result.json")"
          echo "merged_count=$count" >> "$GITHUB_OUTPUT"

      - name: Reconcile merged issues and dispatch production
        if: steps.merge.outputs.merged_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_post_merge_closure.py --sweep || {
            echo "::warning::Post-merge sweep failed; existing drain can retry"
          }
          # The trusted Python merge path already dispatched production in finally.
