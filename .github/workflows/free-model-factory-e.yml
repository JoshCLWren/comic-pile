name: Fixed Model Factory Scheduler E

on:
  schedule:
    - cron: '4 * * * *'
    - cron: '9 * * * *'
    - cron: '14 * * * *'
    - cron: '19 * * * *'
    - cron: '24 * * * *'
    - cron: '29 * * * *'
    - cron: '34 * * * *'
    - cron: '39 * * * *'
    - cron: '44 * * * *'
    - cron: '49 * * * *'
  workflow_dispatch:
    inputs:
      worker:
        description: Factory worker from scheduler E
        required: true
        type: choice
        options: ['10','15','20','25','30','35','40','45','50','55']

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.resolve.outputs.worker }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: resolve
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${DISPATCH_WORKER:-}" ]]; then
            worker="$DISPATCH_WORKER"
          else
            minute="${SCHEDULE%% *}"
            worker="$(awk -F '\t' -v minute="$minute" '$4 == minute && $5 == "E" {print $1; exit}' .github/free-model-factories.tsv)"
          fi
          [[ -n "$worker" ]] || { echo "No scheduler E lane resolved" >&2; exit 1; }
          awk -F '\t' -v worker="$worker" '$1 == worker && $5 == "E" {found=1} END {exit !found}' .github/free-model-factories.tsv
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "Scheduler E selected Factory $worker"

  run:
    needs: resolve
    uses: ./.github/workflows/free-model-factory-run.yml
    with:
      worker: ${{ needs.resolve.outputs.worker }}
    secrets: inherit
