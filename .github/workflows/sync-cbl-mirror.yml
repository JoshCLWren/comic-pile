name: Sync CBL Mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Re-import even when the fork revision is already synchronized
        required: false
        default: false
        type: boolean

concurrency:
  group: cbl-mirror-reconciliation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CBL_SYNC_API_URL: https://comic-pile.vercel.app/api/v1/cbl-sync
      RELEASE_WRITER_TOKEN: ${{ secrets.RELEASE_WRITER_TOKEN }}
    steps:
      - name: Check out ComicPile
        uses: actions/checkout@v7
        with:
          path: comic-pile
          persist-credentials: false

      - name: Check out CBL fork
        uses: actions/checkout@v7
        with:
          repository: JoshCLWren/CBL-ReadingLists
          ref: main
          path: cbl-mirror
          persist-credentials: false

      - name: Validate trusted automation credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$RELEASE_WRITER_TOKEN" ]]; then
            echo '::error::RELEASE_WRITER_TOKEN is not configured in GitHub Actions secrets.'
            exit 1
          fi

      - name: Reconcile mirror revision
        shell: bash
        working-directory: comic-pile
        run: |
          set -Eeuo pipefail
          revision="$(git -C ../cbl-mirror rev-parse HEAD)"
          force_arg=()
          if [[ "${{ inputs.force || false }}" == "true" ]]; then
            force_arg=(--force)
          fi
          python scripts/push_cbl_mirror.py \
            ../cbl-mirror \
            --repository JoshCLWren/CBL-ReadingLists \
            --revision-sha "$revision" \
            "${force_arg[@]}"
