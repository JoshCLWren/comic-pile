name: Factory Owner Reconcile

on:
  workflow_run:
    workflows: [opencode]
    types: [completed]

permissions:
  pull-requests: read
  issues: write

jobs:
  reconcile:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Restore durable owner from branch identity or adoption marker
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
          [[ -n "$pr" ]] || exit 0
          branch="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .head.ref)"
          worker=''

          # Durable scheduled workers use one- or two-digit IDs. Do not mistake
          # ordinary factory/<issue>-... branches such as factory/924-* for workers.
          if [[ "$branch" =~ ^factory/([1-9][0-9]?)- ]]; then
            worker="${BASH_REMATCH[1]}"
          else
            worker="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" --jq '.[].body' \
              | grep -Eo '<!-- (free-model-factory-owner|nvidia-factory-owner|omniroute-factory-owner):([1-9][0-9]?) -->' \
              | sed -E 's/^.*:([0-9]+) -->$/\1/' \
              | tail -1 || true)"
          fi
          [[ "$worker" =~ ^[1-9][0-9]?$ ]] || exit 0

          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels?per_page=100" --jq '[.[].name]')"
          stage="$(jq -r '[.[] | select(test("^factory:(building|review|changes-requested|ci|ready|blocked)$"))] | first // "factory:review"' <<< "$labels")"
          target="$(jq -c --arg owner "factory:${worker}" --arg stage "$stage" '
            map(select(
              (test("^factory:(building|review|changes-requested|ci|ready|blocked)$") | not) and
              (test("^factory:(unowned|local|[1-9][0-9]?)$") | not) and
              . != "factory"
            )) + ["factory", $owner, $stage] | unique' <<< "$labels")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" \
            --input - <<< "{\"labels\":${target}}" >/dev/null
          echo "Restored factory:${worker} on PR #${pr} with ${stage}"
