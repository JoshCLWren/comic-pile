name: Factory heartbeat watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: factory-heartbeat-watchdog
  cancel-in-progress: true

jobs:
  inspect-heartbeats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory roster
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Inspect factory heartbeat registry
        uses: actions/github-script@v7
        env:
          REGISTRY_ISSUE: '1093'
          STALE_MINUTES: '135'
          RUNNING_MINUTES: '90'
          EXTERNAL_STALE_MINUTES: '150'
          EXTERNAL_RUNNING_MINUTES: '125'
        with:
          script: |
            const fs = require('fs');
            const registryIssue = Number(process.env.REGISTRY_ISSUE);
            const staleMinutes = Number(process.env.STALE_MINUTES);
            const runningMinutes = Number(process.env.RUNNING_MINUTES);
            const externalStaleMinutes = Number(process.env.EXTERNAL_STALE_MINUTES);
            const externalRunningMinutes = Number(process.env.EXTERNAL_RUNNING_MINUTES);

            const expectedWorkers = new Map([
              ['chatgpt-factory-1', { name: 'Nova', slot: ':40', source: 'ChatGPT' }],
              ['chatgpt-factory-2', { name: 'Booster Gold', slot: ':52', source: 'ChatGPT' }],
              ['chatgpt-factory-3', { name: 'Starman', slot: ':04', source: 'ChatGPT' }],
              ['chatgpt-factory-4', { name: 'Mister Miracle', slot: ':16', source: 'ChatGPT' }],
              ['chatgpt-factory-5', { name: "Death's Head", slot: ':28', source: 'ChatGPT' }],
            ]);

            const manifest = fs.readFileSync('.github/free-model-factories.tsv', 'utf8');
            for (const rawLine of manifest.split(/\r?\n/)) {
              if (!rawLine || rawLine.startsWith('#')) continue;
              const [worker, source, model, minute, scheduler, display] = rawLine.split('\t');
              if (!worker || !display) continue;
              expectedWorkers.set(`opencode-free-model-factory-${worker}`, {
                name: display,
                slot: `:${String(minute).padStart(2, '0')}`,
                source,
                model,
                scheduler,
                staleMinutes: externalStaleMinutes,
                runningMinutes: externalRunningMinutes,
              });
            }

            const marker = '<!-- factory-heartbeat-alert:v1 -->';
            const now = new Date();
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: registryIssue,
              per_page: 100,
            });

            const rows = [];
            const stale = [];
            for (const [worker, metadata] of expectedWorkers) {
              const heartbeatMarker = `<!-- factory-heartbeat:v1 worker=${worker} -->`;
              const matches = comments.filter((comment) => comment.body?.includes(heartbeatMarker));
              const comment = matches.sort(
                (left, right) => new Date(right.updated_at) - new Date(left.updated_at),
              )[0];

              if (!comment) {
                rows.push(`| ${worker} | ${metadata.name} | ${metadata.source} | ${metadata.slot} | missing | 🔴 missing |`);
                stale.push(`${worker} has no heartbeat comment`);
                continue;
              }

              const ageMinutes = Math.floor((now - new Date(comment.updated_at)) / 60000);
              const running = /^Outcome:\s*running\s*$/im.test(comment.body ?? '');
              const unconfigured = /^Outcome:\s*unconfigured\s*$/im.test(comment.body ?? '');
              const workerStaleMinutes = metadata.staleMinutes ?? staleMinutes;
              const workerRunningMinutes = metadata.runningMinutes ?? runningMinutes;
              const unhealthy = ageMinutes > workerStaleMinutes || (running && ageMinutes > workerRunningMinutes);
              const status = unhealthy
                ? running ? '🔴 stuck running' : '🔴 stale'
                : unconfigured ? '⚪ installed / unconfigured'
                : running ? '🟡 running'
                : '🟢 healthy';
              rows.push(`| ${worker} | ${metadata.name} | ${metadata.source} | ${metadata.slot} | ${ageMinutes}m | ${status} |`);
              if (unhealthy) {
                stale.push(
                  running
                    ? `${worker} has reported running for ${ageMinutes} minutes`
                    : `${worker} has not reported for ${ageMinutes} minutes`,
                );
              }
            }

            const workerCount = expectedWorkers.size;
            const report = [
              marker,
              '# Factory heartbeat alert',
              '',
              stale.length
                ? 'The external watchdog detected missing or stuck factory heartbeats.'
                : `All ${workerCount} scheduled factories are reporting normally.`,
              '',
              '| Worker | Model / call sign | Source | Slot minute | Age | Status |',
              '|---|---|---|---:|---:|---|',
              ...rows,
              '',
              `Registry: #${registryIssue}`,
              `Roster: .github/free-model-factories.tsv plus ChatGPT factories 1-5`,
              `Checked: ${now.toISOString()}`,
              '',
              stale.length
                ? 'Check ChatGPT Scheduled for factories 1-5 and GitHub Actions fixed-model schedulers for factories 6-47. Do not assign this alert to a factory.'
                : 'This alert closes automatically after every worker recovers.',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const alert = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );

            if (stale.length) {
              if (alert) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  body: report,
                  state: 'open',
                  assignees: [context.repo.owner],
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'Factory heartbeat alert',
                  body: report,
                  assignees: [context.repo.owner],
                });
              }
              await core.summary.addHeading('Factory heartbeat warning').addList(stale).write();
            } else if (alert?.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                body: report,
                state: 'closed',
                state_reason: 'completed',
              });
              await core.summary
                .addHeading('Factory heartbeat recovery')
                .addRaw(`All ${workerCount} factories are reporting normally.`)
                .write();
            } else {
              await core.summary
                .addHeading('Factory heartbeats healthy')
                .addRaw(`All ${workerCount} factories are reporting normally.`)
                .write();
            }
