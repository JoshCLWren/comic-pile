name: Factory Fork Execution
run-name: Factory ${{ inputs.worker }} · fork repair · PR ${{ inputs.pr }} · ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      head:
        required: true
        type: string
      worker:
        required: true
        type: string
      nonce:
        required: true
        type: string

# This job deliberately receives no repository/provider secrets or inherited
# secret bundle. Contributor code, dependencies, tests, and hooks run only here.
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: factory-fork-execution-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_PR: ${{ inputs.pr }}
      EXPECTED_HEAD: ${{ inputs.head }}
      FACTORY_WORKER: ${{ inputs.worker }}
      FORK_RECEIPT_NONCE: ${{ inputs.nonce }}
      CI: true
      SECRET_KEY: test-secret-key-for-testing-only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/comic_pile_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/comic_pile_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comic_pile_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.28'
      - name: Install factory syntax parsers
        uses: ./.github/actions/factory-syntax

      - name: Stage trusted execution helpers before source checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          trusted="$RUNNER_TEMP/fork-trusted"
          mkdir -p "$trusted"
          cp .github/scripts/factory_fork_control.py .github/scripts/factory_roster.py \
            .github/scripts/kilo-auto-factory-run.sh .github/scripts/factory-fast-checks.sh \
            .github/scripts/factory-fork-execute.sh "$trusted/"
          cp .github/free-model-factories.tsv scripts/install-git-hooks.sh "$trusted/"
          echo "TRUSTED_FORK_DIRECTORY=$trusted" >> "$GITHUB_ENV"
      - name: Install pinned anonymous Kilo runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/kilo.tar.gz"
          curl -fsSL https://github.com/Kilo-Org/kilocode/releases/download/v7.4.22/kilo-linux-x64-baseline.tar.gz -o "$archive"
          printf '%s  %s\n' bf817ad53bc95b16abe92e7a2389cc9f509c62c3510c23ecc58e151a4455cb41 "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/kilo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/kilo-bin"
          binary="$(find "$RUNNER_TEMP/kilo-bin" -type f -name kilo -perm -111 | head -n 1)"
          test -n "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          npm install -g pnpm@10.15.0
      - name: Run isolated contributor repair
        shell: bash
        run: bash "$TRUSTED_FORK_DIRECTORY/factory-fork-execute.sh"
      - name: Upload untrusted repair result as data
        uses: actions/upload-artifact@v7
        with:
          name: fork-repair-result-${{ inputs.nonce }}
          path: ${{ runner.temp }}/fork-results/
          if-no-files-found: error
          retention-days: 7
