name: Native Rust Roll

on:
  pull_request:
    paths:
      - 'native/roll-service/**'
      - 'native/migrate/**'
      - 'alembic/**'
      - 'scripts/check_rust_migration_parity.py'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.sh'
      - 'check-rust-workspace-lock.mjs'
      - 'rust-toolchain.toml'
      - 'api/native_roll.rs'
      - '.vercelignore'
      # Python is the behavioral oracle; include its transitive application inputs.
      - 'app/**'
      - 'comic_pile/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'tests/test_native_roll_workflow.py'
      - '.github/workflows/rust-roll.yml'
      - 'scripts/export_roll_test_schema.py'
      - 'tests/fixtures/roll-v2/auth-matrix.json'
  push:
    branches: [main]
    paths:
      - 'native/roll-service/**'
      - 'native/migrate/**'
      - 'alembic/**'
      - 'scripts/check_rust_migration_parity.py'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.sh'
      - 'check-rust-workspace-lock.mjs'
      - 'rust-toolchain.toml'
      - 'api/native_roll.rs'
      - '.vercelignore'
      # Python is the behavioral oracle; include its transitive application inputs.
      - 'app/**'
      - 'comic_pile/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'tests/test_native_roll_workflow.py'
      - '.github/workflows/rust-roll.yml'
      - 'scripts/export_roll_test_schema.py'
      - 'tests/fixtures/roll-v2/auth-matrix.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-roll:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-local-test
          POSTGRES_DB: native_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: native-roll-test-secret
      DATABASE_URL: postgresql+asyncpg://postgres:native-local-test@127.0.0.1:5432/native_auth_test
      RUST_ROLL_TEST_DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/native_auth_test
      RUST_ROLL_PARITY_DATABASE_URL: postgresql://roll_test_dml:roll-test-dml@127.0.0.1:5432/native_auth_test
      # comicpile-migrate is now a workspace member, so the workspace-wide test
      # step runs its database tests too; they create their own scratch databases.
      MIGRATE_TEST_DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/postgres
      # The workspace target directory is the repository root by default; keep
      # the release artifact at the path the parity runner and upload expect.
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/roll-service/target
    defaults:
      run:
        working-directory: native/roll-service
    steps:
      - uses: actions/checkout@v7
      - name: Reject any database-test skip setting
        run: |
          if [[ -n "${RUST_ROLL_ALLOW_DB_SKIP+x}" ]]; then
            echo "::error::RUST_ROLL_ALLOW_DB_SKIP is forbidden in CI and factory tests."
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native/roll-service -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify unified Cargo workspace lockfile
        # Same guard the production @vercel/rust build.sh runs: fail on a
        # second lockfile, divergent resolution or lock mutation, then export
        # the canonical digest so build.rs asserts it on every cargo step.
        working-directory: .
        run: |
          set -euo pipefail
          node check-rust-workspace-lock.mjs
          lock_sha256="$(node check-rust-workspace-lock.mjs --lock-sha256)"
          printf 'COMICPILE_EXPECTED_LOCK_SHA256=%s\n' "$lock_sha256" >> "$GITHUB_ENV"
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install Python oracle dependencies
        working-directory: .
        run: uv sync --frozen --all-extras
      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Rust migration runner (format, lint, tests)
        working-directory: native/migrate
        env:
          MIGRATE_TEST_DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Apply the Rust baseline migration to the test database
        working-directory: native/migrate
        env:
          MIGRATE_DATABASE_URL: ${{ env.RUST_ROLL_TEST_DATABASE_URL }}
        run: cargo run --locked -- up
      - name: Build the Alembic oracle database
        working-directory: .
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:native-local-test@127.0.0.1:5432/alembic_oracle
        run: |
          PGPASSWORD=native-local-test psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE alembic_oracle'
          uv run alembic upgrade head
      - name: Verify Rust migrations equal the Alembic head schema
        working-directory: .
        run: |
          uv run python scripts/check_rust_migration_parity.py \
            --alembic-url postgresql://postgres:native-local-test@127.0.0.1:5432/alembic_oracle \
            --rust-url "$RUST_ROLL_TEST_DATABASE_URL"
      - name: Verify native Roll test schema fixture
        working-directory: .
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:native-local-test@127.0.0.1:5432/alembic_oracle
        run: uv run python scripts/export_roll_test_schema.py --check
      - name: Unit and integration tests
        run: cargo test --workspace --locked --all-targets
      - name: Assert missing database URL fails, not skips
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          if env -u RUST_ROLL_TEST_DATABASE_URL cargo test --locked -p comicpile-roll-service --lib \
              test_support::tests::the_test_role_cannot_create_persistent_schema >"$output" 2>&1; then
            echo "::error::Database-backed Rust test passed without its required database URL."
            cat "$output"
            exit 1
          fi
          if ! grep -q 'RUST_ROLL_TEST_DATABASE_URL is required' "$output"; then
            echo "::error::Database-backed test failed for the wrong reason."
            cat "$output"
            exit 1
          fi
      - name: Build scalar parity runner
        run: cargo build --locked -p comicpile-roll-service --examples
      - name: Python versus Rust scalar parity
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          PYTHONPATH: .
        run: uv run pytest native/roll-service/parity/ -q -s --no-cov
      - name: Release binary
        run: cargo build --release --locked -p comicpile-roll-service
      - name: Vercel native Roll release build without excluded test fixtures
        working-directory: .
        run: |
          set -euo pipefail
          # Vercel uploads the release sources but excludes tests/ and *.sql.
          # Compile in a fresh, runtime-only source tree so a test-only
          # include_str! dependency cannot pass full-checkout CI again.
          bundle="$(mktemp -d)"
          trap 'rm -rf "$bundle"' EXIT
          mkdir -p "$bundle/api" "$bundle/native/roll-service" "$bundle/native/migrate"
          cp Cargo.toml Cargo.lock build.rs "$bundle/"
          cp api/native_roll.rs api/native_issue.rs "$bundle/api/"
          cp native/roll-service/Cargo.toml "$bundle/native/roll-service/"
          cp -R native/roll-service/src "$bundle/native/roll-service/src"
          test ! -e "$bundle/native/roll-service/tests"
          # Cargo loads every declared workspace member's manifest (and needs
          # its target sources) before building native_roll, so the migration
          # crate must be present even though its binary is not built here.
          # The real Vercel bundle also contains it; .vercelignore only drops
          # tests/ and *.sql, which is why neither is copied above.
          cp native/migrate/Cargo.toml "$bundle/native/migrate/"
          cp -R native/migrate/src "$bundle/native/migrate/src"
          test ! -e "$bundle/native/migrate/tests"
          test ! -e "$bundle/native/migrate/migrations"
          (
            cd "$bundle"
            COMICPILE_BUILD_SHA="$GITHUB_SHA" \
            COMICPILE_EXPECTED_LOCK_SHA256="$COMICPILE_EXPECTED_LOCK_SHA256" \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/native/roll-service/target" \
              cargo build --release --locked --bin native_roll
          )
      - uses: actions/upload-artifact@v7
        with:
          name: comicpile-roll-service-linux-x86_64
          path: native/roll-service/target/release/comicpile-roll-service
          if-no-files-found: error
