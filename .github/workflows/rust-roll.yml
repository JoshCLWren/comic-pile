name: Native Rust Roll

on:
  pull_request:
    paths:
      - 'native/roll-service/**'
      - '.github/workflows/rust-roll.yml'
      - 'tests/fixtures/roll-v2/auth-matrix.json'
  push:
    branches: [main]
    paths:
      - 'native/roll-service/**'
      - '.github/workflows/rust-roll.yml'
      - 'tests/fixtures/roll-v2/auth-matrix.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-roll:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-local-test
          POSTGRES_DB: native_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_ROLL_TEST_DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/native_auth_test
    defaults:
      run:
        working-directory: native/roll-service
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --all-targets
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install Python oracle dependencies
        working-directory: .
        run: uv sync --frozen --all-extras
      - name: Build scalar parity runner
        run: cargo build --locked --example reading_snapshot
      - name: Python versus Rust scalar parity
        working-directory: .
        env:
          PYTHONPATH: .
        run: uv run pytest native/roll-service/parity/test_core_inputs.py -q -s --no-cov
      - name: Release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: comicpile-roll-service-linux-x86_64
          path: native/roll-service/target/release/comicpile-roll-service
          if-no-files-found: error
