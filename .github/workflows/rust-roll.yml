name: Native Rust Roll

on:
  pull_request:
    paths:
      - 'native/roll-service/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'api/native_roll.rs'
      - '.vercelignore'
      # Python is the behavioral oracle; include its transitive application inputs.
      - 'app/**'
      - 'comic_pile/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'tests/test_native_roll_workflow.py'
      - '.github/workflows/rust-roll.yml'
      - 'scripts/export_roll_test_schema.py'
      - 'tests/fixtures/roll-v2/auth-matrix.json'
  push:
    branches: [main]
    paths:
      - 'native/roll-service/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'api/native_roll.rs'
      - '.vercelignore'
      # Python is the behavioral oracle; include its transitive application inputs.
      - 'app/**'
      - 'comic_pile/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'tests/test_native_roll_workflow.py'
      - '.github/workflows/rust-roll.yml'
      - 'scripts/export_roll_test_schema.py'
      - 'tests/fixtures/roll-v2/auth-matrix.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-roll:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-local-test
          POSTGRES_DB: native_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: native-roll-test-secret
      DATABASE_URL: postgresql+asyncpg://postgres:native-local-test@127.0.0.1:5432/native_auth_test
      RUST_ROLL_TEST_DATABASE_URL: postgresql://postgres:native-local-test@127.0.0.1:5432/native_auth_test
      RUST_ROLL_PARITY_DATABASE_URL: postgresql://roll_test_dml:roll-test-dml@127.0.0.1:5432/native_auth_test
    defaults:
      run:
        working-directory: native/roll-service
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install Python oracle dependencies
        working-directory: .
        run: uv sync --frozen --all-extras
      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply Alembic schema to the test database
        working-directory: .
        run: uv run alembic upgrade head
      - name: Verify native Roll test schema fixture
        working-directory: .
        run: uv run python scripts/export_roll_test_schema.py --check
      - name: Unit and integration tests
        run: cargo test --locked --all-targets
      - name: Build scalar parity runner
        run: cargo build --locked --examples
      - name: Python versus Rust scalar parity
        working-directory: .
        env:
          PYTHONPATH: .
        run: uv run pytest native/roll-service/parity/ -q -s --no-cov
      - name: Release binary
        run: cargo build --release --locked
      - name: Vercel native Roll release build without excluded test fixtures
        working-directory: .
        run: |
          set -euo pipefail
          # Vercel uploads the release sources but excludes tests/ and *.sql.
          # Compile in a fresh, runtime-only source tree so a test-only
          # include_str! dependency cannot pass full-checkout CI again.
          bundle="$(mktemp -d)"
          trap 'rm -rf "$bundle"' EXIT
          mkdir -p "$bundle/api" "$bundle/native/roll-service"
          cp Cargo.toml Cargo.lock "$bundle/"
          cp api/native_roll.rs api/native_issue.rs "$bundle/api/"
          cp native/roll-service/Cargo.toml "$bundle/native/roll-service/"
          cp -R native/roll-service/src "$bundle/native/roll-service/src"
          test ! -e "$bundle/native/roll-service/tests"
          (
            cd "$bundle"
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/native/roll-service/target" \
              cargo build --release --locked --bin native_roll
          )
      - uses: actions/upload-artifact@v7
        with:
          name: comicpile-roll-service-linux-x86_64
          path: native/roll-service/target/release/comicpile-roll-service
          if-no-files-found: error
