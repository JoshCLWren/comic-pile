name: Refine CBL materialization

on:
  push:
    branches:
      - manual/2366-cbl-materialization-state

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: manual/2366-cbl-materialization-state
          fetch-depth: 1
      - name: Reuse canonical issue-tracking derivation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/cbl_plan_adoption.py')
          text = path.read_text()
          import_line = 'from app.services.cbl_reconciliation import reconcile_cbl_source_list\n'
          assert import_line in text
          text = text.replace(
              import_line,
              import_line + 'from app.services.issue_tracking import apply_thread_issue_tracking_state\n',
              1,
          )

          start = text.index('    issues = [*existing_issues, issue]\n')
          end_marker = '    thread.status = "active"\n'
          end = text.index(end_marker, start) + len(end_marker)
          text = (
              text[:start]
              + '    apply_thread_issue_tracking_state(thread, [*existing_issues, issue])\n'
              + '    thread.status = "active"\n'
              + text[end:]
          )
          path.write_text(text)
          PY

          git rm .github/workflows/refine-cbl-materialization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/cbl_plan_adoption.py
          git commit -m 'Reuse canonical issue tracking during CBL materialization'
          git push origin HEAD:manual/2366-cbl-materialization-state
