name: Apply CBL materialization state fix

on:
  push:
    branches:
      - manual/2366-cbl-materialization-state

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: manual/2366-cbl-materialization-state
          fetch-depth: 1
      - name: Apply focused production and regression changes
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("app/services/cbl_plan_adoption.py")
          text = path.read_text()
          import_old = "from app.models.thread import Thread\nfrom app.schemas.continuity_plan import ContinuityPlanNode, PlanOrderingMode\n"
          assert import_old in text
          text = text.replace(
              import_old,
              "from app.models.thread import Thread\n"
              "from app.repositories import issue_repository, thread_repository\n"
              "from app.schemas.continuity_plan import ContinuityPlanNode, PlanOrderingMode\n",
              1,
          )

          start = text.index("async def _ensure_missing_issue_created(")
          end = text.index("\n\nasync def _find_or_create_series_thread", start)
          chunk = text[start:end]
          assert "    position: int,\n" in chunk
          chunk = chunk.replace("    position: int,\n", "", 1)
          chunk = chunk.replace(
              "        position: CBL source position used as the issue position in the series.\n",
              "",
              1,
          )
          assert "    issue = Issue(\n" in chunk
          chunk = chunk.replace(
              "    issue = Issue(\n",
              "    if thread.queue_position < 1:\n"
              "        thread.queue_position = await thread_repository.max_queue_position(db, user_id) + 1\n\n"
              "    existing_issues = await issue_repository.locked_issues(db, thread.id)\n"
              "    issue_position = max((item.position for item in existing_issues), default=0) + 1\n"
              "    issue = Issue(\n",
              1,
          )
          assert "        position=position,\n" in chunk
          chunk = chunk.replace("        position=position,\n", "        position=issue_position,\n", 1)
          flush_marker = "    db.add(issue)\n    await db.flush()\n\n    if comicvine_issue_id is not None:\n"
          assert flush_marker in chunk
          chunk = chunk.replace(
              flush_marker,
              "    db.add(issue)\n"
              "    await db.flush()\n\n"
              "    issues = [*existing_issues, issue]\n"
              "    unread_issues = [item for item in issues if item.status != \"read\"]\n"
              "    thread.total_issues = len(issues)\n"
              "    thread.issues_remaining = len(unread_issues)\n"
              "    thread.next_unread_issue_id = min(\n"
              "        unread_issues,\n"
              "        key=lambda item: (item.position, item.id),\n"
              "    ).id\n"
              "    thread.reading_progress = (\n"
              "        \"not_started\" if len(unread_issues) == len(issues) else \"in_progress\"\n"
              "    )\n"
              "    thread.status = \"active\"\n\n"
              "    if comicvine_issue_id is not None:\n",
              1,
          )
          text = text[:start] + chunk + text[end:]

          start = text.index("async def _find_or_create_series_thread(")
          end = text.index("\n\ndef _resolve_decision", start)
          chunk = text[start:end]
          assert chunk.count("queue_position=0,") == 2
          chunk = chunk.replace(
              "queue_position=0,",
              "queue_position=await thread_repository.max_queue_position(db, user_id) + 1,",
          )
          assert chunk.count('reading_progress="unstarted",') == 2
          chunk = chunk.replace('reading_progress="unstarted",', 'reading_progress="not_started",')
          text = text[:start] + chunk + text[end:]

          start = text.index("async def _merge_adopted_nodes(")
          end = text.index("\n\ndef _plan_ordering_mode", start)
          chunk = text[start:end]
          signature_tail = "    series_decisions: dict[str, SourceBackedDecision],\n) -> AdoptionMergeReport:\n"
          assert signature_tail in chunk
          chunk = chunk.replace(
              signature_tail,
              "    series_decisions: dict[str, SourceBackedDecision],\n"
              "    *,\n"
              "    new_node_lane_id: str = \"default\",\n"
              ") -> AdoptionMergeReport:\n",
              1,
          )
          assert "                position=entry.position,\n" in chunk
          chunk = chunk.replace("                position=entry.position,\n", "", 1)
          assert '            "lane_id": "default",\n' in chunk
          chunk = chunk.replace(
              '            "lane_id": "default",\n',
              '            "lane_id": new_node_lane_id,\n',
              1,
          )
          text = text[:start] + chunk + text[end:]
          path.write_text(text)

          path = Path("app/services/cbl_targeted_plan_adoption.py")
          text = path.read_text()
          start = text.index("def _place_new_nodes_on_existing_plan_lane(")
          end = text.index("\n\nasync def adopt_cbl_into_existing_reading_plan", start)
          selector = dedent('''\
          def _adoption_lane_id(plan: ContinuityPlan) -> str:
              """Choose the declared lane that new targeted-adoption nodes should join."""
              lanes = list(plan.lanes_json or [])
              lane_ids = [
                  str(lane["id"])
                  for lane in lanes
                  if isinstance(lane, dict) and lane.get("id") is not None
              ]
              if not lane_ids:
                  return "default"

              declared = set(lane_ids)
              existing_nodes = [
                  node
                  for node in plan.nodes_json or []
                  if str(node.get("lane_id")) in declared
              ]
              existing_nodes.sort(
                  key=lambda node: int(node.get("position", -1))
                  if isinstance(node.get("position"), int)
                  else -1
              )
              if existing_nodes:
                  return str(existing_nodes[-1]["lane_id"])

              ordered_lanes = sorted(
                  lanes,
                  key=lambda lane: int(lane.get("order", 0))
                  if isinstance(lane, dict) and isinstance(lane.get("order"), int)
                  else 0,
              )
              first_lane = ordered_lanes[0] if ordered_lanes else None
              if isinstance(first_lane, dict) and first_lane.get("id") is not None:
                  return str(first_lane["id"])
              return "default"
          ''').rstrip()
          text = text[:start] + selector + text[end:]
          old_ids = '    existing_node_ids = {str(node.get("id")) for node in plan.nodes_json or []}\n'
          assert old_ids in text
          text = text.replace(old_ids, "", 1)
          old_call = (
              "        series_overrides or {},\n"
              "        series_decisions,\n"
              "    )\n"
              "    _place_new_nodes_on_existing_plan_lane(\n"
              "        plan,\n"
              "        existing_node_ids=existing_node_ids,\n"
              "    )\n"
          )
          assert old_call in text
          text = text.replace(
              old_call,
              "        series_overrides or {},\n"
              "        series_decisions,\n"
              "        new_node_lane_id=_adoption_lane_id(plan),\n"
              "    )\n",
              1,
          )
          assert "_place_new_nodes_on_existing_plan_lane" not in text
          path.write_text(text)

          Path("tests/test_cbl_materialization_state.py").write_text(dedent('''\
          """Regression coverage for source-backed issue materialization state."""

          from datetime import UTC, datetime
          from types import SimpleNamespace
          from typing import cast

          import pytest
          from sqlalchemy import select
          from sqlalchemy.ext.asyncio import AsyncSession

          from app.models import Issue, Thread
          from app.models.continuity_plan import ContinuityPlan
          from app.services.cbl_plan_adoption import _ensure_missing_issue_created
          from app.services.cbl_targeted_plan_adoption import _adoption_lane_id
          from tests.conftest import get_or_create_user_async


          def _fact(series: str, number: str) -> dict[str, object]:
              return {
                  "series_name": series,
                  "issue_number": number,
                  "comicvine_issue_id": None,
                  "external_series_identity_id": None,
              }


          @pytest.mark.asyncio
          async def test_materialized_series_uses_thread_local_positions_and_rollable_state(
              async_db: AsyncSession,
          ) -> None:
              user = await get_or_create_user_async(async_db, "cbl-materialized-series")
              async_db.add(
                  Thread(
                      user_id=user.id,
                      title="Existing queue item",
                      format="comic",
                      queue_position=3,
                      status="active",
                      issues_remaining=1,
                      created_at=datetime.now(UTC),
                  )
              )
              await async_db.flush()

              first = await _ensure_missing_issue_created(
                  async_db,
                  user.id,
                  fact=_fact("B.P.R.D.: Garden of Souls", "1"),
                  volume_year=2007,
              )
              second = await _ensure_missing_issue_created(
                  async_db,
                  user.id,
                  fact=_fact("B.P.R.D.: Garden of Souls", "2"),
                  volume_year=2007,
              )

              thread = await async_db.scalar(
                  select(Thread).where(
                      Thread.user_id == user.id,
                      Thread.title == "CBL: B.P.R.D.: Garden of Souls (2007)",
                  )
              )
              assert thread is not None
              issues = list(
                  (
                      await async_db.execute(
                          select(Issue)
                          .where(Issue.thread_id == thread.id)
                          .order_by(Issue.position, Issue.id)
                      )
                  ).scalars().all()
              )
              assert [issue.id for issue in issues] == [first.id, second.id]
              assert [issue.position for issue in issues] == [1, 2]
              assert thread.queue_position == 4
              assert thread.total_issues == 2
              assert thread.issues_remaining == 2
              assert thread.next_unread_issue_id == first.id
              assert thread.reading_progress == "not_started"
              assert thread.status == "active"


          @pytest.mark.asyncio
          async def test_materialization_appends_to_existing_thread_and_recomputes_tracking(
              async_db: AsyncSession,
          ) -> None:
              user = await get_or_create_user_async(async_db, "cbl-existing-series")
              thread = Thread(
                  user_id=user.id,
                  title="CBL: B.P.R.D.: The Universal Machine (2006)",
                  format="comic",
                  queue_position=2,
                  status="completed",
                  total_issues=1,
                  issues_remaining=0,
                  reading_progress="completed",
                  created_at=datetime.now(UTC),
              )
              async_db.add(thread)
              await async_db.flush()
              async_db.add(
                  Issue(
                      thread_id=thread.id,
                      issue_number="1",
                      position=7,
                      status="read",
                      read_at=datetime.now(UTC),
                  )
              )
              await async_db.flush()

              created = await _ensure_missing_issue_created(
                  async_db,
                  user.id,
                  fact=_fact("B.P.R.D.: The Universal Machine", "2"),
                  volume_year=2006,
              )

              assert created.thread_id == thread.id
              assert created.position == 8
              assert thread.total_issues == 2
              assert thread.issues_remaining == 1
              assert thread.next_unread_issue_id == created.id
              assert thread.reading_progress == "in_progress"
              assert thread.status == "active"


          def test_targeted_adoption_selects_existing_tail_lane_without_repairing_nodes() -> None:
              plan = cast(
                  ContinuityPlan,
                  SimpleNamespace(
                      lanes_json=[
                          {"id": "secondary", "name": "Secondary", "order": 1},
                          {"id": "main", "name": "Main", "order": 0},
                      ],
                      nodes_json=[
                          {"id": "a", "lane_id": "main", "position": 0},
                          {"id": "b", "lane_id": "secondary", "position": 9},
                      ],
                  ),
              )

              assert _adoption_lane_id(plan) == "secondary"
          '''))
          PY

          git rm .github/workflows/apply-cbl-materialization-state-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/cbl_plan_adoption.py app/services/cbl_targeted_plan_adoption.py tests/test_cbl_materialization_state.py
          git commit -m 'Materialize CBL issues as rollable thread state'
          git push origin HEAD:manual/2366-cbl-materialization-state
