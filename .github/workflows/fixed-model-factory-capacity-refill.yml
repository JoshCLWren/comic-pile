name: Fixed Model Factory Capacity Refill

on:
  workflow_run:
    workflows: ['Fixed Model Factory Entry']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixed-model-factory-capacity-refill.yml'
      - '.github/scripts/factory_migration_lane.py'

permissions:
  actions: write
  contents: read
  issues: read

# Refill is an event router only. Assignment authority belongs exclusively to
# Fixed Model Factory Dispatcher, whose own concurrency group serializes lease
# decisions. Multiple refill signals may safely coalesce into dispatcher work.
concurrency:
  group: fixed-model-factory-capacity-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Reconcile serialized migration finalization lane
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_migration_lane.py reconcile

      - name: Request dispatcher capacity refill
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          manifest='.github/free-model-factories.tsv'

          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$COMPLETED_RUN_ID" =~ ^[0-9]+$ ]] || {
              echo 'Completed fixed-model run id is unavailable; refusing speculative refill'
              exit 0
            }
            attempt_body="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
                | jq -rs --arg run "$COMPLETED_RUN_ID" '
                    [
                      .[][]?
                      | select(.body | contains("<!-- factory-attempt-outcome:v1 worker=opencode-free-model-factory-"))
                      | select(.body | test("(?m)^Run: " + $run + "$"))
                      | .body
                    ]
                    | last // empty
                  '
            )"
            if [[ -z "$attempt_body" ]]; then
              echo "Run ${COMPLETED_RUN_ID} has no durable attempt outcome; refusing speculative refill"
              exit 0
            fi
            attempt_outcome="$(sed -n 's/^Attempt outcome: //p' <<< "$attempt_body" | tail -1)"
            worker="$(sed -n 's/^Worker: opencode-free-model-factory-//p' <<< "$attempt_body" | tail -1)"
            case "$attempt_outcome" in
              success|no_work|work_failure)
                echo "Run ${COMPLETED_RUN_ID} ended as ${attempt_outcome}; requesting immediate reuse for Factory ${worker}"
                ;;
              *)
                echo "Run ${COMPLETED_RUN_ID} ended as ${attempt_outcome:-unknown}; capacity is not proven healthy for immediate reuse"
                exit 0
                ;;
            esac
            awk -F '\t' -v worker="$worker" '$1 == worker {found=1} END {exit !found}' "$manifest" || {
              echo "Durable outcome named unknown worker ${worker}; refusing refill" >&2
              exit 1
            }
            gh workflow run fixed-model-factory-dispatch.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f mode=roster -f worker="$worker"
            exit 0
          fi

          # A control-plane deploy or explicit refill request wakes one broad
          # roster pass. Busy workers are filtered by the canonical controller.
          echo 'Requesting broad fixed-model capacity refill through dispatcher'
          gh workflow run fixed-model-factory-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f mode=roster
