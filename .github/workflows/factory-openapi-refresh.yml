name: Factory OpenAPI Refresh

on:
  push:
    branches:
      - factory/845-continuity-readiness

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh generated OpenAPI types'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Restore locked Python environment
        run: uv sync --frozen

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Regenerate deterministic OpenAPI artifacts
        env:
          PYTHONPATH: .
        run: uv run python scripts/generate_openapi_types.py

      - name: Commit generated artifacts
        shell: bash
        run: |
          artifacts=(
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
          )
          if git diff --quiet -- "${artifacts[@]}"; then
            exit 0
          fi
          git config user.name "comic-pile-factory"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${artifacts[@]}"
          git commit -m "chore: refresh generated OpenAPI types"
          git push origin "HEAD:${GITHUB_REF_NAME}"
