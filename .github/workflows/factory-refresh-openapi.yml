name: Factory Refresh OpenAPI

on:
  push:
    branches:
      - factory/839-crossover-issue-ranges

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/839-crossover-issue-ranges
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Refresh generated OpenAPI artifacts
        run: uv run python scripts/generate_openapi_types.py
      - name: Commit generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/generated/openapi.json frontend/src/generated/openapi.ts
          git diff --cached --quiet && exit 0
          git commit -m "Refresh generated OpenAPI artifacts"
          git push origin HEAD:factory/839-crossover-issue-ranges
