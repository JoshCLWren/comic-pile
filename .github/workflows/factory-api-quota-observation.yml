name: Factory API Quota Observation

on:
  workflow_dispatch:
  schedule:
    # One sample per hour, independent of factory worker heartbeat cadence.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: factory-api-quota-observation
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check out Rotisserie factory runtime  # rotisserie-factory-runtime
        uses: actions/checkout@v7
        with:
          repository: JoshCLWren/rotisserie
          ref: 8f917f8f73b6255207a7b7038280d843ba07bb7b
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime  # rotisserie-factory-runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .
      - name: Observe job installation quota
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/factory-quota-observer.py
      - name: Preserve private observation
        uses: actions/upload-artifact@v7
        with:
          name: factory-api-quota
          path: factory-quota-observation.json
          retention-days: 2
          if-no-files-found: error
