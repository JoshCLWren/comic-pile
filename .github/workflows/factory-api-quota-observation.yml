name: Factory API Quota Observation

on:
  workflow_dispatch:
  schedule:
    # One sample per hour, independent of factory worker heartbeat cadence.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: factory-api-quota-observation
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Observe job installation quota
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/factory-quota-observer.py
      - name: Preserve private observation
        uses: actions/upload-artifact@v4
        with:
          name: factory-api-quota-${{ github.run_id }}
          path: factory-quota-observation.json
          retention-days: 2
          if-no-files-found: error
