name: Fixed Model Factory Scheduler C

on:
  schedule:
    - cron: '2 * * * *'
    - cron: '7 * * * *'
    - cron: '12 * * * *'
    - cron: '17 * * * *'
    - cron: '22 * * * *'
    - cron: '27 * * * *'
    - cron: '32 * * * *'
    - cron: '37 * * * *'
    - cron: '42 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      worker:
        description: Factory worker from scheduler C
        required: true
        type: choice
        options: ['8','12','16','20','24','28','32','36','40','44']

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.resolve.outputs.worker }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: resolve
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${DISPATCH_WORKER:-}" ]]; then
            worker="$DISPATCH_WORKER"
          else
            minute="${SCHEDULE%% *}"
            worker="$(awk -F '\t' -v minute="$minute" '$4 == minute && $5 == "C" {print $1; exit}' .github/free-model-factories.tsv)"
          fi
          [[ -n "$worker" ]] || { echo "No scheduler C lane resolved" >&2; exit 1; }
          awk -F '\t' -v worker="$worker" '$1 == worker && $5 == "C" {found=1} END {exit !found}' .github/free-model-factories.tsv
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "Scheduler C selected Factory $worker"

  run:
    needs: resolve
    uses: ./.github/workflows/free-model-factory-run.yml
    with:
      worker: ${{ needs.resolve.outputs.worker }}
    secrets: inherit
