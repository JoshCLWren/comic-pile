name: OmniRoute Factory 16

on:
  pull_request:
    paths:
      - '.github/workflows/omniroute-factory-16.yml'
      - '.github/scripts/omniroute-factory-worker.sh'
      - '.github/scripts/nvidia-factory-worker.sh'
      - '.github/workflows/nvidia-factory-owner-reconcile.yml'
  schedule:
    - cron: '34 * * * *'
  workflow_dispatch:

concurrency:
  group: omniroute-factory-16-${{ github.event.pull_request.number || 'autonomous' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

env:
  FACTORY_WORKER: '16'
  FACTORY_CALL_SIGN: 'Multiple Man'
  OMNIROUTE_IMAGE: 'diegosouzapw/omniroute:3.8.49'
  OMNIROUTE_PROVIDER: 'pollinations'
  OMNIROUTE_MODEL: 'pol/qwen-coder'

jobs:
  gateway-and-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 116
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORY_BUDGET_SECONDS: '6000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'opencode-omniroute-factory-16[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install OpenCode
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Assert pinned non-NVIDIA factory configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$OMNIROUTE_PROVIDER" != 'nvidia' ]]
          [[ "$OMNIROUTE_MODEL" != nvidia/* ]]
          if grep -En '[N]VIDIA_API_KEY|[f]ree-coding-models|[s]elect_fcm_nvidia_model|--origin[[:space:]]+nvidia' \
            .github/workflows/omniroute-factory-16.yml \
            .github/scripts/omniroute-factory-worker.sh; then
            echo 'Factory 16 contains NVIDIA-specific configuration' >&2
            exit 1
          fi
          echo "Factory 16 pinned route: provider=${OMNIROUTE_PROVIDER} model=${OMNIROUTE_MODEL}"

      - name: Create ephemeral OmniRoute runtime secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_env="$RUNNER_TEMP/omniroute-runtime.env"
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          api_key_secret="$(openssl rand -hex 32)"
          initial_password="$(openssl rand -hex 24)"
          storage_key="$(openssl rand -hex 32)"
          ws_secret="$(openssl rand -base64 32 | tr -d '\n')"
          for secret in "$jwt_secret" "$api_key_secret" "$initial_password" "$storage_key" "$ws_secret"; do
            echo "::add-mask::$secret"
          done
          {
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'API_KEY_SECRET=%s\n' "$api_key_secret"
            printf 'INITIAL_PASSWORD=%s\n' "$initial_password"
            printf 'STORAGE_ENCRYPTION_KEY=%s\n' "$storage_key"
            printf 'STORAGE_ENCRYPTION_KEY_VERSION=v1\n'
            printf 'OMNIROUTE_WS_BRIDGE_SECRET=%s\n' "$ws_secret"
            printf 'DATA_DIR=/app/data\n'
            printf 'OMNIROUTE_NO_UPDATE_NOTIFIER=1\n'
            printf 'AUTH_COOKIE_SECURE=false\n'
          } > "$runtime_env"
          printf '%s' "$initial_password" > "$RUNNER_TEMP/omniroute-initial-password"
          chmod 600 "$runtime_env" "$RUNNER_TEMP/omniroute-initial-password"

      - name: Start official OmniRoute container
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Starting ${OMNIROUTE_IMAGE} for provider=${OMNIROUTE_PROVIDER} model=${OMNIROUTE_MODEL}"
          docker pull "$OMNIROUTE_IMAGE"
          docker volume create omniroute-factory-16-data >/dev/null
          docker run -d \
            --name omniroute-factory-16 \
            --stop-timeout 40 \
            -p 127.0.0.1:20128:20128 \
            --env-file "$RUNNER_TEMP/omniroute-runtime.env" \
            -v omniroute-factory-16-data:/app/data \
            "$OMNIROUTE_IMAGE" >/dev/null

      - name: Require real OmniRoute health
        shell: bash
        run: |
          set -Eeuo pipefail
          for _ in {1..120}; do
            code="$(curl --silent --output "$RUNNER_TEMP/omniroute-health.json" --write-out '%{http_code}' \
              --connect-timeout 1 --max-time 3 http://127.0.0.1:20128/api/monitoring/health || true)"
            if [[ "$code" == '200' ]]; then
              echo 'OmniRoute health endpoint returned HTTP 200'
              exit 0
            fi
            sleep 1
          done
          echo 'OmniRoute did not become healthy' >&2
          exit 1

      - name: Create ephemeral OmniRoute gateway key
        shell: bash
        run: |
          set -Eeuo pipefail
          initial_password="$(cat "$RUNNER_TEMP/omniroute-initial-password")"
          login_body="$(jq -nc --arg password "$initial_password" '{password:$password}')"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            --cookie-jar "$RUNNER_TEMP/omniroute-cookies" \
            --header 'Content-Type: application/json' \
            --data "$login_body" \
            http://127.0.0.1:20128/api/auth/login >/dev/null
          response="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            --cookie "$RUNNER_TEMP/omniroute-cookies" \
            --header 'Content-Type: application/json' \
            --data '{"name":"Factory 16 Runtime","noLog":true}' \
            http://127.0.0.1:20128/api/keys)"
          key="$(jq -r '.key // empty' <<< "$response")"
          [[ "$key" == sk-* ]] || { echo 'OmniRoute did not return a gateway key' >&2; exit 1; }
          echo "::add-mask::$key"
          printf '%s' "$key" > "$RUNNER_TEMP/omniroute-gateway-key"
          chmod 600 "$RUNNER_TEMP/omniroute-gateway-key"

      - name: Prove pinned free model and direct OmniRoute completion
        shell: bash
        run: |
          set -Eeuo pipefail
          gateway_key="$(cat "$RUNNER_TEMP/omniroute-gateway-key")"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            --header "Authorization: Bearer $gateway_key" \
            http://127.0.0.1:20128/v1/models > "$RUNNER_TEMP/omniroute-models.json"
          jq -e --arg model "$OMNIROUTE_MODEL" '.data[]?.id | select(. == $model)' \
            "$RUNNER_TEMP/omniroute-models.json" >/dev/null || {
              echo "Pinned model ${OMNIROUTE_MODEL} is not exposed by OmniRoute" >&2
              exit 1
            }
          echo "OmniRoute exposes pinned provider=${OMNIROUTE_PROVIDER} model=${OMNIROUTE_MODEL}"
          request="$(jq -nc --arg model "$OMNIROUTE_MODEL" \
            '{model:$model,messages:[{role:"user",content:"Reply with exactly: OMNIROUTE_FACTORY_OK"}],max_tokens:64}')"
          response="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 120 \
            --header "Authorization: Bearer $gateway_key" \
            --header 'Content-Type: application/json' \
            --data "$request" \
            http://127.0.0.1:20128/v1/chat/completions)"
          jq -e '.choices[0].message.content | strings | contains("OMNIROUTE_FACTORY_OK")' >/dev/null <<< "$response"
          upstream_model="$(jq -r '.model // empty' <<< "$response")"
          echo "Direct OmniRoute completion succeeded for ${OMNIROUTE_MODEL}; upstream reported model=${upstream_model:-not-reported}"

      - name: Configure OpenCode through pinned OmniRoute route
        shell: bash
        run: |
          set -Eeuo pipefail
          gateway_key="$(cat "$RUNNER_TEMP/omniroute-gateway-key")"
          mkdir -p "$HOME/.config/opencode"
          jq -n --arg model "$OMNIROUTE_MODEL" --arg key "$gateway_key" '{
            provider: {
              omniroute: {
                npm: "@ai-sdk/openai-compatible",
                name: "OmniRoute",
                options: {
                  baseURL: "http://127.0.0.1:20128/v1",
                  apiKey: $key
                },
                models: {($model): {name: $model}}
              }
            }
          }' > "$HOME/.config/opencode/opencode.json"
          echo "OpenCode configured for omniroute/${OMNIROUTE_MODEL} via localhost:20128/v1"

      - name: Prove actual Factory 16 worker traverses OmniRoute
        shell: bash
        run: |
          set -Eeuo pipefail
          bash .github/scripts/omniroute-factory-worker.sh --smoke

      - name: Report running heartbeat
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          previous_completed="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .body | capture("Last run completed: `(?<value>[^`]*)`")?.value] | map(select(. != null)) | last // "not yet reported"')"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run started: `%s`\nLast run completed: `%s`\nWorked on: selecting normal ComicPile work with `%s` via `%s`\nOutcome: running\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$now" "$previous_completed" "$OMNIROUTE_MODEL" "$OMNIROUTE_PROVIDER")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Run normal OmniRoute factory session
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash .github/scripts/omniroute-factory-worker.sh

      - name: Report terminal heartbeat
        if: always() && github.event_name != 'pull_request'
        env:
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          previous="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .body] | last // empty')"
          started="$(jq -nr --arg body "$previous" '$body | capture("Last run started: `(?<value>[^`]*)`")?.value // "unknown"')"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run started: `%s`\nLast run completed: `%s`\nWorked on: normal ComicPile factory session with `%s` via `%s`\nOutcome: %s\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$started" "$now" "$OMNIROUTE_MODEL" "$OMNIROUTE_PROVIDER" "$OUTCOME")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          docker logs omniroute-factory-16 --tail 200 2>&1 || true
          echo 'Last health response:'
          cat "$RUNNER_TEMP/omniroute-health.json" 2>/dev/null || true
          echo 'OpenCode smoke/session output:'
          tail -n 160 "/tmp/opencode-factory-${FACTORY_WORKER}.log" 2>/dev/null || true

      - name: Cleanup OmniRoute runtime
        if: always()
        shell: bash
        run: |
          docker rm -f omniroute-factory-16 >/dev/null 2>&1 || true
          docker volume rm omniroute-factory-16-data >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/omniroute-runtime.env" \
            "$RUNNER_TEMP/omniroute-initial-password" \
            "$RUNNER_TEMP/omniroute-cookies" \
            "$RUNNER_TEMP/omniroute-gateway-key" \
            "$RUNNER_TEMP/omniroute-models.json"
