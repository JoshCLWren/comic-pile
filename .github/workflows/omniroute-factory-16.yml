name: OmniRoute Factory 16

on:
  pull_request:
    paths:
      - '.github/workflows/omniroute-factory-16.yml'
      - '.github/scripts/omniroute-factory-worker.sh'
  schedule:
    - cron: '34 * * * *'
  workflow_dispatch:

concurrency:
  group: omniroute-factory-16-${{ github.event.pull_request.number || 'autonomous' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

env:
  FACTORY_WORKER: '16'
  FACTORY_CALL_SIGN: 'Multiple Man'
  OMNIROUTE_IMAGE: 'diegosouzapw/omniroute:3.8.49'

jobs:
  gateway-and-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 116
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORY_BUDGET_SECONDS: '6000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use supported Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure git identity
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'opencode-omniroute-factory-16[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install OpenCode and model selector
        run: |
          set -Eeuo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npm install --global free-coding-models@0.5.69

      - name: Select NVIDIA seed model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${NVIDIA_API_KEY:-}" ]] || { echo 'NVIDIA_API_KEY is required' >&2; exit 1; }
          fcm_output="$(free-coding-models --json --origin nvidia --hide-unconfigured --best --no-telemetry)"
          selected="$(printf '%s\n' "$fcm_output" | python scripts/select_fcm_nvidia_model.py | sed '/^$/d' | head -n1)"
          [[ -n "$selected" ]] || { echo 'No NVIDIA model candidate available' >&2; exit 1; }
          printf '%s' "${selected#nvidia/}" > "$RUNNER_TEMP/omniroute-seed-model"
          echo "Selected an NVIDIA seed model for OmniRoute routing"

      - name: Create ephemeral OmniRoute runtime secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_env="$RUNNER_TEMP/omniroute-runtime.env"
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          api_key_secret="$(openssl rand -hex 32)"
          initial_password="$(openssl rand -hex 24)"
          storage_key="$(openssl rand -hex 32)"
          ws_secret="$(openssl rand -base64 32 | tr -d '\n')"
          for secret in "$jwt_secret" "$api_key_secret" "$initial_password" "$storage_key" "$ws_secret" "$NVIDIA_API_KEY"; do
            echo "::add-mask::$secret"
          done
          {
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'API_KEY_SECRET=%s\n' "$api_key_secret"
            printf 'INITIAL_PASSWORD=%s\n' "$initial_password"
            printf 'STORAGE_ENCRYPTION_KEY=%s\n' "$storage_key"
            printf 'STORAGE_ENCRYPTION_KEY_VERSION=v1\n'
            printf 'OMNIROUTE_WS_BRIDGE_SECRET=%s\n' "$ws_secret"
            printf 'NVIDIA_API_KEY=%s\n' "$NVIDIA_API_KEY"
            printf 'DATA_DIR=/app/data\n'
            printf 'OMNIROUTE_NO_UPDATE_NOTIFIER=1\n'
            printf 'AUTH_COOKIE_SECURE=false\n'
          } > "$runtime_env"
          printf '%s' "$initial_password" > "$RUNNER_TEMP/omniroute-initial-password"
          chmod 600 "$runtime_env" "$RUNNER_TEMP/omniroute-initial-password"

      - name: Start official OmniRoute container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "$OMNIROUTE_IMAGE"
          docker volume create omniroute-factory-16-data >/dev/null
          docker run -d \
            --name omniroute-factory-16 \
            --stop-timeout 40 \
            -p 127.0.0.1:20128:20128 \
            --env-file "$RUNNER_TEMP/omniroute-runtime.env" \
            -v omniroute-factory-16-data:/app/data \
            "$OMNIROUTE_IMAGE" >/dev/null

      - name: Require real OmniRoute health
        shell: bash
        run: |
          set -Eeuo pipefail
          for _ in {1..120}; do
            code="$(curl --silent --output "$RUNNER_TEMP/omniroute-health.json" --write-out '%{http_code}' \
              --connect-timeout 1 --max-time 3 http://127.0.0.1:20128/api/monitoring/health || true)"
            if [[ "$code" == '200' ]]; then
              echo 'OmniRoute health endpoint returned HTTP 200'
              exit 0
            fi
            sleep 1
          done
          echo 'OmniRoute did not become healthy' >&2
          exit 1

      - name: Create ephemeral OmniRoute gateway key
        shell: bash
        run: |
          set -Eeuo pipefail
          initial_password="$(cat "$RUNNER_TEMP/omniroute-initial-password")"
          login_body="$(jq -nc --arg password "$initial_password" '{password:$password}')"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            --cookie-jar "$RUNNER_TEMP/omniroute-cookies" \
            --header 'Content-Type: application/json' \
            --data "$login_body" \
            http://127.0.0.1:20128/api/auth/login >/dev/null
          response="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            --cookie "$RUNNER_TEMP/omniroute-cookies" \
            --header 'Content-Type: application/json' \
            --data '{"name":"Factory 16 Runtime","noLog":true}' \
            http://127.0.0.1:20128/api/keys)"
          key="$(jq -r '.key // empty' <<< "$response")"
          [[ "$key" == sk-* ]] || { echo 'OmniRoute did not return a gateway key' >&2; exit 1; }
          echo "::add-mask::$key"
          printf '%s' "$key" > "$RUNNER_TEMP/omniroute-gateway-key"
          chmod 600 "$RUNNER_TEMP/omniroute-gateway-key"

      - name: Prove NVIDIA provider and direct routed completion
        shell: bash
        run: |
          set -Eeuo pipefail
          gateway_key="$(cat "$RUNNER_TEMP/omniroute-gateway-key")"
          seed_model="$(cat "$RUNNER_TEMP/omniroute-seed-model")"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            --header "Authorization: Bearer $gateway_key" \
            http://127.0.0.1:20128/v1/models > "$RUNNER_TEMP/omniroute-models.json"
          routed_model="$(jq -r --arg seed "$seed_model" '
            [ .data[]?.id | select(startswith("nvidia/")) ] as $nvidia
            | ($nvidia | map(select(endswith("/" + $seed) or . == ("nvidia/" + $seed))) | first)
              // ($nvidia | first)
              // empty
          ' "$RUNNER_TEMP/omniroute-models.json")"
          [[ -n "$routed_model" ]] || {
            echo 'No NVIDIA models were exposed through the authenticated OmniRoute gateway' >&2
            exit 1
          }
          request="$(jq -nc --arg model "$routed_model" '{model:$model,messages:[{role:"user",content:"Reply with exactly: OMNIROUTE_FACTORY_OK"}],max_tokens:32}')"
          response="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 90 \
            --header "Authorization: Bearer $gateway_key" \
            --header 'Content-Type: application/json' \
            --data "$request" \
            http://127.0.0.1:20128/v1/chat/completions)"
          jq -e '.choices[0].message.content | strings | contains("OMNIROUTE_FACTORY_OK")' >/dev/null <<< "$response"
          printf '%s' "$routed_model" > "$RUNNER_TEMP/omniroute-routed-model"
          echo "Direct completion succeeded through OmniRoute and the NVIDIA provider"

      - name: Configure OpenCode through OmniRoute
        shell: bash
        run: |
          set -Eeuo pipefail
          routed_model="$(cat "$RUNNER_TEMP/omniroute-routed-model")"
          gateway_key="$(cat "$RUNNER_TEMP/omniroute-gateway-key")"
          mkdir -p "$HOME/.config/opencode"
          jq -n --arg model "$routed_model" --arg key "$gateway_key" '{
            provider: {
              omniroute: {
                npm: "@ai-sdk/openai-compatible",
                name: "OmniRoute",
                options: {
                  baseURL: "http://127.0.0.1:20128/v1",
                  apiKey: $key
                },
                models: {($model): {name: $model}}
              }
            }
          }' > "$HOME/.config/opencode/opencode.json"

      - name: Prove OpenCode traverses OmniRoute
        shell: bash
        run: |
          set -Eeuo pipefail
          routed_model="$(cat "$RUNNER_TEMP/omniroute-routed-model")"
          timeout 120s opencode run -m "omniroute/$routed_model" --agent build --dir "$GITHUB_WORKSPACE" \
            --title 'OmniRoute Factory 16 smoke' \
            'Reply with exactly OMNIROUTE_OPENCODE_OK. Do not edit files.' \
            2>&1 | tee "$RUNNER_TEMP/omniroute-opencode-smoke.log"
          grep -q 'OMNIROUTE_OPENCODE_OK' "$RUNNER_TEMP/omniroute-opencode-smoke.log"
          test -z "$(git status --porcelain)"

      - name: Ensure isolated experiment lane label
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/labels/omniroute-experiment" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name='omniroute-experiment' -f color='6f42c1' \
              -f description='Explicit opt-in work lane for OmniRoute Factory 16' >/dev/null
          fi

      - name: Report running heartbeat
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run started: `%s`\nWorked on: isolated OmniRoute experiment lane\nOutcome: running\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$now")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Run isolated OmniRoute factory session
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          routed_model="$(cat "$RUNNER_TEMP/omniroute-routed-model")"
          bash .github/scripts/omniroute-factory-worker.sh "$routed_model"

      - name: Report terminal heartbeat
        if: always() && github.event_name != 'pull_request'
        env:
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run completed: `%s`\nWorked on: isolated OmniRoute experiment lane\nOutcome: %s\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$now" "$OUTCOME")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          docker logs omniroute-factory-16 --tail 200 2>&1 || true
          echo 'Last health response:'
          cat "$RUNNER_TEMP/omniroute-health.json" 2>/dev/null || true
          echo 'OpenCode smoke output:'
          tail -n 120 "$RUNNER_TEMP/omniroute-opencode-smoke.log" 2>/dev/null || true

      - name: Cleanup OmniRoute runtime
        if: always()
        shell: bash
        run: |
          docker rm -f omniroute-factory-16 >/dev/null 2>&1 || true
          docker volume rm omniroute-factory-16-data >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/omniroute-runtime.env" \
            "$RUNNER_TEMP/omniroute-initial-password" \
            "$RUNNER_TEMP/omniroute-cookies" \
            "$RUNNER_TEMP/omniroute-gateway-key"
