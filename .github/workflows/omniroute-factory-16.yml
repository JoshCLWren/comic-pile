name: OmniRoute Factory 16

on:
  schedule:
    - cron: "34 * * * *"
  workflow_dispatch:

concurrency:
  group: omniroute-factory-16
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

env:
  FACTORY_WORKER: "16"
  FACTORY_CALL_SIGN: "Multiple Man"

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 116
    env:
      GH_TOKEN: ${{ github.token }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      FACTORY_BUDGET_SECONDS: "6000"
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "opencode-omniroute-factory-16[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure Factory 16 owner label
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A16" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name='factory:16' \
              -f color='5319e7' \
              -f description='Owned by OpenCode OmniRoute Factory 16' >/dev/null
          fi

      - name: Report running heartbeat
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run started: `%s`\nWorked on: selecting work\nOutcome: running\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$now")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Install OmniRoute and model discovery
        run: |
          npm install --global --ignore-scripts omniroute@3.8.49 free-coding-models@0.5.69
          omniroute --version || true

      - name: Select NVIDIA seed model
        id: model
        shell: bash
        run: |
          set -Eeuo pipefail
          fcm_output="$(free-coding-models --json --origin nvidia --hide-unconfigured --best --no-telemetry)"
          selected="$(printf '%s\n' "$fcm_output" | python scripts/select_fcm_nvidia_model.py | sed '/^$/d' | head -n1)"
          [[ -n "$selected" ]] || { echo 'No NVIDIA model candidate available' >&2; exit 1; }
          echo "model=$selected" >> "$GITHUB_OUTPUT"
          echo "Seed model: $selected"

      - name: Start headless OmniRoute
        shell: bash
        env:
          SEED_MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${NVIDIA_API_KEY:-}" ]] || { echo 'NVIDIA_API_KEY is required for the initial OmniRoute experiment' >&2; exit 1; }
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          export API_KEY_SECRET="$(openssl rand -hex 32)"
          export STORAGE_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export INITIAL_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          export REQUIRE_API_KEY=false
          export OMNIROUTE_DISABLE_BACKGROUND_SERVICES=true
          export DATA_DIR="$RUNNER_TEMP/omniroute"
          export PORT=20128
          mkdir -p "$DATA_DIR"
          nohup omniroute --no-open >"$RUNNER_TEMP/omniroute.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/omniroute.pid"
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:20128/v1/models >/tmp/omniroute-models.json 2>/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:20128/v1/models >/tmp/omniroute-models.json
          provider_model="${SEED_MODEL#nvidia/}"
          request="$(jq -nc --arg model "nvidia/${provider_model}" '{model:$model,messages:[{role:"user",content:"Reply with exactly: OMNIROUTE_FACTORY_OK"}],max_tokens:32}')"
          response="$(curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 40 \
            --header 'Content-Type: application/json' \
            --data "$request" http://127.0.0.1:20128/v1/chat/completions)"
          jq -e '.choices[0].message.content | strings | contains("OMNIROUTE_FACTORY_OK")' >/dev/null <<<"$response"

      - name: Configure OpenCode for OmniRoute
        env:
          SEED_MODEL: ${{ steps.model.outputs.model }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "omniroute": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "OmniRoute",
                "options": {
                  "baseURL": "http://127.0.0.1:20128/v1",
                  "apiKey": "factory-local"
                },
                "models": {
                  "$SEED_MODEL": { "name": "$SEED_MODEL" }
                }
              }
            }
          }
          EOF

      - name: Run OmniRoute factory work session
        env:
          MODEL: ${{ steps.model.outputs.model }}
        run: bash .github/scripts/omniroute-factory-worker.sh "$MODEL"

      - name: Show OmniRoute diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '--- OmniRoute log tail ---'
          tail -n 120 "$RUNNER_TEMP/omniroute.log" 2>/dev/null || true
          echo '--- OmniRoute models ---'
          jq -r '.data[]?.id' /tmp/omniroute-models.json 2>/dev/null | head -n 80 || true

      - name: Report terminal heartbeat
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run completed: `%s`\nWorked on: OmniRoute factory session\nOutcome: %s\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$now" "$OUTCOME")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi
