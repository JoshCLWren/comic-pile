name: OmniRoute Factory 16

on:
  pull_request:
    paths:
      - '.github/workflows/omniroute-factory-16.yml'
      - '.github/workflows/omniroute-smoke.yml'
      - '.github/scripts/omniroute-factory-worker.sh'
      - '.github/scripts/patch-omniroute-setup.sh'
  schedule:
    - cron: '34 * * * *'
  workflow_dispatch:

concurrency:
  group: omniroute-factory-16-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

env:
  FACTORY_WORKER: '16'
  FACTORY_CALL_SIGN: 'Multiple Man'

jobs:
  gateway-and-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 116
    env:
      GH_TOKEN: ${{ github.token }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      FACTORY_BUDGET_SECONDS: '6000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use supported Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure git identity
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'opencode-omniroute-factory-16[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install and repair OmniRoute
        shell: bash
        run: |
          set -Eeuo pipefail
          allowed_scripts='omniroute,better-sqlite3,wreq-js,keytar,tls-client-node,onnxruntime-node,sharp,core-js,@parcel/watcher,@swc/core,protobufjs,koffi,esbuild'
          npm config set allow-scripts="$allowed_scripts" --location=user
          npm install --global --allow-scripts="$allowed_scripts" omniroute@3.8.49 free-coding-models@0.5.69
          global_root="$(npm root --global)"
          dist_dir="$global_root/omniroute/dist"
          (cd "$dist_dir" && npm rebuild better-sqlite3 wreq-js)
          node "$global_root/omniroute/scripts/build/postinstall.mjs"
          sqlite_binary="$dist_dir/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          [[ -f "$sqlite_binary" ]] || { echo "OmniRoute better-sqlite3 binary is missing after approved rebuild" >&2; exit 1; }
          bash .github/scripts/patch-omniroute-setup.sh

      - name: Verify OmniRoute version
        run: test "$(omniroute --version)" = '3.8.49'

      - name: Select NVIDIA seed model
        id: model
        shell: bash
        run: |
          set -Eeuo pipefail
          fcm_output="$(free-coding-models --json --origin nvidia --hide-unconfigured --best --no-telemetry)"
          selected="$(printf '%s\n' "$fcm_output" | python scripts/select_fcm_nvidia_model.py | sed '/^$/d' | head -n1)"
          [[ -n "$selected" ]] || { echo 'No NVIDIA model candidate available' >&2; exit 1; }
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "provider_model=${selected#nvidia/}" >> "$GITHUB_OUTPUT"

      - name: Configure OmniRoute
        env:
          PROVIDER_MODEL: ${{ steps.model.outputs.provider_model }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${NVIDIA_API_KEY:-}" ]] || { echo 'NVIDIA_API_KEY is required' >&2; exit 1; }
          DATA_DIR="$RUNNER_TEMP/omniroute"
          JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          API_KEY_SECRET="$(openssl rand -hex 32)"
          STORAGE_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          INITIAL_PASSWORD=''
          OMNIROUTE_NO_UPDATE_NOTIFIER=1
          OMNIROUTE_API_KEY="$NVIDIA_API_KEY"
          export DATA_DIR JWT_SECRET API_KEY_SECRET STORAGE_ENCRYPTION_KEY INITIAL_PASSWORD OMNIROUTE_NO_UPDATE_NOTIFIER OMNIROUTE_API_KEY
          mkdir -p "$DATA_DIR"
          env_file="$RUNNER_TEMP/omniroute-env"
          {
            printf 'export DATA_DIR=%q\n' "$DATA_DIR"
            printf 'export JWT_SECRET=%q\n' "$JWT_SECRET"
            printf 'export API_KEY_SECRET=%q\n' "$API_KEY_SECRET"
            printf 'export STORAGE_ENCRYPTION_KEY=%q\n' "$STORAGE_ENCRYPTION_KEY"
            printf "export INITIAL_PASSWORD=''\n"
            printf 'export OMNIROUTE_NO_UPDATE_NOTIFIER=1\n'
          } > "$env_file"
          chmod 600 "$env_file"
          omniroute setup --add-provider --provider nvidia --provider-name 'Factory 16 NVIDIA' \
            --default-model "$PROVIDER_MODEL" --test-provider --non-interactive

      - name: Start OmniRoute
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/omniroute-env"
          mkdir -p "$HOME/.cache"
          nohup omniroute serve --no-open --no-recovery --port 20128 >"$RUNNER_TEMP/omniroute.log" 2>&1 &
          for _ in {1..120}; do
            code="$(curl --silent --output /tmp/omniroute-health.json --write-out '%{http_code}' \
              --connect-timeout 1 --max-time 3 http://localhost:20128/api/monitoring/health || true)"
            if [[ "$code" == '200' ]]; then
              echo 'OmniRoute health endpoint is ready'
              exit 0
            fi
            if [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "OmniRoute listener is up but health is HTTP ${code}; continuing startup probe"
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/omniroute.log" >&2 || true
          echo 'Last health response:' >&2
          cat /tmp/omniroute-health.json >&2 2>/dev/null || true
          exit 1

      - name: Create ephemeral OmniRoute gateway key
        id: gateway_key
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"name":"Factory 16 Runtime","noLog":true}' \
            http://localhost:20128/api/keys)"
          key="$(jq -r '.key // empty' <<< "$response")"
          [[ "$key" == sk-* ]] || { echo "$response" >&2; exit 1; }
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Prove completion traverses OmniRoute
        id: routed
        env:
          PROVIDER_MODEL: ${{ steps.model.outputs.provider_model }}
          OMNIROUTE_GATEWAY_KEY: ${{ steps.gateway_key.outputs.key }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 30 \
            --header "Authorization: Bearer $OMNIROUTE_GATEWAY_KEY" \
            http://localhost:20128/v1/models > /tmp/omniroute-models.json
          model="$(jq -r --arg needle "$PROVIDER_MODEL" '[.data[]?.id | select(contains($needle))][0] // empty' /tmp/omniroute-models.json)"
          [[ -n "$model" ]] || model="nvidia/$PROVIDER_MODEL"
          request="$(jq -nc --arg model "$model" '{model:$model,messages:[{role:"user",content:"Reply with exactly: OMNIROUTE_FACTORY_OK"}],max_tokens:32}')"
          response="$(curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 60 \
            --header "Authorization: Bearer $OMNIROUTE_GATEWAY_KEY" \
            --header 'Content-Type: application/json' --data "$request" \
            http://localhost:20128/v1/chat/completions)"
          jq -e '.choices[0].message.content | strings | contains("OMNIROUTE_FACTORY_OK")' >/dev/null <<< "$response"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Configure OpenCode through OmniRoute
        env:
          ROUTED_MODEL: ${{ steps.routed.outputs.model }}
          OMNIROUTE_GATEWAY_KEY: ${{ steps.gateway_key.outputs.key }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.config/opencode"
          jq -n --arg model "$ROUTED_MODEL" --arg key "$OMNIROUTE_GATEWAY_KEY" '{
            provider: {
              omniroute: {
                npm: "@ai-sdk/openai-compatible",
                name: "OmniRoute",
                options: {baseURL: "http://localhost:20128/v1", apiKey: $key},
                models: {($model): {name: $model}}
              }
            }
          }' > "$HOME/.config/opencode/opencode.json"

      - name: Prove OpenCode traverses OmniRoute
        env:
          ROUTED_MODEL: ${{ steps.routed.outputs.model }}
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s opencode run -m "omniroute/$ROUTED_MODEL" --agent build --dir "$GITHUB_WORKSPACE" \
            --title 'OmniRoute Factory 16 smoke' \
            'Reply with exactly OMNIROUTE_OPENCODE_OK. Do not edit files.' 2>&1 | tee /tmp/omniroute-opencode-smoke.log
          grep -q 'OMNIROUTE_OPENCODE_OK' /tmp/omniroute-opencode-smoke.log
          test -z "$(git status --porcelain)"

      - name: Ensure isolated experiment lane label
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/labels/omniroute-experiment" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name='omniroute-experiment' -f color='6f42c1' \
              -f description='Explicit opt-in work lane for OmniRoute Factory 16' >/dev/null
          fi

      - name: Report running heartbeat
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run started: `%s`\nWorked on: isolated OmniRoute experiment lane\nOutcome: running\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$now")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Run isolated OmniRoute factory session
        if: github.event_name != 'pull_request'
        env:
          ROUTED_MODEL: ${{ steps.routed.outputs.model }}
        run: bash .github/scripts/omniroute-factory-worker.sh "$ROUTED_MODEL"

      - name: Report terminal heartbeat
        if: always() && github.event_name != 'pull_request'
        env:
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker='<!-- factory-heartbeat:v1 worker=opencode-omniroute-factory-16 -->'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\n## 🏭 Factory 16 · Multiple Man\nScheduled slot: `:34` America/Chicago\nLast run completed: `%s`\nWorked on: isolated OmniRoute experiment lane\nOutcome: %s\nUpdated by: `opencode-omniroute-factory-16`' "$marker" "$now" "$OUTCOME")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1093/comments?per_page=100" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker)) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1093/comments" -f body="$body" >/dev/null
          fi

      - name: Diagnostics
        if: failure()
        run: tail -n 160 "$RUNNER_TEMP/omniroute.log" 2>/dev/null || true
