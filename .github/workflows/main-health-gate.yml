# Observe completed product CI without creating or modifying GitHub issues.
# CI itself is the authoritative failure signal. This follow-up makes a
# failed main run visible without injecting new work into the Rust cutover.
name: Main Health Gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report completed main CI
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Main CI for ${HEAD_SHA}: ${CONCLUSION} (${CI_URL})"
          case "${CONCLUSION}" in
            success)
              echo "Main CI is green"
              ;;
            failure|timed_out|startup_failure|action_required)
              echo "::error title=Main CI failed::${HEAD_SHA} ${CONCLUSION}; see ${CI_URL}"
              exit 1
              ;;
            cancelled|skipped|neutral)
              echo "::warning title=Main CI inconclusive::${HEAD_SHA} ${CONCLUSION}; see ${CI_URL}"
              ;;
            *)
              echo "::warning title=Main CI unknown::${HEAD_SHA} ${CONCLUSION}; see ${CI_URL}"
              ;;
          esac
