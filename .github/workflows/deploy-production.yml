name: Deploy Production
# Dispatched runs show who asked and why ("Deploy Production [source=manual] <reason>");
# factory-dispatch-production-deploy.sh matches this prefix to find a queued
# manual run. Other events evaluate to '' and keep GitHub's default run name.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy Production [source={0}] {1}', inputs.source, inputs.reason) || '' }}

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Factory Ready Merge Drain
      - Factory Completion Drain
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: Optional reason for this manual deployment. Logged in the run summary and shown in the run name.
        type: string
        required: false
      source:
        description: >
          Who dispatched the run. "manual" (default) forces a redeploy of
          main. "factory-merge" is used by factory bot-merge paths (GITHUB_TOKEN
          merges fire no push event) and skips a SHA that is already READY.
        type: choice
        options:
          - manual
          - factory-merge
        default: manual

# One deploy at a time; the newest pending run replaces any older pending
# run, and every run checks out current main, so overlapping triggers (push,
# workflow_run, cron, factory-merge dispatches) never deploy an older SHA
# after a newer one and never cancel an in-flight deploy.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  VERCEL_ORG_ID: team_1na05XWOpOb6wB1CA4m3GPRT
  VERCEL_PROJECT_ID: prj_TLT92644pRPZbZSMoXddCfQLZgK8
  VERCEL_TEAM_SLUG: joshclwrens-projects

jobs:
  preflight:
    name: Deduplicate exact main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.revision.outputs.deploy_sha }}
      deployment_required: ${{ steps.deployment.outputs.deployment_required }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record selected deployment revision
        id: revision
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$deploy_sha" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{sha: $sha, run_id: $run_id, run_attempt: $run_attempt}' \
            > "$RUNNER_TEMP/deployment-attempt.json"

      - name: Publish selected deployment revision
        uses: actions/upload-artifact@v7
        with:
          name: deployment-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-attempt.json
          if-no-files-found: error
          retention-days: 90

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Repository secret VERCEL_TOKEN is required for production deployment." >&2
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.1.0

      - name: Check for an existing production deployment
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source || 'manual' }}
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"

          # A manual run is an explicit recovery request and may intentionally
          # redeploy a SHA that Vercel already considers READY. A factory-merge
          # dispatch (after a GITHUB_TOKEN merge) deduplicates like push does.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_SOURCE" != "factory-merge" ]]; then
            echo "deployment_required=true" >> "$GITHUB_OUTPUT"
            echo "Recovery requested for $deploy_sha"
            exit 0
          fi

          deployments_json="$(vercel list comic-pile \
            --prod \
            --status READY \
            --meta "githubCommitSha=$deploy_sha" \
            --limit 5 \
            --json \
            --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN")"
          # Only a deployment created by this workflow counts as already
          # deployed. A vercel[bot] Git deployment for the same SHA must not
          # deduplicate the migration-aware path.
          ready_count="$(jq --arg sha "$deploy_sha" '
            [.deployments[]
             | select(.meta.githubCommitSha == $sha)
             | select((.meta.githubDeployment // "") | tostring == "1")]
            | length
          ' <<< "$deployments_json")"
          foreign_count="$(jq --arg sha "$deploy_sha" '
            [.deployments[]
             | select(.meta.githubCommitSha == $sha)
             | select((.meta.githubDeployment // "") | tostring != "1")]
            | length
          ' <<< "$deployments_json")"

          if [[ "$ready_count" -gt 0 ]]; then
            echo "deployment_required=false" >> "$GITHUB_OUTPUT"
            echo "Production already has a workflow-created READY deployment for $deploy_sha; skipping duplicate trigger."
          else
            echo "deployment_required=true" >> "$GITHUB_OUTPUT"
            if [[ "$foreign_count" -gt 0 ]]; then
              echo "A production deployment for $deploy_sha was created outside this workflow; the migration-aware deploy will replace it."
            else
              echo "No READY production deployment exists for $deploy_sha."
            fi
          fi

  deploy:
    name: Migrate Neon and deploy exact main SHA
    needs: preflight
    if: needs.preflight.outputs.deployment_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.deploy_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Generate Rust-default ingress from existing FastAPI OpenAPI
        env:
          ROUTE_PYTHON: .venv/bin/python
        run: |
          set -euo pipefail
          node scripts/generate_vercel_routes.mjs
          .venv/bin/python scripts/generate_route_burndown.py
          node scripts/generate_vercel_routes.mjs --check
          .venv/bin/python scripts/generate_route_burndown.py --check

      - name: Get production database connection string
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
            echo "NEON_API_KEY secret and NEON_PROJECT_ID variable are required for production migrations." >&2
            exit 1
          fi
          uri="$(curl --fail --silent --show-error \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=neondb&role_name=neondb_owner" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" \
            | jq -r '.uri')"
          if [[ -z "$uri" || "$uri" == "null" ]]; then
            echo "Failed to retrieve the Neon production connection string." >&2
            exit 1
          fi
          echo "::add-mask::$uri"
          echo "db_url=$uri" >> "$GITHUB_OUTPUT"

      - name: Check single Alembic head
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          heads="$(.venv/bin/alembic heads)"
          count="$(grep -c '(head)' <<< "$heads")"
          if [[ "$count" -ne 1 ]]; then
            echo "ERROR: $count Alembic heads detected - resolve before deploying" >&2
            printf '%s\n' "$heads"
            exit 1
          fi
          echo "Single head confirmed: $heads"

      - name: Detect pending Alembic revisions
        id: migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          expected="$(.venv/bin/alembic heads | awk 'NR==1 {print $1}')"
          current="$(.venv/bin/alembic current | awk 'NR==1 {print $1}')"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          if [[ -n "$expected" && "$current" == "$expected" ]]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No pending migrations (production already at $current)."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Pending migrations: production=${current:-<none>} application=$expected"
          fi

      - name: Migrate production database before deploy
        if: steps.migrations.outputs.pending == 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          .venv/bin/alembic upgrade head

      - name: Verify production schema at application head
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          expected="$(.venv/bin/alembic heads | awk 'NR==1 {print $1}')"
          current="$(.venv/bin/alembic current | awk 'NR==1 {print $1}')"
          echo "Production Alembic revision: $current"
          if [[ -z "$expected" || "$current" != "$expected" ]]; then
            echo "ERROR: production schema is not at application head (current=$current expected=$expected)" >&2
            exit 1
          fi

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Repository secret VERCEL_TOKEN is required for production deployment." >&2
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.1.0

      - name: Link production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN"

      - name: Deploy exact commit to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          commit_message="$(git log -1 --pretty=%s)"
          # A parallel CLI deployment can win the alias and cancel this one.
          # Reconcile ONLY if the live production alias is READY on our exact
          # (already schema-verified) SHA. Other errors must remain fatal.
          set +e
          vercel deploy \
            --prod \
            --yes \
            --logs \
            --build-env COMICPILE_BUILD_SHA="$deploy_sha" \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef=main \
            --meta githubCommitSha="$deploy_sha" \
            --meta githubCommitMessage="$commit_message" \
            --meta githubCommitOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubCommitRepo="${GITHUB_REPOSITORY#*/}" \
            --meta githubOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubRepo="${GITHUB_REPOSITORY#*/}" \
            --meta githubCommitAuthorLogin="$GITHUB_ACTOR"
          deploy_status=$?
          set -e
          if [[ "$deploy_status" -ne 0 ]]; then
            live_sha="$(python3 .github/scripts/verify_vercel_production.py || true)"
            if [[ "$live_sha" != "$deploy_sha" ]]; then
              echo "::error::Vercel CLI failed and production alias does not serve $deploy_sha" >&2
              exit "$deploy_status"
            fi
            echo "::warning::CLI deployment was superseded, but production alias serves $deploy_sha. Continuing all verification and smoke checks."
          fi

      - name: Verify the newest production deployment matches this SHA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 5); do
            response="$(curl --fail --silent --show-error \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=20" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            newest="$(jq -r '
              [.deployments[] | select(.readyState == "READY")]
              | sort_by(.createdAt // .created) | reverse | .[0]
              | [
                  (.meta.githubCommitSha // ""),
                  ((.meta.githubDeployment // "") | tostring),
                  ((.aliasError // null) | tostring)
                ]
              | @tsv
            ' <<< "$response")"
            read -r newest_sha newest_owner newest_alias_error <<< "$newest"
            if [[ "$newest_sha" == "$deploy_sha" && "$newest_owner" == "1" && "$newest_alias_error" == "null" ]]; then
              echo "Production deployment confirmed for $deploy_sha"
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              echo "Production deployment not confirmed yet (attempt $attempt/5): sha=${newest_sha:-<none>} workflow=${newest_owner:-<none>} aliasError=${newest_alias_error:-<none>}"
              sleep 5
            fi
          done
          echo "ERROR: newest READY production deployment is not the workflow deployment for $deploy_sha" >&2
          jq -r '.deployments[] | "  \(.uid) \(.readyState) \(.meta.githubCommitSha // "no-sha") workflow=\((.meta.githubDeployment // "") | tostring) aliasError=\((.aliasError // null) | tostring)"' <<< "$response" >&2
          exit 1

      - name: Smoke production Rust health
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          header_file="$(mktemp)"
          trap 'rm -f "$body_file" "$header_file"' EXIT
          status="$(curl --silent --show-error --max-time 25 \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --dump-header "$header_file" \
            --output "$body_file" \
            --write-out '%{http_code}' \
            https://comic-pile.vercel.app/api/v2/health)"
          deploy_sha="$(git rev-parse HEAD)"
          # Read build identity captured by the compiler and OS process metadata;
          # the legacy language header alone is not runtime/revision evidence.
          if ! jq -e --arg sha "$deploy_sha" '
            .build.revision == $sha and
            .build.package == "comicpile-vercel-native" and
            (.build.compiler | startswith("rustc ")) and
            .process.os == "linux" and
            (.process.executable | type == "string" and length > 0)
          ' "$body_file" >/dev/null; then
            echo "::error::Production process/build identity does not match deployed revision" >&2
            exit 1
          fi
          health="$(jq -r '.status // ""' "$body_file")"
          runtime="$(awk 'tolower($1) == "x-comicpile-api-runtime:" {gsub(/\r/,""); print $2}' "$header_file" | tail -1)"
          if [[ "$status" != "200" || "$health" != "ok" || "$runtime" != "rust" ]]; then
            echo "::error::Production Rust health contract failed (HTTP $status, health=${health:-missing}, runtime=${runtime:-missing})" >&2
            exit 1
          fi
          echo "Production health contract passed (HTTP 200, status ok, runtime rust)"

      - name: Smoke production unknown API returns native Rust 404
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          header_file="$(mktemp)"
          trap 'rm -f "$body_file" "$header_file"' EXIT
          status="$(curl --silent --show-error --max-time 25 \
            --dump-header "$header_file" \
            --output "$body_file" \
            --write-out '%{http_code}' \
            https://comic-pile.vercel.app/api/v2/_unknown-rust-route-probe)"
          runtime="$(awk 'tolower($1) == "x-comicpile-api-runtime:" {gsub(/\r/,""); print $2}' "$header_file" | tail -1)"
          if [[ "$status" != "404" || "$runtime" != "rust" ]] || \
             ! jq -e '.detail == "Not Found"' "$body_file" >/dev/null; then
            echo "::error::Unknown API route did not terminate in Rust (HTTP $status, runtime=${runtime:-missing})" >&2
            exit 1
          fi
          echo "Unknown API route returned Rust JSON 404"

      - name: Smoke production rejected login on the Rust runtime
        run: |
          set -euo pipefail
          # One synthetic nonexistent username per SHA, never an actual reader.
          username="auth_smoke_$(git rev-parse --short=12 HEAD)"
          payload="$(jq -nc --arg username "$username" '{username: $username, password: "synthetic-invalid-credential"}')"
          body_file="$(mktemp)"
          header_file="$(mktemp)"
          trap 'rm -f "$body_file" "$header_file"' EXIT
          status="$(curl --silent --show-error --max-time 25 \
            --request POST \
            --header 'content-type: application/json' \
            --data "$payload" \
            --dump-header "$header_file" \
            --write-out '%{http_code}' \
            --output "$body_file" \
            https://comic-pile.vercel.app/api/v2/auth/login)"
          detail="$(jq -r '.detail // ""' "$body_file")"
          runtime="$(awk 'BEGIN{IGNORECASE=1} /^x-comicpile-api-runtime:/ {gsub(/\r/,""); print $2}' "$header_file" | tail -1)"
          if [[ "$status" != "401" || "$detail" != "Incorrect username or password" ]]; then
            echo "::error::Production rejected-login contract failed, HTTP $status" >&2
            exit 1
          fi
          # Python returns the identical status/detail, so the runtime marker is
          # what proves this request actually executed in native Rust.
          if [[ "$runtime" != "rust" ]]; then
            echo "::error::Production rejected login did not run on the Rust runtime (marker: ${runtime:-missing})" >&2
            exit 1
          fi
          echo "Production rejected-login contract passed (HTTP 401, runtime rust)"

  # Keep-N=2: live production alias plus previous READY rollback candidate.
  # Fail-soft so prune errors do not fail a finished migrate/deploy/smoke.
  prune:
    name: Prune older Vercel deployments
    needs:
      - preflight
      - deploy
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.deploy_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Repository secret VERCEL_TOKEN is required to prune Vercel deployments." >&2
            exit 1
          fi

      - name: Keep live and previous READY production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python3 scripts/prune_vercel_deployments.py \
            --project-id "$VERCEL_PROJECT_ID" \
            --project-name comic-pile \
            --team-id "$VERCEL_ORG_ID" \
            --keep-n 2 \
            --fail-soft
