name: Deploy Production
# Dispatched runs show who asked and why ("Deploy Production [source=manual] <reason>");
# factory-dispatch-production-deploy.sh matches this prefix to find a queued
# manual run. Other events evaluate to '' and keep GitHub's default run name.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy Production [source={0}] {1}', inputs.source, inputs.reason) || '' }}

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Factory Ready Merge Drain
      - Factory Completion Drain
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      override_freeze:
        description: >
          Bypass the red-deploy freeze after a fix is on main. Repository
          owner only (github.actor must match github.repository_owner).
        type: boolean
        default: false
      reason:
        description: Required when override_freeze is true. Logged in the run summary and shown in the run name.
        type: string
        required: false
      source:
        description: >
          Who dispatched the run. "manual" (default) forces a redeploy of
          main. "factory-merge" is used by factory bot-merge paths (GITHUB_TOKEN
          merges fire no push event) and skips a SHA that is already READY.
        type: choice
        options:
          - manual
          - factory-merge
        default: manual

# One deploy at a time; the newest pending run replaces any older pending
# run, and every run checks out current main, so overlapping triggers (push,
# workflow_run, cron, factory-merge dispatches) never deploy an older SHA
# after a newer one and never cancel an in-flight deploy.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  VERCEL_ORG_ID: team_1na05XWOpOb6wB1CA4m3GPRT
  VERCEL_PROJECT_ID: prj_TLT92644pRPZbZSMoXddCfQLZgK8
  VERCEL_TEAM_SLUG: joshclwrens-projects

jobs:
  freeze:
    name: Red-deploy freeze gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      frozen: ${{ steps.check.outputs.frozen }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Skip deploy when the last attempted run is red
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_FREEZE: ${{ github.event.inputs.override_freeze || 'false' }}
          OVERRIDE_REASON: ${{ github.event.inputs.reason || '' }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          runs_file="$RUNNER_TEMP/deploy-production-runs.json"
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?branch=main&status=completed&per_page=100" \
            > "$runs_file"; then
            echo "::warning::Unable to read completed Deploy Production runs; failing open."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "frozen=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy freeze"
              echo
              echo "Runs API error; failing open. This run will not count as a deploy failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          extra=(--fetch-jobs)
          if [[ "$OVERRIDE_FREEZE" == "true" ]]; then
            if [[ "$ACTOR" != "$OWNER" ]]; then
              echo "::warning::Ignoring override_freeze from ${ACTOR}; only repository owner ${OWNER} may override."
            else
              extra+=(--override --reason "$OVERRIDE_REASON")
            fi
          fi
          set +e
          decision="$(python3 .github/scripts/factory_deploy_freeze.py "${extra[@]}" \
            < "$runs_file" 2>"$RUNNER_TEMP/freeze.err")"
          status=$?
          set -e
          echo "$decision"
          cat "$RUNNER_TEMP/freeze.err" >&2
          if [[ "$status" -eq 2 || -z "$decision" ]]; then
            echo "::warning::Invalid Deploy Production run payload; failing open."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "frozen=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy freeze"
              echo
              echo "Invalid runs payload; failing open. This run will not count as a deploy failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          reason="$(python3 -c "import json,sys; print(json.load(sys.stdin)['reason'])" <<< "$decision")"
          frozen="$(python3 -c "import json,sys; print('true' if json.load(sys.stdin)['blocked'] else 'false')" <<< "$decision")"
          {
            echo "## Deploy freeze"
            echo
            echo "$reason"
            echo
            echo "Actor: ${ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$frozen" == "true" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Deploy skipped::The last attempted Deploy Production run is red; production was not deployed." >&2
            echo "Last attempted Deploy Production run is red; skipping this deploy." >&2
            echo "This run is gate-blocked and will not count as a deploy failure." >&2
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "frozen=false" >> "$GITHUB_OUTPUT"

  preflight:
    name: Deduplicate exact main SHA
    needs: freeze
    if: needs.freeze.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.deployment.outputs.deploy_sha }}
      deployment_required: ${{ steps.deployment.outputs.deployment_required }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Repository secret VERCEL_TOKEN is required for production deployment." >&2
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.1.0

      - name: Check for an existing production deployment
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source || 'manual' }}
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"

          # A manual run is an explicit recovery request and may intentionally
          # redeploy a SHA that Vercel already considers READY. A factory-merge
          # dispatch (after a GITHUB_TOKEN merge) deduplicates like push does.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_SOURCE" != "factory-merge" ]]; then
            echo "deployment_required=true" >> "$GITHUB_OUTPUT"
            echo "Manual recovery requested for $deploy_sha"
            exit 0
          fi

          deployments_json="$(vercel list comic-pile \
            --prod \
            --status READY \
            --meta "githubCommitSha=$deploy_sha" \
            --limit 5 \
            --json \
            --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN")"
          # Only a deployment created by this workflow counts as already
          # deployed. A vercel[bot] Git deployment for the same SHA must not
          # deduplicate the migration-aware path.
          ready_count="$(jq --arg sha "$deploy_sha" '
            [.deployments[]
             | select(.meta.githubCommitSha == $sha)
             | select((.meta.githubDeployment // "") | tostring == "1")]
            | length
          ' <<< "$deployments_json")"
          foreign_count="$(jq --arg sha "$deploy_sha" '
            [.deployments[]
             | select(.meta.githubCommitSha == $sha)
             | select((.meta.githubDeployment // "") | tostring != "1")]
            | length
          ' <<< "$deployments_json")"

          if [[ "$ready_count" -gt 0 ]]; then
            echo "deployment_required=false" >> "$GITHUB_OUTPUT"
            echo "Production already has a workflow-created READY deployment for $deploy_sha; skipping duplicate trigger."
          else
            echo "deployment_required=true" >> "$GITHUB_OUTPUT"
            if [[ "$foreign_count" -gt 0 ]]; then
              echo "A production deployment for $deploy_sha was created outside this workflow; the migration-aware deploy will replace it."
            else
              echo "No READY production deployment exists for $deploy_sha."
            fi
          fi

  deploy:
    name: Migrate Neon and deploy exact main SHA
    needs: preflight
    if: needs.preflight.outputs.deployment_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.deploy_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Get production database connection string
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
            echo "NEON_API_KEY secret and NEON_PROJECT_ID variable are required for production migrations." >&2
            exit 1
          fi
          uri="$(curl --fail --silent --show-error \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=neondb&role_name=neondb_owner" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" \
            | jq -r '.uri')"
          if [[ -z "$uri" || "$uri" == "null" ]]; then
            echo "Failed to retrieve the Neon production connection string." >&2
            exit 1
          fi
          echo "::add-mask::$uri"
          echo "db_url=$uri" >> "$GITHUB_OUTPUT"

      - name: Check single Alembic head
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          heads="$(.venv/bin/alembic heads)"
          count="$(grep -c '(head)' <<< "$heads")"
          if [[ "$count" -ne 1 ]]; then
            echo "ERROR: $count Alembic heads detected - resolve before deploying" >&2
            printf '%s\n' "$heads"
            exit 1
          fi
          echo "Single head confirmed: $heads"

      - name: Detect pending Alembic revisions
        id: migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          expected="$(.venv/bin/alembic heads | awk 'NR==1 {print $1}')"
          current="$(.venv/bin/alembic current | awk 'NR==1 {print $1}')"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          if [[ -n "$expected" && "$current" == "$expected" ]]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No pending migrations (production already at $current)."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Pending migrations: production=${current:-<none>} application=$expected"
          fi

      - name: Migrate production database before deploy
        if: steps.migrations.outputs.pending == 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          .venv/bin/alembic upgrade head

      - name: Verify production schema at application head
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          expected="$(.venv/bin/alembic heads | awk 'NR==1 {print $1}')"
          current="$(.venv/bin/alembic current | awk 'NR==1 {print $1}')"
          echo "Production Alembic revision: $current"
          if [[ -z "$expected" || "$current" != "$expected" ]]; then
            echo "ERROR: production schema is not at application head (current=$current expected=$expected)" >&2
            exit 1
          fi

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Repository secret VERCEL_TOKEN is required for production deployment." >&2
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.1.0

      - name: Link production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN"

      - name: Deploy exact commit to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          commit_message="$(git log -1 --pretty=%s)"
          vercel deploy \
            --prod \
            --yes \
            --logs \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef=main \
            --meta githubCommitSha="$deploy_sha" \
            --meta githubCommitMessage="$commit_message" \
            --meta githubCommitOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubCommitRepo="${GITHUB_REPOSITORY#*/}" \
            --meta githubOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubRepo="${GITHUB_REPOSITORY#*/}" \
            --meta githubCommitAuthorLogin="$GITHUB_ACTOR"

      - name: Verify the newest production deployment matches this SHA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 5); do
            response="$(curl --fail --silent --show-error \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=20" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            newest="$(jq -r '
              [.deployments[] | select(.readyState == "READY")]
              | sort_by(.createdAt // .created) | reverse | .[0]
              | [
                  (.meta.githubCommitSha // ""),
                  ((.meta.githubDeployment // "") | tostring),
                  ((.aliasError // null) | tostring)
                ]
              | @tsv
            ' <<< "$response")"
            read -r newest_sha newest_owner newest_alias_error <<< "$newest"
            if [[ "$newest_sha" == "$deploy_sha" && "$newest_owner" == "1" && "$newest_alias_error" == "null" ]]; then
              echo "Production deployment confirmed for $deploy_sha"
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              echo "Production deployment not confirmed yet (attempt $attempt/5): sha=${newest_sha:-<none>} workflow=${newest_owner:-<none>} aliasError=${newest_alias_error:-<none>}"
              sleep 5
            fi
          done
          echo "ERROR: newest READY production deployment is not the workflow deployment for $deploy_sha" >&2
          jq -r '.deployments[] | "  \(.uid) \(.readyState) \(.meta.githubCommitSha // "no-sha") workflow=\((.meta.githubDeployment // "") | tostring) aliasError=\((.aliasError // null) | tostring)"' <<< "$response" >&2
          exit 1

      - name: Smoke production health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            https://comic-pile.vercel.app/health >/dev/null

  # Keep-N=1: live production alias only. No rollback candidate.
  # Fail-soft so prune errors do not fail a finished migrate/deploy/smoke.
  prune:
    name: Prune older Vercel deployments
    needs:
      - preflight
      - deploy
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.deploy_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Repository secret VERCEL_TOKEN is required to prune Vercel deployments." >&2
            exit 1
          fi

      - name: Keep only the live production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python3 scripts/prune_vercel_deployments.py \
            --project-id "$VERCEL_PROJECT_ID" \
            --project-name comic-pile \
            --team-id "$VERCEL_ORG_ID" \
            --keep-n 1 \
            --fail-soft
