name: Production Profile

on:
  pull_request:
  workflow_dispatch:

jobs:
  production-profile:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/har-production-profile'
    name: Production Profile (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_BASE_URL: https://comic-pile.vercel.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run production profile
        run: pnpm --filter frontend run test:e2e:prod-profile

      - name: Print production profile report
        if: always()
        shell: bash
        run: |
          reports=$(find frontend/test-results -type f -name '*.json' 2>/dev/null || true)
          if [ -z "$reports" ]; then
            echo "No JSON attachment found."
            exit 0
          fi
          while IFS= read -r report; do
            echo "===== $report ====="
            cat "$report"
            echo
          done <<< "$reports"
