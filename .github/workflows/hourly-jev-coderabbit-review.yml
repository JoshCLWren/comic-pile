name: Hourly Jev CodeRabbit Review

on:
  schedule:
    # Leave room after the factory's top-of-hour activity and review cooldown.
    - cron: '29 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

# Scheduled and manually dispatched runs share the same review quota.
concurrency:
  group: hourly-jev-coderabbit-review
  cancel-in-progress: false

jobs:
  select-and-request-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Snapshot open and recently completed pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Closed PRs are included to account for a CodeRabbit review that
          # consumed the hour's quota immediately before a green PR was merged.
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 120 \
            --json number,title,state,headRefOid,isDraft,createdAt,closedAt,updatedAt,labels,mergeStateStatus,statusCheckRollup \
            > "$RUNNER_TEMP/coderabbit-review-prs.json"
      - name: Ask Jev and request the highest-value review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_JEV_API_KEY: ${{ secrets.OPENROUTER_JEV_API_KEY }}
          PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/hourly_coderabbit_review.py \
            --repo "$GITHUB_REPOSITORY" \
            --prs "$RUNNER_TEMP/coderabbit-review-prs.json"
