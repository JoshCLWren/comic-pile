name: Apply factory policy patch

on:
  push:
    branches:
      - factory/harden-autonomous-factory-policy

permissions:
  contents: write

jobs:
  patch-entrypoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/harden-autonomous-factory-policy
          fetch-depth: 0

      - name: Align embedded factory prompt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/comic-pile-opencode-factory.sh')
          content = path.read_text()

          replacements = {
              "git and gh CLI access. Read AGENTS.md and docs/ISSUE_EXECUTION_PROTOCOL.md before any\nselection or write.":
                  "git and gh CLI access. Read AGENTS.md, docs/ISSUE_EXECUTION_PROTOCOL.md, and\ndocs/AUTONOMOUS_FACTORY_POLICY.md before any selection or write. The autonomous\nfactory policy controls lifecycle behavior when generic guidance conflicts.",
              "open a truthful draft PR.": "open a truthful non-draft PR.",
              "Post the ready marker and mark a draft ready when\nappropriate. Never merge.":
                  "Post the ready marker. Never create or convert a draft PR unless Josh explicitly\nrequested a draft. Never merge.",
              "ComicPile local factory v6 (high ownership, CI-driven QA)":
                  "ComicPile local factory v7 (canonical policy, CI-driven QA)",
          }

          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'missing expected factory prompt text: {old!r}')
              content = content.replace(old, new, 1)

          path.write_text(content)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-factory-policy-patch.yml

      - name: Commit policy alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/comic-pile-opencode-factory.sh .github/workflows/apply-factory-policy-patch.yml
          git commit -m "Align local factory with canonical policy"
          git push origin HEAD:factory/harden-autonomous-factory-policy
