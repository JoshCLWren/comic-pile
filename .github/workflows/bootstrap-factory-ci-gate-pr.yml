name: Run Factory CI Gate Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  issues: write

jobs:
  run-bootstrap:
    if: github.head_ref == 'factory/ci-approval-gate' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v7
        with:
          ref: factory/ci-approval-gate
          fetch-depth: 0

      - name: Extract and execute patch program
        run: |
          awk '
            /python <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/bootstrap-factory-ci-gate.yml > /tmp/patch_factory_ci_gate.py
          python /tmp/patch_factory_ci_gate.py
          python <<'PY'
          import re
          from pathlib import Path

          policy_path = Path('docs/AUTONOMOUS_FACTORY_POLICY.md')
          policy = policy_path.read_text(encoding='utf-8')
          anchor = (
              'Full CI must not run merely because a PR opened or a commit was pushed. '
              'The factory first completes an exact-SHA review using the diff, issue contract, '
              'focused local validation, and all available review evidence.'
          )
          replacement = anchor + ' Do not wait for broad CI before the exact-SHA factory pass.'
          if policy.count(anchor) != 1:
              raise SystemExit('CI approval policy anchor changed')
          policy_path.write_text(policy.replace(anchor, replacement, 1), encoding='utf-8')

          test_path = Path('scripts/tests/test_autonomous_factory_policy.py')
          tests = test_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n\s*def test_ci_approval_gate_is_required\(self\) -> None:.*?'
              r'\n\s*def test_planning_pr_ban_is_required\(self\) -> None:\n',
              re.DOTALL,
          )
          corrected = '''
    def test_ci_approval_gate_is_required(self) -> None:
        """Reject restoring automatic full CI before exact-SHA factory review."""
        mutated = self.policy.replace(
            "Full CI must not run merely because a PR opened or a commit was pushed.",
            "Full CI runs automatically for every pull request push.",
        )
        with self.assertRaisesRegex(SystemExit, "missing required policy text"):
            self.validate(policy=mutated)

    def test_planning_pr_ban_is_required(self) -> None:
'''
          tests, count = pattern.subn(corrected, tests, count=1)
          if count != 1:
              raise SystemExit(f'expected one malformed CI approval test block, found {count}')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate patched policy
        run: |
          bash -n scripts/comic-pile-opencode-factory-heartbeat.sh
          python scripts/check-autonomous-factory-policy.py
          python -m unittest scripts/tests/test_autonomous_factory_policy.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ci.yml'); YAML.load_file('.github/workflows/factory-ci-approval.yml')"

      - name: Ensure approval label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create factory-ci-approved \
            --color 1f883d \
            --description "Exact-SHA factory review passed; full CI authorized" \
            --force

      - name: Commit patched gate and remove bootstrap files
        run: |
          rm .github/workflows/bootstrap-factory-ci-gate.yml
          rm .github/workflows/bootstrap-factory-ci-gate-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Gate full CI on exact-SHA factory approval"
          git push origin HEAD:factory/ci-approval-gate
