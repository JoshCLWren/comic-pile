name: Factory Migration Lane Release

# A closed/drafted factory PR disappears from the active finalization set.
# Scheduled/dispatcher sweeps alone can leave a migration waiter stranded.
# pull_request_target checks out trusted main only, never a PR's untrusted code.
on:
  pull_request_target:
    types: [closed, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# Serialize this event-driven reconciliation with dispatch and capacity refill.
concurrency:
  group: fixed-model-factory-dispatch
  cancel-in-progress: false

jobs:
  release-waiter:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'closed' ||
      github.event.action == 'converted_to_draft' ||
      contains(
        fromJSON('["factory:ready", "factory:ci", "factory:review", "factory:changes-requested", "factory:blocked", "factory:migration-wait"]'),
        github.event.label.name
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Reconcile serialized migration finalization lane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_migration_lane.py reconcile
