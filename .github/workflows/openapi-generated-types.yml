name: OpenAPI Generated Types

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-generated-types-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-types-current:
    name: Generated OpenAPI types are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Restore locked Python environment
        run: uv sync --frozen

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Regenerate deterministic OpenAPI schema and TypeScript output
        env:
          PYTHONPATH: .
        run: uv run python scripts/generate_openapi_types.py

      - name: Commit regenerated artifacts for same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
        run: |
          git add frontend/src/generated/openapi.json frontend/src/generated/openapi.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api): regenerate auth OpenAPI artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload regenerated artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-openapi-types
          path: |
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
          if-no-files-found: error

      - name: Verify generated artifacts are committed
        shell: bash
        run: |
          artifacts=(
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
          )

          git diff -- "${artifacts[@]}"
          git status --short --untracked-files=all --ignored -- "${artifacts[@]}"

          if ! git diff --quiet -- "${artifacts[@]}"; then
            echo "Generated OpenAPI artifacts differ from the committed files." >&2
            exit 1
          fi

          if [[ -n "$(git ls-files --others -- "${artifacts[@]}")" ]]; then
            echo "Generated OpenAPI artifacts are untracked and must be committed." >&2
            exit 1
          fi
