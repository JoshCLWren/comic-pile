name: OpenAPI Generated Types

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-generated-types-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-types-current:
    name: Generated OpenAPI types are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Restore locked Python environment
        run: uv sync --frozen

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Regenerate deterministic OpenAPI schema and TypeScript output
        env:
          PYTHONPATH: .
        run: uv run python scripts/generate_openapi_types.py

      - name: Commit generated artifacts to this factory branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          artifacts=(
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
          )

          if [[ -n "$(git status --short --untracked-files=all -- "${artifacts[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${artifacts[@]}"
            git commit -m "Generate current OpenAPI artifacts"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Upload regenerated artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-openapi-types
          path: |
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
          if-no-files-found: error

      - name: Verify generated artifacts are committed
        shell: bash
        run: |
          artifacts=(
            frontend/src/generated/openapi.json
            frontend/src/generated/openapi.ts
          )

          git diff -- "${artifacts[@]}"
          git status --short --untracked-files=all -- "${artifacts[@]}"

          if ! git diff --quiet -- "${artifacts[@]}"; then
            echo "Generated OpenAPI artifacts differ from the committed files." >&2
            exit 1
          fi

          if [[ -n "$(git ls-files --others --exclude-standard -- "${artifacts[@]}")" ]]; then
            echo "Generated OpenAPI artifacts are untracked and must be committed." >&2
            exit 1
          fi
