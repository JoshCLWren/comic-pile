name: Release writer

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional merged pull request number to reconcile
        required: false
        type: string
      backfill_since:
        description: Optional ISO-8601 lower bound for merged-PR reconciliation
        required: false
        type: string
  schedule:
    - cron: '23 * * * *'

jobs:
  publish-release:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      RELEASE_API_URL: https://comic-pile.vercel.app/api/v1/releases
      RELEASE_WRITER_TOKEN: ${{ secrets.RELEASE_WRITER_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      RELEASE_BACKFILL_BASELINE: '2026-09-22T20:35:40Z'
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate release-writer credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$RELEASE_WRITER_TOKEN" ]]; then
            echo '::error::RELEASE_WRITER_TOKEN is not configured in GitHub Actions secrets.'
            exit 1
          fi
          if [[ -z "$NVIDIA_API_KEY" ]]; then
            echo '::error::NVIDIA_API_KEY is not configured in GitHub Actions secrets.'
            exit 1
          fi

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Install pinned FCM discovery CLI
        run: npm install --global --ignore-scripts free-coding-models@0.5.69

      - name: Select healthy NVIDIA models
        id: model
        shell: bash
        run: |
          set -Eeuo pipefail
          fcm_output="$(
            free-coding-models \
              --json \
              --origin nvidia \
              --hide-unconfigured \
              --best \
              --no-telemetry
          )"
          candidates="$(
            printf '%s\n' "$fcm_output" \
              | python scripts/select_fcm_nvidia_model.py
          )"
          if [[ -z "$candidates" ]]; then
            echo 'No configured NVIDIA release-writer model is available' >&2
            exit 1
          fi
          {
            echo 'models<<EOF'
            printf '%s\n' "$candidates"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Determine reconciliation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_SINCE: ${{ inputs.backfill_since }}
        run: |
          set -Eeuo pipefail
          args=(--repository "$GITHUB_REPOSITORY")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # The deterministic repair landed after a known gap. Rechecking this
            # baseline is idempotent and guarantees deployment performs backfill.
            args+=(--since "$RELEASE_BACKFILL_BASELINE")
          elif [[ -n "$INPUT_PR" ]]; then
            args+=(--pr "$INPUT_PR")
          elif [[ -n "$INPUT_SINCE" ]]; then
            args+=(--since "$INPUT_SINCE")
          else
            args+=(--limit 100)
          fi
          printf '%q ' "${args[@]}" > "$RUNNER_TEMP/release-reconcile-args"

      - name: Run deterministic release reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WRITER_MODELS: ${{ steps.model.outputs.models }}
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r -a args <<< "$(cat "$RUNNER_TEMP/release-reconcile-args")"
          python scripts/release_reconcile.py \
            "${args[@]}" \
            --summary-json "$RUNNER_TEMP/release-reconcile.json" \
            --summary-markdown "$RUNNER_TEMP/release-reconcile.md"

      - name: Publish reconciliation summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/release-reconcile.md" ]]; then
            cat "$RUNNER_TEMP/release-reconcile.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Release reconciliation' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Controller exited before producing a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi
