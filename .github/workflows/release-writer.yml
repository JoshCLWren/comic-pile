name: Release writer

# INCIDENT 2026-10-20: The writer remains intentionally DISABLED.
# Neither generating nor persisting may run until explicitly reauthorized.
# Reenable only with exact PR triggers, never an unbounded historical scan.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact merged pull request to process
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: release-writer
  cancel-in-progress: false

jobs:
  generate:
    # INC-2026-10-20: KEEP THIS DISABLED until separately authorized.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Untrusted model process gets no Neon credential.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      RELEASE_WRITER_STAGE_FILE: ${{ runner.temp }}/release-writer/candidate.json
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate exact scope and model credential
        env:
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -Eeuo pipefail
          [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'Exact PR number required' >&2; exit 1; }
          [[ -n "$NVIDIA_API_KEY" ]] || { echo 'NVIDIA_API_KEY is required' >&2; exit 1; }
          mkdir -p "$(dirname "$RELEASE_WRITER_STAGE_FILE")"

      - name: Install OpenCode CLI
        run: |
          set -Eeuo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Install pinned model discovery
        run: npm install --global --ignore-scripts free-coding-models@0.5.69

      - name: Select healthy NVIDIA models
        id: model
        shell: bash
        run: |
          set -Eeuo pipefail
          fcm_output="$(free-coding-models --json --origin nvidia --hide-unconfigured --best --no-telemetry)"
          candidates="$(printf '%s\n' "$fcm_output" | python scripts/select_fcm_nvidia_model.py)"
          [[ -n "$candidates" ]] || { echo 'No configured NVIDIA writer model available' >&2; exit 1; }
          {
            echo 'models<<EOF'
            printf '%s\n' "$candidates"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate one staged candidate (no DB credentials)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          RELEASE_WRITER_MODELS: ${{ steps.model.outputs.models }}
        run: |
          set -Eeuo pipefail
          python scripts/release_reconcile.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$INPUT_PR" \
            --summary-json "$RUNNER_TEMP/release-summary.json" \
            --summary-markdown "$RUNNER_TEMP/release-summary.md"
          test -s "$RELEASE_WRITER_STAGE_FILE"

      - name: Upload candidate (no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: release-writer-candidate
          path: ${{ runner.temp }}/release-writer/candidate.json
          if-no-files-found: error
          retention-days: 1

      - name: Write preparation summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/release-summary.md" ]]; then
            cat "$RUNNER_TEMP/release-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  persist:
    # INC-2026-10-20: KEEP THIS DISABLED until separately authorized.
    if: ${{ false }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up isolated Python publisher
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Neon client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Download staged candidate
        uses: actions/download-artifact@v4
        with:
          name: release-writer-candidate
          path: ${{ runner.temp }}/release-candidate

      - name: Validate and publish directly to Neon
        shell: bash
        env:
          INPUT_PR: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          [[ -n "$NEON_API_KEY" && -n "$NEON_PROJECT_ID" ]] || {
            echo 'Production Neon credentials are required in the trusted publisher' >&2
            exit 1
          }
          # Fetch the same production Neon DSN as deploy-production, never Vercel.
          uri="$(curl --fail --silent --show-error \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=neondb&role_name=neondb_owner" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" | jq -r '.uri')"
          [[ -n "$uri" && "$uri" != "null" ]] || exit 1
          echo "::add-mask::$uri"
          RELEASE_NEON_DATABASE_URL="$uri" python -m scripts.release_neon_publish \
            --candidate "$RUNNER_TEMP/release-candidate/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$INPUT_PR"
