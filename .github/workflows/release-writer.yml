name: Release writer

# Reactivated after the 2026-10-20 Fluid Compute incident.
# Exact events stage one merged PR; recovery runs stage at most four independently.
# A three-hour bounded retry also drains the last deployment's backlog.
# pull_request_target runs only trusted main code, including for external contributors.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_run:
    workflows: [Deploy Production]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact merged pull request to process
        required: true
        type: string

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}"}

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: release-writer
  cancel-in-progress: false

jobs:
  discover:
    # Bot merges do not reliably emit pull_request_target. Every successful
    # deployment rechecks recent deployed sources, including prior failed runs.
    if: >-
      ${{
        (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.select.outputs.needed }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up isolated Python discovery
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Neon client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Restore bounded release attempt hints
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/release-recovery-attempts.json
          key: release-writer-attempts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: release-writer-attempts-v1-
      - name: Select bounded missing deployed ledger sources
        id: select
        shell: bash
        env:
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          uri=""
          if [[ -n "$NEON_API_KEY" && -n "$NEON_PROJECT_ID" ]]; then
            # The read-only discovery query uses the same trusted Neon DSN as
            # the publisher. Model generation never receives this credential.
            uri="$(curl --fail --silent --show-error \
              --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=neondb&role_name=neondb_owner" \
              --header 'Accept: application/json' \
              --header "Authorization: Bearer ${NEON_API_KEY}" | jq -r '.uri')"
            [[ -n "$uri" && "$uri" != "null" ]] || exit 1
            echo "::add-mask::$uri"
          fi
          args=(select --repository "$GITHUB_REPOSITORY" --attempt-state "$RUNNER_TEMP/release-recovery-attempts.json")
          if [[ -n "$INPUT_PR" ]]; then
            args+=(--pr "$INPUT_PR")
          fi
          RELEASE_NEON_DATABASE_URL="$uri" python scripts/release_recovery.py "${args[@]}"
      - name: Save selected source attempt hints before generation
        if: steps.select.outputs.needed == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/release-recovery-attempts.json
          key: release-writer-attempts-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Write discovery summary
        if: always()
        run: |
          {
            echo '## Release recovery discovery'
            echo
            echo '- Needed: ${{ steps.select.outputs.needed }}'
            echo '- Missing deployed sources: ${{ steps.select.outputs.missing_count }}'
            echo '- Selected sources: ${{ steps.select.outputs.matrix }}'
          } >> "$GITHUB_STEP_SUMMARY"

  generate:
    needs: discover
    if: needs.discover.outputs.needed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Untrusted model process gets no Neon credential.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check out Rotisserie factory runtime  # rotisserie-factory-runtime
        uses: actions/checkout@v7
        with:
          repository: JoshCLWren/rotisserie
          ref: main
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime  # rotisserie-factory-runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Validate exact scope and model credential
        env:
          INPUT_PR: ${{ matrix.pr_number }}
        run: |
          set -Eeuo pipefail
          [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'Exact PR number required' >&2; exit 1; }
          [[ -n "$NVIDIA_API_KEY" ]] || { echo 'NVIDIA_API_KEY is required' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-writer"
          echo "RELEASE_WRITER_STAGE_FILE=$RUNNER_TEMP/release-writer/candidate.json" >> "$GITHUB_ENV"

      - name: Install OpenCode CLI
        run: |
          set -Eeuo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Install pinned model discovery
        run: npm install --global --ignore-scripts free-coding-models@0.5.69

      - name: Select healthy NVIDIA models
        id: model
        shell: bash
        run: |
          set -Eeuo pipefail
          fcm_output="$(free-coding-models --json --origin nvidia --hide-unconfigured --best --no-telemetry)"
          candidates="$(printf '%s\n' "$fcm_output" | python scripts/select_fcm_nvidia_model.py)"
          [[ -n "$candidates" ]] || { echo 'No configured NVIDIA writer model available' >&2; exit 1; }
          {
            echo 'models<<EOF'
            printf '%s\n' "$candidates"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate one staged candidate (no DB credentials)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ matrix.pr_number }}
          RELEASE_WRITER_MODELS: ${{ steps.model.outputs.models }}
        run: |
          set -Eeuo pipefail
          python scripts/release_reconcile.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$INPUT_PR" \
            --summary-json "$RUNNER_TEMP/release-summary.json" \
            --summary-markdown "$RUNNER_TEMP/release-summary.md"
          test -s "$RELEASE_WRITER_STAGE_FILE"

      - name: Upload candidate (no secrets)
        uses: actions/upload-artifact@v7
        with:
          name: release-writer-candidate-${{ matrix.pr_number }}
          path: ${{ runner.temp }}/release-writer/candidate.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Write preparation summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/release-summary.md" ]]; then
            cat "$RUNNER_TEMP/release-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  persist:
    needs: [discover, generate]
    # A failed generation must not skip persistence for other staged sources.
    # A missing per-source artifact fails before any credential is loaded.
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.needed == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check out Rotisserie factory runtime  # rotisserie-factory-runtime
        uses: actions/checkout@v7
        with:
          repository: JoshCLWren/rotisserie
          ref: main
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime  # rotisserie-factory-runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Set up isolated Python publisher
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Neon client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Download staged candidate
        uses: actions/download-artifact@v8
        with:
          name: release-writer-candidate-${{ matrix.pr_number }}
          path: ${{ runner.temp }}/release-candidate

      - name: Verify selected merge is live before publication
        shell: bash
        env:
          INPUT_MERGE_SHA: ${{ matrix.merge_sha }}
        run: |
          set -Eeuo pipefail
          # Generation can take long enough for a rollback or failed deployment.
          # Recheck live production immediately before loading the Neon DSN.
          python scripts/release_recovery.py verify-deployed \
            --merge-sha "$INPUT_MERGE_SHA"

      - name: Classify test-only public candidates as internal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ matrix.pr_number }}
        run: |
          set -Eeuo pipefail
          # A complete bounded merged diff of only test files is developer-only
          # work. Record a durable internal outcome instead of publishing it or
          # rejecting it forever as the oldest missing source. This guard runs
          # before any database credential is loaded.
          python scripts/release_recovery.py verify-public \
            --candidate "$RUNNER_TEMP/release-candidate/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$INPUT_PR"

      - name: Validate and publish directly to Neon
        shell: bash
        env:
          INPUT_PR: ${{ matrix.pr_number }}
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          [[ -n "$NEON_API_KEY" && -n "$NEON_PROJECT_ID" ]] || {
            echo 'Production Neon credentials are required in the trusted publisher' >&2
            exit 1
          }
          # Fetch the same production Neon DSN as deploy-production, never Vercel.
          uri="$(curl --fail --silent --show-error \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=neondb&role_name=neondb_owner" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" | jq -r '.uri')"
          [[ -n "$uri" && "$uri" != "null" ]] || exit 1
          echo "::add-mask::$uri"
          RELEASE_NEON_DATABASE_URL="$uri" python -m scripts.release_neon_publish \
            --candidate "$RUNNER_TEMP/release-candidate/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$INPUT_PR"
