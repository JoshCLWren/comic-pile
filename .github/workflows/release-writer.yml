name: Release writer

# Reactivated after the 2026-10-20 Fluid Compute incident.
# One event = one merged PR. No Vercel API, schedule, or historical rescan.
# pull_request_target runs only trusted main code, including for external contributors.
# workflow_run recovers PRs merged by factory actors whose GITHUB_TOKEN merges
# do not emit pull_request_target events (issue #5752).
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact merged pull request to process
        required: true
        type: string
  workflow_run:
    workflows:
      - Factory Ready Merge Drain
      - Fixed Model Factory Dispatcher
    types: [completed]

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}"}

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: write

concurrency:
  group: release-writer-${{ github.event_name == 'workflow_run' && format('drain-{0}', github.event.workflow_run.id) || github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch-missed:
    # Factory merges use GITHUB_TOKEN so pull_request_target never fires.
    # When merge-drain completes, dispatch exact-PR release-writer runs for
    # recently merged PRs that may have been missed. Idempotent: persist
    # revalidates and the Neon ledger dedupes by source identity.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch release-writer for recently merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Bounded lookback: only PRs merged in the last 30 minutes.
          cutoff="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          mapfile -t prs < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=20" \
              --jq ".[] | select(.merged_at != null and .merged_at >= \"$cutoff\") | .number" \
            | head -20
          )
          if (( ${#prs[@]} == 0 )); then
            echo "No recently merged PRs found"
            exit 0
          fi
          for pr in "${prs[@]}"; do
            [[ "$pr" =~ ^[1-9][0-9]*$ ]] || continue
            echo "Dispatching release-writer for PR #${pr}"
            gh workflow run release-writer.yml \
              --repo "$GITHUB_REPOSITORY" \
              -f "pr_number=${pr}" || echo "::warning::Failed to dispatch release-writer for PR #${pr}"
          done

  generate:
    # Closed, unmerged PRs are ignored. Only merged PRs or manual exact PRs run.
    if: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Untrusted model process gets no Neon credential.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check out Rotisserie factory runtime  # rotisserie-factory-runtime
        uses: actions/checkout@v7
        with:
          repository: JoshCLWren/rotisserie
          ref: main
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime  # rotisserie-factory-runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Set up Python 3.14 for Rotisserie scripts
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate exact scope and model credential
        env:
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -Eeuo pipefail
          [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'Exact PR number required' >&2; exit 1; }
          [[ -n "$NVIDIA_API_KEY" ]] || { echo 'NVIDIA_API_KEY is required' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-writer"
          echo "RELEASE_WRITER_STAGE_FILE=$RUNNER_TEMP/release-writer/candidate.json" >> "$GITHUB_ENV"

      - name: Install OpenCode CLI
        run: |
          set -Eeuo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Install pinned model discovery
        run: npm install --global --ignore-scripts free-coding-models@0.5.69

      - name: Select healthy NVIDIA models
        id: model
        shell: bash
        run: |
          set -Eeuo pipefail
          fcm_output="$(free-coding-models --json --origin nvidia --hide-unconfigured --best --no-telemetry)"
          candidates="$(printf '%s\n' "$fcm_output" | python scripts/select_fcm_nvidia_model.py)"
          [[ -n "$candidates" ]] || { echo 'No configured NVIDIA writer model available' >&2; exit 1; }
          {
            echo 'models<<EOF'
            printf '%s\n' "$candidates"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate one staged candidate (no DB credentials)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          RELEASE_WRITER_MODELS: ${{ steps.model.outputs.models }}
        run: |
          set -Eeuo pipefail
          python scripts/release_reconcile.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$INPUT_PR" \
            --summary-json "$RUNNER_TEMP/release-summary.json" \
            --summary-markdown "$RUNNER_TEMP/release-summary.md"
          test -s "$RELEASE_WRITER_STAGE_FILE"

      - name: Upload candidate (no secrets)
        uses: actions/upload-artifact@v7
        with:
          name: release-writer-candidate
          path: ${{ runner.temp }}/release-writer/candidate.json
          if-no-files-found: error
          retention-days: 1

      - name: Write preparation summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/release-summary.md" ]]; then
            cat "$RUNNER_TEMP/release-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  persist:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check out Rotisserie factory runtime  # rotisserie-factory-runtime
        uses: actions/checkout@v7
        with:
          repository: JoshCLWren/rotisserie
          ref: main
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime  # rotisserie-factory-runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Set up isolated Python publisher
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Neon client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Download staged candidate
        uses: actions/download-artifact@v8
        with:
          name: release-writer-candidate
          path: ${{ runner.temp }}/release-candidate

      - name: Validate and publish directly to Neon
        shell: bash
        env:
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          [[ -n "$NEON_API_KEY" && -n "$NEON_PROJECT_ID" ]] || {
            echo 'Production Neon credentials are required in the trusted publisher' >&2
            exit 1
          }
          # Fetch the same production Neon DSN as deploy-production, never Vercel.
          uri="$(curl --fail --silent --show-error \
            --url "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=neondb&role_name=neondb_owner" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" | jq -r '.uri')"
          [[ -n "$uri" && "$uri" != "null" ]] || exit 1
          echo "::add-mask::$uri"
          RELEASE_NEON_DATABASE_URL="$uri" python -m scripts.release_neon_publish \
            --candidate "$RUNNER_TEMP/release-candidate/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$INPUT_PR"
