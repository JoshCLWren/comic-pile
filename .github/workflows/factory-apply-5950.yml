name: Factory apply 5950

# One-shot helper: applies the staged #5950 diff, commits it, and removes
# itself and the patch file in the same commit. It exists because the worker
# session had no git write credentials.
on:
  push:
    branches:
      - factory/fix-5950-v2-thread-item-ingress

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply patch, commit and push
        run: |
          set -euo pipefail
          git apply --verbose factory-5950.patch
          rm -f factory-5950.patch .github/workflows/factory-apply-5950.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(#5950): route v2 thread item PATCH/DELETE through the Vercel ingress' -m 'Model: Freebuff 1.5'
          git push origin HEAD:factory/fix-5950-v2-thread-item-ingress
