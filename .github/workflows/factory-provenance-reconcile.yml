# Explicit, maintainer-triggered reconciliation of exact-head provenance for an
# owner-authored factory PR whose head was advanced outside the numbered-worker
# wrapper (a local merge or rebase, or trusted repository automation).
#
# Without this step such a head can never satisfy the exact-head cross-model
# gate, so the review controller parks it in `factory:blocked` forever. The
# controller only attests an identity GitHub already attributes to the owner or
# to trusted automation, and it never invents a numbered-worker identity.
name: Factory Provenance Reconcile

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open factory PR whose wrapper-less head needs reconciliation
        required: true
        type: string
      head:
        description: Exact head SHA you believe is current (optional guard)
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: factory-provenance-reconcile-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Reconcile exact-head provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          pr="${{ inputs.pr }}"
          head="${{ inputs.head }}"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "invalid pr"; exit 1; }
          args=(reconcile-provenance --pr "$pr")
          if [[ -n "$head" ]]; then
            args+=(--head "$head")
          fi
          python3 .github/scripts/factory-review-controller.py "${args[@]}"
          gh pr view "$pr" --json headRefOid,labels \
            --jq '{head: .headRefOid, labels: [.labels[].name]}'
