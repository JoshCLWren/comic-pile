name: Apply PR 665 fixes on ready

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write
  actions: write

jobs:
  apply-fixes:
    if: github.event.pull_request.number == 665
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: add-upstash-cache
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: python scripts/apply_pr665_cache_fixes.py

      - name: Validate Python and patch shape
        run: |
          python -m compileall -q app tests/test_cache.py tests/conftest.py
          git diff --check

      - name: Commit source fixes and remove temporary files
        run: |
          rm .github/workflows/apply-pr665-fixes.yml
          rm .github/workflows/apply-pr665-fixes-on-ready.yml
          rm scripts/apply_pr665_cache_fixes.py
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cache.py app/api/thread.py app/api/queue.py tests/conftest.py tests/test_cache.py .github/workflows scripts/apply_pr665_cache_fixes.py
          git commit -m "Fix remaining cache invalidation and Redis lifecycle issues"
          git push origin HEAD:add-upstash-cache

      - name: Dispatch full CI on final commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run .github/workflows/ci.yml --ref add-upstash-cache
