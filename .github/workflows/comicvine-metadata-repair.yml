name: ComicVine Metadata Repair Drain
# GitHub Actions provides a free cadence that Vercel Hobby cron cannot.
# Only main may call the production worker; never run secret-bearing PR code.
#
# Backoff (#4748): the cron runs 4 times/day (03:17, 09:17, 15:17, 21:17 UTC)
# instead of the previous 96 invocations/day. That is a deterministic cadence
# reduction in DB-touching production calls, not a measured Neon wakeup or
# expense result; no such before/after measurement is recorded for #4748.
# An empty queue is reported as queue_empty=true with claimed=0. New enqueues
# best-effort fire a repository_dispatch wake, but only when a GitHub token is
# configured in the Vercel runtime; no production dispatch run has been
# observed for this change. When dispatch is unavailable the sparse fallback
# cron bounds pickup at <= 6 hours, so no queue is permanently stuck. Manual
# dispatch is preserved for operator use.
on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  repository_dispatch:
    types:
      - comicvine-metadata-repair-enqueued
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comicvine-metadata-repair-production
  cancel-in-progress: false

jobs:
  drain:
    if: github.ref == 'refs/heads/main'
    name: Drain a bounded authenticated production batch
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the awaited Rust worker
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${#CRON_SECRET}" -lt 16 ]]; then
            echo "::error::The GitHub Actions CRON_SECRET repository secret must match the Vercel production CRON_SECRET."
            exit 1
          fi
          response="$RUNNER_TEMP/comicvine-repair.json"
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 \
            --retry-all-errors --connect-timeout 10 --max-time 55 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://comic-pile.vercel.app/api/v2/maintenance/comicvine-metadata-repairs')"
          if [[ "$status" != "200" ]]; then
            echo "::error::ComicVine production drain returned HTTP $status"
            exit 1
          fi
          if ! jq -e 'type == "object" and .provider_configured == true
              and (.claimed | type == "number")
              and (.completed | type == "number")
              and (.failed | type == "number")' "$response" > /dev/null; then
            echo "::error::ComicVine worker response was invalid or COMICVINE_API_KEY is missing in Vercel production."
            exit 1
          fi
          jq -r '"ComicVine bounded drain: claimed=\(.claimed), completed=\(.completed), no_credits=\(.no_credits), failed=\(.failed), deferred=\(.deferred), queue_empty=\(.queue_empty)"' "$response" >> "$GITHUB_STEP_SUMMARY"
