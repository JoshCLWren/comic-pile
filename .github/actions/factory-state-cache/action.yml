name: Factory State Cache (trusted controller only)
description: Supply a restricted Neon snapshot connection to trusted factory jobs

inputs:
  neon-api-key:
    required: true
    description: Existing Neon management credential, never exposed to model jobs
  neon-project-id:
    required: true
    description: Existing ComicPile Neon project ID

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install factory cache client
      shell: bash
      run: python -m pip install --quiet 'asyncpg>=0.30,<1'

    - name: Resolve restricted factory_state database connection
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        NEON_PROJECT_ID: ${{ inputs.neon-project-id }}
      run: |
        set -Eeuo pipefail
        if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
          echo "::warning::Neon factory cache is not configured; controller will read GitHub live"
          exit 0
        fi

        # This is the restricted database role, not the application DB owner.
        # Do not export the Neon management token to any later job step.
        endpoint="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=factory_state&role_name=factory_state_rw"
        if ! response="$(curl --fail --silent --show-error --max-time 15 \
          --url "$endpoint" \
          --header 'Accept: application/json' \
          --header "Authorization: Bearer ${NEON_API_KEY}")"; then
          echo "::warning::Unable to resolve factory state connection; using live GitHub reads"
          exit 0
        fi
        if ! uri="$(jq -er '.uri | select(type == "string" and length > 0)' <<< "$response")"; then
          echo "::warning::Neon did not return a factory state connection; using live GitHub reads"
          exit 0
        fi
        echo "::add-mask::$uri"
        # Only trusted controller steps know this file path. The management
        # token and raw connection URL are never persisted as job outputs.
        umask 077
        dsn_file="$RUNNER_TEMP/factory-state-connection"
        printf '%s' "$uri" > "$dsn_file"
        chmod 600 "$dsn_file"
        echo "FACTORY_STATE_DSN_FILE=$dsn_file" >> "$GITHUB_ENV"
        echo "Factory state cache configured (isolated database, restricted role)"
