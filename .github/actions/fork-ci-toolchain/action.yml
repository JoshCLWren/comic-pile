name: Fork CI toolchain
description: Install the shared CI toolchain without registry credentials
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git curl ca-certificates postgresql-client
    - uses: actions/setup-node@v7
      with:
        node-version: '22.23.1'
    - uses: astral-sh/setup-uv@v7
      with:
        version: '0.11.28'
    - name: Install Python and frontend dependencies
      shell: bash
      run: |
        uv sync --locked --all-extras --no-install-project
        npm install -g pnpm@10.15.0
        pnpm install --frozen-lockfile
        pnpm --filter frontend run build
        mkdir -p /opt/ci-assets/static
        cp -a static/react /opt/ci-assets/static/react
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
