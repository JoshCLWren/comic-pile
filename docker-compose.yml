services:
# SECURITY NOTE: This configuration uses hardcoded development passwords.
# Production runs on Vercel + Neon (make deploy-prod), not Docker Compose.
# Never commit production secrets to version control.
  db:
    image: postgres:16-alpine
    container_name: comic-pile-test-001-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: comicpile
      POSTGRES_PASSWORD: comicpile_password
      POSTGRES_DB: comicpile
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comicpile"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: comic-pile-test-001-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@comicpile.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
    ports:
      - "5051:80"
    depends_on:
      - db

volumes:
  postgres_data:
