services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comic_pile_test
    ports:
      - "${E2E_POSTGRES_PUBLISH:-5437:5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    ports:
      - "${E2E_REDIS_PUBLISH:-6379:6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Network holder: the Rust service binds loopback (development config), and
  # nginx shares this namespace to serve the frontend and proxy /api to it.
  # Same topology as docker-compose.ui-audit.yml.
  app-test:
    image: busybox:1.36
    command: ["sh", "-c", "sleep infinity"]
    ports:
      - "8000:8080"
    networks:
      - test-network

  migrate-test:
    build:
      context: .
      dockerfile: native/roll-service/Dockerfile.audit
    environment:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/comic_pile_test
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test-network
    entrypoint: ["/usr/local/bin/comicpile-migrate"]
    command: ["up"]
    restart: "no"

  native-roll-test:
    build:
      context: .
      dockerfile: native/roll-service/Dockerfile.audit
    environment:
      RUST_ROLL_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/comic_pile_test
      RUST_ROLL_JWT_SECRET: test-secret-key-for-testing-only
      RUST_ROLL_ENV: development
      RUST_ROLL_BIND: 127.0.0.1:8010
    network_mode: "service:app-test"
    depends_on:
      migrate-test:
        condition: service_completed_successfully

  ingress-test:
    image: nginx:1.29-alpine
    network_mode: "service:app-test"
    volumes:
      - "${TEST_INGRESS_CONF:?Run make docker-test-up to generate the ingress}:/etc/nginx/conf.d/default.conf:ro"
      - ./static/react:/usr/share/nginx/html:ro
    depends_on:
      - native-roll-test

networks:
  test-network:
    driver: bridge
