services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comic_pile_test
    ports:
      - "${E2E_POSTGRES_PUBLISH:-5437:5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    ports:
      - "${E2E_REDIS_PUBLISH:-6379:6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/comic_pile_test
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/comic_pile_test
      SECRET_KEY: test-secret-key-for-testing-only
      RUST_ROLL_JWT_SECRET: test-secret-key-for-testing-only
      RUST_ROLL_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/comic_pile_test?sslmode=require
      RUST_ROLL_BIND: 0.0.0.0:8000
      RUST_ROLL_ENV: production
      ENVIRONMENT: test
    command: ["/bin/sh", "-c", "/app/bin/comicpile-migrate up && exec /app/bin/comicpile-roll-service"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
