# mypy configuration for the issue #3258 mypyc evaluation build only.
#
# This file exists because mypycify discovers mypy configuration by walking up
# from the working directory. Without it, running the documented build from
# `benchmark/mypyc/` inherits the repository `mypy.ini` at the root, which sets
# `warn_unused_configs = True` and declares per-module sections for the whole
# application's third-party dependencies. A mypycify run references none of
# them, so mypy reports "unused section(s)" through its error channel, mypycify
# sees a non-empty error list, and the build aborts before compiling anything
# with no message beyond that note.
#
# Scope: this configuration governs the throwaway mypyc build of the benchmark
# copies only. It never affects the repository's own typing policy, and it does
# not relax type checking of the candidates: `strict` still applies, so a real
# type error in a candidate module still fails the build.
#
# `warn_unused_configs` is off only because there are no per-module sections
# here to become unused. There are no third-party dependencies in this tree at
# all, which is a precondition for compiling these modules in the first place.

[mypy]
python_version = 3.14
strict = True
warn_unused_configs = False
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
show_error_codes = True
show_error_context = True
no_implicit_optional = True