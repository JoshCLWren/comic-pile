# Canonical E2E behavior inventory for ComicPile
#
# Epic:       #1476 — Rebuild ComicPile E2E from a canonical behavior inventory
# Child work: #1479 — inventory canonical user behaviors with stable scenario IDs
#
# This file is the single, authoritative inventory of what ComicPile's browser
# E2E suite must protect. It is the source of truth for coverage work; the
# retired Playwright suite and closed bug history were consulted only as
# supporting evidence, not copied as the new specification.
#
# Ownership rule (from #1479): the stable scenario ID is the permanent identity
# for E2E coverage. Future implementation work must cite the inventory IDs it
# owns so two factories do not independently create coverage for the same
# behavior.
#
# Field contract per behavior:
#   id       — stable scenario ID (e.g. ROLL-001)
#   area     — product area (auth, queue, roll, rate, snooze, thread, dep,
#              order, mobile, regression, security, feature)
#   behavior — user-visible behavior / invariant at the user-contract level
#   priority — P0 | P1 | P2
#   status   — uncovered | covered | blocked
#   mobile   — optional note when behavior materially differs on mobile
#   evidence — optional supporting references (legacy tests / bug history)

meta:
  version: 1
  generated_for: "current product behavior (after #1478 legacy suite removal)"
  source_of_truth: "current routes, UI, APIs, user workflows, business invariants"
  priority_definitions:
    P0: "Core user journey that must never regress; protects startup and primary flows."
    P1: "Important historical regression or secondary flow that should be covered."
    P2: "Useful but non-critical surface; covered opportunistically."
  status_definitions:
    uncovered: "No fresh Chromium coverage exists yet for this behavior."
    covered: "A deterministic fresh Chromium spec owns this scenario ID."
    blocked: "Cannot be covered until a prerequisite (infra/feature) lands."

behaviors:
  # ---- Authentication & startup (P0) ----
  - id: AUTH-001
    area: auth
    behavior: "A new visitor can register an account and receive auth tokens."
    priority: P0
    status: uncovered

  - id: AUTH-002
    area: auth
    behavior: "A registered user can log in with credentials and receive access/refresh tokens."
    priority: P0
    status: uncovered

  - id: AUTH-003
    area: auth
    behavior: "Unauthenticated users are redirected from protected routes to /login."
    priority: P0
    status: uncovered

  - id: AUTH-004
    area: auth
    behavior: "Authenticated users are redirected away from /login and /register to the app."
    priority: P0
    status: uncovered

  - id: AUTH-005
    area: auth
    behavior: "App start bootstraps the shell, current user, and active session before interactive use."
    priority: P0
    status: uncovered
    mobile: "Same bootstrap on mobile viewport without layout collapse."

  - id: AUTH-006
    area: auth
    behavior: "Expired access token is refreshed via the refresh cookie without forcing re-login."
