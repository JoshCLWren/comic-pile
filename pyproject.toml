[project]
name = "comic_pile"
version = "0.1.0"
description = "Dice-Driven Comic Reading Tracker - React + Tailwind CSS with a native Rust API"
readme = "README.md"
requires-python = ">=3.14"
# The Python request-serving API (api/index.py, app/) is removed. These are the
# runtime libraries still imported by the retained operator/CI scripts.
dependencies = [
    "sqlalchemy[asyncio]>=2.0.53",
    "asyncpg>=0.29.0",
    "httpx>=0.28.1",
    "requests>=2.32.0",
]

# Local development and test tooling. Installed by default for `uv sync` /
# `uv run` environments.
[dependency-groups]
factory-syntax = [
    "shfmt-py==4.2.0",
    "tree-sitter==0.26.1",
    "tree-sitter-css==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]
dev = [
    { include-group = "factory-syntax" },
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=1.3.0",
    "filelock>=3.13.0",
    "ruff>=0.1.0",
    "ty>=0.0.12",
    # Pinned exactly: worker GitHub App display names are derived from a seeded
    # Faker instance, and Faker's seeded name sequence changes between
    # releases. Worker 48's App name ("Mark Cordova") is already provisioned
    # and persisted in .github/factory-worker-github-apps.json, so a newer
    # Faker would re-roll it and break the existing App identity.
    "faker==40.54.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "pytest-mock>=3.16.0",
    "mypy==2.4.1",
]

# Operator tooling that still needs the synchronous psycopg driver (for
# example scripts/release_neon_publish.py). Alembic and its migration tree are
# removed; migrations run through `comicpile-migrate` (native/migrate).
migrate = [
    "psycopg[binary]>=3.1.0",
]

[tool.uv]
default-groups = ["dev", "migrate"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.node-dependencies]
dev = [
    "eslint>=9.0.0",
    "htmlhint>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires Playwright)",
]

[tool.coverage.run]
source = ["scripts", "tests"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "__pycache__", "*.pyc", ".git", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "D", "ANN401"]
ignore = ["D203", "D213", "E501", "B008", "I001"]
per-file-ignores = { "tests/conftest.py" = ["D205", "D209", "N806", "F841"], ".github/scripts/*.py" = ["D", "ANN401", "UP017"], "tests/test_factory_*.py" = ["D"], "scripts/backfill_read_comicvine.py" = ["E402"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python-version = "3.14"
extra-paths = [".github/scripts"]

[tool.ty.src]
include = ["tests"]
exclude = []

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
deprecated = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unused-ignore-comment = "ignore"

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
show_error_codes = true
warn_unused_configs = true
files = ["scripts", "tests", "scripts/mypy_baseline.py"]

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.test_mypy_baseline"
disallow_untyped_decorators = false
