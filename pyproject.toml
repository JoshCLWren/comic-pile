[project]
name = "comic_pile"
version = "0.1.0"
description = "Dice-Driven Comic Reading Tracker - FastAPI + React + Tailwind CSS"
readme = "README.md"
requires-python = ">=3.14"
# Production dependency set installed into the Vercel Python function and the
# slim DevContainer (issue #2841). Keep this list to packages the deployed
# request path (api/index.py -> app.main.create_app) actually imports. Server
# and migration tooling lives in the `server` and `migrate` dependency groups,
# which every other runtime discovers through `tool.uv.default-groups`.
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "pillow>=11.0.0",
    "pydantic[email]>=2.0.0",
    "python-multipart>=0.0.6",
    "asyncpg>=0.29.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "pydantic-settings>=2.12.0",
    "filelock>=3.25.2",
    "PyGithub>=2.0.0",
    "upstash-redis>=1.7.0",
]

# Local development and test tooling. Installed by default for `uv sync` /
# `uv run` environments. Test-only and operator/script packages that the Vercel
# function does not import belong here (e.g. pytest-xdist, pyyaml).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=1.3.0",
    "filelock>=3.13.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "redis>=5.0.0",
    "ty>=0.0.12",
    "faker>=20.0.0",
    "httpx>=0.28.1",
    "playwright>=1.50.0",
    "pytest-playwright==0.7.0",
    "uvicorn>=0.30.0",
    "PyGithub>=2.0.0",
    "python-jose[cryptography]",
    "bcrypt",
    "aiosqlite>=0.19.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
]

# Database migration + operator tooling (alembic + its sync psycopg driver).
# Workflows that need migrations (deploy-production, Docker runtime, CI
# migration-health, local `make migrate`) get this through the default groups;
# the Vercel request runtime does not install dependency groups.
migrate = [
    "alembic>=1.12.0",
    "psycopg[binary]>=3.1.0",
]

# ASGI server runtime used by the Docker/Compose deployment image and local
# `uvicorn` dev servers. The Vercel function needs no uvicorn: the Vercel
# Python runtime drives the ASGI app directly.
server = [
    "uvicorn[standard]>=0.20.0",
]

# Repositories and containers that are not the Vercel function install the
# dev test stack plus the server/migrate groups by default; `--no-dev` still
# keeps server + migrate so the Docker runtime and deploy migration step work.
[tool.uv]
default-groups = ["dev", "migrate", "server"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.node-dependencies]
dev = [
    "eslint>=9.0.0",
    "htmlhint>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=comic_pile",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires Playwright)",
]

[tool.coverage.run]
source = ["app", "comic_pile"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "__pycache__", "*.pyc", ".git", "node_modules", "alembic/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "D", "ANN401"]
ignore = ["D203", "D213", "E501", "B008", "I001"]
per-file-ignores = { "alembic/env.py" = ["F401"], "alembic/versions/*.py" = ["D415"], "app/cache.py" = ["D102", "D107", "ANN401"], "tests/conftest.py" = ["D205", "D209", "N806", "F841"], "tests/test_queue_cursor_semantics.py" = ["D102", "F401"], ".github/scripts/*.py" = ["D", "ANN401", "UP017"], "tests/test_factory_*.py" = ["D"], "latticery_extraction/*.py" = ["D", "ANN401"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["app", "comic_pile", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "alembic/versions/*.py"]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["app", "comic_pile", "tests"]
exclude = ["scripts/**", "alembic/versions/**", "tests/test_scripts_verify_reading_order.py", "tests/test_factory_review_gate.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
deprecated = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unused-ignore-comment = "ignore"

[tool.env]
# Default environment variables for local development
# Override these in .env file or shell for different configurations
ENVIRONMENT = "development"
DATABASE_URL = "postgresql+asyncpg://comicpile:comicpile_password@localhost:5432/comicpile"
TEST_DATABASE_URL = "postgresql+asyncpg://comicpile:comicpile_password@localhost:5432/comicpile_test"
LOG_LEVEL = "debug"
SECRET_KEY = "dev-secret-key-change-in-production"
AUTO_BACKUP_ENABLED = "false"
PORT = "8000"
typeStubPaths = []