[project]
name = "comic_pile"
version = "0.1.0"
description = "Dice-Driven Comic Reading Tracker - React + Tailwind CSS with a native Rust API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.53",
    "asyncpg>=0.29.0",
]

[dependency-groups]
factory-syntax = [
    "shfmt-py==4.2.0",
    "tree-sitter==0.26.1",
    "tree-sitter-css==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]
dev = [
    { include-group = "factory-syntax" },
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=1.3.0",
    "filelock>=3.13.0",
    "ruff>=0.1.0",
    "ty>=0.0.12",
    "faker==40.54.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "pytest-mock>=3.16.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
select = ["E", "F", "I", "N", "P", "W"]

[tool.ruff.lint]
force-text-modes = true

[tool.ruff.format]
mypy = false
