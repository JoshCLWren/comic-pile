services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comic_pile_test
    ports:
      - "${E2E_POSTGRES_PUBLISH:-5437:5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    ports:
      - "${E2E_REDIS_PUBLISH:-6379:6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Network holder for the Rust service and nginx. The Python API is deleted;
  # only the native Rust ingress serves API requests in the visual audit.
  api-test:
    image: busybox:1.36
    command: ["sh", "-c", "sleep infinity"]
    ports:
      - "127.0.0.1:${E2E_API_PORT:-8002}:8080"
    networks:
      - test-network

  migrate:
    build:
      context: .
      dockerfile: native/roll-service/Dockerfile.audit
    environment:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/comic_pile_test
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test-network
    entrypoint: ["/usr/local/bin/comicpile-migrate"]
    command: ["up"]
    restart: "no"

  # The visual audit exercises the native Rust contract only.
  native-roll-test:
    build:
      context: .
      dockerfile: native/roll-service/Dockerfile.audit
    environment:
      RUST_ROLL_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/comic_pile_test
      RUST_ROLL_JWT_SECRET: test-secret-key-for-testing-only
      RUST_ROLL_ENV: development
      RUST_ROLL_BIND: 127.0.0.1:8010
    network_mode: "service:api-test"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ui-audit-ingress:
    image: nginx:1.29-alpine
    network_mode: "service:api-test"
    volumes:
      - "${UI_AUDIT_INGRESS_CONF:?Run scripts/run_ui_audit.sh to generate ingress}:/etc/nginx/conf.d/default.conf:ro"
      - ./static/react:/usr/share/nginx/html:ro
    depends_on:
      - native-roll-test

networks:
  test-network:
    driver: bridge
